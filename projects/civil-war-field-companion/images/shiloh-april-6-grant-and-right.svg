<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Grant's arrival and the fighting on the United States right at Shiloh, 7 a.m. to 11:30 a.m. April 6, 1862</title>
  <desc id="desc">Map shows Grant traveling upriver from Savannah past Crump's Landing to Pittsburg Landing, and the United States right withdrawing from Shiloh Church to the Hamburg-Purdy Road and then Jones Field.</desc>
  <defs><marker id="usa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315f8c"/></marker><marker id="csa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9a3d32"/></marker></defs>
  <rect width="1200" height="820" fill="#f3eedf"/><rect x="820" width="380" height="820" fill="#dfe9e5"/>
  <path d="M1030 0C970 130 1080 250 1010 385S1080 650 990 820" fill="none" stroke="#6da3aa" stroke-width="90"/><text x="1080" y="435" fill="#385f64" font-family="Georgia,serif" font-size="25" text-anchor="middle" transform="rotate(88 1080 435)">TENNESSEE RIVER</text>
  <path d="M790 780L485 115" stroke="#665746" stroke-width="8"/><text x="620" y="355" fill="#514438" font-family="Arial,sans-serif" font-size="17" transform="rotate(-65 620 355)">Corinth Road</text>
  <path d="M250 455L820 455" stroke="#756551" stroke-width="9"/><text x="530" y="437" text-anchor="middle" fill="#514438" font-family="Arial,sans-serif" font-size="18">Hamburg–Purdy Road</text>
  <rect x="640" y="642" width="175" height="76" rx="8" fill="#d8b88a"/><text x="728" y="676" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="20" font-weight="700">SHILOH CHURCH</text><text x="728" y="701" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="15">line abandoned about 10 a.m.</text>
  <rect x="310" y="255" width="220" height="80" rx="8" fill="#d8b88a"/><text x="420" y="290" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="23" font-weight="700">JONES FIELD</text><text x="420" y="315" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="15">rallying area after 11:30 a.m.</text>
  <path d="M610 575C575 530 550 490 530 465" fill="none" stroke="#315f8c" stroke-width="11" stroke-dasharray="15 9" marker-end="url(#usa)"/><text x="470" y="563" fill="#234b73" font-family="Arial,sans-serif" font-size="17" font-weight="700">600-yard withdrawal</text>
  <path d="M520 435L755 435" stroke="#315f8c" stroke-width="19"/><text x="640" y="414" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="20" font-weight="700">SHERMAN · RAITH · MARSH · HARE</text><text x="640" y="486" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="15">second line, about 10–11:30 a.m.</text>
  <path d="M560 405C520 355 475 320 440 310" fill="none" stroke="#315f8c" stroke-width="10" stroke-dasharray="15 9" marker-end="url(#usa)"/><text x="570" y="345" fill="#234b73" font-family="Arial,sans-serif" font-size="16">retreat and rally</text>
  <path d="M500 735C535 650 575 555 610 458" fill="none" stroke="#9a3d32" stroke-width="13" marker-end="url(#csa)"/><path d="M620 760C650 660 675 555 680 458" fill="none" stroke="#9a3d32" stroke-width="13" marker-end="url(#csa)"/><path d="M755 760C760 665 755 555 735 458" fill="none" stroke="#9a3d32" stroke-width="13" marker-end="url(#csa)"/>
  <text x="630" y="785" text-anchor="middle" fill="#7c3029" font-family="Arial,sans-serif" font-size="18" font-weight="700">CONFEDERATE BRIGADES FROM THREE CORPS</text><text x="630" y="808" text-anchor="middle" fill="#7c3029" font-family="Arial,sans-serif" font-size="14">Wood and Shaver strike Marsh first; attacks spread across the line</text>
  <path d="M1015 95C995 170 995 245 1012 315C1025 360 1025 405 1010 490" fill="none" stroke="#315f8c" stroke-width="9" stroke-dasharray="14 9" marker-end="url(#usa)"/>
  <circle cx="1015" cy="90" r="9" fill="#315f8c"/><text x="970" y="75" text-anchor="end" fill="#234b73" font-family="Arial,sans-serif" font-size="18" font-weight="700">SAVANNAH</text><text x="970" y="98" text-anchor="end" fill="#234b73" font-family="Arial,sans-serif" font-size="14">Grant departs about 7:30</text>
  <circle cx="1010" cy="285" r="9" fill="#315f8c"/><text x="965" y="274" text-anchor="end" fill="#234b73" font-family="Arial,sans-serif" font-size="18" font-weight="700">CRUMP'S LANDING</text><text x="965" y="297" text-anchor="end" fill="#234b73" font-family="Arial,sans-serif" font-size="14">Lew Wallace alerted</text>
  <circle cx="1012" cy="500" r="10" fill="#315f8c"/><text x="965" y="500" text-anchor="end" fill="#234b73" font-family="Arial,sans-serif" font-size="18" font-weight="700">PITTSBURG LANDING</text><text x="965" y="523" text-anchor="end" fill="#234b73" font-family="Arial,sans-serif" font-size="14">Grant arrives about 9</text>
  <path d="M970 510C890 500 820 475 760 448" fill="none" stroke="#315f8c" stroke-width="7" stroke-dasharray="12 8" marker-end="url(#usa)"/><text x="850" y="535" fill="#234b73" font-family="Arial,sans-serif" font-size="15">Grant reaches Sherman about 10 a.m.</text>
  <text x="40" y="52" fill="#263332" font-family="Georgia,serif" font-size="30" font-weight="700">Grant arrives as the United States right falls back</text><text x="40" y="86" fill="#4b5856" font-family="Arial,sans-serif" font-size="18">April 6, 1862 · about 7 a.m.–11:30 a.m. · simplified orientation · not to scale</text>
  <rect x="48" y="680" width="20" height="20" fill="#315f8c"/><text x="80" y="697" fill="#263332" font-family="Arial,sans-serif" font-size="16">United States</text><rect x="48" y="714" width="20" height="20" fill="#9a3d32"/><text x="80" y="731" fill="#263332" font-family="Arial,sans-serif" font-size="16">Confederacy</text>
  <path d="M1120 70V125" stroke="#263332" stroke-width="5" marker-end="url(#usa)"/><text x="1120" y="52" text-anchor="middle" fill="#263332" font-family="Arial,sans-serif" font-size="20" font-weight="700">N</text>
</svg>
