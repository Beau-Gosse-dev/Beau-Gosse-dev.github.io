<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">The operational opening on September 13, 1862</title>
  <desc id="desc">Schematic map of western Maryland showing Federal concentrations east of South Mountain, Confederate forces around Hagerstown and Boonsboro, and the detached Confederate columns around Harpers Ferry.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f0df"/>
      <stop offset="1" stop-color="#e9dfc8"/>
    </linearGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="1" fill="#6b5a42" opacity=".06"/>
      <circle cx="18" cy="15" r="1.2" fill="#6b5a42" opacity=".05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3a3024" flood-opacity=".25"/>
    </filter>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="9.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="9.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#9a3d32"/>
    </marker>
    <style>
      .label{font-family:Georgia,'Times New Roman',serif;fill:#2b241d}.sans{font-family:Arial,sans-serif;fill:#2b241d}.town{font:700 22px Georgia,'Times New Roman',serif}.small{font:18px Arial,sans-serif}.tiny{font:16px Arial,sans-serif}.unit{font:700 18px Arial,sans-serif}.water{fill:none;stroke:#5b8ea5;stroke-width:12;stroke-linecap:round;opacity:.8}.creek{fill:none;stroke:#6e9db0;stroke-width:5;stroke-linecap:round;stroke-dasharray:4 10}.road{fill:none;stroke:#8d7b60;stroke-width:6;stroke-linecap:round}.ridge{fill:none;stroke:#788369;stroke-width:28;stroke-linecap:round;opacity:.42}.ridge2{fill:none;stroke:#899377;stroke-width:19;stroke-linecap:round;opacity:.32}.gap{fill:#f6f0df;stroke:#5e664f;stroke-width:3}.townDot{fill:#3d3328}.federal{fill:#edf4fb;stroke:#315f8c;stroke-width:3}.confed{fill:#fbefec;stroke:#9a3d32;stroke-width:3}.note{fill:#fffaf0;stroke:#aa9879;stroke-width:2}
    </style>
  </defs>

  <rect width="1440" height="960" fill="url(#paper)"/>
  <rect width="1440" height="960" fill="url(#grain)"/>
  <rect x="42" y="42" width="1356" height="876" rx="10" fill="none" stroke="#705f46" stroke-width="3"/>

  <text x="720" y="88" text-anchor="middle" class="label" font-size="38" font-weight="700">The operational opening</text>
  <text x="720" y="121" text-anchor="middle" class="sans" font-size="19" letter-spacing="2">WESTERN MARYLAND • SEPTEMBER 13, 1862</text>

  <!-- Water and terrain -->
  <path class="water" d="M84 789C214 770 284 727 374 739C470 752 513 823 617 835C759 852 868 798 972 814C1105 835 1218 898 1360 880"/>
  <text x="220" y="804" class="sans" font-size="19" fill="#47758b" transform="rotate(-8 220 804)">Potomac River</text>
  <path class="creek" d="M454 406C442 478 478 524 463 587C452 635 421 666 407 724"/>
  <text x="415" y="581" class="sans" font-size="16" fill="#47758b" transform="rotate(-82 415 581)">Antietam Creek</text>
  <path class="ridge2" d="M1043 176C1012 267 1030 335 1005 416C981 493 1002 567 977 660C958 729 967 799 940 858"/>
  <path class="ridge" d="M770 150C744 245 766 325 738 414C714 492 741 566 716 642C695 706 711 780 674 855"/>
  <text x="1027" y="541" class="sans" font-size="20" font-weight="700" fill="#5a634d" transform="rotate(-82 1027 541)">Catoctin Range</text>
  <text x="750" y="546" class="sans" font-size="23" font-weight="700" fill="#4f5945" transform="rotate(-82 750 546)">South Mountain</text>

  <!-- Roads -->
  <path class="road" d="M1164 330L969 401L841 421L740 431L606 439"/>
  <path class="road" d="M1100 644L896 672L722 700L580 760"/>
  <path class="road" d="M607 438L460 330L409 211"/>
  <path class="road" d="M607 438L479 586L420 660"/>
  <path class="road" d="M420 660L578 806"/>

  <!-- Gaps -->
  <circle class="gap" cx="740" cy="431" r="12"/>
  <circle class="gap" cx="725" cy="512" r="12"/>
  <circle class="gap" cx="722" cy="700" r="12"/>
  <text x="780" y="468" class="small" font-weight="700">Turner’s Gap</text>
  <text x="600" y="548" class="small" font-weight="700">Fox’s Gap</text>
  <text x="570" y="690" class="small" font-weight="700">Crampton’s Gap</text>

  <!-- Towns -->
  <g><circle class="townDot" cx="1164" cy="330" r="6"/><text class="town" x="1180" y="337">Frederick</text></g>
  <g><circle class="townDot" cx="969" cy="401" r="6"/><text class="town" x="986" y="394">Middletown</text></g>
  <g><circle class="townDot" cx="1100" cy="644" r="6"/><text class="town" x="1117" y="651">Burkittsville</text></g>
  <g><circle class="townDot" cx="606" cy="439" r="6"/><text class="town" x="536" y="474">Boonsboro</text></g>
  <g><circle class="townDot" cx="409" cy="211" r="6"/><text class="town" x="430" y="218">Hagerstown</text></g>
  <g><circle class="townDot" cx="420" cy="660" r="6"/><text class="town" x="315" y="691">Sharpsburg</text></g>
  <g><circle class="townDot" cx="578" cy="806" r="6"/><text class="town" x="593" y="814">Harpers Ferry</text></g>
  <g><circle class="townDot" cx="460" cy="330" r="5"/><text class="small" x="477" y="325" font-weight="700">Funkstown</text></g>

  <!-- Federal concentrations and opportunity arrows -->
  <g filter="url(#shadow)">
    <rect class="federal" x="1100" y="177" width="263" height="94" rx="12"/>
    <text x="1232" y="207" text-anchor="middle" class="unit" fill="#244d74">McClellan</text>
    <text x="1232" y="232" text-anchor="middle" class="small">13 divisions near Frederick</text>
    <text x="1232" y="255" text-anchor="middle" class="tiny">Right and center wings</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="federal" x="1087" y="703" width="276" height="89" rx="12"/>
    <text x="1225" y="735" text-anchor="middle" class="unit" fill="#244d74">Franklin’s left wing</text>
    <text x="1225" y="761" text-anchor="middle" class="small">4 divisions farther south</text>
  </g>
  <path d="M1102 257C1004 287 917 336 772 414" fill="none" stroke="#315f8c" stroke-width="10" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M1094 294C988 369 881 439 756 500" fill="none" stroke="#315f8c" stroke-width="8" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M1088 736C961 731 850 717 752 706" fill="none" stroke="#315f8c" stroke-width="10" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <text x="893" y="294" class="small" fill="#315f8c" font-weight="700">Main advance</text>
  <text x="897" y="691" class="small" fill="#315f8c" font-weight="700">Relief route</text>

  <!-- Confederate dispersed commands -->
  <g filter="url(#shadow)">
    <rect class="confed" x="74" y="139" width="277" height="94" rx="12"/>
    <text x="213" y="170" text-anchor="middle" class="unit" fill="#7e2f28">Lee and Longstreet</text>
    <text x="213" y="195" text-anchor="middle" class="small">Main body near Hagerstown</text>
    <text x="213" y="218" text-anchor="middle" class="tiny">Ordered back toward the gaps</text>
  </g>
  <path d="M325 229C383 282 467 348 565 407" fill="none" stroke="#9a3d32" stroke-width="9" stroke-linecap="round" stroke-dasharray="15 11" marker-end="url(#redArrow)"/>
  <g filter="url(#shadow)">
    <rect class="confed" x="424" y="367" width="259" height="76" rx="12"/>
    <text x="553" y="397" text-anchor="middle" class="unit" fill="#7e2f28">D. H. Hill and Stuart</text>
    <text x="553" y="422" text-anchor="middle" class="small">Rear guard and cavalry screen</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="confed" x="112" y="742" width="371" height="113" rx="12"/>
    <text x="297" y="773" text-anchor="middle" class="unit" fill="#7e2f28">Harpers Ferry operation</text>
    <text x="297" y="799" text-anchor="middle" class="small">Jackson • McLaws • Walker</text>
    <text x="297" y="824" text-anchor="middle" class="tiny">Separated from Lee by distance, ridges,</text>
    <text x="297" y="845" text-anchor="middle" class="tiny">and the Federal garrison</text>
  </g>

  <!-- Legend and lost-order callout -->
  <g filter="url(#shadow)">
    <rect class="note" x="858" y="817" width="488" height="67" rx="10"/>
    <text x="880" y="845" class="unit">The lost order revealed the separation.</text>
    <text x="880" y="870" class="small">The four-day-old document still revealed its structure.</text>
  </g>
  <g transform="translate(86 270)">
    <rect class="note" width="245" height="115" rx="9"/>
    <text x="18" y="28" class="unit">Map key</text>
    <line x1="20" y1="55" x2="72" y2="55" stroke="#315f8c" stroke-width="8" marker-end="url(#blueArrow)"/>
    <text x="88" y="61" class="small">Federal opportunity</text>
    <line x1="20" y1="88" x2="72" y2="88" stroke="#9a3d32" stroke-width="7" stroke-dasharray="10 7" marker-end="url(#redArrow)"/>
    <text x="88" y="94" class="small">Return movement</text>
  </g>

  <text x="720" y="908" text-anchor="middle" class="sans" font-size="16" fill="#625540">Schematic and not to scale • Routes and positions are generalized</text>
</svg>
