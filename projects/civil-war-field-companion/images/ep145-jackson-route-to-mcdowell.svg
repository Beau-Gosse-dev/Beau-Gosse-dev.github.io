<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Jackson's circuitous movement from Swift Run Gap to the McDowell approaches</title>
  <desc id="desc">Schematic north-up route map showing Jackson leaving Elk Run Valley on April 30, struggling through Port Republic and Brown's Gap to Mechum's Station, returning by rail to Staunton, joining Edward Johnson, and marching west toward McDowell on May 7.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf5e8"/><stop offset="1" stop-color="#eadfc7"/></linearGradient>
    <pattern id="mountains" width="42" height="32" patternUnits="userSpaceOnUse"><path d="M2 28 L13 7 L24 28 L33 11 L41 28" fill="none" stroke="#68765f" stroke-width="2" opacity=".55"/></pattern>
    <marker id="redArrow" markerWidth="18" markerHeight="18" refX="11" refY="6" orient="auto" viewBox="0 0 12 12"><path d="M0 0 L12 6 L0 12 Z" fill="#9a3d32"/></marker>
    <marker id="grayArrow" markerWidth="18" markerHeight="18" refX="11" refY="6" orient="auto" viewBox="0 0 12 12"><path d="M0 0 L12 6 L0 12 Z" fill="#6c665d"/></marker>
    <style>.head{font:700 30px Georgia,serif;fill:#292621}.label{font:700 20px Georgia,serif;fill:#292621}.small{font:17px Arial,sans-serif;fill:#3f3a33}.tiny{font:14px Arial,sans-serif;fill:#554f46}.red{fill:#9a3d32}.box{fill:#fffaf0;stroke:#8a7b66;stroke-width:2}.town{fill:#2d2a26}.rail{fill:none;stroke:#4d4b48;stroke-width:12;stroke-dasharray:3 11;stroke-linecap:round}.turnpike{fill:none;stroke:#aa8454;stroke-width:9;stroke-linecap:round}</style>
  </defs>
  <rect width="1200" height="760" fill="url(#paper)"/>
  <text x="32" y="46" class="head">APRIL 30–MAY 7 • JACKSON'S ROUTE TO McDOWELL</text>
  <text x="32" y="76" class="small">Route diagram • north is up • schematic geography, not a navigation map or exact march trace</text>

  <rect x="55" y="104" width="280" height="590" rx="18" fill="url(#mountains)" opacity=".82"/>
  <rect x="760" y="104" width="145" height="590" rx="18" fill="url(#mountains)" opacity=".82"/>
  <text x="112" y="675" class="label" fill="#65715e">ALLEGHENIES</text>
  <text x="804" y="664" class="label" fill="#65715e" transform="rotate(-90 804 664)">BLUE RIDGE</text>
  <text x="426" y="675" class="label" fill="#7a684d">SHENANDOAH VALLEY</text>
  <text x="1003" y="675" class="label" fill="#7a684d">PIEDMONT</text>

  <path class="turnpike" d="M156 555 C260 550 363 552 485 558"/>
  <text x="194" y="583" class="tiny">Staunton–Parkersburg Turnpike</text>
  <path class="rail" d="M487 557 C635 563 786 566 964 528"/>
  <line x1="487" y1="548" x2="964" y2="519" stroke="#4d4b48" stroke-width="2" opacity=".6"/>
  <text x="605" y="602" class="tiny">Virginia Central Railroad • train movement west</text>

  <circle cx="704" cy="152" r="8" class="town"/><text x="725" y="158" class="small">Conrad's Store / Elk Run Valley</text>
  <circle cx="615" cy="286" r="8" class="town"/><text x="503" y="276" class="small">Port Republic</text>
  <circle cx="808" cy="408" r="8" class="town"/><text x="827" y="414" class="small">Brown's Gap</text>
  <circle cx="964" cy="528" r="8" class="town"/><text x="981" y="535" class="small">Mechum's Station</text>
  <circle cx="487" cy="557" r="8" class="town"/><text x="463" y="535" class="small">Staunton</text>
  <circle cx="365" cy="552" r="8" class="town"/><text x="331" y="529" class="small">Buffalo Gap</text>
  <circle cx="244" cy="551" r="8" class="town"/><text x="214" y="528" class="small">Shaw's Fork</text>
  <circle cx="156" cy="555" r="8" class="town"/><text x="95" y="530" class="small">McDowell</text>

  <path d="M700 169 C685 213 650 245 622 273 C671 321 739 370 795 401 C844 444 902 490 951 520" fill="none" stroke="#9a3d32" stroke-width="11" marker-end="url(#redArrow)"/>
  <text x="641" y="221" class="tiny red">April 30: heavy rain and deep mud</text>
  <text x="687" y="354" class="tiny red">May 3: crosses Brown's Gap</text>
  <path d="M948 542 C827 566 663 566 506 558" fill="none" stroke="#9a3d32" stroke-width="9" marker-end="url(#redArrow)"/>
  <text x="715" y="534" class="tiny red">May 4–5: troops return west by rail</text>
  <path d="M473 566 C376 582 265 579 168 563" fill="none" stroke="#9a3d32" stroke-width="10" marker-end="url(#redArrow)"/>
  <text x="258" y="627" class="tiny red">May 7: Jackson and Johnson move west</text>

  <path d="M1062 189 C952 176 839 170 725 159" fill="none" stroke="#6c665d" stroke-width="8" stroke-dasharray="15 10" marker-end="url(#grayArrow)"/>
  <rect x="906" y="104" width="250" height="82" rx="10" class="box"/>
  <text x="925" y="133" class="label">Ewell</text><text x="925" y="159" class="small">takes Jackson's place at the gap</text>

  <g>
    <circle cx="682" cy="130" r="18" fill="#9a3d32"/><text x="676" y="136" font-family="Arial" font-weight="700" font-size="16" fill="white">1</text>
    <circle cx="593" cy="264" r="18" fill="#9a3d32"/><text x="587" y="270" font-family="Arial" font-weight="700" font-size="16" fill="white">2</text>
    <circle cx="787" cy="387" r="18" fill="#9a3d32"/><text x="781" y="393" font-family="Arial" font-weight="700" font-size="16" fill="white">3</text>
    <circle cx="943" cy="507" r="18" fill="#9a3d32"/><text x="937" y="513" font-family="Arial" font-weight="700" font-size="16" fill="white">4</text>
    <circle cx="466" cy="579" r="18" fill="#9a3d32"/><text x="460" y="585" font-family="Arial" font-weight="700" font-size="16" fill="white">5</text>
    <circle cx="135" cy="577" r="18" fill="#9a3d32"/><text x="129" y="583" font-family="Arial" font-weight="700" font-size="16" fill="white">6</text>
  </g>

  <rect x="39" y="113" width="455" height="177" rx="12" class="box"/>
  <text x="59" y="144" class="label">Movement sequence</text>
  <text x="59" y="174" class="small">1. Leave Elk Run Valley; Ewell replaces Jackson</text>
  <text x="59" y="202" class="small">2–4. Port Republic → Brown's Gap → Mechum's</text>
  <text x="59" y="230" class="small">5. Rail west through Rockfish Gap to Staunton</text>
  <text x="59" y="258" class="small">6. Join Johnson and advance toward McDowell</text>

  <path d="M1148 112 L1148 169" stroke="#292621" stroke-width="4"/><path d="M1148 92 L1135 120 L1161 120 Z" fill="#292621"/><text x="1139" y="82" class="label">N</text>
</svg>
