<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Opposing movements toward Sharpsburg on September 15, 1862</title>
  <desc id="desc">Schematic operational map with north at top. Confederate forces move west from South Mountain through Boonsboro and Keedysville to Sharpsburg while their trains move toward the Potomac. Federal First, Second, and Twelfth Corps pursue on the National Road, and Ninth Corps with Sykes's division follows the Old Sharpsburg Road.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf4e5"/>
      <stop offset="1" stop-color="#e9dcc1"/>
    </linearGradient>
    <marker id="blueArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <style>
      .place { font: 700 17px Georgia, serif; fill: #2d2a26; }
      .small { font: 14px Arial, sans-serif; fill: #4e4940; }
      .unit-blue { font: 700 16px Arial, sans-serif; fill: #244c73; }
      .unit-red { font: 700 16px Arial, sans-serif; fill: #7a3029; }
    </style>
  </defs>
  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#998a6d" stroke-width="2"/>
  <text x="58" y="76" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#2d2a26">THE APPROACH TO SHARPSBURG</text>
  <text x="59" y="106" font-family="Arial, sans-serif" font-size="17" fill="#5e574b">Confederate withdrawal and Federal pursuit · Monday, September 15, 1862</text>

  <rect x="50" y="127" width="1100" height="605" rx="12" fill="#e8e2c8" stroke="#c5b897"/>
  <path d="M875 127C844 197 883 258 851 325C819 391 860 454 828 521C797 586 833 655 805 732H1017C992 656 1016 589 987 521C961 459 998 393 968 326C940 263 968 196 944 127Z" fill="#667159" opacity="0.9"/>
