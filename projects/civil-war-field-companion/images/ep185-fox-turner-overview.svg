  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#9b8d72" stroke-width="2"/>
  <text x="60" y="77" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2e2b28">SOUTH MOUNTAIN: THE AFTERNOON FIGHT</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#5d5548">Fox's, Turner's, and Frosttown Gaps · September 14, 1862</text>

  <rect x="48" y="127" width="1104" height="617" fill="#e9e5cb"/>
