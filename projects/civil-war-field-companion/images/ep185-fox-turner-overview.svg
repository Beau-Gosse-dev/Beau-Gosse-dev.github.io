      <circle cx="10" cy="18" r="8" fill="#536248" opacity="0.34"/>
      <circle cx="24" cy="11" r="7" fill="#6a7557" opacity="0.3"/>
      <circle cx="31" cy="27" r="6" fill="#485a43" opacity="0.3"/>
    </pattern>
  </defs>
