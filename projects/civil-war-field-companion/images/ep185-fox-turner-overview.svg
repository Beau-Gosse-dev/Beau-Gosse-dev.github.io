<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Fox's Gap and Turner's Gap on the afternoon of September 14, 1862</title>
  <desc id="desc">Schematic map with north at top. South Mountain runs north to south between Boonsboro on the west and Middletown and Bolivar on the east. United States Ninth Corps arrows approach Fox's Gap on the Old Sharpsburg Road, while First Corps arrows approach Turner's and Frosttown Gaps north of the National Road. Confederate reinforcements approach from Boonsboro and Hagerstown.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f1df"/>
      <stop offset="1" stop-color="#e9ddc4"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e866f"/>
      <stop offset="0.48" stop-color="#5f684f"/>
      <stop offset="1" stop-color="#8e866f"/>
    </linearGradient>
    <marker id="blueArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
