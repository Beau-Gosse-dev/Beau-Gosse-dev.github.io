  <text x="230" y="425" font-family="Arial, sans-serif" font-size="15" fill="#7a3029">D. R. Jones · Hood</text>

  <path d="M552 431C611 412 656 420 698 449" fill="none" stroke="#963b31" stroke-width="7" stroke-dasharray="13 9" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <path d="M700 449C663 476 622 481 589 467" fill="none" stroke="#963b31" stroke-width="7" stroke-dasharray="13 9" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <text x="665" y="402" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7a3029">planned counterattack</text>
