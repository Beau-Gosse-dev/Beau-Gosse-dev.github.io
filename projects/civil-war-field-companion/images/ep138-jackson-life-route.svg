<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Thomas J. Jackson's path from western Virginia to Richmond</title>
  <desc id="desc">Schematic map of the eastern United States showing Jackson's movement from Clarksburg to West Point, Fort Hamilton, Fort Meade, Lexington, and Richmond between 1824 and 1861.</desc>
  <defs>
    <marker id="route-arrow" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" refX="15" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#744f2e"/></marker>
    <pattern id="water" width="28" height="18" patternUnits="userSpaceOnUse"><path d="M1 11 Q7 5 13 11 T25 11" fill="none" stroke="#8fb7c8" stroke-width="2"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="#f5f0e4"/>
  <path d="M60 122 C170 86 315 82 418 108 C486 125 548 103 625 96 C733 86 862 101 972 137 C1051 163 1110 205 1147 256 L1112 311 C1087 353 1060 391 1053 446 C1040 533 1066 602 1095 690 L273 690 C234 650 215 601 205 547 C192 473 154 429 112 384 C75 344 54 289 55 224 Z" fill="#e8dfc8" stroke="#a6977d" stroke-width="4"/>
  <path d="M1033 104 C1048 165 1025 217 1038 269 C1052 326 1096 348 1095 410 C1094 462 1063 506 1071 560 C1078 609 1104 652 1128 706 L1180 706 L1180 82 Z" fill="url(#water)" opacity="0.9"/>
  <text x="1012" y="92" fill="#4f7e91" font-family="Georgia,serif" font-size="22" font-style="italic">Atlantic Ocean</text>
  <path d="M268 692 C351 613 417 553 478 509 C566 445 679 403 752 339 C824 276 856 194 914 108" fill="none" stroke="#b9c6a7" stroke-width="22" opacity="0.65"/>
  <text x="546" y="445" fill="#647654" font-family="Georgia,serif" font-size="22" font-style="italic" transform="rotate(-34 546 445)">Appalachian Mountains</text>

  <g fill="none" stroke="#744f2e" stroke-width="7" stroke-linecap="round" marker-end="url(#route-arrow)">
    <path d="M577 300 C684 233 801 180 946 135"/>
    <path d="M948 143 C966 170 969 194 965 219"/>
    <path d="M957 236 C774 309 591 433 436 603"/>
    <path d="M449 602 C489 510 562 419 638 367"/>
    <path d="M657 370 C704 374 744 383 787 402"/>
  </g>

  <g font-family="Arial,sans-serif">
    <g transform="translate(576 300)"><circle r="13" fill="#272727"/><rect x="-182" y="18" width="244" height="62" rx="10" fill="#fffaf0" stroke="#9e8b70"/><text x="-164" y="44" font-size="23" font-weight="700" fill="#282522">Clarksburg, Virginia</text><text x="-164" y="68" font-size="17" fill="#5c574f">born January 21, 1824</text></g>
    <g transform="translate(950 132)"><circle r="13" fill="#315f8c"/><rect x="-282" y="-58" width="247" height="61" rx="10" fill="#edf4f8" stroke="#315f8c"/><text x="-264" y="-32" font-size="22" font-weight="700" fill="#234866">West Point, New York</text><text x="-264" y="-9" font-size="17" fill="#315f72">cadet, 1842–1846</text></g>
    <g transform="translate(965 228)"><circle r="13" fill="#315f8c"/><rect x="-292" y="12" width="258" height="61" rx="10" fill="#edf4f8" stroke="#315f8c"/><text x="-274" y="38" font-size="22" font-weight="700" fill="#234866">Fort Hamilton, New York</text><text x="-274" y="62" font-size="17" fill="#315f72">garrison duty, 1849–1851</text></g>
    <g transform="translate(432 614)"><circle r="13" fill="#315f8c"/><rect x="-8" y="-77" width="259" height="61" rx="10" fill="#edf4f8" stroke="#315f8c"/><text x="10" y="-51" font-size="22" font-weight="700" fill="#234866">Fort Meade, Florida</text><text x="10" y="-27" font-size="17" fill="#315f72">U.S. Army service, 1851</text></g>
    <g transform="translate(647 364)"><circle r="13" fill="#9a3d32"/><rect x="-220" y="17" width="249" height="62" rx="10" fill="#f5e7e3" stroke="#9a3d32"/><text x="-202" y="44" font-size="22" font-weight="700" fill="#702a23">Lexington, Virginia</text><text x="-202" y="68" font-size="17" fill="#7f3e35">VMI professor, 1851–1861</text></g>
    <g transform="translate(796 406)"><circle r="13" fill="#9a3d32"/><rect x="18" y="-21" width="277" height="64" rx="10" fill="#f5e7e3" stroke="#9a3d32"/><text x="36" y="7" font-size="22" font-weight="700" fill="#702a23">Richmond, Virginia</text><text x="36" y="31" font-size="17" fill="#7f3e35">cadet corps sent here, Apr. 1861</text></g>
  </g>

  <text x="43" y="52" fill="#2c2925" font-family="Georgia,serif" font-size="34" font-weight="700">Jackson's prewar path</text>
  <text x="44" y="85" fill="#5c574f" font-family="Arial,sans-serif" font-size="20">1824–April 1861 • locations schematic, routes not exact</text>
  <rect x="51" y="635" width="331" height="76" rx="12" fill="#fffaf0" stroke="#b8aa94"/>
  <line x1="75" y1="660" x2="140" y2="660" stroke="#744f2e" stroke-width="7" marker-end="url(#route-arrow)"/>
  <text x="158" y="667" font-family="Arial,sans-serif" font-size="19" fill="#292929">chronological movement</text>
  <circle cx="86" cy="691" r="10" fill="#315f8c"/><text x="106" y="698" font-family="Arial,sans-serif" font-size="17" fill="#292929">U.S. Army</text>
  <circle cx="235" cy="691" r="10" fill="#9a3d32"/><text x="255" y="698" font-family="Arial,sans-serif" font-size="17" fill="#292929">VMI / Virginia</text>
</svg>
