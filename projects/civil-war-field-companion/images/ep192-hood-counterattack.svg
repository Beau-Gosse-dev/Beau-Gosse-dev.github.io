  <path d="M861 261C836 311 818 356 809 399" fill="none" stroke="#315f8c" stroke-width="10" stroke-linecap="round" marker-end="url(#blueArrow)"/>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(349 698)">
      <rect x="-78" y="-23" width="156" height="46" rx="8" fill="#963b31"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">WOFFORD</text>
    </g>
    <g transform="translate(730 699)">
      <rect x="-70" y="-23" width="140" height="46" rx="8" fill="#963b31"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">LAW</text>
    </g>
    <g transform="translate(684 575)">
      <rect x="-81" y="-24" width="162" height="48" rx="8" fill="#7c2925"/>
      <text x="0" y="-2" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1ST TEXAS</text>
      <text x="0" y="17" text-anchor="middle" font-size="12" fill="#f8dedb">surges ahead</text>
    </g>

    <g transform="translate(385 233)">
      <rect x="-91" y="-23" width="182" height="46" rx="8" fill="#315f8c"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">PATRICK · GIBBON</text>
    </g>
    <g transform="translate(610 190)">
      <rect x="-88" y="-23" width="176" height="46" rx="8" fill="#315f8c"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">MEADE RESERVE</text>
    </g>
    <g transform="translate(880 218)">
      <rect x="-80" y="-23" width="160" height="46" rx="8" fill="#315f8c"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">RICKETTS</text>
    </g>
  </g>

  <g transform="translate(462 353)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="-84" y="-28" width="168" height="56" rx="8" fill="#e5edf5" stroke="#315f8c" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" font-size="14" font-weight="700" fill="#244d76">BATTERY B</text>
    <text x="0" y="16" text-anchor="middle" font-size="12" fill="#244d76">double canister</text>
  </g>

  <path d="M594 274L798 285" fill="none" stroke="#5e5143" stroke-width="7" stroke-dasharray="9 6"/>
  <rect x="627" y="240" width="154" height="25" rx="5" fill="#fffaf0" opacity="0.95"/>
  <text x="704" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#5d5144">NORTH FIELD FENCE</text>

  <g transform="translate(1052 688)" font-family="Arial, sans-serif">
    <rect x="-140" y="-52" width="158" height="94" rx="10" fill="#fffaf0" stroke="#93846d" stroke-width="2" opacity="0.97"/>
    <line x1="-120" y1="-24" x2="-87" y2="-24" stroke="#315f8c" stroke-width="8" marker-end="url(#blueArrow)"/>
    <text x="-70" y="-19" font-size="14" fill="#2f2b27">Federal</text>
    <line x1="-120" y1="14" x2="-87" y2="14" stroke="#963b31" stroke-width="8" marker-end="url(#redArrow)"/>
