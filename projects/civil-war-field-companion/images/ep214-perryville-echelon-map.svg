<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Perryville echelon attack, October 8, 1862</title>
  <desc id="desc">Schematic north-up map of the Confederate attacks between 2 and 4:30 p.m. against Open Knob, Starkweather Hill, the center ridges, and Loomis Heights near the Bottom house.</desc>
  <defs>
    <marker id="blueArrow214" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow214" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#963b31"/>
    </marker>
    <filter id="paper214" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="214" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.03"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <style>
      .title214 { font: 700 30px Georgia, serif; fill: #2b2722; }
      .subtitle214 { font: 16px Georgia, serif; fill: #5f574c; }
      .label214 { font: 700 16px Arial, sans-serif; fill: #302c27; paint-order: stroke; stroke: #f8f1e3; stroke-width: 5px; stroke-linejoin: round; }
      .small214 { font: 14px Arial, sans-serif; fill: #3e3932; paint-order: stroke; stroke: #f8f1e3; stroke-width: 4px; stroke-linejoin: round; }
      .blue214 { font: 700 15px Arial, sans-serif; fill: #244f79; }
      .red214 { font: 700 15px Arial, sans-serif; fill: #7f2f27; }
      .time214 { font: 700 13px Arial, sans-serif; fill: #7f2f27; paint-order: stroke; stroke: #f8f1e3; stroke-width: 4px; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f8f1e3"/>
  <g filter="url(#paper214)">
    <text x="48" y="48" class="title214">Perryville: Bragg’s echelon attack</text>
    <text x="48" y="75" class="subtitle214">October 8, 1862 · approximately 2:00–4:30 p.m. · schematic, north up</text>

    <!-- Relief and fields -->
    <path d="M135 190 C260 145 390 158 505 132 C650 100 810 128 950 98" fill="none" stroke="#cbbb9a" stroke-width="2" stroke-dasharray="8 8"/>
    <path d="M105 286 C260 238 395 260 530 226 C670 190 815 215 970 180" fill="none" stroke="#cbbb9a" stroke-width="2" stroke-dasharray="8 8"/>
    <path d="M95 475 C250 425 385 449 515 410 C690 357 830 386 1000 340" fill="none" stroke="#cbbb9a" stroke-width="2" stroke-dasharray="8 8"/>
    <path d="M120 680 C275 627 415 660 565 615 C710 570 855 595 1012 548" fill="none" stroke="#cbbb9a" stroke-width="2" stroke-dasharray="8 8"/>
    <rect x="305" y="280" width="245" height="118" rx="10" fill="#e7d899" opacity="0.52" stroke="#b6a36f" stroke-width="2"/>
    <path d="M325 300 L530 377 M320 330 L500 396 M360 288 L548 350" stroke="#b6a36f" stroke-width="2" opacity="0.65"/>
    <text x="369" y="343" class="small214">tall cornfield</text>

    <!-- Water and roads -->
    <path d="M1040 90 C1010 160 1060 227 1025 300 C995 365 1040 430 1010 500 C985 560 1025 625 998 715" fill="none" stroke="#6f9fb7" stroke-width="11"/>
    <path d="M648 100 C620 175 654 250 626 320 C598 390 640 465 610 535 C585 590 618 660 588 720" fill="none" stroke="#78a9bf" stroke-width="8"/>
    <text x="1065" y="250" class="label214" transform="rotate(79 1065 250)">Chaplin River</text>
    <text x="570" y="443" class="label214" transform="rotate(-83 570 443)">Doctors Creek</text>
    <path d="M82 250 C255 248 430 245 615 239 C780 233 930 224 1035 215" fill="none" stroke="#8b7961" stroke-width="9"/>
    <path d="M70 602 C250 598 410 596 600 589 C770 582 920 569 1020 548" fill="none" stroke="#8b7961" stroke-width="10"/>
    <path d="M100 705 C290 689 450 686 595 674 C780 658 915 620 1010 563" fill="none" stroke="#8b7961" stroke-width="7"/>
    <text x="90" y="231" class="label214">Benton Road</text>
    <text x="88" y="582" class="label214">Mackville Road</text>
    <text x="94" y="734" class="small214">Springfield Pike</text>

    <!-- Landmarks -->
    <ellipse cx="493" cy="210" rx="90" ry="48" fill="#dacb98" opacity="0.72" stroke="#a79569" stroke-width="2"/>
    <ellipse cx="265" cy="220" rx="93" ry="50" fill="#dacb98" opacity="0.72" stroke="#a79569" stroke-width="2"/>
    <ellipse cx="382" cy="548" rx="110" ry="49" fill="#dacb98" opacity="0.58" stroke="#a79569" stroke-width="2"/>
    <text x="450" y="164" class="label214">Open Knob</text>
    <text x="214" y="166" class="label214">Starkweather Hill</text>
    <text x="329" y="511" class="label214">Loomis Heights</text>
    <rect x="554" y="555" width="22" height="17" fill="#725743" stroke="#3f3025" stroke-width="2"/>
    <text x="488" y="546" class="small214">H. P. Bottom house</text>
    <circle cx="1022" cy="527" r="8" fill="#2f2a25"/>
    <text x="1040" y="532" class="label214">Perryville</text>
    <circle cx="110" cy="603" r="7" fill="#2f2a25"/>
    <text x="80" y="638" class="small214">toward Dixville Crossroads</text>

    <!-- United States line -->
    <g>
      <rect x="188" y="190" width="156" height="43" rx="6" fill="#d7e5f0" stroke="#315f8c" stroke-width="3"/>
      <text x="202" y="208" class="blue214">Starkweather</text>
      <text x="202" y="226" class="small214">28th Brigade · 12 guns</text>
      <rect x="430" y="186" width="148" height="43" rx="6" fill="#d7e5f0" stroke="#315f8c" stroke-width="3"/>
      <text x="443" y="204" class="blue214">Terrill / Jackson</text>
      <text x="443" y="222" class="small214">Open Knob · 8 guns</text>
      <rect x="382" y="402" width="144" height="43" rx="6" fill="#d7e5f0" stroke="#315f8c" stroke-width="3"/>
      <text x="396" y="420" class="blue214">Webster / Harris</text>
      <text x="396" y="438" class="small214">center ridge</text>
      <rect x="302" y="566" width="150" height="43" rx="6" fill="#d7e5f0" stroke="#315f8c" stroke-width="3"/>
      <text x="316" y="584" class="blue214">Lytle</text>
      <text x="316" y="602" class="small214">infantry and Loomis</text>
      <path d="M500 238 C453 258 408 277 360 302" fill="none" stroke="#315f8c" stroke-width="5" stroke-dasharray="9 7" marker-end="url(#blueArrow214)"/>
      <text x="430" y="278" class="small214">Terrill falls back</text>
    </g>

    <!-- Confederate echelon -->
    <g>
      <rect x="710" y="135" width="156" height="43" rx="6" fill="#efd2cc" stroke="#963b31" stroke-width="3"/>
      <text x="724" y="153" class="red214">Maney / Stewart</text>
      <text x="724" y="171" class="small214">Cheatham’s division</text>
      <path d="M710 169 C648 171 598 185 554 198" fill="none" stroke="#963b31" stroke-width="8" marker-end="url(#redArrow214)"/>
      <path d="M684 185 C590 206 490 265 345 322 C300 341 275 305 273 250" fill="none" stroke="#963b31" stroke-width="7" marker-end="url(#redArrow214)"/>
      <text x="603" y="154" class="time214">~3:00–4:15</text>

      <rect x="720" y="294" width="154" height="43" rx="6" fill="#efd2cc" stroke="#963b31" stroke-width="3"/>
      <text x="734" y="312" class="red214">Donelson</text>
      <text x="734" y="330" class="small214">15th, 16th, 38th Tenn.</text>
      <path d="M720 316 C655 325 600 356 522 409" fill="none" stroke="#963b31" stroke-width="8" marker-end="url(#redArrow214)"/>
      <text x="611" y="323" class="time214">2:00–2:30</text>

      <rect x="742" y="410" width="152" height="63" rx="6" fill="#efd2cc" stroke="#963b31" stroke-width="3"/>
      <text x="756" y="429" class="red214">Jones / Brown</text>
      <text x="756" y="447" class="small214">Anderson’s division</text>
      <text x="756" y="465" class="small214">attacks in the center</text>
      <path d="M742 443 C672 443 603 434 526 424" fill="none" stroke="#963b31" stroke-width="8" marker-end="url(#redArrow214)"/>
      <text x="633" y="470" class="time214">~3:00–4:30</text>

      <rect x="745" y="575" width="178" height="63" rx="6" fill="#efd2cc" stroke="#963b31" stroke-width="3"/>
      <text x="759" y="594" class="red214">Johnson / Cleburne</text>
      <text x="759" y="612" class="small214">Buckner’s division</text>
      <text x="759" y="630" class="small214">Adams on the flank</text>
      <path d="M745 597 C682 595 630 586 576 571 C530 560 490 567 451 583" fill="none" stroke="#963b31" stroke-width="8" marker-end="url(#redArrow214)"/>
      <path d="M735 635 C650 655 555 655 455 611" fill="none" stroke="#963b31" stroke-width="7" marker-end="url(#redArrow214)"/>
      <text x="621" y="627" class="time214">~3:30–4:30</text>
    </g>

    <!-- Legend and north -->
    <g transform="translate(48 92)">
      <rect width="475" height="54" rx="8" fill="#fffaf0" stroke="#b5a98f"/>
      <line x1="18" y1="27" x2="61" y2="27" stroke="#315f8c" stroke-width="7" marker-end="url(#blueArrow214)"/>
      <text x="76" y="33" class="small214">United States movement</text>
      <line x1="251" y1="27" x2="294" y2="27" stroke="#963b31" stroke-width="7" marker-end="url(#redArrow214)"/>
      <text x="309" y="33" class="small214">Confederate attack</text>
    </g>
    <g transform="translate(1110 100)">
      <path d="M0 48 L0 4" stroke="#2f2a25" stroke-width="3" marker-end="url(#blueArrow214)"/>
      <text x="-7" y="-5" class="label214">N</text>
    </g>
    <text x="48" y="770" class="small214">Positions, roads, and attack paths are approximate. Based on J. B. Work’s battlefield map, the Official Records, and U.S. Army history.</text>
  </g>
</svg>
