<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">McClellan's approaches to Richmond in May 1862</title>
  <desc id="desc">Schematic map showing the actual railroad supply route from White House Landing, the alternative James River route, the Chickahominy River, and McDowell's expected route from Fredericksburg.</desc>
  <defs>
    <marker id="blue-arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="8" orient="auto"><path d="M0,0 L17,8 L0,16 Z" fill="#315f8c"/></marker>
    <marker id="gray-arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="8" orient="auto"><path d="M0,0 L17,8 L0,16 Z" fill="#58636c"/></marker>
    <pattern id="marsh" width="18" height="12" patternUnits="userSpaceOnUse"><path d="M1 10 Q5 3 9 10 T17 10" fill="none" stroke="#8cb5a0" stroke-width="1.5"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="#f5f0e4"/>
  <path d="M40 555 C190 530 275 590 400 550 S630 475 790 520 S1010 620 1170 555 L1170 730 L40 730 Z" fill="#c5deea" stroke="#5e91ad" stroke-width="5"/>
  <text x="780" y="675" fill="#315f72" font-family="Georgia,serif" font-size="30" font-style="italic">James River</text>
  <path d="M1125 210 C1000 220 940 275 835 300 C720 328 610 302 520 340 C420 382 344 423 265 460" fill="none" stroke="#6a9db4" stroke-width="20" stroke-linecap="round"/>
  <text x="820" y="245" fill="#315f72" font-family="Georgia,serif" font-size="26" font-style="italic">Pamunkey River</text>
  <path d="M1125 388 C1000 370 920 412 830 430 C710 455 640 425 540 444 C430 465 355 505 270 525" fill="none" stroke="#78a9bc" stroke-width="13" stroke-linecap="round"/>
  <text x="820" y="410" fill="#315f72" font-family="Georgia,serif" font-size="23" font-style="italic">Chickahominy River</text>
  <path d="M765 404 C720 423 685 435 630 438 L350 525" fill="none" stroke="#bc792f" stroke-width="5" stroke-dasharray="14 8"/>
  <text x="545" y="408" fill="#7e4d1f" font-family="Arial,sans-serif" font-size="18" transform="rotate(-9 545 408)">Richmond &amp; York River Railroad</text>
  <path d="M785 312 C710 336 646 365 590 405 C520 452 452 490 355 520" fill="none" stroke="#315f8c" stroke-width="10" marker-end="url(#blue-arrow)"/>
  <text x="515" y="365" fill="#234866" font-family="Arial,sans-serif" font-size="23" font-weight="700">Actual army and supply axis</text>
  <path d="M970 662 C805 650 660 630 545 594 C455 566 410 548 360 530" fill="none" stroke="#58636c" stroke-width="8" stroke-dasharray="16 10" marker-end="url(#gray-arrow)"/>
  <text x="640" y="615" fill="#3e4850" font-family="Arial,sans-serif" font-size="22" font-weight="700">Alternative James River approach</text>
  <path d="M690 75 C667 142 640 196 600 244 C557 296 505 334 450 365" fill="none" stroke="#315f8c" stroke-width="8" stroke-dasharray="16 10" marker-end="url(#blue-arrow)"/>
  <text x="700" y="118" fill="#234866" font-family="Arial,sans-serif" font-size="21" font-weight="700">McDowell expected from north</text>
  <text x="700" y="145" fill="#234866" font-family="Arial,sans-serif" font-size="18">movement suspended May 24</text>
  <circle cx="785" cy="312" r="12" fill="#182f44"/>
  <text x="805" y="306" fill="#182f44" font-family="Arial,sans-serif" font-size="24" font-weight="700">White House Landing</text>
  <text x="805" y="335" fill="#182f44" font-family="Arial,sans-serif" font-size="18">main depot on the Pamunkey</text>
  <circle cx="690" cy="75" r="11" fill="#182f44"/>
  <text x="710" y="70" fill="#182f44" font-family="Arial,sans-serif" font-size="22" font-weight="700">Fredericksburg</text>
  <circle cx="450" cy="365" r="11" fill="#182f44"/>
  <text x="300" y="350" fill="#182f44" font-family="Arial,sans-serif" font-size="22" font-weight="700">Hanover Court House</text>
  <circle cx="350" cy="525" r="15" fill="#9a3d32"/>
  <text x="205" y="565" fill="#702a23" font-family="Arial,sans-serif" font-size="30" font-weight="700">RICHMOND</text>
  <rect x="540" y="425" width="310" height="90" rx="14" fill="url(#marsh)" stroke="#7d9f8c" stroke-width="2"/>
  <text x="652" y="486" fill="#3f6552" font-family="Arial,sans-serif" font-size="17">flooded bottomlands</text>
  <text x="42" y="55" fill="#2c2925" font-family="Georgia,serif" font-size="34" font-weight="700">Approaches to Richmond</text>
  <text x="44" y="88" fill="#5c574f" font-family="Arial,sans-serif" font-size="20">May 1862 • schematic, not to scale</text>
  <rect x="42" y="650" width="480" height="70" rx="10" fill="#fffaf0" stroke="#b8aa94"/>
  <line x1="65" y1="676" x2="125" y2="676" stroke="#315f8c" stroke-width="9"/>
  <text x="140" y="683" font-family="Arial,sans-serif" font-size="18" fill="#292929">actual / expected United States movement</text>
  <line x1="65" y1="704" x2="125" y2="704" stroke="#58636c" stroke-width="7" stroke-dasharray="12 7"/>
  <text x="140" y="711" font-family="Arial,sans-serif" font-size="18" fill="#292929">discussed alternative</text>
</svg>
