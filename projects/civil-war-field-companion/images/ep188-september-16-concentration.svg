<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">The armies concentrate at Sharpsburg on September 16, 1862</title>
  <desc id="desc">Schematic regional map with north at top. Sharpsburg lies west of Antietam Creek, Keedysville east of the creek, Harpers Ferry southwest, Shepherdstown south, and Pleasant Valley southeast. Confederate arrows show Jackson and Walker moving from Harpers Ferry and Shepherdstown to Lee at Sharpsburg. A United States arrow shows Franklin remaining in Pleasant Valley until ordered toward Sharpsburg, while the main Army of the Potomac concentrates from Keedysville.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e3"/>
      <stop offset="1" stop-color="#e8dcc3"/>
    </linearGradient>
    <pattern id="ridge" width="42" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 27Q10 9 20 27T42 27" fill="none" stroke="#68745d" stroke-width="3" opacity="0.35"/>
    </pattern>
    <marker id="blueArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#97896f" stroke-width="2"/>
  <text x="60" y="77" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2f2b27">SEPTEMBER 16: CONCENTRATION AT SHARPSBURG</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#5c5549">The divided armies close on Antietam Creek before the battle</text>

  <rect x="48" y="128" width="1104" height="613" fill="#e9e6cf"/>

  <path d="M673 128C645 205 672 261 640 323C614 374 645 423 616 486C584 555 610 634 587 741H779C796 647 773 568 800 501C824 442 797 383 826 324C856 263 829 198 853 128Z" fill="#78816a" opacity="0.74"/>
  <path d="M673 128C645 205 672 261 640 323C614 374 645 423 616 486C584 555 610 634 587 741H779C796 647 773 568 800 501C824 442 797 383 826 324C856 263 829 198 853 128Z" fill="url(#ridge)"/>
  <text x="714" y="506" transform="rotate(-84 714 506)" font-family="Georgia, serif" font-size="25" font-weight="700" letter-spacing="4" fill="#f5ecd7" opacity="0.9">SOUTH MOUNTAIN</text>

  <path d="M230 128C246 198 215 257 236 322C257 388 227 450 251 514C275 580 247 650 266 741" fill="none" stroke="#6d91a3" stroke-width="34" opacity="0.9"/>
  <path d="M230 128C246 198 215 257 236 322C257 388 227 450 251 514C275 580 247 650 266 741" fill="none" stroke="#b7d0d8" stroke-width="12"/>
  <text x="186" y="460" transform="rotate(-88 186 460)" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#365c70">Potomac River</text>

  <path d="M445 129C429 203 468 260 442 327C419 386 459 446 431 510C402 577 441 654 418 741" fill="none" stroke="#5e899e" stroke-width="24"/>
  <path d="M445 129C429 203 468 260 442 327C419 386 459 446 431 510C402 577 441 654 418 741" fill="none" stroke="#b9d5dd" stroke-width="8"/>
  <text x="484" y="492" transform="rotate(-86 484 492)" font-family="Georgia, serif" font-size="21" font-style="italic" fill="#365c70">Antietam Creek</text>

  <path d="M916 179C806 249 701 323 599 408C521 473 418 551 298 650" fill="none" stroke="#b48653" stroke-width="15"/>
  <path d="M916 179C806 249 701 323 599 408C521 473 418 551 298 650" fill="none" stroke="#f0d8ad" stroke-width="5"/>
  <path d="M443 302C523 305 594 316 676 334" fill="none" stroke="#b48653" stroke-width="13"/>
  <path d="M443 302C523 305 594 316 676 334" fill="none" stroke="#f0d8ad" stroke-width="4"/>

  <path d="M281 655C333 617 371 567 409 520" fill="none" stroke="#b48653" stroke-width="13"/>
  <path d="M281 655C333 617 371 567 409 520" fill="none" stroke="#f0d8ad" stroke-width="4"/>
  <text x="281" y="598" transform="rotate(-46 281 598)" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#6c5133">SHEPHERDSTOWN ROAD</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(340 301)">
      <circle r="9" fill="#514b45" stroke="#fffaf0" stroke-width="3"/>
      <rect x="-70" y="18" width="140" height="42" rx="7" fill="#fffaf0" stroke="#8d806a"/>
      <text x="0" y="46" text-anchor="middle" font-size="19" font-weight="700" fill="#2f2b27">Sharpsburg</text>
    </g>
    <g transform="translate(550 302)">
      <circle r="8" fill="#514b45" stroke="#fffaf0" stroke-width="3"/>
      <rect x="-66" y="19" width="132" height="39" rx="7" fill="#fffaf0" stroke="#8d806a"/>
      <text x="0" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#2f2b27">Keedysville</text>
    </g>
    <g transform="translate(274 654)">
      <circle r="8" fill="#514b45" stroke="#fffaf0" stroke-width="3"/>
      <rect x="-91" y="18" width="182" height="40" rx="7" fill="#fffaf0" stroke="#8d806a"/>
      <text x="0" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#2f2b27">Shepherdstown</text>
    </g>
    <g transform="translate(659 650)">
      <circle r="8" fill="#514b45" stroke="#fffaf0" stroke-width="3"/>
      <rect x="-92" y="18" width="184" height="40" rx="7" fill="#fffaf0" stroke="#8d806a"/>
      <text x="0" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#2f2b27">Harpers Ferry</text>
    </g>
    <g transform="translate(925 181)">
      <circle r="8" fill="#514b45" stroke="#fffaf0" stroke-width="3"/>
      <rect x="-85" y="-45" width="170" height="38" rx="7" fill="#fffaf0" stroke="#8d806a"/>
      <text x="0" y="-20" text-anchor="middle" font-size="17" font-weight="700" fill="#2f2b27">Pleasant Valley</text>
    </g>
  </g>

  <path d="M657 615C547 530 439 420 355 328" fill="none" stroke="#963b31" stroke-width="12" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <text x="480" y="485" transform="rotate(-43 480 485)" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7a3029">Jackson · Walker</text>
  <text x="507" y="511" transform="rotate(-43 507 511)" font-family="Arial, sans-serif" font-size="14" fill="#7a3029">arrive September 16</text>

  <path d="M289 625C309 555 329 450 337 346" fill="none" stroke="#963b31" stroke-width="8" stroke-dasharray="13 9" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <text x="290" y="490" transform="rotate(-79 290 490)" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7a3029">via Shepherdstown</text>

  <path d="M921 239C802 251 684 269 587 291" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <rect x="739" y="277" width="267" height="55" rx="8" fill="#f8f1df" opacity="0.92"/>
  <text x="755" y="299" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#244c73">VI Corps · Franklin</text>
  <text x="755" y="322" font-family="Arial, sans-serif" font-size="14" fill="#244c73">ordered toward Sharpsburg at 6 p.m.</text>

  <path d="M1007 425C862 399 705 360 587 321" fill="none" stroke="#315f8c" stroke-width="13" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <text x="798" y="393" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#244c73">Army of the Potomac</text>
  <text x="806" y="416" font-family="Arial, sans-serif" font-size="14" fill="#244c73">concentrating from Keedysville</text>

  <path d="M321 211C345 191 368 190 395 204M321 225C346 245 371 244 397 223" fill="none" stroke="#963b31" stroke-width="9" stroke-linecap="round"/>
  <text x="410" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7a3029">Lee · Longstreet · D. H. Hill</text>
  <text x="410" y="234" font-family="Arial, sans-serif" font-size="14" fill="#7a3029">defensive line west of the creek</text>

  <g transform="translate(67 616)" font-family="Arial, sans-serif">
    <rect width="321" height="105" rx="10" fill="#fffaf0" stroke="#8d806a" filter="url(#shadow)"/>
    <path d="M20 29H78" stroke="#315f8c" stroke-width="9" marker-end="url(#blueArrow)"/>
    <text x="96" y="35" font-size="15" fill="#2f2b27">United States movement</text>
    <path d="M20 70H78" stroke="#963b31" stroke-width="9" marker-end="url(#redArrow)"/>
    <text x="96" y="76" font-size="15" fill="#2f2b27">Confederate movement</text>
  </g>

  <g transform="translate(1091 158)" font-family="Arial, sans-serif">
    <path d="M0 60V0" stroke="#2f2b27" stroke-width="4"/>
    <path d="M0 0L-10 20H10Z" fill="#2f2b27"/>
    <text x="0" y="87" text-anchor="middle" font-size="17" font-weight="700" fill="#2f2b27">N</text>
  </g>
  <text x="1126" y="718" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#5c5548">Schematic · not to scale</text>
</svg>
