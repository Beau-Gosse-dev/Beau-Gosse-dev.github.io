  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#5d5548">McClellan's plan and Lee's divided army · September 13–14, 1862</text>

  <rect x="48" y="128" width="1104" height="610" fill="#efe8d6"/>
  <rect x="48" y="128" width="505" height="610" fill="#e5ecd8" opacity="0.82"/>
  <rect x="694" y="128" width="458" height="610" fill="#ead7c8" opacity="0.7"/>
  <text x="85" y="165" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#667154">EAST OF THE RIDGE</text>
  <text x="893" y="165" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#895d52">WEST OF THE RIDGE</text>

