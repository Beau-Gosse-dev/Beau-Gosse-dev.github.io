  <path d="M278 332 C393 352 503 373 626 401" fill="none" stroke="#315f8c" stroke-width="9" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <text x="382" y="204" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#315f8c">Burnside: IX Corps, then I Corps</text>
  <text x="376" y="374" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#315f8c">Cox toward Fox's Gap</text>

  <path d="M244 550 C371 553 490 562 627 588" fill="none" stroke="#315f8c" stroke-width="12" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <text x="266" y="526" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#315f8c">Franklin's VI Corps</text>
  <text x="268" y="547" font-family="Arial, sans-serif" font-size="14" fill="#315f8c">through Burkittsville</text>

  <path d="M1025 231 C975 230 947 240 902 253" fill="none" stroke="#963b31" stroke-width="11" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <text x="788" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#963b31">Longstreet recalled south</text>
  <path d="M866 278 C795 292 737 301 684 301" fill="none" stroke="#963b31" stroke-width="9" stroke-linecap="round" marker-end="url(#redArrow)"/>
