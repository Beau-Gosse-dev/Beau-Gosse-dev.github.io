  <text x="665" y="435" transform="rotate(-87 665 435)" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#49483d">SOUTH MOUNTAIN</text>

  <path d="M326 286 C434 291 538 292 652 291 C772 289 876 282 994 273" fill="none" stroke="#a98b59" stroke-width="12" opacity="0.72"/>
