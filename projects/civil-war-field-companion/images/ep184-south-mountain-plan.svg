      <rect x="42" y="-31" width="169" height="48" rx="8" fill="#fffaf0" stroke="#978a71"/>
      <text x="126" y="-11" text-anchor="middle" font-size="16" font-weight="700">Maryland Heights</text>
      <text x="126" y="8" text-anchor="middle" font-size="14" fill="#5d5548">McLaws</text>
    </g>
  </g>

