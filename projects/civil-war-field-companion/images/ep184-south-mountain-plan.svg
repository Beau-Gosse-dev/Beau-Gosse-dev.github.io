<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">McClellan's plan and Lee's divided army, September 13 to 14, 1862</title>
  <desc id="desc">Schematic regional map showing the north-south ridge of South Mountain, Burnside's United States movement from Frederick and Middletown toward Turner's and Fox's gaps, Franklin's movement through Burkittsville toward Crampton's Gap, and Confederate forces under Hill, Longstreet, and McLaws west and south of the ridge.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f2e3"/>
      <stop offset="1" stop-color="#e9ddc3"/>
    </linearGradient>
    <pattern id="ridge" width="34" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 24 L9 8 L18 23 L26 5 L34 24" fill="none" stroke="#7b765d" stroke-width="3" opacity="0.72"/>
    </pattern>
    <marker id="blueArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0 L18 9 L0 18 Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0 L18 9 L0 18 Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

