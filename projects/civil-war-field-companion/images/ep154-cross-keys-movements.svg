<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Battle of Cross Keys troop movements, June 8, 1862</title>
  <desc id="desc">Schematic tactical map showing Ewell's ridge line, Trimble's advanced position behind a fence at the Pence farm, the isolated advance of the 8th New York, Trimble's counterattack against Bohlen, and Milroy's advance and withdrawal.</desc>
  <defs><marker id="b" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#315f8c"/></marker><marker id="r" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#9a3d32"/></marker><pattern id="woods" width="40" height="34" patternUnits="userSpaceOnUse"><circle cx="8" cy="10" r="7" fill="#8da273"/><circle cx="28" cy="20" r="9" fill="#78925e"/></pattern></defs>
  <rect width="1200" height="780" fill="#f1eadb"/>
  <path d="M0 80 C190 20 325 80 445 150 C600 240 770 204 1200 95 L1200 0 L0 0 Z" fill="url(#woods)" opacity="0.72"/>
  <path d="M0 705 C170 650 300 662 440 725 L440 780 L0 780 Z" fill="url(#woods)" opacity="0.68"/>
  <path d="M846 0 C805 147 824 275 875 374 C916 454 1020 575 1200 656 L1200 780 L1065 780 C944 640 845 562 791 457 C724 328 729 167 754 0 Z" fill="url(#woods)" opacity="0.72"/>
  <path d="M104 735 C254 620 363 550 493 480 C647 397 780 318 979 175" fill="none" stroke="#c1a477" stroke-width="17"/>
  <text x="120" y="700" font-family="Arial,sans-serif" font-size="18" fill="#604e36">road from Harrisonburg</text><text x="865" y="215" font-family="Arial,sans-serif" font-size="18" fill="#604e36" transform="rotate(-36 865 215)">road to Port Republic</text>
  <path d="M79 355 C270 340 432 324 601 302 C755 282 906 252 1118 223" fill="none" stroke="#708b5d" stroke-width="25" opacity="0.33"/>
  <text x="76" y="315" font-family="Arial,sans-serif" font-size="18" fill="#526444">Ewell’s slightly elevated defensive ridge</text>
  <g fill="#9a3d32"><rect x="132" y="330" width="210" height="38" rx="7"/><rect x="410" y="308" width="236" height="38" rx="7"/><rect x="852" y="213" width="232" height="38" rx="7"/></g>
  <g font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="white"><text x="237" y="355" text-anchor="middle">Steuart’s brigade</text><text x="528" y="333" text-anchor="middle">Elzey’s brigade + guns</text><text x="968" y="238" text-anchor="middle">Trimble’s brigade</text></g>
  <path d="M815 267 l18 -12 18 12 18 -12 18 12 18 -12 18 12 18 -12 18 12 18 -12 18 12 18 -12" fill="none" stroke="#6e5132" stroke-width="5"/>
  <text x="820" y="292" font-family="Arial,sans-serif" font-size="16" fill="#59442f">split-rail fence near Pence farm</text>
  <g fill="#315f8c"><rect x="676" y="608" width="185" height="38" rx="7"/><rect x="424" y="630" width="178" height="38" rx="7"/><rect x="183" y="602" width="179" height="38" rx="7"/><rect x="904" y="590" width="177" height="38" rx="7"/></g>
  <g font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="white"><text x="769" y="633" text-anchor="middle">Stahel’s brigade</text><text x="513" y="655" text-anchor="middle">Bohlen’s brigade</text><text x="273" y="627" text-anchor="middle">Milroy</text><text x="993" y="615" text-anchor="middle">Federal reserve</text></g>
  <path d="M772 598 C800 524 845 438 895 337" fill="none" stroke="#315f8c" stroke-width="13" marker-end="url(#b)"/>
  <rect x="786" y="428" width="170" height="38" rx="7" fill="#315f8c"/><text x="871" y="453" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="white" font-weight="bold">8th New York alone</text>
  <text x="713" y="504" font-family="Arial,sans-serif" font-size="16" fill="#315f8c">about 11 a.m.</text>
  <path d="M948 274 C895 353 816 430 710 506" fill="none" stroke="#9a3d32" stroke-width="12" marker-end="url(#r)"/>
  <text x="906" y="370" font-family="Arial,sans-serif" font-size="17" fill="#9a3d32" font-weight="bold">Trimble counterattacks</text>
  <path d="M508 620 C480 548 437 475 353 402" fill="none" stroke="#315f8c" stroke-width="12" marker-end="url(#b)"/>
  <text x="350" y="535" font-family="Arial,sans-serif" font-size="17" fill="#315f8c" font-weight="bold">Milroy advances</text>
  <path d="M342 392 C280 445 246 515 253 583" fill="none" stroke="#315f8c" stroke-width="9" stroke-dasharray="13 10" marker-end="url(#b)"/>
  <text x="80" y="470" font-family="Arial,sans-serif" font-size="16" fill="#315f8c">ordered back before</text><text x="80" y="492" font-family="Arial,sans-serif" font-size="16" fill="#315f8c">his flank move developed</text>
  <g transform="translate(450 226)"><circle r="23" fill="#d4a744"/><path d="M-15 0 L15 0 M0 -15 L0 15 M-11 -11 L11 11 M-11 11 L11 -11" stroke="#42351f" stroke-width="3"/><text x="34" y="6" font-family="Arial,sans-serif" font-size="17">Confederate artillery center</text></g>
  <g transform="translate(56 38)"><rect width="505" height="103" rx="12" fill="#fffdf7" stroke="#c9b995"/><text x="22" y="35" font-family="Georgia,serif" font-weight="bold" font-size="27">Cross Keys, June 8</text><text x="22" y="64" font-family="Arial,sans-serif" font-size="18">Frémont attacked in fragments. The 8th New York met</text><text x="22" y="87" font-family="Arial,sans-serif" font-size="18">Trimble’s close-range volley without effective support.</text></g>
  <text x="650" y="744" font-family="Arial,sans-serif" font-size="17" font-style="italic">Unit blocks and routes are schematic; not to scale. North is approximately up.</text>
</svg>
