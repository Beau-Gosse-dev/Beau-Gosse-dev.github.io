  <rect x="522" y="389" width="124" height="55" rx="8" fill="#fff8df" opacity="0.91"/>
  <text x="584" y="411" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#66501f">MILLER’S</text>
  <text x="584" y="433" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#66501f">CORNFIELD</text>

  <path d="M713 545Q803 521 911 560L883 679Q788 688 695 649Z" fill="#ad916d" opacity="0.45"/>
  <path d="M713 545Q803 521 911 560L883 679Q788 688 695 649Z" fill="url(#furrow)"/>
  <rect x="751" y="620" width="132" height="29" rx="6" fill="#fffaf0" opacity="0.92"/>
  <text x="817" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#685442">MUMMA FARM</text>

