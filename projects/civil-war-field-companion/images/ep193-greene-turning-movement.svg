  <path d="M590 638C545 646 509 651 482 652" fill="none" stroke="#963b31" stroke-width="10" stroke-dasharray="15 10" stroke-linecap="round" marker-end="url(#redRetreat)" opacity="0.78"/>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(580 206)">
      <rect x="-66" y="-22" width="132" height="44" rx="8" fill="#315f8c"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">GORDON</text>
    </g>
    <g transform="translate(870 350)">
      <rect x="-72" y="-24" width="144" height="48" rx="8" fill="#315f8c"/>
      <text x="0" y="-2" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">TYNDALE</text>
      <text x="0" y="17" text-anchor="middle" font-size="12" fill="#e4eef7">pivots west</text>
    </g>
    <g transform="translate(947 523)">
      <rect x="-78" y="-24" width="156" height="48" rx="8" fill="#315f8c"/>
      <text x="0" y="-2" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">STAINROOK</text>
      <text x="0" y="17" text-anchor="middle" font-size="12" fill="#e4eef7">wider turn</text>
