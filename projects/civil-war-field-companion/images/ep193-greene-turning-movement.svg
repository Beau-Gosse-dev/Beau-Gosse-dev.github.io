<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">George S. Greene turns the Confederate line at Antietam, about 8 to 9 a.m.</title>
  <desc id="desc">Schematic tactical map with north at top. Gordon fights Colquitt from Miller's pasture. Tyndale pivots west from the East Woods into Colquitt's flank, while Stainrook makes a wider turning movement toward the Mumma farm. McRae retreats from the East Woods, Stephen D. Lee withdraws from the Dunker Church plateau, and the 125th Pennsylvania crosses the turnpike near the church.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e3"/>
      <stop offset="1" stop-color="#e8dcc3"/>
    </linearGradient>
    <pattern id="trees" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="17" r="8" fill="#43543d" opacity="0.55"/>
      <circle cx="21" cy="9" r="7" fill="#667257" opacity="0.53"/>
      <circle cx="29" cy="25" r="6" fill="#354834" opacity="0.48"/>
    </pattern>
    <pattern id="corn" width="20" height="28" patternUnits="userSpaceOnUse">
      <path d="M10 27V5M10 11L4 7M10 15L16 9M10 20L4 15" fill="none" stroke="#87691f" stroke-width="2" opacity="0.7"/>
    </pattern>
    <pattern id="furrow" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#987c57" stroke-width="3" opacity="0.4"/>
    </pattern>
    <marker id="blueArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16">
      <path d="M0 0L16 8L0 16Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16">
      <path d="M0 0L16 8L0 16Z" fill="#963b31"/>
    </marker>
    <marker id="redRetreat" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16">
      <path d="M0 0L16 8L0 16Z" fill="#963b31" opacity="0.76"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#97896f" stroke-width="2"/>
  <text x="60" y="77" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2f2b27">GREENE TURNS THE CONFEDERATE LINE</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#5c5549">The East Woods, Cornfield, and Dunker Church plateau · approximately 8–9 a.m.</text>
  <rect x="48" y="128" width="1104" height="613" fill="#e8e5ce"/>

