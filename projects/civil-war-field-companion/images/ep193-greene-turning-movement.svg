  <g transform="translate(1074 682)" font-family="Arial, sans-serif">
    <rect x="-174" y="-64" width="188" height="112" rx="10" fill="#fffaf0" stroke="#93846d" stroke-width="2" opacity="0.96"/>
    <line x1="-153" y1="-36" x2="-120" y2="-36" stroke="#315f8c" stroke-width="8" marker-end="url(#blueArrow)"/>
    <text x="-103" y="-31" font-size="14" fill="#2f2b27">Federal attack</text>
    <line x1="-153" y1="2" x2="-120" y2="2" stroke="#963b31" stroke-width="7" stroke-dasharray="10 7" marker-end="url(#redRetreat)"/>
    <text x="-103" y="7" font-size="14" fill="#2f2b27">Confed. retreat</text>
    <text x="-153" y="38" font-size="12" font-style="italic" fill="#5c5549">Schematic · not to scale</text>
