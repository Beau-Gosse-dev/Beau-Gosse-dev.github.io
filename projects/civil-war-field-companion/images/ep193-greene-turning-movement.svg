    <text x="0" y="-9" text-anchor="middle" font-size="18" font-weight="700">N</text>
  </g>

  <path d="M438 128C442 249 444 371 449 495C452 588 457 670 460 741" fill="none" stroke="#a97849" stroke-width="17"/>
