<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Battle of Drewry's Bluff, May 15, 1862</title>
  <desc id="desc">Tactical schematic showing Fort Darling and Confederate batteries on a high bluff, infantry along the James River banks, obstructions across the channel, USS Galena anchored closest to the barrier, and the other ships of Commander John Rodgers's flotilla downstream.</desc>
  <defs>
    <linearGradient id="paper2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8f2e2"/><stop offset="1" stop-color="#e8dcc2"/></linearGradient>
    <linearGradient id="river2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#acd0da"/><stop offset="1" stop-color="#6f9fb0"/></linearGradient>
    <pattern id="slope" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(25)"><path d="M0 0V18" stroke="#8e7e5d" stroke-width="2" opacity=".35"/></pattern>
    <marker id="fireArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#9a3d32"/></marker>
    <marker id="retreatArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#315f8c"/></marker>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3e392f" flood-opacity=".25"/></filter>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif;fill:#29271f}.small{font:15px system-ui,sans-serif;fill:#4b4942}.label{font:700 17px system-ui,sans-serif;fill:#29271f}.waterlabel{font:italic 20px Georgia,serif;fill:#285e73}.red{font-family:system-ui,sans-serif;fill:#8f352e}.blue{font-family:system-ui,sans-serif;fill:#315f8c}.shiptext{font:700 14px system-ui,sans-serif;fill:#fff}.forttext{font:700 15px system-ui,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#paper2)"/>
  <path d="M0 0H1200V760H0Z" fill="none" stroke="#6c655b" stroke-width="12" opacity=".12"/>
  <path d="M96 760C180 660 223 573 263 489C306 399 343 336 412 286C478 238 556 220 657 207C733 197 788 160 823 105L581 0H142C113 91 122 191 159 269C193 341 195 411 157 495C118 581 65 665 22 721Z" fill="url(#river2)" stroke="#4f8194" stroke-width="4"/>
  <path d="M671 206C735 200 790 161 825 104L1011 183C939 288 845 335 740 346C640 356 588 389 542 460L353 348C416 253 513 222 671 206Z" fill="url(#slope)" stroke="#8e7e5d" stroke-width="3"/>
  <text x="727" y="277" class="small" font-weight="700">steep bluff · approximately 90 feet</text>
  <text x="185" y="520" class="waterlabel" transform="rotate(-64 185 520)">James River</text>
  <text x="160" y="694" class="small" fill="#285e73">downriver</text>
  <text x="545" y="154" class="small" fill="#285e73">upriver toward Richmond →</text>

  <g filter="url(#shadow2)">
    <path d="M742 214L822 174L900 214L882 286L758 286Z" fill="#8f352e" stroke="#5e241f" stroke-width="4"/>
    <rect x="776" y="210" width="92" height="34" rx="5" fill="#6f2924"/>
    <text x="822" y="232" text-anchor="middle" class="forttext">FORT DARLING</text>
  </g>
  <circle cx="761" cy="244" r="12" fill="#2e2b27" stroke="#c8b17d" stroke-width="4"/>
  <circle cx="821" cy="199" r="12" fill="#2e2b27" stroke="#c8b17d" stroke-width="4"/>
  <circle cx="878" cy="244" r="12" fill="#2e2b27" stroke="#c8b17d" stroke-width="4"/>
  <text x="919" y="226" class="red" font-size="15" font-weight="700">heavy guns on the bluff</text>

  <path d="M704 321C663 336 632 357 604 389M689 309C650 319 617 336 585 365M674 298C635 304 599 318 568 342" fill="none" stroke="#9a3d32" stroke-width="5" stroke-dasharray="8 7"/>
  <text x="758" y="361" class="red" font-size="15" font-weight="700">infantry and sharpshooters along the banks</text>

  <g stroke="#654b35" stroke-width="10" stroke-linecap="round">
    <path d="M394 302L523 385"/>
    <path d="M414 280L543 363"/>
    <path d="M438 271L559 348"/>
  </g>
  <g fill="#775942" stroke="#4e382a" stroke-width="2">
    <rect x="432" y="291" width="42" height="20" transform="rotate(33 453 301)"/>
    <rect x="475" y="321" width="45" height="20" transform="rotate(33 497 331)"/>
  </g>
  <text x="314" y="250" class="label">River obstruction</text>
  <text x="287" y="270" class="small">sunken vessels, piles, cribs, and debris</text>
  <text x="365" y="417" class="small">CSS Jamestown sunk in the barrier</text>

  <g filter="url(#shadow2)">
    <rect x="290" y="424" width="164" height="52" rx="18" fill="#315f8c" transform="rotate(-20 372 450)"/>
    <text x="372" y="455" text-anchor="middle" class="shiptext" transform="rotate(-20 372 450)">USS GALENA</text>
    <rect x="202" y="512" width="150" height="48" rx="18" fill="#315f8c" transform="rotate(-31 277 536)"/>
    <text x="277" y="541" text-anchor="middle" class="shiptext" transform="rotate(-31 277 536)">NAUGATUCK</text>
    <rect x="117" y="599" width="150" height="48" rx="18" fill="#315f8c" transform="rotate(-38 192 623)"/>
    <text x="192" y="628" text-anchor="middle" class="shiptext" transform="rotate(-38 192 623)">USS MONITOR</text>
    <rect x="330" y="590" width="144" height="46" rx="18" fill="#50799e" transform="rotate(-22 402 613)"/>
    <text x="402" y="618" text-anchor="middle" class="shiptext" transform="rotate(-22 402 613)">AROOSTOOK</text>
    <rect x="471" y="650" width="144" height="46" rx="18" fill="#50799e" transform="rotate(-15 543 673)"/>
    <text x="543" y="678" text-anchor="middle" class="shiptext" transform="rotate(-15 543 673)">PORT ROYAL</text>
  </g>

  <path d="M753 254C650 293 546 341 421 426" fill="none" stroke="#9a3d32" stroke-width="6" marker-end="url(#fireArrow)"/>
  <path d="M818 210C689 252 575 312 421 423" fill="none" stroke="#9a3d32" stroke-width="4" opacity=".75" marker-end="url(#fireArrow)"/>
  <path d="M367 423C475 350 594 296 738 249" fill="none" stroke="#315f8c" stroke-width="5" stroke-dasharray="11 8"/>
  <text x="495" y="327" class="blue" font-size="15" font-weight="700" transform="rotate(-24 495 327)">Galena returns fire</text>

  <path d="M259 557C230 594 199 632 166 672" fill="none" stroke="#315f8c" stroke-width="8" stroke-dasharray="12 8" marker-end="url(#retreatArrow)"/>
  <text x="265" y="576" class="blue" font-size="15" font-weight="700">Monitor cannot elevate effectively</text>
  <text x="265" y="598" class="blue" font-size="15">flotilla withdraws as ammunition runs low</text>

  <rect x="775" y="438" width="360" height="224" rx="11" fill="#fffaf0" stroke="#847966"/>
  <text x="798" y="473" class="label">Why the position held</text>
  <circle cx="807" cy="509" r="6" fill="#9a3d32"/><text x="825" y="515" class="small">High guns fired down onto exposed decks.</text>
  <circle cx="807" cy="548" r="6" fill="#9a3d32"/><text x="825" y="554" class="small">The narrow bend limited ship maneuver.</text>
  <circle cx="807" cy="587" r="6" fill="#9a3d32"/><text x="825" y="593" class="small">The barrier blocked passage upriver.</text>
  <circle cx="807" cy="626" r="6" fill="#9a3d32"/><text x="825" y="632" class="small">Infantry fire supported the batteries.</text>

  <rect x="775" y="682" width="360" height="45" rx="8" fill="#f0e4cb" stroke="#847966"/>
  <text x="955" y="710" text-anchor="middle" class="small" font-size="14" font-weight="700">Confederate victory · Richmond remained beyond naval reach</text>

  <g>
    <rect x="40" y="18" width="610" height="92" rx="8" fill="#f8f2e2" opacity=".94"/>
    <text x="56" y="62" class="serif" font-size="33" font-weight="700">Drewry’s Bluff blocks the James</text>
    <text x="58" y="93" class="small">May 15, 1862 · tactical schematic · positions approximate</text>
  </g>
</svg>
