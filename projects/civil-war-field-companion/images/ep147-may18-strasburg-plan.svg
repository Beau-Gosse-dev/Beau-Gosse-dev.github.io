<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Jackson and Ewell's May 18 plan to concentrate and move against Strasburg</title>
  <desc id="desc">Schematic north-up operational map showing Jackson marching from Mount Solon, Ewell leaving Swift Run Gap, both forces concentrating between New Market and Mount Jackson, and the intended advance north to Banks at Strasburg.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6e9"/>
      <stop offset="1" stop-color="#e9ddc4"/>
    </linearGradient>
    <pattern id="mountains" width="44" height="34" patternUnits="userSpaceOnUse">
      <path d="M2 30 L13 8 L24 29 L34 12 L43 30" fill="none" stroke="#68765f" stroke-width="2" opacity=".6"/>
    </pattern>
    <marker id="redArrow" markerWidth="18" markerHeight="18" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12">
      <path d="M0 0 L12 6 L0 12 Z" fill="#9a3d32"/>
    </marker>
    <style>
      .head{font:700 30px Georgia,serif;fill:#292621}.label{font:700 20px Georgia,serif;fill:#292621}.small{font:17px Arial,sans-serif;fill:#3f3a33}.tiny{font:14px Arial,sans-serif;fill:#554f46}.blue{fill:#315f8c}.red{fill:#9a3d32}.box{fill:#fffaf0;stroke:#8a7b66;stroke-width:2}.town{fill:#2d2a26}.road{fill:none;stroke:#aa8454;stroke-width:10;stroke-linecap:round}.rail{fill:none;stroke:#4d4b48;stroke-width:7;stroke-dasharray:3 9;stroke-linecap:round}.river{fill:none;stroke:#6f9cb5;stroke-width:7;opacity:.8}
    </style>
  </defs>
  <rect width="1200" height="800" fill="url(#paper)"/>
  <text x="32" y="46" class="head">MAY 18 PLAN • CONCENTRATE, THEN STRIKE STRASBURG</text>
  <text x="32" y="76" class="small">Operational schematic • north is up • shows the plan described in this episode, not the route ultimately used</text>

  <rect x="55" y="105" width="130" height="620" rx="18" fill="url(#mountains)" opacity=".8"/>
  <rect x="690" y="105" width="165" height="620" rx="58" fill="url(#mountains)" opacity=".9"/>
  <rect x="1064" y="105" width="95" height="620" rx="18" fill="url(#mountains)" opacity=".8"/>
  <text x="96" y="686" class="label" fill="#65715e" transform="rotate(-90 96 686)">ALLEGHENIES</text>
  <text x="749" y="684" class="label" fill="#65715e" transform="rotate(-90 749 684)">MASSANUTTEN</text>
  <text x="1102" y="680" class="label" fill="#65715e" transform="rotate(-90 1102 680)">BLUE RIDGE</text>

  <path class="road" d="M472 112 C466 194 458 280 452 370 C445 468 445 572 432 713"/>
  <text x="403" y="426" class="small" transform="rotate(-86 403 426)">Valley Turnpike</text>
  <path class="rail" d="M448 200 C560 202 686 207 885 214"/>
  <text x="565" y="188" class="tiny">Manassas Gap Railroad to Front Royal</text>
  <path class="river" d="M617 108 C605 205 606 303 615 395 C624 500 612 609 588 720"/>

  <circle cx="465" cy="120" r="7" class="town"/><text x="484" y="126" class="small">Winchester</text>
  <circle cx="448" cy="200" r="7" class="town"/><text x="364" y="226" class="small">Strasburg</text>
  <circle cx="885" cy="214" r="7" class="town"/><text x="904" y="220" class="small">Front Royal</text>
  <circle cx="454" cy="352" r="7" class="town"/><text x="348" y="358" class="small">Mount Jackson</text>
  <circle cx="447" cy="455" r="7" class="town"/><text x="355" y="481" class="small">New Market</text>
  <circle cx="774" cy="452" r="7" class="town"/><text x="650" y="458" class="small">New Market Gap</text>
  <circle cx="441" cy="564" r="7" class="town"/><text x="338" y="590" class="small">Harrisonburg</text>
  <circle cx="430" cy="688" r="7" class="town"/><text x="331" y="715" class="small">Mount Solon</text>
  <circle cx="1075" cy="584" r="7" class="town"/><text x="940" y="590" class="small">Swift Run Gap</text>

  <rect x="255" y="104" width="252" height="83" rx="12" class="box"/>
  <text x="274" y="136" class="label blue">Banks at Strasburg</text>
  <text x="274" y="163" class="small">main Federal position</text>

  <rect x="870" y="104" width="173" height="83" rx="12" class="box"/>
  <text x="889" y="136" class="label blue">Front Royal</text>
  <text x="889" y="163" class="small">small garrison</text>

  <path d="M431 670 C437 616 440 582 441 540 C443 507 444 486 446 470" fill="none" stroke="#9a3d32" stroke-width="11" marker-end="url(#redArrow)"/>
  <rect x="205" y="610" width="210" height="75" rx="12" class="box"/>
  <text x="225" y="642" class="label red">Jackson</text>
  <text x="225" y="669" class="small">march begins May 19</text>

  <path d="M1060 580 C981 565 913 530 842 489 C790 459 729 446 665 439 C590 431 525 433 462 448" fill="none" stroke="#9a3d32" stroke-width="11" marker-end="url(#redArrow)"/>
  <rect x="880" y="604" width="184" height="75" rx="12" class="box"/>
  <text x="899" y="636" class="label red">Ewell</text>
  <text x="899" y="663" class="small">leaves Swift Run Gap</text>

  <ellipse cx="449" cy="404" rx="112" ry="84" fill="#9a3d32" opacity=".11" stroke="#9a3d32" stroke-width="4" stroke-dasharray="11 8"/>
  <rect x="194" y="330" width="221" height="92" rx="12" class="box"/>
  <text x="214" y="362" class="label red">Concentration area</text>
  <text x="214" y="389" class="small">between New Market</text>
  <text x="214" y="413" class="small">and Mount Jackson</text>

  <path d="M443 320 C445 280 447 246 448 216" fill="none" stroke="#9a3d32" stroke-width="13" marker-end="url(#redArrow)"/>
  <text x="484" y="294" class="label red">planned advance</text>
  <text x="484" y="320" class="small">north against Banks</text>

  <rect x="816" y="298" width="342" height="129" rx="12" class="box"/>
  <text x="836" y="330" class="label">Scope note</text>
  <text x="836" y="359" class="small">No battle occurs in this episode.</text>
  <text x="836" y="385" class="small">Jackson later turned through New Market Gap</text>
  <text x="836" y="411" class="small">toward Front Royal; that change comes next.</text>

  <g>
    <circle cx="430" cy="655" r="18" fill="#9a3d32"/><text x="424" y="661" font-family="Arial" font-weight="700" font-size="16" fill="white">1</text>
    <circle cx="1036" cy="566" r="18" fill="#9a3d32"/><text x="1030" y="572" font-family="Arial" font-weight="700" font-size="16" fill="white">2</text>
    <circle cx="474" cy="406" r="18" fill="#9a3d32"/><text x="468" y="412" font-family="Arial" font-weight="700" font-size="16" fill="white">3</text>
    <circle cx="447" cy="270" r="18" fill="#9a3d32"/><text x="441" y="276" font-family="Arial" font-weight="700" font-size="16" fill="white">4</text>
  </g>
  <rect x="36" y="115" width="194" height="171" rx="12" class="box"/>
  <text x="55" y="147" class="label">Plan sequence</text>
  <text x="55" y="179" class="small">1. Jackson moves north</text>
  <text x="55" y="207" class="small">2. Ewell moves west</text>
  <text x="55" y="235" class="small">3. Commands unite</text>
  <text x="55" y="263" class="small">4. Strike Strasburg</text>

  <path d="M1141 112 L1141 168" stroke="#292621" stroke-width="4"/><path d="M1141 94 L1128 122 L1154 122 Z" fill="#292621"/><text x="1132" y="86" class="label">N</text>
</svg>
