<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Operational setting of Second Manassas on August 29, 1862</title>
  <desc id="desc">Generalized northern Virginia map with a separate annotation lane describing Longstreet's approach, Jackson's position, and Pope's concentration.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#315f8c"/></marker>
    <marker id="redArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#9a3d32"/></marker>
    <style>
      .heading{font:700 28px Arial,sans-serif;fill:#20252b}.label{font:600 18px Arial,sans-serif;fill:#20252b}.body{font:16px Arial,sans-serif;fill:#3c454d}.small{font:14px Arial,sans-serif;fill:#4b545d}.road{fill:none;stroke:#b58a55;stroke-width:10;stroke-linecap:round}.rail{fill:none;stroke:#5f646a;stroke-width:6;stroke-dasharray:15 10}.water{fill:none;stroke:#78a9c8;stroke-width:12}.town{fill:#fff;stroke:#29323a;stroke-width:3}.blueMove{fill:none;stroke:#315f8c;stroke-width:8;marker-end:url(#blueArrow)}.redMove{fill:none;stroke:#9a3d32;stroke-width:8;marker-end:url(#redArrow)}.callout{fill:#fff;stroke:#9d9486;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f5f0e4"/>
  <rect x="28" y="22" width="1144" height="88" rx="10" fill="#fff" stroke="#9d9486" stroke-width="2"/>
  <text x="52" y="58" class="heading">Second Manassas operational setting — August 29, 1862</text>
  <text x="52" y="88" class="body">Generalized locations, routes, and movements. Schematic; not to scale.</text>
  <rect x="28" y="130" width="840" height="590" rx="10" fill="#faf7ef" stroke="#b7aea0" stroke-width="2"/>
  <rect x="892" y="130" width="280" height="590" rx="10" fill="#fff" stroke="#b7aea0" stroke-width="2"/>
  <path d="M800 158 C758 260 832 350 774 437 C722 515 804 608 748 694" class="water"/>
  <path d="M75 440 C265 440 430 440 575 440 C665 440 755 420 835 388" class="road"/>
  <path d="M205 165 C300 260 400 355 493 447 C555 508 620 568 695 640" class="rail"/>
  <path d="M732 195 C704 315 690 450 692 618" fill="none" stroke="#9c8463" stroke-width="6"/>
  <path d="M112 500 C220 500 325 500 430 500" class="redMove"/>
  <circle cx="332" cy="500" r="17" fill="#9a3d32"/><text x="326" y="506" style="font:700 16px Arial,sans-serif;fill:#fff">A</text>
  <path d="M665 585 C632 513 605 432 585 330" class="redMove"/>
  <circle cx="615" cy="445" r="17" fill="#9a3d32"/><text x="609" y="451" style="font:700 16px Arial,sans-serif;fill:#fff">B</text>
  <rect x="485" y="247" width="224" height="46" rx="7" fill="#9a3d32" stroke="#6c211a" stroke-width="2"/>
  <text x="519" y="276" style="font:600 18px Arial,sans-serif;fill:#fff">Jackson on Stony Ridge</text>
  <path d="M824 365 C763 370 704 378 649 392" class="blueMove"/>
  <path d="M675 592 C647 552 619 516 590 486" class="blueMove"/>
  <circle cx="736" cy="377" r="17" fill="#315f8c"/><text x="730" y="383" style="font:700 16px Arial,sans-serif;fill:#fff">C</text>
  <circle cx="94" cy="440" r="8" class="town"/><rect x="48" y="370" width="158" height="40" rx="6" class="callout"/><text x="63" y="396" class="label">Thoroughfare Gap</text><line x1="111" y1="410" x2="96" y2="430" stroke="#656b70" stroke-width="2"/>
  <circle cx="275" cy="440" r="8" class="town"/><rect x="229" y="370" width="116" height="40" rx="6" class="callout"/><text x="246" y="396" class="label">Gainesville</text><line x1="287" y1="410" x2="277" y2="430" stroke="#656b70" stroke-width="2"/>
  <circle cx="486" cy="440" r="8" class="town"/><rect x="446" y="456" width="99" height="40" rx="6" class="callout"/><text x="461" y="482" class="label">Groveton</text><line x1="488" y1="448" x2="489" y2="456" stroke="#656b70" stroke-width="2"/>
  <circle cx="692" cy="618" r="8" class="town"/><rect x="555" y="654" width="180" height="40" rx="6" class="callout"/><text x="571" y="680" class="label">Manassas Junction</text><line x1="679" y1="625" x2="650" y2="654" stroke="#656b70" stroke-width="2"/>
  <circle cx="818" cy="395" r="8" class="town"/><rect x="728" y="298" width="116" height="40" rx="6" class="callout"/><text x="745" y="324" class="label">Centreville</text><line x1="794" y1="338" x2="815" y2="385" stroke="#656b70" stroke-width="2"/>
  <text x="920" y="168" class="label">Movement key</text>
  <circle cx="922" cy="210" r="17" fill="#9a3d32"/><text x="916" y="216" style="font:700 16px Arial,sans-serif;fill:#fff">A</text><text x="951" y="207" class="label">Longstreet</text><text x="951" y="229" class="small">approaches from</text><text x="951" y="248" class="small">Thoroughfare Gap</text>
  <circle cx="922" cy="291" r="17" fill="#9a3d32"/><text x="916" y="297" style="font:700 16px Arial,sans-serif;fill:#fff">B</text><text x="951" y="288" class="label">Jackson</text><text x="951" y="310" class="small">holds the ridge</text><text x="951" y="329" class="small">north of Groveton</text>
  <circle cx="922" cy="372" r="17" fill="#315f8c"/><text x="916" y="378" style="font:700 16px Arial,sans-serif;fill:#fff">C</text><text x="951" y="369" class="label">Pope</text><text x="951" y="391" class="small">concentrates from</text><text x="951" y="410" class="small">east and southeast</text>
  <line x1="920" y1="458" x2="978" y2="458" class="road"/><text x="996" y="464" class="body">Warrenton</text><text x="996" y="484" class="body">Turnpike</text>
  <line x1="920" y1="526" x2="978" y2="526" class="rail"/><text x="996" y="523" class="body">Manassas Gap</text><text x="996" y="543" class="body">Railroad</text>
  <line x1="920" y1="588" x2="978" y2="588" class="water"/><text x="996" y="594" class="body">Bull Run</text>
  <path d="M1113 645 l16 38 h-32 z" fill="#26333d"/><text x="1092" y="632" class="label">N</text>
</svg>
