<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">Johnston's intended Shiloh plan compared with the deployment order actually issued</title>
  <desc id="desc">Side-by-side diagrams compare Johnston's intended corps deployed as left, center, and right wings with Thomas Jordan's order stacking Hardee, Bragg, Polk, and Breckinridge one behind another.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9a3d32"/></marker></defs>
  <rect width="1300" height="760" fill="#f3eedf"/>
  <text x="650" y="50" text-anchor="middle" fill="#263332" font-family="Georgia,serif" font-size="32" font-weight="700">Confederate deployment for Shiloh</text>
  <text x="315" y="102" text-anchor="middle" fill="#263332" font-family="Arial,sans-serif" font-size="25" font-weight="700">Johnston's stated concept</text>
  <text x="985" y="102" text-anchor="middle" fill="#263332" font-family="Arial,sans-serif" font-size="25" font-weight="700">Jordan's written order</text>
  <rect x="65" y="140" width="500" height="535" rx="12" fill="#e9e1d0" stroke="#c5b79c" stroke-width="3"/>
  <rect x="735" y="140" width="500" height="535" rx="12" fill="#e9e1d0" stroke="#c5b79c" stroke-width="3"/>
  <path d="M515 150V665" stroke="#87afb4" stroke-width="26"/>
  <text x="533" y="405" fill="#385f64" font-family="Arial,sans-serif" font-size="18" transform="rotate(90 533 405)">Tennessee River</text>
  <path d="M1185 150V665" stroke="#87afb4" stroke-width="26"/>
  <text x="1203" y="405" fill="#385f64" font-family="Arial,sans-serif" font-size="18" transform="rotate(90 1203 405)">Tennessee River</text>
  <rect x="110" y="175" width="390" height="70" rx="8" fill="#315f8c"/>
  <text x="305" y="218" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">GRANT'S CAMPS / PITTSBURG LANDING</text>
  <rect x="780" y="175" width="390" height="70" rx="8" fill="#315f8c"/>
  <text x="975" y="218" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">GRANT'S CAMPS / PITTSBURG LANDING</text>
  <rect x="105" y="425" width="125" height="88" rx="8" fill="#9a3d32"/><rect x="242" y="425" width="125" height="88" rx="8" fill="#9a3d32"/><rect x="379" y="425" width="125" height="88" rx="8" fill="#9a3d32"/>
  <text x="167" y="462" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">POLK</text><text x="167" y="488" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="16">left</text>
  <text x="304" y="462" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">HARDEE</text><text x="304" y="488" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="16">center</text>
  <text x="441" y="462" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">BRAGG</text><text x="441" y="488" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="16">right</text>
  <rect x="242" y="555" width="125" height="70" rx="8" fill="#b9796f"/><text x="304" y="586" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">RESERVE</text><text x="304" y="609" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="15">Breckinridge</text>
  <path d="M167 410V270M304 410V270M441 410V270" stroke="#9a3d32" stroke-width="10" marker-end="url(#a)"/>
  <text x="305" y="650" text-anchor="middle" fill="#4b5856" font-family="Arial,sans-serif" font-size="17">Bragg's right was to push the U.S. left away from the river.</text>
  <rect x="795" y="365" width="360" height="64" rx="8" fill="#9a3d32"/><text x="975" y="405" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">HARDEE · 6,700 · FIRST LINE</text>
  <rect x="795" y="445" width="360" height="64" rx="8" fill="#a94f43"/><text x="975" y="485" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">BRAGG · 13,500 · SECOND LINE</text>
  <rect x="795" y="525" width="360" height="64" rx="8" fill="#b8665b"/><text x="975" y="565" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">POLK · 9,100 · THIRD LINE</text>
  <rect x="795" y="605" width="360" height="52" rx="8" fill="#c57c73"/><text x="975" y="638" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">BRECKINRIDGE · 6,400 · RESERVE</text>
  <path d="M975 350V270" stroke="#9a3d32" stroke-width="12" marker-end="url(#a)"/>
  <text x="975" y="302" text-anchor="middle" fill="#7c3029" font-family="Arial,sans-serif" font-size="17">each corps stretched across the field</text>
  <text x="985" y="690" text-anchor="middle" fill="#4b5856" font-family="Arial,sans-serif" font-size="17">Following lines would feed into the same fight and intermingle.</text>
  <text x="650" y="730" text-anchor="middle" fill="#4b5856" font-family="Arial,sans-serif" font-size="17">Orientation diagram · not to scale</text>
</svg>
