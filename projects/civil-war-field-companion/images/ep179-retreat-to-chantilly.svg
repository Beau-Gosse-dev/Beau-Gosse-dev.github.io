<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">From Second Manassas to Chantilly, August 30 to September 1, 1862</title>
  <desc id="desc">Schematic operational map showing the United States retreat through Centreville and Fairfax, Jackson's flank march toward Germantown, and the Battle of Chantilly at Ox Hill.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2ebd9"/>
      <stop offset="1" stop-color="#dfd4b8"/>
    </linearGradient>
    <pattern id="rain" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M5 4L0 15M24 18L19 29M38 2L33 13" stroke="#5a7b86" stroke-width="2" opacity=".14"/>
    </pattern>
    <marker id="blue" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="20" refY="11" orient="auto"><path d="M0 0L22 11L0 22Z" fill="#315f8c"/></marker>
    <marker id="red" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="20" refY="11" orient="auto"><path d="M0 0L22 11L0 22Z" fill="#913c35"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3f392f" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="26" y="26" width="1148" height="708" rx="22" fill="url(#rain)" stroke="#5f594d" stroke-width="2"/>

  <path d="M70 555C260 535 402 526 555 522S847 506 1128 490" fill="none" stroke="#b79a6b" stroke-width="34" opacity=".72"/>
  <path d="M70 555C260 535 402 526 555 522S847 506 1128 490" fill="none" stroke="#554c3e" stroke-width="3" stroke-dasharray="18 9"/>
  <text x="614" y="568" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#3d382f">Warrenton Turnpike</text>

  <path d="M404 120C570 130 722 158 822 220S926 352 1032 482" fill="none" stroke="#b79a6b" stroke-width="32" opacity=".72"/>
  <path d="M404 120C570 130 722 158 822 220S926 352 1032 482" fill="none" stroke="#554c3e" stroke-width="3" stroke-dasharray="18 9"/>
  <text x="650" y="151" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#3d382f">Little River Turnpike</text>

  <path d="M274 300C400 312 540 286 684 315S875 416 1028 486" fill="none" stroke="#913c35" stroke-width="16" marker-end="url(#red)"/>
  <text x="470" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#7b2e29">Jackson’s flank march • Aug. 31–Sept. 1</text>
  <text x="505" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#7b2e29">A. P. Hill leading; Longstreet following</text>

  <path d="M192 544C390 480 586 478 776 491" fill="none" stroke="#315f8c" stroke-width="16" marker-end="url(#blue)"/>
  <path d="M765 495C878 496 989 495 1091 492" fill="none" stroke="#315f8c" stroke-width="12" stroke-dasharray="18 10" marker-end="url(#blue)"/>
  <text x="438" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#244b70">Pope retreats toward Washington</text>

  <path d="M840 492C800 438 775 384 776 319" fill="none" stroke="#315f8c" stroke-width="12" marker-end="url(#blue)"/>
  <text x="555" y="409" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#244b70">Stevens and Kearny</text>
  <text x="555" y="434" font-family="Arial,sans-serif" font-size="18" fill="#244b70">move to block Jackson</text>

  <path d="M995 80C1016 134 980 173 1006 221S1049 305 1019 356" fill="none" stroke="#6f9eb1" stroke-width="18" opacity=".82"/>
  <text x="1040" y="190" font-family="Georgia,serif" font-size="20" fill="#23495b" transform="rotate(72 1040 190)">Difficult Run</text>

  <g filter="url(#shadow)">
    <circle cx="160" cy="545" r="13" fill="#fffaf0" stroke="#544c3f" stroke-width="4"/>
    <rect x="72" y="578" width="176" height="48" rx="10" fill="#fffaf0" stroke="#706858" stroke-width="2"/>
    <text x="160" y="609" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#332f28">Second Manassas</text>

    <circle cx="548" cy="522" r="13" fill="#fffaf0" stroke="#544c3f" stroke-width="4"/>
    <rect x="476" y="586" width="144" height="44" rx="10" fill="#fffaf0" stroke="#706858" stroke-width="2"/>
    <text x="548" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#332f28">Centreville</text>

    <circle cx="1034" cy="489" r="13" fill="#fffaf0" stroke="#544c3f" stroke-width="4"/>
    <rect x="936" y="536" width="196" height="44" rx="10" fill="#fffaf0" stroke="#706858" stroke-width="2"/>
    <text x="1034" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#332f28">Germantown</text>

    <circle cx="1110" cy="492" r="13" fill="#fffaf0" stroke="#544c3f" stroke-width="4"/>
    <text x="1110" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#332f28">Fairfax</text>
  </g>

  <g transform="translate(690 206)" filter="url(#shadow)">
    <ellipse cx="92" cy="94" rx="82" ry="67" fill="#d7dfd5" stroke="#496250" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M34 106C57 70 73 130 91 91S122 61 153 105" fill="none" stroke="#315f8c" stroke-width="9"/>
    <path d="M28 80C57 109 79 58 108 91S139 122 158 72" fill="none" stroke="#913c35" stroke-width="9"/>
    <text x="92" y="-2" text-anchor="middle" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#332f28">OX HILL / CHANTILLY</text>
    <text x="92" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#332f28">Sept. 1 • severe thunderstorm</text>
  </g>

  <g transform="translate(60 70)">
    <rect width="430" height="148" rx="14" fill="#fffaf0" stroke="#706858" stroke-width="2" opacity=".96"/>
    <text x="24" y="35" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#332f28">Campaign’s closing movement</text>
    <line x1="26" y1="67" x2="100" y2="67" stroke="#913c35" stroke-width="10" marker-end="url(#red)"/>
    <text x="120" y="74" font-family="Arial,sans-serif" font-size="19" fill="#332f28">Confederate flank march</text>
    <line x1="26" y1="108" x2="100" y2="108" stroke="#315f8c" stroke-width="10" marker-end="url(#blue)"/>
    <text x="120" y="115" font-family="Arial,sans-serif" font-size="19" fill="#332f28">United States movement</text>
  </g>
  <g transform="translate(1090 80)">
    <path d="M28 50V0" stroke="#332f28" stroke-width="4"/><path d="M28 0L16 22H40Z" fill="#332f28"/>
    <text x="28" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#332f28">N</text>
  </g>
  <text x="600" y="708" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#5e574b">Schematic — roads, waterways, routes, positions, and distances are generalized; not to scale</text>
</svg>
