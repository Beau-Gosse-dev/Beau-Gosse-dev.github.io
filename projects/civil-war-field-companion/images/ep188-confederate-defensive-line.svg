    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e3"/>
      <stop offset="1" stop-color="#e7dbc2"/>
    </linearGradient>
    <pattern id="trees" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="17" r="8" fill="#506044" opacity="0.46"/>
      <circle cx="22" cy="10" r="7" fill="#687256" opacity="0.42"/>
      <circle cx="28" cy="25" r="6" fill="#44543f" opacity="0.38"/>
    </pattern>
    <pattern id="corn" width="18" height="24" patternUnits="userSpaceOnUse">
      <path d="M9 23V5M9 10L3 6M9 14L15 9" stroke="#9f7f30" stroke-width="2" fill="none" opacity="0.56"/>
    </pattern>
    <marker id="blueArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#315f8c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

