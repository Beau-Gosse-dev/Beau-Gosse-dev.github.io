<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Lee's defensive line west of Antietam Creek on September 16, 1862</title>
  <desc id="desc">Schematic battlefield map with north at top. The Confederate line arcs from Stuart and Early on Nicodemus Heights through Jackson at the Dunker Church, D. H. Hill near the Roulette farm, Longstreet around Sharpsburg, and Toombs above Rohrbach Bridge. Antietam Creek and three bridges lie to the east. Snavely's Ford is farther south, while the Shepherdstown Road leads to Boteler's Ford across the Potomac.</desc>
