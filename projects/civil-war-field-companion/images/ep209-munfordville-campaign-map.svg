<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Munfordville assault, encirclement, and Confederate withdrawal, September 14–20, 1862</title>
  <desc id="desc">North-up schematic map showing Fort Craig and the Louisville and Nashville Railroad bridge at Green River, Chalmers's failed September 14 attacks, Bragg's September 16 encirclement, and the September 20 withdrawal toward Bardstown.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f0df"/>
      <stop offset="1" stop-color="#e8dcc0"/>
    </linearGradient>
    <pattern id="fields" width="52" height="52" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 10H52 M0 36H52" stroke="#c8bc9e" stroke-width="1" opacity=".34"/>
    </pattern>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#982f2f"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#315a88"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#8a6b1c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect width="1200" height="800" fill="url(#fields)" opacity=".48"/>

  <g fill="none" stroke="#b5a889" stroke-width="2" opacity=".55">
    <path d="M36 164 C178 122 298 150 386 106 S625 38 775 94 1036 136 1164 76"/>
    <path d="M40 612 C188 554 323 606 450 558 S694 510 844 570 1041 628 1175 575"/>
    <path d="M76 688 C215 652 348 698 505 658 S763 624 919 672 1084 711 1170 686"/>
  </g>

  <!-- Green River: Munfordville is north of the river; Fort Craig is south. -->
  <path d="M-25 385 C132 292 275 286 411 346 C533 400 650 386 774 316 C913 238 1052 254 1225 196" fill="none" stroke="#79b8cd" stroke-width="78" opacity=".92"/>
  <path d="M-25 385 C132 292 275 286 411 346 C533 400 650 386 774 316 C913 238 1052 254 1225 196" fill="none" stroke="#cce7ed" stroke-width="50" opacity=".95"/>
  <text x="805" y="280" fill="#315d6d" font-family="Georgia,serif" font-size="23" font-style="italic" transform="rotate(-20 805 280)">Green River</text>

  <!-- Louisville & Nashville Railroad and bridge. -->
  <g transform="rotate(-6 440 400)">
    <path d="M431 -20V820" stroke="#34363a" stroke-width="8"/>
    <path d="M449 -20V820" stroke="#34363a" stroke-width="8"/>
    <path d="M426 10H454 M426 38H454 M426 66H454 M426 94H454 M426 122H454 M426 150H454 M426 178H454 M426 206H454 M426 234H454 M426 262H454 M426 290H454 M426 318H454 M426 346H454 M426 374H454 M426 402H454 M426 430H454 M426 458H454 M426 486H454 M426 514H454 M426 542H454 M426 570H454 M426 598H454 M426 626H454 M426 654H454 M426 682H454 M426 710H454 M426 738H454 M426 766H454 M426 794H454" stroke="#5f5c54" stroke-width="3"/>
  </g>
  <path d="M403 363 L486 354" stroke="#d9a638" stroke-width="19"/>
  <path d="M405 363 L484 354" stroke="#5f4418" stroke-width="4"/>
  <text x="278" y="490" fill="#39372f" font-family="Arial,sans-serif" font-size="19" transform="rotate(-84 278 490)">Louisville &amp; Nashville Railroad</text>
  <text x="418" y="338" fill="#4b3512" font-family="Arial,sans-serif" font-size="16" font-weight="700">railroad bridge</text>

  <!-- Roads and settlements. -->
  <g fill="none" stroke="#887c64" stroke-width="7" stroke-linecap="round">
    <path d="M474 790 C484 676 540 573 616 492 S748 358 897 289"/>
    <path d="M517 495 C662 486 824 518 1135 617"/>
    <path d="M754 381 C881 379 1018 345 1176 297"/>
  </g>
  <g fill="#2f302d" opacity=".78">
    <rect x="594" y="205" width="18" height="13" transform="rotate(16 603 212)"/>
    <rect x="628" y="190" width="17" height="13" transform="rotate(-8 636 196)"/>
    <rect x="658" y="222" width="18" height="13" transform="rotate(22 667 228)"/>
    <rect x="690" y="193" width="16" height="13" transform="rotate(-14 698 200)"/>
    <rect x="710" y="235" width="18" height="13" transform="rotate(8 719 241)"/>
    <rect x="765" y="425" width="18" height="13" transform="rotate(22 774 431)"/>
    <rect x="803" y="451" width="17" height="13" transform="rotate(-9 811 458)"/>
    <rect x="842" y="420" width="17" height="13" transform="rotate(12 850 426)"/>
  </g>
  <text x="604" y="162" fill="#2e2d29" font-family="Georgia,serif" font-size="34" font-weight="700">Munfordville</text>
  <text x="774" y="402" fill="#2e2d29" font-family="Georgia,serif" font-size="31" font-weight="700">Woodsonville</text>
  <text x="965" y="383" fill="#5f594c" font-family="Arial,sans-serif" font-size="15" transform="rotate(-17 965 383)">Greensburg Road</text>
  <text x="900" y="523" fill="#5f594c" font-family="Arial,sans-serif" font-size="15" transform="rotate(17 900 523)">Burkesville Road</text>
  <text x="500" y="689" fill="#5f594c" font-family="Arial,sans-serif" font-size="15" transform="rotate(-60 500 689)">Bowling Green Pike</text>

  <!-- Fort Craig and south-bank stockade. -->
  <path d="M650 475 702 446 756 468 766 523 724 560 663 546 635 510Z" fill="#dce7f2" stroke="#315a88" stroke-width="8" filter="url(#shadow)"/>
  <path d="M661 484 704 462 742 478 749 516 718 542 674 531 653 507Z" fill="none" stroke="#6988aa" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="663" y="504" fill="#173b62" font-family="Arial,sans-serif" font-size="22" font-weight="800">FORT</text>
  <text x="663" y="531" fill="#173b62" font-family="Arial,sans-serif" font-size="22" font-weight="800">CRAIG</text>
  <rect x="294" y="500" width="95" height="58" rx="6" fill="#dce7f2" stroke="#315a88" stroke-width="7" transform="rotate(-6 341 529)"/>
  <text x="304" y="525" fill="#173b62" font-family="Arial,sans-serif" font-size="16" font-weight="800">Union</text>
  <text x="304" y="547" fill="#173b62" font-family="Arial,sans-serif" font-size="16" font-weight="800">stockade</text>

  <!-- September 14 assault. -->
  <g fill="none" stroke="#982f2f" stroke-width="13" stroke-linecap="round" marker-end="url(#arrowRed)">
    <path d="M358 726 C346 638 385 578 453 539"/>
    <path d="M479 728 C498 642 565 579 637 534"/>
    <path d="M681 714 C696 641 704 599 704 569"/>
    <path d="M806 684 C800 616 771 578 745 551"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#7d2323">
    <text x="258" y="674">10th &amp; 44th Miss.</text>
    <text x="461" y="682">7th Miss.</text>
    <text x="665" y="675">9th Miss.</text>
    <text x="792" y="648">29th Miss.</text>
  </g>
  <path d="M947 341 C891 367 824 396 752 459" fill="none" stroke="#982f2f" stroke-width="9" stroke-dasharray="13 10" marker-end="url(#arrowRed)"/>
  <text x="849" y="299" fill="#7d2323" font-family="Arial,sans-serif" font-size="18" font-weight="800">Scott's guns</text>
  <text x="804" y="323" fill="#7d2323" font-family="Arial,sans-serif" font-size="15">friendly fire disrupted the assault</text>

  <!-- September 16 encirclement. -->
  <path d="M235 647 C135 557 125 430 194 336" fill="none" stroke="#8a6b1c" stroke-width="10" stroke-dasharray="14 11"/>
  <path d="M909 604 C1041 533 1080 403 1031 315" fill="none" stroke="#8a6b1c" stroke-width="10" stroke-dasharray="14 11"/>
  <text x="92" y="652" fill="#6a5014" font-family="Arial,sans-serif" font-size="21" font-weight="800">Hardee's left wing</text>
  <text x="79" y="676" fill="#6a5014" font-family="Arial,sans-serif" font-size="16">south-bank hills</text>
  <text x="948" y="629" fill="#6a5014" font-family="Arial,sans-serif" font-size="21" font-weight="800">Polk's right wing</text>
  <text x="969" y="653" fill="#6a5014" font-family="Arial,sans-serif" font-size="16">north-bank heights</text>
  <path d="M170 348 C323 230 494 195 612 237" fill="none" stroke="#315a88" stroke-width="8" stroke-dasharray="10 10" marker-end="url(#arrowBlue)"/>
  <text x="150" y="246" fill="#224a75" font-family="Arial,sans-serif" font-size="17" font-weight="800">Dunham's reinforcements arrive by rail</text>

  <!-- Withdrawal. -->
  <path d="M997 195 C1059 176 1112 157 1164 139" fill="none" stroke="#8a6b1c" stroke-width="10" marker-end="url(#arrowGold)"/>
  <text x="876" y="153" fill="#6a5014" font-family="Arial,sans-serif" font-size="20" font-weight="800">Sept. 20: toward Bardstown</text>
  <text x="899" y="178" fill="#6a5014" font-family="Arial,sans-serif" font-size="15">Bragg leaves the Green River line</text>

  <!-- Title, north arrow, and legend. -->
  <rect x="0" y="0" width="1200" height="132" fill="#fbf8ee" opacity=".98"/>
  <rect x="28" y="24" width="748" height="104" rx="8" fill="#fbf8ee" stroke="#4b473d" stroke-width="2"/>
  <text x="52" y="63" fill="#242825" font-family="Georgia,serif" font-size="31" font-weight="700">Munfordville: assault, siege, and withdrawal</text>
  <text x="53" y="95" fill="#5a5549" font-family="Arial,sans-serif" font-size="18">September 14–20, 1862 • schematic, north up</text>
  <text x="53" y="119" fill="#5a5549" font-family="Arial,sans-serif" font-size="15">Positions are simplified; arrows show operational direction, not exact unit frontage.</text>

  <g transform="translate(1122 20)">
    <path d="M22 66V22" stroke="#242825" stroke-width="5"/>
    <path d="M22 8 9 32H35Z" fill="#242825"/>
    <text x="13" y="106" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#242825">N</text>
  </g>

  <g transform="translate(25 696)">
    <rect width="420" height="82" rx="7" fill="#fbf8ee" stroke="#746d5d" stroke-width="2" opacity=".97"/>
    <path d="M20 24H82" stroke="#982f2f" stroke-width="10" marker-end="url(#arrowRed)"/>
    <text x="120" y="30" fill="#3e3a32" font-family="Arial,sans-serif" font-size="16">Sept. 14 Confederate attack</text>
    <path d="M20 56H82" stroke="#8a6b1c" stroke-width="8" stroke-dasharray="11 8"/>
    <text x="95" y="62" fill="#3e3a32" font-family="Arial,sans-serif" font-size="16">Sept. 16 encircling positions</text>
  </g>

  <text x="1168" y="778" text-anchor="end" fill="#6c6659" font-family="Arial,sans-serif" font-size="13">Based on Official Records, NPS documentation, and American Battlefield Trust maps</text>
</svg>
