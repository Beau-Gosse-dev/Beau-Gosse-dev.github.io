<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="title desc">
  <title id="title">Generalized troop positions and attacks at Second Manassas on August 29, 1862</title>
  <desc id="desc">Schematic battlefield map showing Jackson along the unfinished railroad, Longstreet south of the Warrenton Turnpike, and Federal attacks by Sigel, Grover, Nagle, Kearny, Stevens, and Hatch.</desc>
  <defs>
    <marker id="ba" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#315f8c"/></marker>
    <style>.h{font:700 29px Arial,sans-serif;fill:#20252b}.t{font:600 19px Arial,sans-serif;fill:#252b31}.s{font:16px Arial,sans-serif;fill:#3c454d}.road{fill:none;stroke:#b58a55;stroke-width:12}.rail{fill:none;stroke:#555b61;stroke-width:7;stroke-dasharray:17 11}.cs{fill:#9a3d32;stroke:#6c211a;stroke-width:2}.us{fill:#315f8c;stroke:#173d60;stroke-width:2}.atk{fill:none;stroke:#315f8c;stroke-width:9;marker-end:url(#ba)}.wood{fill:#dce7cf;stroke:#b8c7a8;stroke-width:2}</style>
  </defs>
  <rect width="1400" height="950" fill="#f6f1e6"/>
  <path d="M65 290 C265 165 445 125 680 165 C850 194 980 165 1140 85 L1280 80 L1280 260 C1115 315 975 328 827 298 C622 257 433 286 245 380 Z" class="wood"/>
  <text x="1080" y="150" class="s">wooded Stony Ridge</text>
  <path d="M92 760 C385 695 663 650 880 630 C1070 612 1240 606 1360 595" class="road"/>
  <text x="1000" y="660" class="t">Warrenton Turnpike</text>
  <path d="M150 520 C360 395 580 320 785 287 C990 254 1160 225 1325 150" class="rail"/>
  <text x="570" y="335" class="t" transform="rotate(-17 570 335)">unfinished Manassas Gap Railroad</text>
  <path d="M1165 70 C1125 275 1090 500 1110 850" fill="none" stroke="#9b8464" stroke-width="7"/>
  <text x="1142" y="483" class="s" transform="rotate(82 1142 483)">Sudley Road</text>
  <path d="M355 822 C545 740 740 667 895 630" fill="none" stroke="#9b8464" stroke-width="6"/>
  <text x="535" y="755" class="s" transform="rotate(-21 535 755)">Gainesville–Manassas road</text>
  <g transform="rotate(-17 430 398)"><rect x="255" y="370" width="350" height="42" rx="7" class="cs"/><text x="330" y="398" class="t" fill="#fff">A. P. Hill: Gregg · Thomas · Pender</text></g>
  <g transform="rotate(-17 742 315)"><rect x="632" y="288" width="300" height="42" rx="7" class="cs"/><text x="680" y="316" class="t" fill="#fff">Lawton: Johnson · Early</text></g>
  <g transform="rotate(-17 1018 242)"><rect x="935" y="215" width="250" height="42" rx="7" class="cs"/><text x="975" y="243" class="t" fill="#fff">Starke’s division</text></g>
  <rect x="518" y="688" width="405" height="45" rx="7" class="cs"/><text x="587" y="718" class="t" fill="#fff">Longstreet’s wing — concealed in woods</text>
  <path d="M476 581 C430 523 400 480 390 440" class="atk"/><text x="225" y="604" class="t" fill="#315f8c">Sigel: Schurz and Milroy</text>
  <path d="M660 550 C615 479 580 425 530 376" class="atk"/><text x="560" y="578" class="t" fill="#315f8c">Grover, about 3:15 p.m.</text>
  <path d="M825 535 C797 457 790 395 778 326" class="atk"/><text x="790" y="566" class="t" fill="#315f8c">Nagle; Taylor follows</text>
  <path d="M1025 495 C980 416 945 350 925 290" class="atk"/><text x="970" y="526" class="t" fill="#315f8c">Kearny and Stevens, about 5 p.m.</text>
  <path d="M1005 735 C907 696 846 668 794 648" class="atk"/><text x="965" y="772" class="t" fill="#315f8c">Hatch toward Groveton at dusk</text>
  <rect x="155" y="610" width="325" height="44" rx="7" class="us"/><text x="203" y="639" class="t" fill="#fff">Federal attack assembly areas</text>
  <rect x="968" y="812" width="320" height="44" rx="7" class="us"/><text x="1011" y="841" class="t" fill="#fff">Porter and McDowell halted</text>
  <path d="M1065 807 C958 752 861 704 788 667" fill="none" stroke="#315f8c" stroke-width="5" stroke-dasharray="12 9"/>
  <circle cx="532" cy="376" r="17" fill="#f2b544" stroke="#5e481b" stroke-width="3"/><text x="504" y="347" class="s">Grover breach</text>
  <circle cx="779" cy="326" r="17" fill="#f2b544" stroke="#5e481b" stroke-width="3"/><text x="736" y="294" class="s">Nagle breach</text>
  <circle cx="925" cy="290" r="17" fill="#f2b544" stroke="#5e481b" stroke-width="3"/><text x="878" y="260" class="s">Kearny breach</text>
  <rect x="26" y="24" width="1348" height="88" rx="10" fill="#fff" stroke="#9d9486" stroke-width="2"/>
  <text x="52" y="61" class="h">August 29: Jackson’s railroad defense and Longstreet’s arrival</text>
  <text x="52" y="92" class="s">Generalized formation bars and attack arrows show relationships, not exact frontage, routes, or timing. Schematic; not to scale.</text>
  <g transform="translate(44 897)"><rect width="34" height="22" class="us"/><text x="47" y="18" class="s">United States</text><rect x="190" width="34" height="22" class="cs"/><text x="237" y="18" class="s">Confederacy</text><circle cx="423" cy="11" r="11" fill="#f2b544" stroke="#5e481b" stroke-width="2"/><text x="445" y="18" class="s">temporary penetration</text><line x1="686" y1="11" x2="755" y2="11" class="rail"/><text x="770" y="18" class="s">unfinished railroad</text></g>
  <path d="M1310 154 l18 43 h-36 z" fill="#26333d"/><text x="1288" y="141" class="t">N</text>
</svg>
