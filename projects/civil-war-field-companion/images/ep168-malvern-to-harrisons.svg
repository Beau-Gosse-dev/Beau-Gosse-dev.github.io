<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Malvern Hill to Harrison's Landing, July 2, 1862</title>
  <desc id="desc">Generalized schematic map showing the Army of the Potomac withdrawing southeast from Malvern Hill to Harrison's Landing on the James River.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f0dc"/>
      <stop offset="1" stop-color="#eadbb8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#24558a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#paper)"/>
  <path d="M0 570 C135 520 245 555 350 600 C500 663 665 638 815 590 C935 551 1060 571 1200 618 L1200 720 L0 720Z" fill="#8eb8cf"/>
  <path d="M0 570 C135 520 245 555 350 600 C500 663 665 638 815 590 C935 551 1060 571 1200 618" fill="none" stroke="#426d7f" stroke-width="5"/>
  <path d="M135 505 C255 440 410 395 535 385 C675 374 805 410 915 493" fill="none" stroke="#9b845f" stroke-width="8" stroke-dasharray="15 12"/>
  <path d="M285 235 C380 282 465 326 542 379 C629 438 728 486 838 522" fill="none" stroke="#24558a" stroke-width="15" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g fill="#34452b" opacity=".72">
    <path d="M73 152l18-43 18 43h-11l17 39H67l17-39z"/><path d="M147 205l18-43 18 43h-11l17 39h-48l17-39z"/><path d="M945 175l18-43 18 43h-11l17 39h-48l17-39z"/>
    <path d="M1035 282l18-43 18 43h-11l17 39h-48l17-39z"/><path d="M780 170l18-43 18 43h-11l17 39h-48l17-39z"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="285" cy="235" r="18" fill="#234f83" stroke="#fff" stroke-width="5"/>
    <circle cx="548" cy="383" r="18" fill="#234f83" stroke="#fff" stroke-width="5"/>
    <circle cx="848" cy="528" r="18" fill="#234f83" stroke="#fff" stroke-width="5"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#252821">
    <text x="55" y="66" font-size="36" font-weight="700">Malvern Hill to Harrison's Landing</text>
    <text x="57" y="100" font-size="21">Army of the Potomac withdrawal, July 2, 1862</text>
    <text x="310" y="220" font-size="28" font-weight="700">Malvern Hill</text>
    <text x="310" y="251" font-size="20">Federal defensive victory, July 1</text>
    <text x="575" y="369" font-size="26" font-weight="700">Route down the James</text>
    <text x="575" y="399" font-size="19">about eight miles in the episode's account</text>
    <text x="770" y="444" font-size="28" font-weight="700" style="paint-order:stroke;stroke:#f3e8ca;stroke-width:8;stroke-linejoin:round">Harrison's Landing</text>
    <text x="770" y="474" font-size="19" style="paint-order:stroke;stroke:#f3e8ca;stroke-width:7;stroke-linejoin:round">entrenched camp and naval protection</text>
    <text x="500" y="614" font-size="29" font-style="italic" fill="#294f62">James River</text>
    <text x="58" y="656" font-size="18" font-weight="700">GENERALIZED SCHEMATIC — NOT TO SCALE</text>
    <text x="58" y="684" font-size="16">Shoreline, roads, positions, direction, and distance are approximate.</text>
  </g>
  <path d="M920 603c45-17 87-14 129 3" fill="none" stroke="#fff" stroke-width="5" opacity=".65"/>
</svg>
