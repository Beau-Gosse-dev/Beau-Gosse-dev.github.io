<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Hooker's attack north of Turner's Gap late on September 14, 1862</title>
  <desc id="desc">Schematic tactical map with north at top. Meade's division advances west toward a north ridge and through a ravine to turn Rodes's left. Hatch's division advances toward a southern spur closer to the National Road. Ricketts remains in reserve. Confederate reinforcements reach Turner's Gap from Boonsboro while Rodes and P. F. Stevens defend the high ground.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f1df"/>
      <stop offset="1" stop-color="#e9ddc4"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d684f"/>
      <stop offset="0.55" stop-color="#889078"/>
      <stop offset="1" stop-color="#d5cfad"/>
    </linearGradient>
    <marker id="blueArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <pattern id="forest" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="17" r="7" fill="#45563f" opacity="0.27"/>
      <circle cx="21" cy="10" r="7" fill="#607052" opacity="0.3"/>
      <circle cx="29" cy="25" r="6" fill="#4b5d43" opacity="0.26"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#9b8d72" stroke-width="2"/>
  <text x="60" y="77" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2e2b28">HOOKER TURNS THE CONFEDERATE LEFT</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#5d5548">High ground north of Turner's Gap · attack begins just before 5 p.m.</text>

  <rect x="48" y="127" width="1104" height="617" fill="#e7e3c8"/>
  <path d="M48 127H631C608 187 602 253 625 318C645 374 622 431 604 482C580 547 607 614 586 676C577 702 580 724 589 744H48Z" fill="url(#ridge)"/>
  <path d="M48 127H631C608 187 602 253 625 318C645 374 622 431 604 482C580 547 607 614 586 676C577 702 580 724 589 744H48Z" fill="url(#forest)"/>
  <path d="M614 127C586 186 581 250 602 309C621 365 594 418 576 468C552 534 575 601 555 660C546 687 548 716 557 744" fill="none" stroke="#eee2bf" stroke-width="9" stroke-dasharray="12 13" opacity="0.83"/>
  <path d="M528 127C485 187 474 248 499 307C520 357 497 410 472 460C440 523 456 593 421 651" fill="none" stroke="#65725c" stroke-width="38" opacity="0.52"/>
  <path d="M523 127C486 193 483 244 507 302C529 355 506 411 480 463C450 523 463 583 434 641" fill="none" stroke="#d7ceb2" stroke-width="12" opacity="0.87"/>
  <text x="445" y="398" transform="rotate(-79 445 398)" font-family="Georgia, serif" font-size="19" font-style="italic" fill="#514c40">deep ravine</text>

  <path d="M76 650C282 642 446 648 586 655C748 662 909 650 1127 638" fill="none" stroke="#b78a52" stroke-width="20"/>
  <path d="M76 650C282 642 446 648 586 655C748 662 909 650 1127 638" fill="none" stroke="#f6e0ae" stroke-width="7"/>
  <text x="817" y="622" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#6b5337">NATIONAL ROAD</text>

  <path d="M609 259C754 252 882 241 1041 219" fill="none" stroke="#9a744e" stroke-width="12"/>
  <path d="M609 259C754 252 882 241 1041 219" fill="none" stroke="#ecd3a8" stroke-width="4"/>
  <text x="811" y="227" transform="rotate(-7 811 227)" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#6b5337">FROSTTOWN ROAD</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(593 655)">
      <circle r="11" fill="#f4c35a" stroke="#2e2b28" stroke-width="3"/>
      <rect x="-55" y="28" width="152" height="43" rx="7" fill="#fffaf0" stroke="#877b65"/>
      <text x="21" y="55" text-anchor="middle" font-size="17" font-weight="700" fill="#2e2b28">Turner's Gap</text>
    </g>
    <g transform="translate(616 259)">
      <circle r="10" fill="#f4c35a" stroke="#2e2b28" stroke-width="3"/>
      <rect x="18" y="-43" width="153" height="41" rx="7" fill="#fffaf0" stroke="#877b65"/>
      <text x="95" y="-17" text-anchor="middle" font-size="17" font-weight="700" fill="#2e2b28">Frosttown Gap</text>
    </g>
  </g>

  <path d="M568 183C562 254 573 324 550 399" fill="none" stroke="#963b31" stroke-width="14" stroke-linecap="round"/>
  <path d="M550 422C550 467 553 516 567 559" fill="none" stroke="#963b31" stroke-width="14" stroke-linecap="round"/>
  <text x="272" y="189" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7a3029">Rodes's brigade</text>
  <text x="270" y="214" font-family="Arial, sans-serif" font-size="15" fill="#7a3029">about 1,200 men · thin, disconnected line</text>

  <path d="M517 512C548 525 576 539 604 560" fill="none" stroke="#963b31" stroke-width="11" stroke-linecap="round"/>
  <text x="243" y="519" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7a3029">P. F. Stevens's brigade</text>
  <text x="243" y="542" font-family="Arial, sans-serif" font-size="15" fill="#7a3029">about 550 South Carolinians</text>

  <path d="M1050 329C916 322 788 307 624 282" fill="none" stroke="#315f8c" stroke-width="10" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M1037 373C897 378 762 365 624 334" fill="none" stroke="#315f8c" stroke-width="10" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M1010 424C862 445 723 435 601 401" fill="none" stroke="#315f8c" stroke-width="10" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <text x="849" y="281" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#244c73">Meade's division</text>
  <text x="842" y="305" font-family="Arial, sans-serif" font-size="15" fill="#244c73">Seymour · Magilton · Gallagher</text>
  <text x="812" y="461" font-family="Arial, sans-serif" font-size="14" fill="#244c73">about 4,000 Federals</text>

  <path d="M1001 554C872 554 752 535 623 494" fill="none" stroke="#315f8c" stroke-width="12" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <text x="806" y="511" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#244c73">Hatch's division</text>
  <text x="798" y="534" font-family="Arial, sans-serif" font-size="15" fill="#244c73">attacks the spur nearer the road</text>

  <g transform="translate(930 688)" font-family="Arial, sans-serif">
    <rect x="-136" y="-38" width="272" height="51" rx="8" fill="#e3edf4" stroke="#315f8c" filter="url(#shadow)"/>
    <text x="0" y="-16" text-anchor="middle" font-size="17" font-weight="700" fill="#244c73">Ricketts's division</text>
    <text x="0" y="4" text-anchor="middle" font-size="14" fill="#244c73">reserve; later supports the line</text>
  </g>

  <path d="M126 677C270 665 407 655 540 655" fill="none" stroke="#963b31" stroke-width="10" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <text x="89" y="614" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7a3029">Longstreet arrives near 5 p.m.</text>
  <text x="89" y="636" font-family="Arial, sans-serif" font-size="14" fill="#7a3029">reinforcements march up from Boonsboro</text>

  <path d="M554 197C514 207 475 208 435 200" fill="none" stroke="#963b31" stroke-width="6" stroke-dasharray="10 8" marker-end="url(#redArrow)"/>
  <path d="M550 386C512 401 478 409 449 408" fill="none" stroke="#963b31" stroke-width="6" stroke-dasharray="10 8" marker-end="url(#redArrow)"/>
  <text x="79" y="314" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7a3029">Rodes falls back toward the gap</text>
  <text x="79" y="336" font-family="Arial, sans-serif" font-size="14" fill="#7a3029">after Seymour gains the north ridge</text>

  <g transform="translate(67 658)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="310" height="68" rx="9" fill="#fffaf0" stroke="#877b65" filter="url(#shadow)" opacity="0.96"/>
    <path d="M18 23H70" stroke="#315f8c" stroke-width="8" marker-end="url(#blueArrow)"/>
    <text x="88" y="29" font-size="14" fill="#2e2b28">United States advance</text>
    <path d="M18 50H70" stroke="#963b31" stroke-width="8" marker-end="url(#redArrow)"/>
    <text x="88" y="56" font-size="14" fill="#2e2b28">Confederate movement</text>
  </g>
  <g transform="translate(1091 156)" font-family="Arial, sans-serif">
    <path d="M0 58V0" stroke="#2e2b28" stroke-width="4"/>
    <path d="M0 0L-10 20H10Z" fill="#2e2b28"/>
    <text x="0" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#2e2b28">N</text>
  </g>
  <text x="1129" y="724" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#5d5548">Schematic · not to scale</text>
</svg>
