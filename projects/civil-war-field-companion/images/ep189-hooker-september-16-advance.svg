  <rect x="202" y="438" width="189" height="34" rx="7" fill="#fffaf0" opacity="0.9"/>
  <text x="297" y="461" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#6c5133">HAGERSTOWN TURNPIKE</text>

  <path d="M408 370C521 354 640 320 746 278C811 253 860 235 923 227" fill="none" stroke="#ad7e4f" stroke-width="13"/>
