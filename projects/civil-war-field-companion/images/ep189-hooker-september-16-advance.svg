      <text x="79" y="21" text-anchor="middle" font-size="15" font-weight="700" fill="#244c73">Meade · Ricketts</text>
      <text x="79" y="40" text-anchor="middle" font-size="13" fill="#244c73">Upper Bridge</text>
    </g>
    <g transform="translate(976 337)">
      <rect width="150" height="48" rx="9" fill="#e8f0f7" stroke="#315f8c" stroke-width="2"/>
      <text x="75" y="21" text-anchor="middle" font-size="15" font-weight="700" fill="#244c73">Doubleday</text>
      <text x="75" y="40" text-anchor="middle" font-size="13" fill="#244c73">Pry's Ford</text>
    </g>
    <g transform="translate(926 580)">
      <rect width="200" height="55" rx="9" fill="#e8f0f7" stroke="#315f8c" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="100" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#244c73">XII Corps · Mansfield</text>
      <text x="100" y="44" text-anchor="middle" font-size="13" fill="#244c73">crosses near midnight</text>
    </g>
  </g>

  <path d="M966 189C929 194 898 207 874 226C824 265 773 289 710 305C647 321 594 343 548 365" fill="none" stroke="#315f8c" stroke-width="10" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M975 360C930 360 891 370 849 388C776 419 704 449 637 478C588 499 535 513 476 522" fill="none" stroke="#315f8c" stroke-width="10" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M546 363C504 379 470 402 448 432C430 456 420 477 414 510" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>

  <g font-family="Arial, sans-serif">
    <rect x="708" y="141" width="185" height="47" rx="8" fill="#fffaf0" opacity="0.94"/>
    <text x="800" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#244c73">1 · CROSS ABOUT 3:30–4 P.M.</text>
    <text x="800" y="179" text-anchor="middle" font-size="13" fill="#244c73">bridge and nearby ford</text>

    <rect x="694" y="475" width="167" height="46" rx="8" fill="#fffaf0" opacity="0.94"/>
    <text x="777" y="494" text-anchor="middle" font-size="14" font-weight="700" fill="#244c73">2 · MOVE WEST</text>
    <text x="777" y="512" text-anchor="middle" font-size="13" fill="#244c73">toward the turnpike</text>

    <rect x="60" y="483" width="168" height="46" rx="8" fill="#fffaf0" opacity="0.94"/>
    <text x="144" y="502" text-anchor="middle" font-size="14" font-weight="700" fill="#244c73">3 · TURN SOUTH</text>
    <text x="144" y="520" text-anchor="middle" font-size="13" fill="#244c73">feel for Lee's left</text>
  </g>

  <path d="M338 563C391 555 446 541 492 520C532 502 565 478 592 450" fill="none" stroke="#963b31" stroke-width="12" stroke-linecap="round" marker-end="url(#redArrow)"/>
