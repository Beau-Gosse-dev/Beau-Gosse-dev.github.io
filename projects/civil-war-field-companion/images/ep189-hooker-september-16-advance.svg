  <path d="M493 213C570 191 646 214 671 277C688 320 674 383 635 430L506 416C529 360 522 305 482 260Z" fill="url(#trees)"/>
  <rect x="521" y="380" width="126" height="34" rx="7" fill="#fffaf0" opacity="0.86"/>
  <text x="584" y="403" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#3f4d39">EAST WOODS</text>

  <path d="M406 185C446 176 484 182 524 207L504 388C465 377 437 378 410 390Z" fill="#d6c36f" opacity="0.72" stroke="#a58d3d" stroke-width="2"/>
  <path d="M406 185C446 176 484 182 524 207L504 388C465 377 437 378 410 390Z" fill="url(#corn)"/>
  <text x="462" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#6a5525">MILLER'S</text>
  <text x="462" y="301" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#6a5525">CORNFIELD</text>

  <g transform="translate(510 169)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="-15" y="-11" width="30" height="22" fill="#a36e43" stroke="#4b4540" stroke-width="2"/>
    <path d="M-19 -11L0 -24L19 -11Z" fill="#704a32"/>
    <text x="29" y="5" font-size="15" font-weight="700" fill="#2f2b27">Poffenberger farm</text>
