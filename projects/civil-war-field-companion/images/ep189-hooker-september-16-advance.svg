    <rect width="208" height="61" rx="10" fill="#f7e9e5" stroke="#963b31" stroke-width="2"/>
    <text x="104" y="25" text-anchor="middle" font-size="17" font-weight="700" fill="#7a3029">Hood's division</text>
    <text x="104" y="48" text-anchor="middle" font-size="14" fill="#7a3029">moves north to meet Hooker</text>
  </g>

  <g transform="translate(548 445)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <circle r="16" fill="#fffaf0" stroke="#2f2b27" stroke-width="2"/>
    <path d="M-8 -8L8 8M8 -8L-8 8" stroke="#963b31" stroke-width="4"/>
    <rect x="23" y="-27" width="214" height="56" rx="9" fill="#fffaf0" stroke="#8d806a"/>
    <text x="130" y="-5" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2b27">MEADE MEETS HOOD</text>
    <text x="130" y="16" text-anchor="middle" font-size="13" fill="#5c5548">East Woods · near dusk</text>
  </g>

  <path d="M925 608C841 593 766 578 696 561C638 547 580 544 521 551" fill="none" stroke="#315f8c" stroke-width="8" stroke-dasharray="13 9" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <rect x="571" y="663" width="324" height="46" rx="8" fill="#fffaf0" opacity="0.94"/>
  <text x="733" y="682" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#244c73">Mansfield bivouacs behind Hooker</text>
  <text x="733" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#244c73">about one mile to the left and rear</text>

  <g transform="translate(71 656)" font-family="Arial, sans-serif">
    <rect width="412" height="61" rx="10" fill="#fffaf0" stroke="#8d806a" filter="url(#shadow)"/>
    <path d="M20 22H76" stroke="#315f8c" stroke-width="9" marker-end="url(#blueArrow)"/>
    <text x="92" y="28" font-size="14" fill="#2f2b27">United States movement</text>
    <path d="M220 22H276" stroke="#963b31" stroke-width="9" marker-end="url(#redArrow)"/>
    <text x="292" y="28" font-size="14" fill="#2f2b27">Confederate response</text>
    <text x="20" y="51" font-size="13" fill="#5c5548">Routes and unit footprints are generalized.</text>
  </g>

  <g transform="translate(1138 158)" font-family="Arial, sans-serif">
    <path d="M0 60V0" stroke="#2f2b27" stroke-width="4"/>
    <path d="M0 0L-10 20H10Z" fill="#2f2b27"/>
    <text x="0" y="87" text-anchor="middle" font-size="17" font-weight="700" fill="#2f2b27">N</text>
  </g>
