<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Hooker's advance across upper Antietam Creek on September 16, 1862</title>
  <desc id="desc">Schematic map with north at top. Meade's Pennsylvania Reserves and Ricketts' division cross the Upper Bridge while Doubleday's division crosses nearby Pry's Ford. The First Corps moves west toward the Hagerstown Turnpike, turns south, and Meade's advance encounters Hood's Confederate division in the East Woods near dusk. Mansfield's Twelfth Corps follows later and bivouacs behind Hooker.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e3"/>
      <stop offset="1" stop-color="#e8dcc3"/>
    </linearGradient>
    <pattern id="trees" width="32" height="28" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="17" r="7" fill="#4f6046" opacity="0.5"/>
      <circle cx="21" cy="10" r="6" fill="#6a7658" opacity="0.47"/>
      <circle cx="27" cy="23" r="5" fill="#40513d" opacity="0.43"/>
    </pattern>
    <pattern id="corn" width="18" height="24" patternUnits="userSpaceOnUse">
      <path d="M9 23V5M9 10L3 6M9 14L15 9" stroke="#9f7f30" stroke-width="2" fill="none" opacity="0.58"/>
    </pattern>
    <marker id="blueArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#97896f" stroke-width="2"/>
  <text x="60" y="77" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2f2b27">HOOKER CROSSES THE UPPER ANTIETAM</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#5c5548">I Corps probes Lee's left on the afternoon and evening of September 16</text>

  <rect x="48" y="128" width="1104" height="613" fill="#e9e6cf"/>

