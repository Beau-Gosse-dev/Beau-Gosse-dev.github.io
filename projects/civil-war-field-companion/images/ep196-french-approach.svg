<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">French's division approaches the Sunken Road</title>
  <desc id="desc">Schematic map with north at top. French's three brigades move south from the Roulette farm toward Rodes and George B. Anderson in the Sunken Road. Remnants of Colquitt and McRae extend the Confederate line west to the Hagerstown Turnpike, and Richard H. Anderson's division approaches from the south.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e4"/>
      <stop offset="1" stop-color="#e5d8bd"/>
    </linearGradient>
    <pattern id="orchard" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="7" fill="#60714f" opacity="0.63"/>
      <circle cx="17" cy="17" r="2" fill="#354431" opacity="0.75"/>
    </pattern>
    <marker id="blueArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16">
      <path d="M0 0L16 8L0 16Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16">
      <path d="M0 0L16 8L0 16Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#97896f" stroke-width="2"/>
  <text x="60" y="75" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#2f2b27">FRENCH TURNS TOWARD THE CONFEDERATE CENTER</text>
  <text x="60" y="106" font-family="Arial, sans-serif" font-size="18" fill="#5c5549">Roulette farm to the Sunken Road · about 9:15–9:30 a.m. · north is up</text>
  <rect x="48" y="128" width="1104" height="610" fill="#e9e5cf"/>

  <path d="M164 128C161 273 159 430 166 738" fill="none" stroke="#a97849" stroke-width="18"/>
  <path d="M164 128C161 273 159 430 166 738" fill="none" stroke="#f2d8a4" stroke-width="7"/>
  <g transform="translate(121 300) rotate(-90)">
    <rect x="-92" y="-14" width="184" height="28" rx="6" fill="#fffaf0" opacity="0.95"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#664a32">HAGERSTOWN TURNPIKE</text>
  </g>

  <path d="M165 566C325 554 488 551 630 558C775 565 925 611 1117 703" fill="none" stroke="#876c4d" stroke-width="24" stroke-linecap="round"/>
  <path d="M165 566C325 554 488 551 630 558C775 565 925 611 1117 703" fill="none" stroke="#ccb78e" stroke-width="10" stroke-linecap="round"/>
  <path d="M165 566C325 554 488 551 630 558C775 565 925 611 1117 703" fill="none" stroke="#74593f" stroke-width="3" stroke-dasharray="9 8"/>
  <rect x="482" y="582" width="239" height="33" rx="7" fill="#fffaf0" opacity="0.96"/>
  <text x="601" y="605" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#5f4936">SUNKEN ROAD</text>

  <path d="M884 128C874 227 864 330 855 448C850 500 838 547 801 593" fill="none" stroke="#9b8262" stroke-width="8" stroke-dasharray="13 8"/>
  <rect x="868" y="340" width="186" height="31" rx="7" fill="#fffaf0" opacity="0.95"/>
  <text x="961" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#69543f">ROULETTE FARM LANE</text>

  <rect x="747" y="176" width="253" height="176" rx="22" fill="url(#orchard)" opacity="0.78"/>
  <rect x="762" y="189" width="138" height="29" rx="6" fill="#fffaf0" opacity="0.94"/>
  <text x="831" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#3f4d37">ORCHARD</text>
  <g transform="translate(890 288)" filter="url(#shadow)">
    <rect x="-25" y="-18" width="50" height="38" fill="#f5ead2" stroke="#4b4540" stroke-width="2"/>
    <path d="M-31-18L0-42L31-18Z" fill="#6f5b4c"/>
    <rect x="-7" y="4" width="14" height="16" fill="#7d674f"/>
  </g>
  <rect x="917" y="260" width="170" height="33" rx="7" fill="#fffaf0" opacity="0.96"/>
  <text x="1002" y="283" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#342f2b">ROULETTE FARM</text>

  <g transform="translate(1100 171)" font-family="Arial, sans-serif" fill="#2f2b27">
    <path d="M0 50V0M0 0L-9 18M0 0L9 18" fill="none" stroke="#2f2b27" stroke-width="3"/>
    <text x="0" y="-9" text-anchor="middle" font-size="18" font-weight="700">N</text>
  </g>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <path d="M795 251C748 318 711 375 675 457" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>
    <path d="M904 333C863 381 828 425 782 481" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>
    <path d="M1030 360C996 399 960 440 922 493" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>
    <g transform="translate(610 409)">
      <rect x="-88" y="-23" width="176" height="46" rx="8" fill="#315f8c"/>
      <text x="0" y="-2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">WEBER · FIRST LINE</text>
      <text x="0" y="16" text-anchor="middle" font-size="11" fill="#eaf2f8">about 1,700</text>
    </g>
    <g transform="translate(809 407)">
      <rect x="-90" y="-23" width="180" height="46" rx="8" fill="#315f8c"/>
      <text x="0" y="-2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">MORRIS · SECOND LINE</text>
      <text x="0" y="16" text-anchor="middle" font-size="11" fill="#eaf2f8">about 1,000</text>
    </g>
    <g transform="translate(994 438)">
      <rect x="-91" y="-23" width="182" height="46" rx="8" fill="#315f8c"/>
      <text x="0" y="-2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">KIMBALL · THIRD LINE</text>
      <text x="0" y="16" text-anchor="middle" font-size="11" fill="#eaf2f8">veterans and 132nd Pa.</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(296 529)">
      <rect x="-111" y="-22" width="222" height="44" rx="8" fill="#963b31"/>
      <text x="0" y="-2" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">COLQUITT / McRAE</text>
      <text x="0" y="15" text-anchor="middle" font-size="11" fill="#fae9e4">battered remnants</text>
    </g>
    <g transform="translate(544 518)">
      <rect x="-88" y="-22" width="176" height="44" rx="8" fill="#963b31"/>
      <text x="0" y="-2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">RODES</text>
      <text x="0" y="15" text-anchor="middle" font-size="11" fill="#fae9e4">five Alabama regiments</text>
    </g>
    <g transform="translate(820 555)">
      <rect x="-104" y="-22" width="208" height="44" rx="8" fill="#963b31"/>
      <text x="0" y="-2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">G. B. ANDERSON</text>
      <text x="0" y="15" text-anchor="middle" font-size="11" fill="#fae9e4">four North Carolina regiments</text>
    </g>
  </g>

  <path d="M945 724C917 683 890 649 853 610" fill="none" stroke="#963b31" stroke-width="9" stroke-linecap="round" stroke-dasharray="14 9" marker-end="url(#redArrow)"/>
  <g transform="translate(975 694)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="-132" y="-24" width="264" height="48" rx="8" fill="#f7e8dc" stroke="#963b31" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" font-size="14" font-weight="700" fill="#7a332c">R. H. ANDERSON APPROACHES</text>
    <text x="0" y="15" text-anchor="middle" font-size="11" fill="#7a332c">reinforcement from the south</text>
  </g>

  <g transform="translate(388 188)" font-family="Arial, sans-serif">
    <rect x="-187" y="-48" width="374" height="108" rx="10" fill="#fffaf0" stroke="#93846d" stroke-width="2" opacity="0.97"/>
    <text x="-167" y="-20" font-size="13" font-weight="700" fill="#2f2b27">WHAT FRENCH COULD SEE</text>
    <text x="-167" y="4" font-size="13" fill="#4d4841">Greene's troops near the Dunker Church to the north</text>
    <text x="-167" y="26" font-size="13" fill="#4d4841">and a thin Confederate skirmish line to the south.</text>
    <text x="-167" y="48" font-size="12" fill="#6a6257">Sedgwick was hidden beyond the West Woods.</text>
  </g>

  <text x="600" y="764" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5f574d">Schematic and not to scale · positions and routes are generalized from NPS interpretation, official reports, the Antietam Battlefield Board atlas, and the episode transcript</text>
</svg>
