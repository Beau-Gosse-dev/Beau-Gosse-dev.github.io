<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Peninsula Campaign operations from May 6 to May 24, 1862</title>
  <desc id="desc">Operational schematic showing Eltham's Landing, the capture of Norfolk, destruction of CSS Virginia, the United States naval advance to Drewry's Bluff, and the Army of the Potomac's advance from West Point through White House Landing to positions on both sides of the Chickahominy near Richmond.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f1df"/><stop offset="1" stop-color="#e7dac0"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b7d4dc"/><stop offset="1" stop-color="#78a8b8"/></linearGradient>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#315f8c"/></marker>
    <marker id="redArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#9a3d32"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3e392f" flood-opacity=".2"/></filter>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif;fill:#29271f}.small{font:15px system-ui,sans-serif;fill:#4b4942}.town{font:700 17px system-ui,sans-serif;fill:#29271f}.date{font:14px system-ui,sans-serif;fill:#625b50}.river{font:italic 18px Georgia,serif;fill:#2f6477}.blue{font-family:system-ui,sans-serif;fill:#315f8c}.red{font-family:system-ui,sans-serif;fill:#8d352e}.dot{fill:#fffaf0;stroke:#29271f;stroke-width:3}.corps{font:700 14px system-ui,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#paper)"/>
  <path d="M0 0H1200V760H0Z" fill="none" stroke="#6c655b" stroke-width="12" opacity=".12"/>
  <text x="58" y="62" class="serif" font-size="33" font-weight="700">Operations close on Richmond</text>
  <text x="60" y="93" class="small">May 6–24, 1862 · operational schematic · routes and positions approximate</text>

  <path d="M1048 112C1005 180 961 230 891 280C804 342 736 411 663 483C591 555 505 620 416 699H1200V112Z" fill="url(#water)" opacity=".95"/>
  <path d="M1017 128C961 199 895 260 816 316C738 373 672 437 609 500C543 566 477 616 405 667" fill="none" stroke="#56889a" stroke-width="24" stroke-linecap="round"/>
  <path d="M1017 128C961 199 895 260 816 316C738 373 672 437 609 500C543 566 477 616 405 667" fill="none" stroke="#a7ccd5" stroke-width="13" stroke-linecap="round"/>
  <text x="681" y="456" class="river" transform="rotate(-41 681 456)">James River</text>

  <path d="M1112 217C1030 226 958 247 888 279C811 314 758 340 686 356C608 374 528 365 438 342" fill="none" stroke="#56889a" stroke-width="25" stroke-linecap="round"/>
  <path d="M1112 217C1030 226 958 247 888 279C811 314 758 340 686 356C608 374 528 365 438 342" fill="none" stroke="#a7ccd5" stroke-width="14" stroke-linecap="round"/>
  <path d="M687 355C635 321 575 280 492 238" fill="none" stroke="#78a8b8" stroke-width="18" stroke-linecap="round"/>
  <text x="783" y="312" class="river" transform="rotate(-19 783 312)">York River</text>
  <text x="544" y="300" class="river" transform="rotate(26 544 300)">Pamunkey River</text>

  <path d="M341 184C395 222 431 263 456 307C486 360 493 416 513 475C534 538 566 582 620 620" fill="none" stroke="#6f9b8f" stroke-width="19" stroke-linecap="round"/>
  <path d="M341 184C395 222 431 263 456 307C486 360 493 416 513 475C534 538 566 582 620 620" fill="none" stroke="#b9d1c4" stroke-width="10" stroke-linecap="round"/>
  <text x="425" y="407" class="river" transform="rotate(71 425 407)">Chickahominy River</text>

  <path d="M1093 245C1036 282 982 316 923 348C861 382 793 413 736 448" fill="none" stroke="#315f8c" stroke-width="8" stroke-dasharray="5 15" marker-end="url(#blueArrow)"/>
  <text x="888" y="394" class="blue" font-size="16" font-weight="700" transform="rotate(-28 888 394)">Franklin by water · May 6</text>

  <path d="M742 447C674 417 618 394 556 367C498 342 448 319 399 292" fill="none" stroke="#315f8c" stroke-width="9" marker-end="url(#blueArrow)"/>
  <text x="527" y="426" class="blue" font-size="16" font-weight="700" transform="rotate(-22 527 426)">Army of the Potomac · May 10–24</text>
  <path d="M741 447C667 414 600 386 535 364" fill="none" stroke="#9a3d32" stroke-width="8" stroke-dasharray="12 9" marker-end="url(#redArrow)"/>

  <path d="M1065 596C1008 581 967 558 929 526" fill="none" stroke="#315f8c" stroke-width="9" marker-end="url(#blueArrow)"/>
  <text x="920" y="619" class="blue" font-size="15" font-weight="700">Wool · May 10</text>
  <path d="M994 532C911 520 827 519 749 538C678 555 610 575 556 599" fill="none" stroke="#315f8c" stroke-width="9" marker-end="url(#blueArrow)"/>
  <text x="673" y="554" class="blue" font-size="15" font-weight="700">Rodgers up the James · May 8–15</text>

  <path d="M976 572l34 34m-34 0 34-34" stroke="#9a3d32" stroke-width="7" stroke-linecap="round"/>
  <text x="1140" y="640" text-anchor="end" class="red" font-size="15" font-weight="700">CSS Virginia destroyed · May 11</text>

  <circle cx="1091" cy="246" r="8" class="dot"/><text x="1032" y="205" class="town">Fort Monroe</text>
  <circle cx="742" cy="447" r="8" class="dot"/><text x="756" y="438" class="town">West Point / Eltham’s Landing</text><text x="756" y="460" class="date">May 6–7</text>
  <circle cx="497" cy="281" r="8" class="dot"/><text x="511" y="248" class="town">White House Landing</text><text x="511" y="270" class="date">Main supply base</text>
  <circle cx="335" cy="178" r="9" class="dot"/><text x="257" y="145" class="town">Richmond</text>
  <circle cx="558" cy="599" r="8" class="dot"/><text x="574" y="631" class="town">Drewry’s Bluff</text><text x="574" y="652" class="date">Flotilla repulsed May 15</text>
  <circle cx="931" cy="527" r="8" class="dot"/><text x="886" y="484" class="town">Norfolk</text><text x="878" y="506" class="date">Occupied May 10</text>
  <circle cx="991" cy="589" r="7" class="dot"/><text x="1015" y="574" class="small">Craney Island</text>

  <path d="M262 217H410" stroke="#9a3d32" stroke-width="6" stroke-dasharray="12 8"/>
  <text x="221" y="243" class="red" font-size="15" font-weight="700">Johnston’s army east of Richmond</text>
  <g filter="url(#shadow)">
    <rect x="360" y="261" width="48" height="29" rx="5" fill="#315f8c"/><text x="384" y="281" text-anchor="middle" class="corps">V</text>
    <rect x="410" y="301" width="48" height="29" rx="5" fill="#315f8c"/><text x="434" y="321" text-anchor="middle" class="corps">VI</text>
    <rect x="435" y="347" width="48" height="29" rx="5" fill="#315f8c"/><text x="459" y="367" text-anchor="middle" class="corps">II</text>
    <rect x="472" y="454" width="48" height="29" rx="5" fill="#315f8c"/><text x="496" y="474" text-anchor="middle" class="corps">IV</text>
    <rect x="500" y="500" width="48" height="29" rx="5" fill="#315f8c"/><text x="524" y="520" text-anchor="middle" class="corps">III</text>
  </g>
  <text x="82" y="286" class="small" font-weight="700">Army of the Potomac by May 24</text>
  <text x="82" y="308" class="small">V, VI, II north of the river</text>
  <text x="82" y="330" class="small">IV, III south of the river</text>

  <rect x="60" y="516" width="360" height="174" rx="10" fill="#fffaf0" stroke="#847966"/>
  <text x="82" y="548" class="small" font-weight="700">Operational key</text>
  <path d="M84 580H151" stroke="#315f8c" stroke-width="8" marker-end="url(#blueArrow)"/><text x="174" y="586" class="small">United States movement</text>
  <path d="M84 619H151" stroke="#315f8c" stroke-width="8" stroke-dasharray="4 13" marker-end="url(#blueArrow)"/><text x="174" y="625" class="small">United States water movement</text>
  <path d="M84 659H151" stroke="#9a3d32" stroke-width="8" stroke-dasharray="12 9" marker-end="url(#redArrow)"/><text x="174" y="665" class="small">Confederate withdrawal</text>
</svg>
