<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">The United States left and Confederate attacks on the Hornet's Nest, 10:30 a.m. to 2 p.m. April 6, 1862</title>
  <desc id="desc">Map shows Stuart and MacArthur east of Hurlbut, Prentiss, and Wallace, with Confederate attacks by Chalmers, Jackson, Shaver, Stevens, Hindman, and Gibson across Locust Grove Run, Duncan Field, and Davis Wheat Field.</desc>
  <defs><marker id="usa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315f8c"/></marker><marker id="csa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9a3d32"/></marker></defs>
  <rect width="1200" height="820" fill="#f3eedf"/><path d="M1050 0C1010 140 1080 280 1030 430S1080 680 1015 820H1200V0Z" fill="#b6cfcd"/><text x="1120" y="410" fill="#385f64" font-family="Georgia,serif" font-size="25" text-anchor="middle" transform="rotate(88 1120 410)">TENNESSEE RIVER</text>
  <path d="M505 780L520 90" stroke="#665746" stroke-width="8"/><text x="545" y="330" fill="#514438" font-family="Arial,sans-serif" font-size="17" transform="rotate(-89 545 330)">Corinth Road</text><path d="M865 780L810 90" stroke="#756551" stroke-width="7"/><text x="842" y="355" fill="#514438" font-family="Arial,sans-serif" font-size="16" transform="rotate(-85 842 355)">Hamburg–Savannah Road</text>
  <rect x="260" y="400" width="260" height="126" rx="8" fill="#d8b88a"/><text x="390" y="446" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="22" font-weight="700">DUNCAN FIELD</text><text x="390" y="476" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="16">Shaver · Stevens · Hindman</text><text x="390" y="500" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="16">10:30 a.m.–noon</text>
  <rect x="530" y="420" width="235" height="106" rx="8" fill="#d8b88a"/><text x="648" y="460" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="22" font-weight="700">DAVIS WHEAT FIELD</text><text x="648" y="490" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="16">Gibson · noon–2 p.m.</text>
  <path d="M180 285L790 260" stroke="#315f8c" stroke-width="18"/><text x="485" y="235" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="21" font-weight="700">W. H. L. WALLACE · PRENTISS · HURLBUT</text><text x="485" y="307" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="15">farm lane and thickets · later called the Hornet's Nest</text>
  <path d="M815 252L910 245" stroke="#315f8c" stroke-width="18"/><text x="860" y="218" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="18" font-weight="700">MacARTHUR</text><path d="M930 235L1010 225" stroke="#315f8c" stroke-width="18"/><text x="968" y="195" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="18" font-weight="700">STUART</text><path d="M908 245L930 235" stroke="#315f8c" stroke-width="4" stroke-dasharray="9 8"/>
  <path d="M975 640C970 520 975 400 978 245" fill="none" stroke="#9a3d32" stroke-width="12" marker-end="url(#csa)"/><text x="990" y="610" fill="#7c3029" font-family="Arial,sans-serif" font-size="18" font-weight="700">CHALMERS</text><path d="M885 650C885 530 875 400 860 265" fill="none" stroke="#9a3d32" stroke-width="12" marker-end="url(#csa)"/><text x="875" y="680" text-anchor="middle" fill="#7c3029" font-family="Arial,sans-serif" font-size="18" font-weight="700">JACKSON</text>
  <path d="M355 690C360 600 370 520 382 505" fill="none" stroke="#9a3d32" stroke-width="12" marker-end="url(#csa)"/><text x="330" y="720" text-anchor="middle" fill="#7c3029" font-family="Arial,sans-serif" font-size="17" font-weight="700">SHAVER · STEVENS · HINDMAN</text><path d="M630 700C635 615 640 535 645 510" fill="none" stroke="#9a3d32" stroke-width="12" marker-end="url(#csa)"/><text x="645" y="735" text-anchor="middle" fill="#7c3029" font-family="Arial,sans-serif" font-size="18" font-weight="700">GIBSON'S REPEATED ASSAULTS</text>
  <path d="M305 390C300 340 290 310 285 285" fill="none" stroke="#9a3d32" stroke-width="5" stroke-dasharray="8 7"/><path d="M455 390C450 340 440 300 430 275" fill="none" stroke="#9a3d32" stroke-width="5" stroke-dasharray="8 7"/><path d="M585 405C575 345 565 305 550 270" fill="none" stroke="#9a3d32" stroke-width="5" stroke-dasharray="8 7"/><text x="470" y="570" text-anchor="middle" fill="#7c3029" font-family="Arial,sans-serif" font-size="15">separate attacks were repulsed before 2 p.m.</text>
  <path d="M930 300Q955 335 980 300" fill="none" stroke="#6e8a64" stroke-width="15"/><text x="955" y="350" text-anchor="middle" fill="#4e684a" font-family="Arial,sans-serif" font-size="15">Locust Grove Run</text>
  <text x="40" y="52" fill="#263332" font-family="Georgia,serif" font-size="31" font-weight="700">United States left and the Hornet's Nest</text><text x="40" y="86" fill="#4b5856" font-family="Arial,sans-serif" font-size="18">April 6, 1862 · 10:30 a.m.–2 p.m. · simplified orientation · not to scale</text><rect x="45" y="690" width="20" height="20" fill="#315f8c"/><text x="77" y="707" fill="#263332" font-family="Arial,sans-serif" font-size="16">United States</text><rect x="45" y="724" width="20" height="20" fill="#9a3d32"/><text x="77" y="741" fill="#263332" font-family="Arial,sans-serif" font-size="16">Confederacy</text><path d="M1120 80V135" stroke="#263332" stroke-width="5" marker-end="url(#usa)"/><text x="1120" y="62" text-anchor="middle" fill="#263332" font-family="Arial,sans-serif" font-size="20" font-weight="700">N</text>
</svg>
