    <text x="219" y="164" text-anchor="middle" font-size="15" font-weight="700">HAGERSTOWN</text>

    <circle cx="347" cy="259" r="7" fill="#5c5043"/>
    <rect x="262" y="211" width="170" height="32" rx="6" fill="#fffaf0" stroke="#9a8c76"/>
