    <text x="696" y="376" text-anchor="middle" font-size="15" font-weight="700">HARPERS FERRY</text>

    <circle cx="826" cy="288" r="7" fill="#5c5043"/>
    <rect x="749" y="235" width="205" height="34" rx="6" fill="#fffaf0" stroke="#9a8c76"/>
    <text x="852" y="257" text-anchor="middle" font-size="14" font-weight="700">BERLIN / BRUNSWICK</text>

    <circle cx="567" cy="543" r="6" fill="#5c5043"/>
    <rect x="473" y="559" width="188" height="31" rx="6" fill="#fffaf0" stroke="#9a8c76"/>
    <text x="567" y="580" text-anchor="middle" font-size="15" font-weight="700">WINCHESTER</text>

    <circle cx="888" cy="505" r="6" fill="#5c5043"/>
    <rect x="814" y="458" width="148" height="30" rx="6" fill="#fffaf0" stroke="#9a8c76"/>
    <text x="888" y="479" text-anchor="middle" font-size="15" font-weight="700">LEESBURG</text>

    <circle cx="1008" cy="612" r="6" fill="#5c5043"/>
    <rect x="935" y="627" width="146" height="30" rx="6" fill="#fffaf0" stroke="#9a8c76"/>
    <text x="1008" y="648" text-anchor="middle" font-size="15" font-weight="700">WARRENTON</text>

    <circle cx="1057" cy="703" r="6" fill="#5c5043"/>
    <rect x="961" y="715" width="192" height="30" rx="6" fill="#fffaf0" stroke="#9a8c76"/>
    <text x="1057" y="736" text-anchor="middle" font-size="15" font-weight="700">CULPEPER</text>
  </g>

  <path d="M342 272C367 304 409 338 455 365" fill="none" stroke="#963b31" stroke-width="12" marker-end="url(#redArrow)"/>
  <g transform="translate(220 296)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="-142" y="-31" width="284" height="62" rx="9" fill="#963b31"/>
    <text x="0" y="-7" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">LEE WITHDRAWS · SEPT. 18–19</text>
    <text x="0" y="15" text-anchor="middle" font-size="12" fill="#fae9e4">through Shepherdstown into Virginia</text>
  </g>

  <path d="M477 390C512 449 532 492 558 527" fill="none" stroke="#963b31" stroke-width="9" stroke-dasharray="14 9" marker-end="url(#redArrow)"/>
  <path d="M584 549C711 567 851 593 985 611" fill="none" stroke="#963b31" stroke-width="10" marker-end="url(#redArrow)"/>
  <path d="M1019 626C1034 652 1043 677 1051 691" fill="none" stroke="#963b31" stroke-width="10" marker-end="url(#redArrow)"/>

  <g transform="translate(429 518)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="-112" y="-33" width="224" height="66" rx="9" fill="#963b31"/>
    <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">JACKSON</text>
    <text x="0" y="13" text-anchor="middle" font-size="12" fill="#fae9e4">holds Shenandoah Valley</text>
  </g>
  <g transform="translate(862 682)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="-106" y="-34" width="212" height="68" rx="9" fill="#963b31"/>
    <text x="0" y="-9" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">LONGSTREET</text>
    <text x="0" y="13" text-anchor="middle" font-size="12" fill="#fae9e4">moves toward Culpeper</text>
  </g>

  <path d="M390 247C500 209 661 216 804 278" fill="none" stroke="#315f8c" stroke-width="8" stroke-dasharray="14 10"/>
  <path d="M832 305C842 357 854 412 878 487" fill="none" stroke="#315f8c" stroke-width="12" marker-end="url(#blueArrow)"/>
  <path d="M900 516C941 546 971 571 996 600" fill="none" stroke="#315f8c" stroke-width="11" marker-end="url(#blueArrow)"/>
  <g transform="translate(987 393)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="-143" y="-39" width="286" height="78" rx="9" fill="#315f8c"/>
    <text x="0" y="-13" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ARMY OF THE POTOMAC</text>
    <text x="0" y="9" text-anchor="middle" font-size="12" fill="#eaf2f8">crosses October 26</text>
    <text x="0" y="27" text-anchor="middle" font-size="11" fill="#eaf2f8">advances through Loudoun Valley</text>
  </g>

  <path d="M1077 704C1111 697 1132 685 1150 668" fill="none" stroke="#6f5a44" stroke-width="4" marker-end="url(#redArrow)"/>
  <text x="1128" y="651" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#5b4938">RICHMOND</text>
  <text x="1128" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b4938">off map</text>

  <g transform="translate(1102 168)" font-family="Arial, sans-serif" fill="#2f2b27">
    <path d="M0 50V0M0 0L-9 18M0 0L9 18" fill="none" stroke="#2f2b27" stroke-width="3"/>
