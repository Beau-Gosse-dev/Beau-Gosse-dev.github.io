  <rect x="58" y="716" width="622" height="34" rx="7" fill="#fffaf0" stroke="#93846d" opacity="0.97"/>
  <text x="369" y="738" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f574d">Schematic and not to scale · routes and positions generalized</text>
</svg>
