<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">From Antietam to the Virginia Piedmont</title>
  <desc id="desc">Schematic map with north at top. Lee withdraws from Sharpsburg through Shepherdstown on September 18 and 19. The Army of the Potomac crosses near Harpers Ferry and Berlin on October 26 and advances through the Loudoun Valley. Jackson remains in the Shenandoah Valley while Longstreet moves east toward Culpeper.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e4"/>
      <stop offset="1" stop-color="#e4d6b8"/>
    </linearGradient>
    <linearGradient id="maryland" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7ead4"/>
      <stop offset="1" stop-color="#d4ddbd"/>
    </linearGradient>
    <linearGradient id="virginia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eadcc4"/>
      <stop offset="1" stop-color="#dcc9aa"/>
    </linearGradient>
    <marker id="blueArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16">
      <path d="M0 0L16 8L0 16Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16">
      <path d="M0 0L16 8L0 16Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#97896f" stroke-width="2"/>
  <text x="60" y="75" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#2f2b27">FROM ANTIETAM TO THE VIRGINIA PIEDMONT</text>
  <text x="60" y="106" font-family="Arial, sans-serif" font-size="18" fill="#5c5549">September 18–November 5, 1862 · north is up</text>

  <path d="M48 128H1152V299C1040 309 954 292 861 305C755 319 687 300 596 316C493 334 419 307 326 319C223 333 137 313 48 327Z" fill="url(#maryland)"/>
  <path d="M48 327C137 313 223 333 326 319C419 307 493 334 596 316C687 300 755 319 861 305C954 292 1040 309 1152 299V738H48Z" fill="url(#virginia)"/>
  <path d="M48 327C137 313 223 333 326 319C419 307 493 334 596 316C687 300 755 319 861 305C954 292 1040 309 1152 299" fill="none" stroke="#5b859c" stroke-width="34"/>
  <path d="M48 327C137 313 223 333 326 319C419 307 493 334 596 316C687 300 755 319 861 305C954 292 1040 309 1152 299" fill="none" stroke="#add2dd" stroke-width="19"/>

  <text x="77" y="213" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#596248">MARYLAND</text>
  <text x="102" y="696" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#735d45">VIRGINIA</text>
  <rect x="502" y="283" width="199" height="26" rx="6" fill="#fffaf0" opacity="0.94"/>
  <text x="602" y="302" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#31596d">POTOMAC RIVER</text>

  <path d="M634 128C649 205 665 269 691 340C715 408 744 484 785 553C813 600 845 654 890 738" fill="none" stroke="#71806f" stroke-width="42" opacity="0.2"/>
