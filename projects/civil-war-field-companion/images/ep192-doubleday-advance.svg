      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">PHELPS</text>
    </g>
    <g transform="translate(285 235)">
      <rect x="-72" y="-23" width="144" height="46" rx="8" fill="#315f8c"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">PATRICK</text>
    </g>

    <g transform="translate(322 407)">
      <rect x="-75" y="-23" width="150" height="46" rx="8" fill="#963b31"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">GRIGSBY</text>
    </g>
    <g transform="translate(303 674)">
      <rect x="-92" y="-23" width="184" height="46" rx="8" fill="#963b31"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">STARKE · WEST</text>
    </g>
    <g transform="translate(748 704)">
      <rect x="-91" y="-23" width="182" height="46" rx="8" fill="#963b31"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">STARKE · EAST</text>
    </g>
  </g>

  <g transform="translate(365 330)" font-family="Arial, sans-serif" filter="url(#shadow)">
