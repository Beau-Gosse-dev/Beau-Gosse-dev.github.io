    <text x="0" y="-9" text-anchor="middle" font-size="18" font-weight="700">N</text>
  </g>

  <path d="M570 128C566 246 574 369 577 489C581 593 576 666 580 741" fill="none" stroke="#a97849" stroke-width="18"/>
