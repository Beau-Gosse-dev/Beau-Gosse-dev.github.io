<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">The northern Antietam battlefield at daybreak, September 17, 1862</title>
  <desc id="desc">Schematic map with north at top. Hooker's First Corps waits north of Miller's Cornfield with Doubleday west of Ricketts and Meade in support. Seymour holds part of the East Woods. Jackson's Confederate line extends from Jones in the West Woods through Douglass south of the Cornfield to Walker near the Mumma farm. Hood is in reserve. Stephen D. Lee's batteries occupy the Dunker Church plateau, and Stuart and Pelham hold Nicodemus Heights.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e3"/>
      <stop offset="1" stop-color="#e8dcc3"/>
    </linearGradient>
    <pattern id="trees" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="17" r="8" fill="#43543d" opacity="0.54"/>
      <circle cx="21" cy="9" r="7" fill="#667257" opacity="0.52"/>
      <circle cx="29" cy="25" r="6" fill="#354834" opacity="0.48"/>
    </pattern>
    <pattern id="corn" width="20" height="28" patternUnits="userSpaceOnUse">
      <path d="M10 27V5M10 11L4 7M10 15L16 9M10 20L4 15" fill="none" stroke="#8a6c22" stroke-width="2" opacity="0.66"/>
    </pattern>
    <marker id="blueArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16">
      <path d="M0 0L16 8L0 16Z" fill="#315f8c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

