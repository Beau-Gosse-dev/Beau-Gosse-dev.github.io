<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">George W. Morgan's retreat from Cumberland Gap to the Ohio River</title>
  <desc id="desc">A north-up schematic map showing the United States Seventh Division marching from Cumberland Gap through Manchester, Proctor, Hazel Green, West Liberty, Grayson, and Greenupsburg between September 17 and October 3, 1862. Confederate forces threaten the column from Cumberland Gap, Irvine, Mount Sterling, and Lexington.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f2df"/>
      <stop offset="1" stop-color="#ece0c1"/>
    </linearGradient>
    <pattern id="hills" width="42" height="28" patternUnits="userSpaceOnUse">
      <path d="M2 24 Q11 7 20 24 M19 24 Q29 4 40 24" fill="none" stroke="#8d7d5c" stroke-width="1.4" opacity="0.28"/>
    </pattern>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0 0 L14 7 L0 14 z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0 0 L14 7 L0 14 z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3c3325" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1000" height="760" fill="url(#paper)"/>
  <path d="M58 666 C198 612 253 524 331 468 C426 399 500 332 595 278 C691 222 791 180 944 114 L944 666 L58 666 Z" fill="url(#hills)"/>

  <text x="52" y="58" fill="#2f2a21" font-family="Georgia, serif" font-size="31" font-weight="700">The mountain trek to the Ohio</text>
  <text x="54" y="88" fill="#625a4b" font-family="Arial, sans-serif" font-size="16">Seventh Division evacuation, September 17–October 3, 1862 · schematic, north up</text>

  <path d="M32 120 C214 104 361 131 513 112 C687 91 807 118 968 94" fill="none" stroke="#6d93ac" stroke-width="24" opacity="0.7"/>
  <path d="M32 120 C214 104 361 131 513 112 C687 91 807 118 968 94" fill="none" stroke="#426c88" stroke-width="2" opacity="0.8"/>
  <text x="786" y="79" fill="#315f8c" font-family="Arial, sans-serif" font-size="16" font-weight="700">OHIO RIVER</text>
  <text x="68" y="151" fill="#6b6252" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">OHIO</text>
  <text x="68" y="187" fill="#6b6252" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">KENTUCKY</text>

  <path d="M429 485 C453 451 470 426 493 397 C512 372 524 340 547 311" fill="none" stroke="#6689a1" stroke-width="8" opacity="0.62"/>
  <text x="456" y="389" transform="rotate(-52 456 389)" fill="#456a81" font-family="Arial, sans-serif" font-size="13">Kentucky River</text>

  <path d="M183 650 C206 608 222 560 275 523 C323 490 365 476 428 462 C481 450 514 408 553 370 C603 321 642 295 698 270 C753 245 806 204 855 131" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <path d="M183 650 C206 608 222 560 275 523 C323 490 365 476 428 462 C481 450 514 408 553 370 C603 321 642 295 698 270 C753 245 806 204 855 131" fill="none" stroke="#315f8c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/>

  <g fill="#315f8c" stroke="#fffaf0" stroke-width="3" filter="url(#shadow)">
    <circle cx="183" cy="650" r="8"/>
    <circle cx="275" cy="523" r="8"/>
    <circle cx="428" cy="462" r="8"/>
    <circle cx="553" cy="370" r="8"/>
    <circle cx="698" cy="270" r="8"/>
    <circle cx="787" cy="211" r="8"/>
    <circle cx="855" cy="131" r="8"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#28251f" style="paint-order: stroke; stroke: #f8f2df; stroke-width: 4px; stroke-linejoin: round">
    <text x="74" y="675" font-size="17" font-weight="700">Cumberland Gap</text>
    <text x="74" y="696" font-size="13" fill="#315f8c">Sept. 17 · 8 p.m.</text>
    <text x="244" y="551" font-size="17" font-weight="700">Manchester</text>
    <text x="244" y="570" font-size="13" fill="#315f8c">Sept. 19</text>
    <text x="394" y="441" font-size="17" font-weight="700">Proctor</text>
    <text x="394" y="420" font-size="13" fill="#315f8c">Sept. 21 · river crossing</text>
    <text x="520" y="349" font-size="17" font-weight="700">Hazel Green</text>
    <text x="520" y="329" font-size="13" fill="#315f8c">Sept. 23</text>
    <text x="650" y="299" font-size="17" font-weight="700">West Liberty</text>
    <text x="650" y="319" font-size="13" fill="#315f8c">Sept. 25</text>
    <text x="746" y="191" font-size="17" font-weight="700">Grayson</text>
    <text x="746" y="171" font-size="13" fill="#315f8c">Oct. 1</text>
    <text x="820" y="158" font-size="17" font-weight="700">Greenupsburg</text>
    <text x="820" y="178" font-size="13" fill="#315f8c">Oct. 3 · safety</text>
  </g>

  <path d="M206 704 C219 683 216 663 204 645" fill="none" stroke="#963b31" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#redArrow)"/>
  <text x="54" y="614" fill="#963b31" font-family="Arial, sans-serif" font-size="14" font-weight="700" style="paint-order: stroke; stroke: #f8f2df; stroke-width: 4px">Stevenson follows from the Gap</text>

  <circle cx="320" cy="408" r="6" fill="#963b31"/>
  <text x="246" y="393" fill="#963b31" font-family="Arial, sans-serif" font-size="15" font-weight="700">Irvine</text>
  <path d="M321 413 C361 442 397 449 420 456" fill="none" stroke="#963b31" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#redArrow)"/>
  <path d="M440 445 C511 395 599 339 674 287 C718 257 747 232 770 218" fill="none" stroke="#963b31" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#redArrow)"/>
  <text x="478" y="484" fill="#963b31" font-family="Arial, sans-serif" font-size="14" font-weight="700" style="paint-order: stroke; stroke: #f8f2df; stroke-width: 4px">John Hunt Morgan harasses column</text>

  <circle cx="234" cy="263" r="6" fill="#963b31"/>
  <text x="151" y="247" fill="#963b31" font-family="Arial, sans-serif" font-size="15" font-weight="700">Lexington</text>
  <circle cx="324" cy="315" r="6" fill="#963b31"/>
  <text x="247" y="300" fill="#963b31" font-family="Arial, sans-serif" font-size="15" font-weight="700">Mount Sterling</text>
  <path d="M270 272 C332 296 364 344 393 422" fill="none" stroke="#963b31" stroke-width="3" stroke-dasharray="7 8" opacity="0.75"/>
  <text x="95" y="285" fill="#625a4b" font-family="Arial, sans-serif" font-size="13">Confederate concentration northwest of Proctor</text>

  <g transform="translate(350 603)">
    <rect width="240" height="105" rx="10" fill="#fffaf0" stroke="#baaa87" filter="url(#shadow)"/>
    <path d="M18 26 H62" stroke="#315f8c" stroke-width="7" marker-end="url(#blueArrow)"/>
    <text x="74" y="31" fill="#28251f" font-family="Arial, sans-serif" font-size="13">U.S. march</text>
    <path d="M18 58 H62" stroke="#963b31" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#redArrow)"/>
    <text x="74" y="63" fill="#28251f" font-family="Arial, sans-serif" font-size="13">Confederate movement</text>
    <path d="M18 88 Q27 72 36 88 M35 88 Q45 69 56 88" fill="none" stroke="#8d7d5c" stroke-width="1.5"/>
    <text x="74" y="92" fill="#28251f" font-family="Arial, sans-serif" font-size="13">Mountain terrain</text>
  </g>

  <text x="618" y="684" fill="#3f392f" font-family="Georgia, serif" font-size="16" font-style="italic">219 miles · 16 days · all guns and wagons saved</text>
  <text x="619" y="709" fill="#625a4b" font-family="Arial, sans-serif" font-size="11">Route and dates based on George W. Morgan's account.</text>
  <text x="619" y="726" fill="#625a4b" font-family="Arial, sans-serif" font-size="11">Town positions and road trace are approximate.</text>

  <g transform="translate(934 650)">
    <path d="M0 42 L0 0" stroke="#39342b" stroke-width="3" marker-end="url(#blueArrow)"/>
    <text x="-5" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#39342b">N</text>
  </g>
</svg>
