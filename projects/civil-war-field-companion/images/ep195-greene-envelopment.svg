  <rect x="938" y="600" width="205" height="57" rx="8" fill="#f7e8d4" stroke="#963b31" stroke-width="2"/><text x="1040" y="623" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#7c342d">TWO-GUN SECTION</text><text x="1040" y="643" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#7c342d">one piece abandoned near church</text>

