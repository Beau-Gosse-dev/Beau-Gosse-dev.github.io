<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Army positions around Richmond before Fair Oaks</title>
  <desc id="desc">Schematic operational map showing Richmond, the Chickahominy River, White House Landing, three United States corps north of the river, two corps south of it, and the Confederate concentration west of Fair Oaks and Seven Pines.</desc>
  <defs>
    <marker id="cs-arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="8" orient="auto"><path d="M0,0 L17,8 L0,16 Z" fill="#9a3d32"/></marker>
    <pattern id="marsh" width="28" height="18" patternUnits="userSpaceOnUse"><path d="M2 14 Q8 4 14 14 T26 14" fill="none" stroke="#719985" stroke-width="2"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="#f5f0e4"/>
  <path d="M90 184 C235 164 338 229 442 260 C560 295 646 286 749 341 C875 409 982 491 1138 516" fill="none" stroke="#bad8e3" stroke-width="94" opacity="0.72"/>
  <path d="M90 184 C235 164 338 229 442 260 C560 295 646 286 749 341 C875 409 982 491 1138 516" fill="none" stroke="#6698ae" stroke-width="17" stroke-linecap="round"/>
  <path d="M88 132 C238 110 355 174 463 210 C584 249 682 239 786 295 C914 363 1018 447 1145 469" fill="none" stroke="url(#marsh)" stroke-width="64" opacity="0.7"/>
  <text x="436" y="235" fill="#315f72" font-family="Georgia,serif" font-size="27" font-style="italic" transform="rotate(15 436 235)">Chickahominy River</text>

  <path d="M1117 95 C1052 116 1015 149 985 184" fill="none" stroke="#78a9bc" stroke-width="14" stroke-linecap="round"/>
  <text x="980" y="115" fill="#315f72" font-family="Georgia,serif" font-size="22" font-style="italic">Pamunkey River</text>
  <path d="M1095 126 C978 170 846 209 724 265 C583 330 406 371 206 405" fill="none" stroke="#b56e2c" stroke-width="6" stroke-dasharray="15 8"/>
  <text x="720" y="231" fill="#774619" font-family="Arial,sans-serif" font-size="18" transform="rotate(-20 720 231)">Richmond &amp; York River Railroad</text>

  <rect x="89" y="335" width="151" height="88" rx="12" fill="#cfb69a" stroke="#816447" stroke-width="3"/>
  <path d="M110 352h108M110 374h108M110 396h108M130 338v82M171 338v82M211 338v82" stroke="#816447" stroke-width="2" opacity="0.7"/>
  <text x="91" y="458" fill="#702a23" font-family="Arial,sans-serif" font-size="32" font-weight="700">RICHMOND</text>
  <text x="91" y="487" fill="#5f342d" font-family="Arial,sans-serif" font-size="18">Confederate defenses and field army</text>

  <g font-family="Arial,sans-serif">
    <rect x="238" y="108" width="195" height="70" rx="12" fill="#dce9f2" stroke="#315f8c" stroke-width="3"/>
    <text x="335" y="137" text-anchor="middle" fill="#234866" font-size="23" font-weight="700">Porter • V Corps</text>
    <text x="335" y="163" text-anchor="middle" fill="#315f72" font-size="17">north bank</text>
    <rect x="468" y="112" width="205" height="70" rx="12" fill="#dce9f2" stroke="#315f8c" stroke-width="3"/>
    <text x="570" y="141" text-anchor="middle" fill="#234866" font-size="23" font-weight="700">Franklin • VI Corps</text>
    <text x="570" y="167" text-anchor="middle" fill="#315f72" font-size="17">north bank</text>
    <rect x="711" y="178" width="204" height="70" rx="12" fill="#dce9f2" stroke="#315f8c" stroke-width="3"/>
    <text x="813" y="207" text-anchor="middle" fill="#234866" font-size="23" font-weight="700">Sumner • II Corps</text>
    <text x="813" y="233" text-anchor="middle" fill="#315f72" font-size="17">north bank</text>

    <rect x="390" y="474" width="232" height="75" rx="12" fill="#dce9f2" stroke="#315f8c" stroke-width="3"/>
    <text x="506" y="504" text-anchor="middle" fill="#234866" font-size="23" font-weight="700">Heintzelman • III Corps</text>
    <text x="506" y="532" text-anchor="middle" fill="#315f72" font-size="17">south bank, in support</text>
    <rect x="738" y="505" width="208" height="75" rx="12" fill="#dce9f2" stroke="#315f8c" stroke-width="3"/>
    <text x="842" y="535" text-anchor="middle" fill="#234866" font-size="23" font-weight="700">Keyes • IV Corps</text>
    <text x="842" y="563" text-anchor="middle" fill="#315f72" font-size="17">exposed forward wing</text>
  </g>

  <path d="M258 416 C385 425 543 445 710 500" fill="none" stroke="#9a3d32" stroke-width="13" marker-end="url(#cs-arrow)"/>
  <text x="277" y="384" fill="#702a23" font-family="Arial,sans-serif" font-size="23" font-weight="700">Johnston shifts the main attack south</text>
  <text x="277" y="412" fill="#702a23" font-family="Arial,sans-serif" font-size="18">after learning McDowell will not join McClellan</text>

  <circle cx="956" cy="430" r="13" fill="#272727"/>
  <text x="976" y="425" fill="#272727" font-family="Arial,sans-serif" font-size="22" font-weight="700">Fair Oaks</text>
  <circle cx="972" cy="485" r="13" fill="#272727"/>
  <text x="991" y="491" fill="#272727" font-family="Arial,sans-serif" font-size="22" font-weight="700">Seven Pines</text>
  <circle cx="1085" cy="506" r="12" fill="#272727"/>
  <text x="1000" y="552" fill="#272727" font-family="Arial,sans-serif" font-size="20" font-weight="700">Bottom’s Bridge</text>
  <circle cx="1087" cy="127" r="12" fill="#272727"/>
  <text x="888" y="78" fill="#272727" font-family="Arial,sans-serif" font-size="23" font-weight="700">White House Landing</text>

  <text x="42" y="54" fill="#2c2925" font-family="Georgia,serif" font-size="34" font-weight="700">The army divided by the Chickahominy</text>
  <text x="44" y="88" fill="#5c574f" font-family="Arial,sans-serif" font-size="20">May 25–30, 1862 • schematic, not to scale</text>
  <rect x="44" y="628" width="1110" height="89" rx="12" fill="#fffaf0" stroke="#b8aa94"/>
  <rect x="68" y="653" width="60" height="25" rx="5" fill="#dce9f2" stroke="#315f8c" stroke-width="2"/>
  <text x="145" y="673" font-family="Arial,sans-serif" font-size="19" fill="#292929">United States corps</text>
  <line x1="349" y1="665" x2="414" y2="665" stroke="#9a3d32" stroke-width="11" marker-end="url(#cs-arrow)"/>
  <text x="435" y="673" font-family="Arial,sans-serif" font-size="19" fill="#292929">revised Confederate main effort</text>
  <text x="720" y="657" font-family="Arial,sans-serif" font-size="18" fill="#4b6458">Flooding on May 30 damaged crossings and widened</text>
  <text x="720" y="684" font-family="Arial,sans-serif" font-size="18" fill="#4b6458">the separation between McClellan’s two wings.</text>
</svg>
