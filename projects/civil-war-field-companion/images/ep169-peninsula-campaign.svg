<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">The Peninsula Campaign, March through August 1862</title>
  <desc id="desc">Generalized schematic map showing the Army of the Potomac's movement from Fort Monroe through Yorktown and Williamsburg toward Richmond, its withdrawal through the Seven Days battlefields to Harrison's Landing, and its later evacuation back to Fort Monroe.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5efd9"/>
      <stop offset="1" stop-color="#e7dcc0"/>
    </linearGradient>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a3d32"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2d2b27" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#paper)"/>
  <path d="M70 126 C214 80 412 96 568 151 C712 202 828 250 1048 244 L1160 257 L1160 730 L76 730 Z" fill="#d7e5e7" stroke="#5c8087" stroke-width="3"/>
  <path d="M120 160 C271 130 430 154 554 207 C663 254 736 328 835 370 C920 407 1028 414 1130 400 L1130 510 C1018 529 906 508 802 462 C682 408 593 333 495 292 C372 240 236 224 120 244 Z" fill="#efe7cf" stroke="#756b55" stroke-width="4" filter="url(#shadow)"/>
  <path d="M92 126 C240 84 418 105 565 161 C700 213 823 259 1105 256" fill="none" stroke="#4f7780" stroke-width="18" opacity="0.75"/>
  <path d="M95 650 C236 627 366 603 481 554 C604 502 692 440 801 459 C930 482 1018 550 1138 566" fill="none" stroke="#4f7780" stroke-width="22" opacity="0.75"/>
  <text x="470" y="111" fill="#385f68" font-family="Georgia, serif" font-size="27" font-style="italic">York River</text>
  <text x="520" y="668" fill="#385f68" font-family="Georgia, serif" font-size="27" font-style="italic">James River</text>

  <path d="M1002 421 C898 403 795 376 714 340 C646 309 586 274 516 251 C458 232 402 222 344 219" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M344 232 C457 260 563 310 643 369 C705 415 749 463 799 491" fill="none" stroke="#9a3d32" stroke-width="11" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <path d="M838 510 C918 538 1003 502 1048 450" fill="none" stroke="#315f8c" stroke-width="7" stroke-dasharray="15 11" marker-end="url(#blueArrow)"/>

  <g font-family="Arial, sans-serif" fill="#232a2c">
    <g transform="translate(1015 412)"><circle r="11" fill="#315f8c"/><text x="-29" y="-22" font-size="23" font-weight="700">Fort Monroe</text><text x="-28" y="28" font-size="17">first arrivals Mar. 20</text></g>
    <g transform="translate(827 345)"><circle r="9" fill="#315f8c"/><text x="-40" y="-28" font-size="22" font-weight="700">Yorktown</text></g>
    <g transform="translate(695 330)"><circle r="9" fill="#315f8c"/><text x="-57" y="-25" font-size="22" font-weight="700">Williamsburg</text></g>
    <g transform="translate(319 217)"><circle r="12" fill="#9a3d32"/><text x="-46" y="-30" font-size="25" font-weight="700">Richmond</text></g>
    <g transform="translate(461 268)"><circle r="8" fill="#6a6459"/><text x="-54" y="-17" font-size="19">Seven Pines</text></g>
    <g transform="translate(568 332)"><circle r="8" fill="#9a3d32"/><text x="-64" y="-17" font-size="19">Seven Days</text></g>
    <g transform="translate(663 411)"><circle r="8" fill="#9a3d32"/><text x="-67" y="31" font-size="19">Malvern Hill</text></g>
    <g transform="translate(820 501)"><circle r="11" fill="#315f8c"/><text x="-93" y="50" font-size="22" font-weight="700">Harrison's Landing</text><text x="-35" y="74" font-size="17">July 2-August</text></g>
  </g>

  <g transform="translate(63 563)" font-family="Arial, sans-serif">
    <rect width="390" height="143" rx="12" fill="#fbf7e8" stroke="#746b57" stroke-width="2"/>
    <path d="M25 35 H105" stroke="#315f8c" stroke-width="10" marker-end="url(#blueArrow)"/><text x="125" y="42" font-size="20" fill="#252525">Federal advance, spring 1862</text>
    <path d="M25 76 H105" stroke="#9a3d32" stroke-width="10" marker-end="url(#redArrow)"/><text x="125" y="83" font-size="20" fill="#252525">Seven Days withdrawal</text>
    <path d="M25 116 H105" stroke="#315f8c" stroke-width="7" stroke-dasharray="12 8" marker-end="url(#blueArrow)"/><text x="125" y="123" font-size="20" fill="#252525">Evacuation to Fort Monroe</text>
  </g>
  <text x="600" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#272822">THE PENINSULA CAMPAIGN, 1862</text>
  <text x="600" y="775" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#514c42">GENERALIZED SCHEMATIC • NOT TO SCALE • WATERWAYS, ROUTES, POSITIONS, AND DISTANCES ARE APPROXIMATE</text>
</svg>
