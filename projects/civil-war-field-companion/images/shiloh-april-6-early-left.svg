<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Early fighting on the United States left at Shiloh, 5 to 9 a.m. April 6, 1862</title>
  <desc id="desc">Map shows Powell's patrol withdrawing from Fraley Field, Peabody's delaying line, Miller at Spain Field, and the attacks by Wood, Shaver, Gladden, and Chalmers that routed Prentiss's division.</desc>
  <defs><marker id="u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315f8c"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9a3d32"/></marker></defs>
  <rect width="1200" height="820" fill="#f3eedf"/>
  <path d="M980 0C940 140 1010 280 960 430S1010 670 945 820H1200V0Z" fill="#b6cfcd"/><text x="1055" y="405" fill="#385f64" font-family="Georgia,serif" font-size="27" text-anchor="middle" transform="rotate(88 1055 405)">Tennessee River</text>
  <path d="M590 800L560 90" stroke="#5f5144" stroke-width="9"/><text x="605" y="245" fill="#514438" font-family="Arial,sans-serif" font-size="19" transform="rotate(-88 605 245)">Eastern Corinth Road</text>
  <rect x="330" y="610" width="250" height="78" rx="6" fill="#d8b88a"/><text x="455" y="645" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="23" font-weight="700">FRALEY FIELD</text><text x="455" y="672" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="16">5 a.m. first contact</text>
  <path d="M390 545H715" stroke="#315f8c" stroke-width="16"/><text x="552" y="525" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="20" font-weight="700">PEABODY · 7:30–8:30 a.m.</text>
  <rect x="650" y="345" width="270" height="100" rx="7" fill="#d8b88a"/><text x="785" y="384" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="23" font-weight="700">SPAIN FIELD</text><text x="785" y="414" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="18">Miller + two batteries</text>
  <rect x="370" y="250" width="360" height="76" rx="7" fill="#d7e0e8" stroke="#315f8c" stroke-width="4"/><text x="550" y="284" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="21" font-weight="700">PRENTISS'S DIVISION CAMPS</text><text x="550" y="309" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="16">routed before 9 a.m.</text>
  <path d="M430 690C420 630 455 590 500 560" fill="none" stroke="#315f8c" stroke-width="8" stroke-dasharray="14 9" marker-end="url(#u)"/><text x="250" y="600" fill="#234b73" font-family="Arial,sans-serif" font-size="17">Powell and Moore fell back</text>
  <path d="M355 735C380 660 420 610 455 565" fill="none" stroke="#9a3d32" stroke-width="12" marker-end="url(#c)"/><text x="210" y="730" fill="#7c3029" font-family="Arial,sans-serif" font-size="19" font-weight="700">WOOD + SHAVER</text>
  <path d="M745 650C755 565 770 495 785 450" fill="none" stroke="#9a3d32" stroke-width="12" marker-end="url(#c)"/><text x="765" y="620" fill="#7c3029" font-family="Arial,sans-serif" font-size="19" font-weight="700">GLADDEN</text>
  <path d="M900 650C880 560 850 495 820 448" fill="none" stroke="#9a3d32" stroke-width="12" marker-end="url(#c)"/><text x="915" y="620" fill="#7c3029" font-family="Arial,sans-serif" font-size="19" font-weight="700">CHALMERS</text>
  <path d="M560 230C535 180 500 145 465 120" fill="none" stroke="#315f8c" stroke-width="10" stroke-dasharray="15 10" marker-end="url(#u)"/><text x="490" y="105" fill="#234b73" font-family="Arial,sans-serif" font-size="19">survivors withdrew north</text>
  <text x="40" y="52" fill="#263332" font-family="Georgia,serif" font-size="31" font-weight="700">United States left · 5–9 a.m.</text><text x="40" y="86" fill="#4b5856" font-family="Arial,sans-serif" font-size="18">April 6, 1862 · simplified orientation · not to scale</text>
  <path d="M1110 80V135" stroke="#263332" stroke-width="5" marker-end="url(#c)"/><text x="1110" y="62" text-anchor="middle" fill="#263332" font-family="Arial,sans-serif" font-size="20" font-weight="700">N</text>
</svg>
