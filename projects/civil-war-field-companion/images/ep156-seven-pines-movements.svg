<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Seven Pines and Fair Oaks troop-movement diagram, May 31, 1862</title>
  <desc id="desc">Schematic phase map showing Union corps divided by the flooded Chickahominy, the Confederate attack on Keyes and Heintzelman south of the river, route confusion in Longstreet's command, and Sumner's reinforcement across the river.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efe5ca"/><stop offset="1" stop-color="#d5c093"/></linearGradient>
    <pattern id="wet" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 16 Q6 10 12 16 T24 16" fill="none" stroke="#4d8294" stroke-width="2" opacity=".35"/></pattern>
    <marker id="blue" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0 0L20 10L0 20Z" fill="#315f8c"/></marker>
    <marker id="red" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0 0L20 10L0 20Z" fill="#9a3d32"/></marker>
    <style>.title{font:700 29px Georgia,serif;fill:#27231e}.place{font:700 19px Georgia,serif;fill:#27231e}.label{font:700 16px Arial,sans-serif}.small{font:14px Arial,sans-serif;fill:#38332c}.tiny{font:12px Arial,sans-serif;fill:#38332c}.road{fill:none;stroke:#725f42;stroke-width:13;stroke-linecap:round}.water{fill:none;stroke:#78adbf;stroke-width:65;stroke-linecap:round}</style>
  </defs>
  <rect width="1200" height="760" fill="url(#ground)"/>
  <path d="M0 280 C175 240 340 250 492 286 C665 326 827 300 1205 210" class="water"/>
  <path d="M0 280 C175 240 340 250 492 286 C665 326 827 300 1205 210" fill="none" stroke="#b9d8e1" stroke-width="35" opacity=".8"/>
  <path d="M0 323 C220 282 392 300 520 330 C680 367 860 330 1200 258 L1200 338 C850 410 660 441 500 399 C330 355 175 354 0 397Z" fill="url(#wet)" opacity=".75"/>
  <text x="455" y="268" class="label" fill="#315d72">RAIN-SWOLLEN CHICKAHOMINY</text>
  <path d="M90 492 C320 476 545 464 790 454 C930 448 1055 450 1200 470" class="road"/>
  <text x="420" y="447" class="small">Williamsburg Road</text>
  <path d="M92 420 C280 390 486 378 735 384 C910 389 1050 404 1200 423" class="road"/>
  <text x="455" y="365" class="small">Nine Mile Road</text>
  <path d="M88 585 C330 565 565 568 790 590 C935 604 1062 624 1200 650" class="road"/>
  <text x="425" y="606" class="small">Charles City Road</text>
  <path d="M90 535 C360 530 670 529 1040 536" fill="none" stroke="#514e45" stroke-width="8" stroke-dasharray="20 9"/>
  <text x="775" y="523" class="small">Richmond &amp; York River Railroad</text>
  <path d="M900 185 C855 255 812 325 780 390" fill="none" stroke="#725f42" stroke-width="10"/>
  <text x="835" y="270" class="tiny" transform="rotate(-61 835 270)">Grapevine Bridge route</text>
  <text x="38" y="460" class="place">RICHMOND</text><text x="1000" y="440" class="place">FAIR OAKS</text><text x="975" y="493" class="place">SEVEN PINES</text>
  <g transform="translate(730 94)"><rect width="185" height="70" rx="10" fill="#eaf2f7" stroke="#315f8c" stroke-width="3"/><text x="92" y="29" text-anchor="middle" class="label" fill="#244c72">SUMNER · II CORPS</text><text x="92" y="52" text-anchor="middle" class="small">north of river</text></g>
  <g transform="translate(935 85)"><rect width="225" height="70" rx="10" fill="#eaf2f7" stroke="#315f8c" stroke-width="3"/><text x="112" y="29" text-anchor="middle" class="label" fill="#244c72">PORTER · V CORPS</text><text x="112" y="52" text-anchor="middle" class="small">FRANKLIN · VI CORPS</text></g>
  <path d="M820 165 C810 232 802 303 790 380" fill="none" stroke="#315f8c" stroke-width="16" marker-end="url(#blue)"/>
  <text x="685" y="225" class="small" fill="#244c72">II Corps crosses to reinforce</text>
  <g transform="translate(870 390)"><rect width="255" height="65" rx="10" fill="#eaf2f7" stroke="#315f8c" stroke-width="3"/><text x="127" y="27" text-anchor="middle" class="label" fill="#244c72">KEYES · IV CORPS</text><text x="127" y="49" text-anchor="middle" class="small">Casey and Couch divisions</text></g>
  <g transform="translate(855 555)"><rect width="270" height="65" rx="10" fill="#eaf2f7" stroke="#315f8c" stroke-width="3"/><text x="135" y="27" text-anchor="middle" class="label" fill="#244c72">HEINTZELMAN · III CORPS</text><text x="135" y="49" text-anchor="middle" class="small">south of the river</text></g>
  <g transform="translate(180 432)"><rect width="218" height="64" rx="10" fill="#f7e7e2" stroke="#9a3d32" stroke-width="3"/><text x="109" y="27" text-anchor="middle" class="label" fill="#7e2e27">D. H. HILL</text><text x="109" y="49" text-anchor="middle" class="small">main attack develops</text></g>
  <path d="M400 465 C535 463 700 458 858 446" fill="none" stroke="#9a3d32" stroke-width="17" marker-end="url(#red)"/>
  <g transform="translate(170 338)"><rect width="265" height="64" rx="10" fill="#f7e7e2" stroke="#9a3d32" stroke-width="3"/><text x="132" y="27" text-anchor="middle" class="label" fill="#7e2e27">LONGSTREET'S COMMAND</text><text x="132" y="49" text-anchor="middle" class="small">route confusion and congestion</text></g>
  <path d="M435 369 C555 366 650 385 728 424" fill="none" stroke="#9a3d32" stroke-width="11" stroke-dasharray="18 11" marker-end="url(#red)"/>
  <path d="M435 392 C520 422 590 448 656 464" fill="none" stroke="#9a3d32" stroke-width="16" marker-end="url(#red)"/>
  <g transform="translate(185 538)"><rect width="230" height="64" rx="10" fill="#f7e7e2" stroke="#9a3d32" stroke-width="3"/><text x="115" y="27" text-anchor="middle" class="label" fill="#7e2e27">BENJAMIN HUGER</text><text x="115" y="49" text-anchor="middle" class="small">delayed on right</text></g>
  <path d="M415 570 C555 570 690 580 825 596" fill="none" stroke="#9a3d32" stroke-width="11" stroke-dasharray="18 11" marker-end="url(#red)"/>
  <g transform="translate(36 25)"><rect width="835" height="91" rx="12" fill="#fff9ec" opacity=".97" stroke="#89795c"/><text x="24" y="39" class="title">The divided army and the May 31 attack</text><text x="24" y="69" class="label" fill="#5b4b35">Seven Pines / Fair Oaks · phase diagram · schematic and not to scale</text></g>
  <g transform="translate(34 626)"><rect width="1115" height="108" rx="12" fill="#fff9ec" opacity=".97" stroke="#89795c"/><text x="18" y="28" class="label">READING THE DIAGRAM</text><text x="18" y="52" class="small">Solid arrows show broad movements described in the episode; dashed arrows show delayed or confused movements. Roads, bridges, corps areas, and arrows are approximate.</text><text x="18" y="76" class="small">The diagram follows the episode's reconstruction of Johnston's intended attack. Surviving orders and later accounts have produced disagreement over intended routes and responsibility.</text></g>
</svg>
