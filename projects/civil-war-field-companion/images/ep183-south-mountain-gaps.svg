<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">The roads through South Mountain</title>
  <desc id="desc">Schematic map of Turner’s, Fox’s, and Crampton’s Gaps, with Federal approaches from Middletown and Burkittsville and Confederate covering positions on the western side of South Mountain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f2e4"/>
      <stop offset="1" stop-color="#e7dcc5"/>
    </linearGradient>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#546249" stroke-width="5" opacity=".12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3d3226" flood-opacity=".23"/>
    </filter>
    <marker id="bArrow" markerWidth="12" markerHeight="12" refX="9.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#315f8c"/></marker>
    <marker id="rArrow" markerWidth="12" markerHeight="12" refX="9.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#9a3d32"/></marker>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif;fill:#29231d}.sans{font-family:Arial,sans-serif;fill:#29231d}.town{font:700 23px Georgia,'Times New Roman',serif}.small{font:18px Arial,sans-serif}.tiny{font:16px Arial,sans-serif}.unit{font:700 18px Arial,sans-serif}.road{fill:none;stroke:#8d795b;stroke-width:9;stroke-linecap:round}.minor{fill:none;stroke:#9d896a;stroke-width:5;stroke-linecap:round}.ridge{fill:url(#hatch);stroke:#59644d;stroke-width:5}.gap{fill:#fffaf0;stroke:#4e5845;stroke-width:4}.federal{fill:#edf4fb;stroke:#315f8c;stroke-width:3}.confed{fill:#fbefec;stroke:#9a3d32;stroke-width:3}.note{fill:#fffaf0;stroke:#aa9879;stroke-width:2}
    </style>
  </defs>

  <rect width="1440" height="960" fill="url(#bg)"/>
  <rect x="42" y="42" width="1356" height="876" rx="10" fill="none" stroke="#705f46" stroke-width="3"/>
  <text x="720" y="88" text-anchor="middle" class="serif" font-size="38" font-weight="700">The roads through South Mountain</text>
  <text x="720" y="121" text-anchor="middle" class="sans" font-size="19" letter-spacing="2">TURNER’S • FOX’S • CRAMPTON’S GAPS</text>

  <!-- Regional zones -->
  <text x="252" y="174" text-anchor="middle" class="sans" font-size="21" font-weight="700" fill="#8a382f">CUMBERLAND VALLEY</text>
  <text x="1180" y="174" text-anchor="middle" class="sans" font-size="21" font-weight="700" fill="#315f8c">MIDDLETOWN VALLEY</text>
  <path class="ridge" d="M625 144C670 188 638 250 671 305C704 359 665 420 696 473C725 524 690 581 721 637C748 686 715 752 754 816L892 816C856 749 887 688 857 630C827 573 863 515 831 460C801 407 836 348 806 296C774 240 809 184 766 144Z"/>
  <text x="749" y="485" text-anchor="middle" class="sans" font-size="29" font-weight="700" fill="#4f5945" transform="rotate(-82 749 485)">SOUTH MOUNTAIN</text>

  <!-- Roads and passes -->
  <path class="road" d="M1287 289C1117 293 961 281 821 292C702 301 578 314 436 326C356 333 286 350 166 366"/>
  <path class="minor" d="M1223 476C1061 457 938 464 803 479C695 491 576 510 445 517"/>
  <path class="road" d="M1261 714C1099 707 960 700 825 712C701 723 577 738 424 745C332 749 251 766 151 783"/>
  <circle class="gap" cx="816" cy="293" r="18"/>
  <circle class="gap" cx="803" cy="479" r="18"/>
  <circle class="gap" cx="825" cy="712" r="18"/>
  <text x="843" y="258" class="town">Turner’s Gap</text>
  <text x="831" y="446" class="town">Fox’s Gap</text>
  <text x="854" y="680" class="town">Crampton’s Gap</text>
  <text x="1024" y="273" class="small" fill="#725f45">National Road</text>

  <!-- Towns -->
  <g><circle cx="1215" cy="289" r="7" fill="#382f26"/><text x="1232" y="281" class="town">Middletown</text></g>
  <g><circle cx="1215" cy="714" r="7" fill="#382f26"/><text x="1233" y="748" class="town">Burkittsville</text></g>
  <g><circle cx="269" cy="348" r="7" fill="#382f26"/><text x="173" y="330" class="town">Boonsboro</text></g>
  <g><circle cx="322" cy="747" r="7" fill="#382f26"/><text x="214" y="730" class="town">Brownsville</text></g>
  <text x="286" y="822" class="sans" font-size="18" fill="#5d503e">to Pleasant Valley and Harpers Ferry</text>

  <!-- Federal approaches -->
  <g filter="url(#shadow)">
    <rect class="federal" x="1060" y="190" width="322" height="72" rx="11"/>
    <text x="1221" y="219" text-anchor="middle" class="unit" fill="#244d74">Burnside’s right wing</text>
    <text x="1221" y="244" text-anchor="middle" class="small">I Corps and IX Corps</text>
  </g>
  <path d="M1105 263C1027 284 924 291 849 293" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" marker-end="url(#bArrow)"/>
  <path d="M1132 276C1045 340 938 416 838 462" fill="none" stroke="#315f8c" stroke-width="9" stroke-linecap="round" marker-end="url(#bArrow)"/>
  <g filter="url(#shadow)">
    <rect class="federal" x="1050" y="781" width="332" height="75" rx="11"/>
    <text x="1216" y="811" text-anchor="middle" class="unit" fill="#244d74">Franklin’s left wing</text>
    <text x="1216" y="837" text-anchor="middle" class="small">VI Corps and Couch’s division</text>
  </g>
  <path d="M1080 787C1008 755 924 726 860 716" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" marker-end="url(#bArrow)"/>

  <!-- Confederate covering commands -->
  <g filter="url(#shadow)">
    <rect class="confed" x="87" y="188" width="362" height="91" rx="11"/>
    <text x="268" y="219" text-anchor="middle" class="unit" fill="#7e2f28">D. H. Hill’s division</text>
    <text x="268" y="244" text-anchor="middle" class="small">Covering Turner’s and Fox’s Gaps</text>
    <text x="268" y="265" text-anchor="middle" class="tiny">Stuart’s cavalry screens eastward</text>
  </g>
  <path d="M407 281C518 293 640 296 777 293" fill="none" stroke="#9a3d32" stroke-width="8" stroke-linecap="round" marker-end="url(#rArrow)"/>
  <path d="M404 269C526 355 643 430 766 473" fill="none" stroke="#9a3d32" stroke-width="7" stroke-linecap="round" marker-end="url(#rArrow)"/>
  <g filter="url(#shadow)">
    <rect class="confed" x="72" y="564" width="410" height="94" rx="11"/>
    <text x="277" y="595" text-anchor="middle" class="unit" fill="#7e2f28">McLaws’s detachments</text>
    <text x="277" y="620" text-anchor="middle" class="small">Covering Crampton’s Gap</text>
    <text x="277" y="643" text-anchor="middle" class="tiny">Main command engaged around Maryland Heights</text>
  </g>
  <path d="M454 657C557 684 665 704 785 711" fill="none" stroke="#9a3d32" stroke-width="8" stroke-linecap="round" marker-end="url(#rArrow)"/>

  <!-- Opportunity annotation -->
  <g filter="url(#shadow)">
    <rect class="note" x="974" y="518" width="395" height="116" rx="11"/>
    <text x="1172" y="549" text-anchor="middle" class="unit">McClellan’s operational choice</text>
    <text x="997" y="578" class="small">• Push the main body toward Boonsboro</text>
    <text x="997" y="604" class="small">• Send Franklin toward Harpers Ferry</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="note" x="83" y="839" width="691" height="46" rx="9"/>
    <text x="429" y="868" text-anchor="middle" class="small">The gaps were road corridors through a steep wooded ridge, not broad open passes.</text>
  </g>

  <text x="720" y="908" text-anchor="middle" class="sans" font-size="16" fill="#625540">Schematic and not to scale • Terrain, roads, and unit footprints are generalized</text>
</svg>
