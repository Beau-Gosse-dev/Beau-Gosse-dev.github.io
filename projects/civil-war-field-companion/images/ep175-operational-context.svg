<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Operational setting of Jackson's movement to Manassas Junction</title>
  <desc id="desc">Generalized diagram of movements in northern Virginia from August 26 to 28, 1862.</desc>
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f2e1"/><stop offset="1" stop-color="#ddd1b4"/></linearGradient>
    <marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#9a3d32"/></marker>
    <marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#315f8c"/></marker>
  </defs>
  <rect width="1200" height="800" fill="url(#p)"/>
  <text x="52" y="54" font-family="Georgia,serif" font-size="31" fill="#2f2a22">Jackson behind Pope's army</text>
  <text x="54" y="84" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.3" fill="#7b302a">AUGUST 26–28, 1862 · GENERALIZED · NOT TO SCALE</text>
  <rect x="485" y="135" width="135" height="475" rx="24" fill="#c9c1aa" opacity=".7"/>
  <text x="550" y="374" transform="rotate(-90 550 374)" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#50483b">Bull Run Mountains</text>
  <rect x="490" y="372" width="125" height="43" rx="10" fill="#fbf8ee" stroke="#746b59" stroke-width="2"/>
  <text x="552" y="399" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700">Thoroughfare Gap</text>
  <path d="M87 660 C190 574 244 483 276 356 C292 287 326 223 385 160" fill="none" stroke="#6e96a7" stroke-width="22"/>
  <text x="102" y="623" font-family="Georgia,serif" font-size="18" fill="#315e72">Rappahannock River</text>
  <path d="M666 540 C800 548 938 539 1085 500" fill="none" stroke="#4b463e" stroke-width="8"/>
  <path d="M666 540 C800 548 938 539 1085 500" fill="none" stroke="#f7f1df" stroke-width="2" stroke-dasharray="16 11"/>
  <text x="770" y="579" font-family="Arial,sans-serif" font-size="17" fill="#3f3931">Orange &amp; Alexandria Railroad</text>
  <path d="M180 506 C306 429 414 395 474 394" fill="none" stroke="#9a3d32" stroke-width="7" marker-end="url(#r)"/>
  <path d="M630 395 C721 417 786 474 850 506" fill="none" stroke="#9a3d32" stroke-width="7" marker-end="url(#r)"/>
  <path d="M178 552 C304 509 402 462 475 421" fill="none" stroke="#9a3d32" stroke-width="5" stroke-dasharray="13 9" marker-end="url(#r)"/>
  <path d="M324 621 C445 589 568 558 650 548" fill="none" stroke="#315f8c" stroke-width="6" marker-end="url(#b)"/>
  <path d="M1080 270 C1038 330 991 411 930 490" fill="none" stroke="#315f8c" stroke-width="6" marker-end="url(#b)"/>
  <g font-family="Arial,sans-serif" fill="#252421">
    <g transform="translate(150 475)"><circle r="10" fill="#315f8c"/><rect x="-95" y="-46" width="190" height="31" rx="8" fill="#fbf8ee"/><text y="-25" text-anchor="middle" font-size="17" font-weight="700">Pope's Rappahannock line</text></g>
    <g transform="translate(675 542)"><circle r="9"/><rect x="-60" y="-53" width="120" height="31" rx="8" fill="#fbf8ee"/><text y="-32" text-anchor="middle" font-size="17" font-weight="700">Bristoe Station</text></g>
    <g transform="translate(882 527)"><circle r="11"/><rect x="-90" y="-66" width="180" height="33" rx="8" fill="#fbf8ee"/><text y="-43" text-anchor="middle" font-size="19" font-weight="700">Manassas Junction</text></g>
    <g transform="translate(352 623)"><circle r="8"/><rect x="-75" y="18" width="150" height="31" rx="8" fill="#fbf8ee"/><text y="40" text-anchor="middle" font-size="16" font-weight="700">Warrenton Junction</text></g>
    <g transform="translate(1050 242)"><circle r="8"/><rect x="-86" y="-45" width="172" height="31" rx="8" fill="#fbf8ee"/><text y="-24" text-anchor="middle" font-size="17" font-weight="700">Washington / Alexandria</text></g>
  </g>
  <g transform="translate(54 704)" font-family="Arial,sans-serif" font-size="16">
    <rect width="1092" height="62" rx="10" fill="#fbf8ee" stroke="#8a806e"/>
    <line x1="30" y1="31" x2="84" y2="31" stroke="#9a3d32" stroke-width="6" marker-end="url(#r)"/><text x="102" y="37">Jackson to Manassas</text>
    <line x1="328" y1="31" x2="382" y2="31" stroke="#9a3d32" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#r)"/><text x="400" y="37">Lee and Longstreet follow</text>
    <line x1="692" y1="31" x2="746" y2="31" stroke="#315f8c" stroke-width="6" marker-end="url(#b)"/><text x="764" y="37">United States concentration</text>
  </g>
</svg>
