<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">The assault on Crampton's Gap, September 14, 1862</title>
  <desc id="desc">Schematic tactical map with north at top. United States Sixth Corps troops move west through Burkittsville. Slocum's division attacks Parham's infantry and Munford's cavalry behind a stone wall along Mountain Church Road, breaks the line in a united charge, and pursues toward Crampton's Gap. Cobb's brigade arrives from Pleasant Valley too late to form a stable second line.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f1df"/>
      <stop offset="1" stop-color="#e8dcc2"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7d0aa"/>
      <stop offset="0.5" stop-color="#718064"/>
      <stop offset="1" stop-color="#43563f"/>
    </linearGradient>
    <pattern id="trees" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="16" r="7" fill="#38513b" opacity="0.32"/>
      <circle cx="20" cy="9" r="7" fill="#587054" opacity="0.34"/>
      <circle cx="29" cy="24" r="6" fill="#304936" opacity="0.28"/>
    </pattern>
    <marker id="blueArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#9b8d72" stroke-width="2"/>
  <text x="60" y="76" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2e2b28">THE ASSAULT ON CRAMPTON'S GAP</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#5d5548">September 14, 1862 · Federal attack moves east to west</text>

  <rect x="48" y="127" width="1104" height="617" fill="#dce2c0"/>
  <rect x="48" y="127" width="390" height="617" fill="#e6dfb8"/>
  <path d="M438 127C494 180 462 244 509 302C542 343 514 397 557 447C591 487 567 546 620 593C655 624 650 686 679 744H1152V127Z" fill="url(#mountain)"/>
  <path d="M438 127C494 180 462 244 509 302C542 343 514 397 557 447C591 487 567 546 620 593C655 624 650 686 679 744H1152V127Z" fill="url(#trees)"/>

  <path d="M72 472C236 463 361 449 486 435C659 415 819 397 1118 374" fill="none" stroke="#b88750" stroke-width="21"/>
  <path d="M72 472C236 463 361 449 486 435C659 415 819 397 1118 374" fill="none" stroke="#f6dfa8" stroke-width="7"/>
  <text x="757" y="365" transform="rotate(-5 757 365)" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#60492f">BURKITTSVILLE–CRAMPTON ROAD</text>

  <path d="M447 156C462 252 473 350 486 454C498 552 511 641 536 718" fill="none" stroke="#9a744e" stroke-width="14"/>
  <path d="M447 156C462 252 473 350 486 454C498 552 511 641 536 718" fill="none" stroke="#ecd3a8" stroke-width="5"/>
  <text x="421" y="306" transform="rotate(83 421 306)" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#60492f">MOUNTAIN CHURCH ROAD</text>

  <path d="M452 205C461 269 468 337 476 404M487 479C494 545 503 608 520 675" fill="none" stroke="#756c60" stroke-width="12" stroke-dasharray="5 7"/>
  <text x="297" y="192" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#544d44">STONE WALL</text>
  <text x="292" y="214" font-family="Arial, sans-serif" font-size="14" fill="#544d44">thin Confederate line</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(224 455)">
      <circle r="10" fill="#f4c35a" stroke="#2e2b28" stroke-width="3"/>
      <rect x="-69" y="24" width="138" height="40" rx="7" fill="#fffaf0" stroke="#877b65"/>
      <text x="0" y="50" text-anchor="middle" font-size="17" font-weight="700" fill="#2e2b28">Burkittsville</text>
    </g>
    <g transform="translate(898 390)">
      <circle r="11" fill="#f4c35a" stroke="#2e2b28" stroke-width="3"/>
      <rect x="-80" y="25" width="160" height="42" rx="7" fill="#fffaf0" stroke="#877b65"/>
      <text x="0" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#2e2b28">Crampton's Gap</text>
    </g>
  </g>

  <path d="M120 300C236 308 321 326 431 349" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M118 368C238 374 328 388 438 409" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M116 550C243 528 331 504 441 474" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <text x="83" y="257" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#244c73">Slocum's division</text>
  <text x="83" y="281" font-family="Arial, sans-serif" font-size="15" fill="#244c73">Bartlett · Newton · Torbert</text>
  <text x="91" y="588" font-family="Arial, sans-serif" font-size="15" fill="#244c73">united charge about 5:30 p.m.</text>

  <path d="M470 249C484 296 487 338 483 386" fill="none" stroke="#963b31" stroke-width="13" stroke-linecap="round"/>
  <path d="M489 487C493 534 500 574 510 613" fill="none" stroke="#963b31" stroke-width="13" stroke-linecap="round"/>
  <text x="518" y="259" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#762d28">Parham + Munford</text>
  <text x="518" y="283" font-family="Arial, sans-serif" font-size="14" fill="#762d28">about 800 infantry and cavalry</text>

  <path d="M509 339C611 361 706 376 825 389" fill="none" stroke="#963b31" stroke-width="8" stroke-dasharray="11 8" marker-end="url(#redArrow)"/>
  <text x="595" y="325" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#762d28">retreat to summit</text>

  <path d="M1051 600C923 570 811 526 678 478" fill="none" stroke="#963b31" stroke-width="10" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <text x="837" y="629" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#762d28">Cobb's brigade</text>
  <text x="802" y="653" font-family="Arial, sans-serif" font-size="14" fill="#762d28">arrives from Pleasant Valley</text>
  <text x="802" y="674" font-family="Arial, sans-serif" font-size="14" fill="#762d28">while the first line is breaking</text>

  <path d="M517 423C629 414 738 401 855 392" fill="none" stroke="#315f8c" stroke-width="12" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <text x="588" y="459" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#244c73">pursuit up the eastern slope</text>
  <text x="617" y="482" font-family="Arial, sans-serif" font-size="14" fill="#244c73">summit held about 6:45 p.m.</text>

  <g transform="translate(70 650)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="334" height="73" rx="9" fill="#fffaf0" stroke="#877b65" filter="url(#shadow)" opacity="0.97"/>
    <path d="M20 24H79" stroke="#315f8c" stroke-width="8" marker-end="url(#blueArrow)"/>
    <text x="96" y="30" font-size="14" fill="#2e2b28">United States movement</text>
    <path d="M20 53H79" stroke="#963b31" stroke-width="8" marker-end="url(#redArrow)"/>
    <text x="96" y="59" font-size="14" fill="#2e2b28">Confederate movement</text>
  </g>
  <g transform="translate(1091 156)" font-family="Arial, sans-serif">
    <path d="M0 58V0" stroke="#2e2b28" stroke-width="4"/>
    <path d="M0 0L-10 20H10Z" fill="#2e2b28"/>
    <text x="0" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#2e2b28">N</text>
  </g>
  <text x="1128" y="719" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#f4eedc">Schematic · not to scale</text>
</svg>
