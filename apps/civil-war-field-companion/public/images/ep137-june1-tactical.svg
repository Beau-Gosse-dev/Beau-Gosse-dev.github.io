<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Second-day fighting at Fair Oaks and Seven Pines, June 1, 1862</title>
  <desc id="desc">Schematic tactical map of Richardson's United States division along the railroad, the Confederate advances by Mahone, Armistead, and Pickett, Ward's flank attack, Hooker's advance on the Williamsburg Road, and the Confederate withdrawal.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4eedc"/><stop offset="1" stop-color="#dfd2b4"/></linearGradient>
    <pattern id="woods" width="46" height="46" patternUnits="userSpaceOnUse"><circle cx="12" cy="13" r="9" fill="#83966d" opacity=".48"/><circle cx="33" cy="29" r="12" fill="#708760" opacity=".42"/><path d="M12 21v14M33 39v6" stroke="#5f684e" stroke-width="2"/></pattern>
    <marker id="b" markerWidth="18" markerHeight="18" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0L12 6 0 12Z" fill="#285f91"/></marker>
    <marker id="r" markerWidth="18" markerHeight="18" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0L12 6 0 12Z" fill="#963d35"/></marker>
    <marker id="ret" markerWidth="18" markerHeight="18" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0L12 6 0 12Z" fill="#6e6254"/></marker>
    <style>
      .title{font:700 26px Georgia,serif;fill:#2d2922}.label{font:600 20px Georgia,serif;fill:#2d2922}.small{font:17px Arial,sans-serif;fill:#3c3831}.tiny{font:14px Arial,sans-serif;fill:#514b42}.rail{stroke:#262626;stroke-width:6;stroke-dasharray:18 10}.road{fill:none;stroke:#90744e;stroke-width:11;stroke-linecap:round}.blueLine{stroke:#285f91;stroke-width:13;stroke-linecap:round}.redLine{stroke:#963d35;stroke-width:13;stroke-linecap:round}.unitBlue{fill:#e6eef6;stroke:#285f91;stroke-width:3}.unitRed{fill:#f6e6e2;stroke:#963d35;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#ground)"/>
  <path d="M0 150H1200V560H0Z" fill="url(#woods)" opacity=".67"/>
  <path d="M0 300 C240 284 420 302 620 290 S970 270 1200 285" class="rail"/>
  <path d="M0 615 C250 600 430 620 645 600 S980 580 1200 592" class="road"/>
  <text x="25" y="54" class="title">FAIR OAKS / SEVEN PINES • JUNE 1, 1862</text>
  <text x="26" y="84" class="small">Schematic: brigade locations and frontages are approximate</text>
  <text x="788" y="258" class="small">Richmond &amp; York River Railroad</text>
  <text x="835" y="645" class="small">Williamsburg Road</text>
  <text x="1042" y="560" class="label">Seven Pines →</text>
  <text x="1035" y="314" class="label">Fair Oaks →</text>

  <line x1="175" y1="244" x2="480" y2="244" class="blueLine"/>
  <line x1="500" y1="244" x2="820" y2="244" class="blueLine"/>
  <line x1="840" y1="244" x2="1065" y2="244" class="blueLine"/>
  <rect x="185" y="165" rx="8" width="280" height="60" class="unitBlue"/>
  <text x="200" y="191" class="label" fill="#285f91">RICHARDSON • II CORPS</text>
  <text x="200" y="214" class="small">Meagher reserve / French front</text>
  <rect x="515" y="165" rx="8" width="290" height="60" class="unitBlue"/>
  <text x="530" y="191" class="label" fill="#285f91">HOWARD / BARLOW</text>
  <text x="530" y="214" class="small">61st and 64th New York</text>

  <path d="M305 530 C310 455 320 390 340 275" fill="none" stroke="#963d35" stroke-width="12" marker-end="url(#r)"/>
  <path d="M580 535 C580 455 585 385 625 276" fill="none" stroke="#963d35" stroke-width="12" marker-end="url(#r)"/>
  <path d="M825 540 C810 460 785 400 752 278" fill="none" stroke="#963d35" stroke-width="12" marker-end="url(#r)"/>
  <rect x="215" y="458" rx="8" width="190" height="58" class="unitRed"/><text x="233" y="484" class="label">MAHONE</text><text x="233" y="506" class="small">piecemeal attacks</text>
  <rect x="495" y="458" rx="8" width="190" height="58" class="unitRed"/><text x="513" y="484" class="label">ARMISTEAD</text><text x="513" y="506" class="small">right flank exposed</text>
  <rect x="755" y="458" rx="8" width="190" height="58" class="unitRed"/><text x="773" y="484" class="label">PICKETT</text><text x="773" y="506" class="small">advanced slowly</text>

  <path d="M980 375 C900 365 785 352 680 330" fill="none" stroke="#285f91" stroke-width="12" marker-end="url(#b)"/>
  <rect x="923" y="352" rx="8" width="215" height="72" class="unitBlue"/>
  <text x="940" y="380" class="label">WARD • III CORPS</text>
  <text x="940" y="404" class="small">railroad cut → flank</text>
  <path d="M1005 572 C855 565 710 572 535 586" fill="none" stroke="#285f91" stroke-width="12" marker-end="url(#b)"/>
  <text x="945" y="548" class="small" fill="#285f91">Hooker advances west</text>

  <rect x="190" y="630" rx="8" width="215" height="55" class="unitRed"/><text x="208" y="654" class="label">WILCOX / PRYOR</text><text x="208" y="676" class="small">road-blocking force</text>
  <path d="M620 340 C650 405 635 470 605 565" fill="none" stroke="#6e6254" stroke-width="7" stroke-dasharray="13 10" marker-end="url(#ret)"/>
  <path d="M350 340 C380 425 405 510 430 595" fill="none" stroke="#6e6254" stroke-width="7" stroke-dasharray="13 10" marker-end="url(#ret)"/>
  <text x="420" y="405" class="small">Confederate withdrawal ordered about 1 p.m.</text>

  <rect x="22" y="690" rx="8" width="720" height="48" fill="#fffaf0" stroke="#756b5c" stroke-width="2"/>
  <line x1="42" y1="714" x2="92" y2="714" class="blueLine" marker-end="url(#b)"/><text x="108" y="720" class="small">United States attack</text>
  <line x1="292" y1="714" x2="342" y2="714" class="redLine" marker-end="url(#r)"/><text x="358" y="720" class="small">Confederate attack</text>
  <line x1="548" y1="714" x2="600" y2="714" stroke="#6e6254" stroke-width="7" stroke-dasharray="13 9" marker-end="url(#ret)"/><text x="616" y="720" class="small">withdrawal</text>
  <path d="M1125 65v62" stroke="#2d2922" stroke-width="4"/><path d="M1125 49l-12 25h24Z" fill="#2d2922"/><text x="1117" y="42" class="label">N</text>
</svg>
