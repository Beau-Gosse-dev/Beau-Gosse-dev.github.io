<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Lee's morning plan meets Porter's actual position at Gaines's Mill</title>
  <desc id="desc">Schematic local map showing Powhite Creek, Boatswain's Swamp, New and Old Cold Harbor, Porter's line, Lee's expected line, and generalized Confederate approaches and contacts.</desc>
  <defs>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#9a3d32"/></marker>
    <pattern id="marsh" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M3 18C3 10 8 9 8 3M10 18C10 12 15 11 15 6" fill="none" stroke="#477b70" stroke-width="2" opacity=".65"/></pattern>
    <style>
      .label{font:600 20px Georgia,serif;fill:#20282a}.small{font:16px Arial,sans-serif;fill:#293437}.tiny{font:14px Arial,sans-serif;fill:#3d474a}.river{fill:none;stroke:#65a1c2;stroke-width:24;stroke-linecap:round}.creek{fill:none;stroke:#6e9fb2;stroke-width:12;stroke-linecap:round}.road{fill:none;stroke:#a89879;stroke-width:5;stroke-dasharray:10 8}.actual{fill:none;stroke:#315f8c;stroke-width:12;stroke-linecap:round}.expected{fill:none;stroke:#315f8c;stroke-width:7;stroke-dasharray:15 11;opacity:.6}.move{fill:none;stroke:#9a3d32;stroke-width:9;marker-end:url(#redArrow)}.contact{fill:#f6d66b;stroke:#6e5620;stroke-width:3}.note{fill:#fffdf7;stroke:#827966;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f3eedf"/>
  <path d="M-20 632C210 590 430 663 610 624S950 574 1220 615" class="river"/>
  <text x="820" y="670" class="label" fill="#3e7899">Chickahominy River</text>
  <path d="M340-20C300 118 370 240 330 365S360 530 338 620" class="creek"/>
  <text x="248" y="391" class="small" fill="#3e7899" transform="rotate(-82 248 391)">Powhite Creek</text>
  <path d="M680-20C622 100 698 202 648 302S688 458 628 612" class="creek"/>
  <path d="M608 0H750L715 612H570Z" fill="url(#marsh)"/>
  <text x="585" y="365" class="small" fill="#356b63" transform="rotate(-82 585 365)">Boatswain's Swamp</text>
  <path d="M65 255L350 286L620 318L1015 230" class="road"/>
  <path d="M350 286L342 474L520 596" class="road"/>
  <path d="M620 318L790 176L1045 88" class="road"/>
  <circle cx="350" cy="286" r="8" fill="#292d2e"/><text x="370" y="280" class="small">Gaines's Mill area</text>
  <circle cx="620" cy="318" r="8" fill="#292d2e"/><text x="640" y="310" class="small">New Cold Harbor</text>
  <circle cx="1045" cy="88" r="8" fill="#292d2e"/><text x="955" y="116" class="small">Old Cold Harbor</text>
  <path d="M280 112C335 182 351 250 340 332" class="expected"/>
  <text x="62" y="76" class="small" fill="#315f8c">Line Lee expected at Powhite Creek</text>
  <text x="62" y="99" class="tiny">Porter did not occupy this line</text>
  <path d="M720 142C847 105 985 140 1022 242C1044 305 983 376 904 400C825 424 790 476 775 540" class="actual"/>
  <text x="772" y="118" class="label" fill="#315f8c">Porter's actual arc</text>
  <text x="899" y="171" class="small" fill="#315f8c">Sykes faces north</text>
  <text x="890" y="418" class="small" fill="#315f8c">Morell faces west</text>
  <path d="M520 58C690 31 826 39 953 62" class="move"/>
  <text x="522" y="27" class="small" fill="#9a3d32">Jackson and D. H. Hill toward Old Cold Harbor</text>
  <path d="M58 430C215 398 395 405 585 389" class="move"/>
  <text x="65" y="465" class="small" fill="#9a3d32">A. P. Hill presses east; Longstreet approaches farther south</text>
  <circle cx="892" cy="145" r="15" class="contact"/><text x="744" y="185" class="tiny">D. H. Hill meets Sykes</text><text x="782" y="204" class="tiny">and falls back</text>
  <circle cx="680" cy="340" r="15" class="contact"/><text x="703" y="340" class="tiny">Gregg finds the actual line</text>
  <rect x="44" y="520" width="490" height="118" rx="12" class="note"/>
  <text x="64" y="552" class="label">Why the plan failed</text>
  <text x="64" y="581" class="small">The expected Powhite Creek defense was empty. Two separate</text>
  <text x="64" y="606" class="small">contacts revealed Porter behind another stream, facing both</text>
  <text x="64" y="631" class="small">west and north. Lee had to revise the attack during the march.</text>
  <g transform="translate(1125 35)"><path d="M0 48V4" stroke="#293437" stroke-width="4"/><path d="M0 0L-8 16H8Z" fill="#293437"/><text x="-8" y="70" class="tiny">N</text></g>
  <text x="636" y="706" class="tiny">Schematic; not to scale. Roads, watercourses, positions, and movements are generalized.</text>
</svg>
