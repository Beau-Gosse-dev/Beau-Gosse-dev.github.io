<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Shiloh at mid-morning, about 9 to 10 a.m. on April 6, 1862</title>
  <desc id="desc">Simplified map showing Sherman and Raith near Shiloh Church facing seven Confederate brigades, Wallace, Prentiss, and Hurlbut forming a new United States center, and Stuart's detached brigade on the far left.</desc>
  <defs>
    <marker id="usa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315f8c"/></marker>
    <marker id="csa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9a3d32"/></marker>
  </defs>
  <rect width="1200" height="820" fill="#f3eedf"/>
  <path d="M1060 0C1015 145 1085 275 1035 425S1080 675 1015 820H1200V0Z" fill="#b6cfcd"/>
  <text x="1120" y="410" fill="#385f64" font-family="Georgia,serif" font-size="27" text-anchor="middle" transform="rotate(88 1120 410)">TENNESSEE RIVER</text>
  <path d="M510 770L520 118" stroke="#665746" stroke-width="8"/>
  <text x="540" y="350" fill="#514438" font-family="Arial,sans-serif" font-size="17" transform="rotate(-89 540 350)">Corinth Road</text>
  <path d="M840 780L790 100" stroke="#756551" stroke-width="7"/>
  <text x="820" y="360" fill="#514438" font-family="Arial,sans-serif" font-size="16" transform="rotate(-85 820 360)">Hamburg–Savannah Road</text>

  <rect x="345" y="442" width="190" height="78" rx="8" fill="#d8b88a"/>
  <text x="440" y="475" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="22" font-weight="700">SHILOH CHURCH</text>
  <text x="440" y="501" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="16">Sherman’s camps</text>
  <rect x="635" y="300" width="210" height="92" rx="8" fill="#d8b88a"/>
  <text x="740" y="336" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="22" font-weight="700">BELL FIELD</text>
  <text x="740" y="362" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="16">peach orchard + cotton field</text>

  <path d="M300 420L520 405" stroke="#315f8c" stroke-width="18"/>
  <text x="405" y="391" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="20" font-weight="700">SHERMAN</text>
  <path d="M500 500L585 485" stroke="#315f8c" stroke-width="18"/>
  <text x="550" y="529" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="18" font-weight="700">RAITH</text>
  <path d="M505 210L810 238" stroke="#315f8c" stroke-width="17"/>
  <text x="650" y="200" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="19" font-weight="700">W. H. L. WALLACE · PRENTISS · HURLBUT</text>
  <text x="650" y="264" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="15">new line along the farm lane, about 9–9:30 a.m.</text>
  <path d="M885 225L970 215" stroke="#315f8c" stroke-width="18"/>
  <text x="925" y="193" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="18" font-weight="700">STUART</text>
  <path d="M814 236L880 225" stroke="#315f8c" stroke-width="4" stroke-dasharray="10 9"/>
  <text x="850" y="280" text-anchor="middle" fill="#4c5c69" font-family="Arial,sans-serif" font-size="15">200-yard gap</text>

  <path d="M285 700C305 620 330 520 365 438" fill="none" stroke="#9a3d32" stroke-width="12" marker-end="url(#csa)"/>
  <path d="M390 710C400 625 420 525 430 442" fill="none" stroke="#9a3d32" stroke-width="12" marker-end="url(#csa)"/>
  <path d="M500 710C510 620 520 550 525 505" fill="none" stroke="#9a3d32" stroke-width="12" marker-end="url(#csa)"/>
  <path d="M605 700C585 610 570 535 565 500" fill="none" stroke="#9a3d32" stroke-width="12" marker-end="url(#csa)"/>
  <text x="440" y="760" text-anchor="middle" fill="#7c3029" font-family="Arial,sans-serif" font-size="19" font-weight="700">SEVEN CONFEDERATE BRIGADES CONVERGE</text>
  <text x="440" y="786" text-anchor="middle" fill="#7c3029" font-family="Arial,sans-serif" font-size="15">Cleburne · Anderson · Bushrod Johnson · Russell · Wood and others</text>

  <path d="M850 545C900 460 920 350 925 240" fill="none" stroke="#9a3d32" stroke-width="12" marker-end="url(#csa)"/>
  <path d="M950 560C970 460 970 345 950 240" fill="none" stroke="#9a3d32" stroke-width="12" marker-end="url(#csa)"/>
  <text x="920" y="590" text-anchor="middle" fill="#7c3029" font-family="Arial,sans-serif" font-size="18" font-weight="700">CHALMERS + JACKSON</text>
  <text x="920" y="615" text-anchor="middle" fill="#7c3029" font-family="Arial,sans-serif" font-size="15">diverted toward Stuart</text>
  <path d="M665 540C690 455 710 385 730 245" fill="none" stroke="#9a3d32" stroke-width="8" marker-end="url(#csa)"/>
  <text x="670" y="570" fill="#7c3029" font-family="Arial,sans-serif" font-size="17" font-weight="700">ADAMS</text>
  <text x="670" y="592" fill="#7c3029" font-family="Arial,sans-serif" font-size="14">only brigade facing center during lull</text>

  <text x="40" y="52" fill="#263332" font-family="Georgia,serif" font-size="31" font-weight="700">Shiloh · the line reforms and the right is pressed</text>
  <text x="40" y="86" fill="#4b5856" font-family="Arial,sans-serif" font-size="18">April 6, 1862 · about 9–10 a.m. · simplified orientation · not to scale</text>
  <rect x="45" y="690" width="20" height="20" fill="#315f8c"/><text x="77" y="707" fill="#263332" font-family="Arial,sans-serif" font-size="16">United States</text>
  <rect x="45" y="724" width="20" height="20" fill="#9a3d32"/><text x="77" y="741" fill="#263332" font-family="Arial,sans-serif" font-size="16">Confederacy</text>
  <path d="M1120 80V135" stroke="#263332" stroke-width="5" marker-end="url(#usa)"/>
  <text x="1120" y="62" text-anchor="middle" fill="#263332" font-family="Arial,sans-serif" font-size="20" font-weight="700">N</text>
</svg>
