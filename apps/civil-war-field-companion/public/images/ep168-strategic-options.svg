<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Strategic choices after the Seven Days, July to August 1862</title>
  <desc id="desc">Generalized schematic map showing McClellan at Harrison's Landing, Pope in northern Virginia, Washington, Richmond, Petersburg, Fort Monroe, and Aquia Creek, with possible and ordered movements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f0dc"/><stop offset="1" stop-color="#e4d1a7"/></linearGradient>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#24558a"/></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9e3d32"/></marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6c665d"/></marker>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <path d="M50 625 C240 570 395 620 520 680 C650 742 780 675 885 650 C1005 620 1090 653 1200 700 L1200 760H50Z" fill="#93bbcf" stroke="#477385" stroke-width="4"/>
  <path d="M950 80 C900 190 900 335 950 465 C980 540 1025 615 1100 680" fill="none" stroke="#a5c9dc" stroke-width="42" opacity=".9"/>
  <path d="M260 290 C395 215 560 245 678 336" fill="none" stroke="#9e3d32" stroke-width="8" stroke-dasharray="14 10" marker-end="url(#redArrow)"/>
  <path d="M720 540 C692 469 668 406 657 356" fill="none" stroke="#6c665d" stroke-width="8" stroke-dasharray="8 10" marker-end="url(#grayArrow)"/>
  <path d="M710 537 C647 515 574 481 519 461" fill="none" stroke="#6c665d" stroke-width="8" stroke-dasharray="8 10" marker-end="url(#grayArrow)"/>
  <path d="M727 548 C796 601 869 630 978 653" fill="none" stroke="#24558a" stroke-width="9" marker-end="url(#blueArrow)"/>
  <path d="M994 637 C976 530 956 406 955 295" fill="none" stroke="#24558a" stroke-width="9" marker-end="url(#blueArrow)"/>
  <path d="M943 286 C923 299 902 312 879 323" fill="none" stroke="#24558a" stroke-width="8" stroke-dasharray="9 8" marker-end="url(#blueArrow)"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#252821">
    <text x="50" y="60" font-size="36" font-weight="700">Strategic choices after the Seven Days</text>
    <text x="52" y="94" font-size="21">July–August 1862</text>
    <g font-size="22" font-weight="700" style="paint-order:stroke;stroke:#f5ead0;stroke-width:6;stroke-linejoin:round">
      <circle cx="261" cy="289" r="15" fill="#9e3d32" stroke="#fff" stroke-width="4"/><text x="282" y="280">Lee</text><text x="282" y="307" font-size="17" font-weight="400">Richmond defenses</text>
      <circle cx="654" cy="348" r="15" fill="#202b38" stroke="#fff" stroke-width="4"/><text x="677" y="344">Richmond</text>
      <circle cx="720" cy="540" r="17" fill="#24558a" stroke="#fff" stroke-width="4"/><text x="604" y="581">McClellan</text><text x="604" y="608" font-size="17" font-weight="400">Harrison's Landing</text>
      <circle cx="955" cy="278" r="17" fill="#24558a" stroke="#fff" stroke-width="4"/><text x="979" y="270">Aquia Creek</text><text x="979" y="297" font-size="17" font-weight="400">ordered transfer point</text>
      <circle cx="995" cy="130" r="17" fill="#24558a" stroke="#fff" stroke-width="4"/><text x="1020" y="123">Washington</text><text x="1020" y="149" font-size="17" font-weight="400">Lincoln and Halleck</text>
      <circle cx="865" cy="331" r="17" fill="#24558a" stroke="#fff" stroke-width="4"/><text x="787" y="299">Pope</text><text x="787" y="322" font-size="17" font-weight="400">Army of Virginia</text>
      <circle cx="506" cy="456" r="15" fill="#6c665d" stroke="#fff" stroke-width="4"/><text x="315" y="449">Petersburg</text><text x="315" y="476" font-size="17" font-weight="400">alternate proposal</text>
      <circle cx="994" cy="655" r="15" fill="#24558a" stroke="#fff" stroke-width="4"/><text x="1018" y="649">Fort Monroe</text><text x="1018" y="676" font-size="17" font-weight="400">embarkation route</text>
    </g>
    <text x="475" y="222" font-size="18" fill="#8b2f28">Lee shifts attention toward Pope</text>
    <text x="52" y="696" font-size="18" font-weight="700">GENERALIZED SCHEMATIC — NOT TO SCALE</text>
    <text x="52" y="724" font-size="16">Locations, waterways, routes, army positions, and distances are approximate.</text>
  </g>
  <g transform="translate(52 132)" font-family="Arial, sans-serif" font-size="16">
    <rect width="360" height="94" rx="10" fill="#fff" opacity=".76" stroke="#b7a77f"/>
    <path d="M20 25h52" stroke="#24558a" stroke-width="10" marker-end="url(#blueArrow)"/><text x="87" y="31">Halleck's ordered movement</text>
    <path d="M20 65h52" stroke="#6c665d" stroke-width="9" stroke-dasharray="7 7" marker-end="url(#grayArrow)"/><text x="87" y="71">McClellan's proposed operation</text>
  </g>
</svg>
