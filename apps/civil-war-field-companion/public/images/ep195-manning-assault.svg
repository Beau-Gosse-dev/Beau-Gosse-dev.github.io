  <rect x="486" y="461" width="156" height="31" rx="6" fill="#fffaf0" opacity=".95"/><text x="564" y="483" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#342f2b">DUNKER CHURCH</text>

