  <rect x="946" y="154" width="153" height="36" rx="7" fill="#fffaf0" opacity=".92"/><text x="1022" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#384535">EAST WOODS</text>

