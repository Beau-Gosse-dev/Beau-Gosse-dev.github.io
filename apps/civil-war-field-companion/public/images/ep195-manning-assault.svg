    <g transform="translate(263 385)"><rect x="-72" y="-21" width="144" height="42" rx="8" fill="#963b31"/><text x="0" y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">30th VIRGINIA</text></g>
    <g transform="translate(274 597)"><rect x="-72" y="-21" width="144" height="42" rx="8" fill="#963b31"/><text x="0" y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">48th N.C.</text></g>
