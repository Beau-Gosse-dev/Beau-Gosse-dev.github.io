<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Manning's assault and Greene's counteradvance at the Dunker Church</title>
  <desc id="desc">Schematic tactical map with north at top. Manning's three Confederate regiments charge east from the West Woods across the Hagerstown Turnpike. Greene's two Federal brigades and Tompkins's battery stop the charge, then advance west past the Dunker Church into the West Woods.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf4e6"/><stop offset="1" stop-color="#e7dcc6"/></linearGradient>
    <pattern id="trees" width="38" height="34" patternUnits="userSpaceOnUse"><circle cx="9" cy="18" r="9" fill="#40513b" opacity=".59"/><circle cx="25" cy="9" r="7" fill="#68775b" opacity=".55"/><circle cx="31" cy="28" r="6" fill="#304631" opacity=".49"/></pattern>
    <marker id="blueArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16"><path d="M0 0L16 8L0 16Z" fill="#315f8c"/></marker>
    <marker id="redArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16"><path d="M0 0L16 8L0 16Z" fill="#963b31"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="850" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="794" rx="18" fill="none" stroke="#97896f" stroke-width="2"/>
  <text x="60" y="76" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#2f2b27">MANNING’S ASSAULT AT THE DUNKER CHURCH</text>
  <text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#5c5549">Federal fire stops the charge; Greene then advances west · about 10:00 a.m.</text>
  <rect x="48" y="130" width="1104" height="646" fill="#e9e6d2"/>

