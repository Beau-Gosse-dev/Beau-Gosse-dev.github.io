  <rect x="128" y="657" width="302" height="58" rx="9" fill="#f7e8d4" stroke="#963b31" stroke-width="2"/><text x="279" y="681" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7c342d">1 · MANNING’S ATTACK</text><text x="279" y="702" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#7c342d">checked about 70 yards from Greene</text>

  <path d="M737 626C660 644 582 648 500 627C425 608 359 570 298 516" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" stroke-dasharray="17 11" marker-end="url(#blueArrow)"/>
  <path d="M732 683C650 706 553 707 460 675" fill="none" stroke="#315f8c" stroke-width="9" stroke-linecap="round" stroke-dasharray="17 11" marker-end="url(#blueArrow)"/>
  <rect x="682" y="666" width="225" height="66" rx="9" fill="#e5edf5" stroke="#315f8c" stroke-width="2"/><text x="794" y="691" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244d76">2 · GREENE ADVANCES</text><text x="794" y="712" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#244d76">past the church into the woods</text>

