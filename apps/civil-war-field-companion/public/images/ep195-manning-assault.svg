  <path d="M645 130C650 270 653 405 650 535C647 630 650 706 656 776" fill="none" stroke="#f1d7a6" stroke-width="7"/>
  <g transform="translate(684 375) rotate(-89)"><rect x="-96" y="-15" width="192" height="30" rx="6" fill="#fffaf0" opacity=".95"/><text x="0" y="5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#6b4d31">HAGERSTOWN TURNPIKE</text></g>
  <path d="M610 342L690 342M610 514L690 514" stroke="#705c43" stroke-width="4" stroke-dasharray="11 7"/>
  <text x="707" y="346" font-family="Arial,sans-serif" font-size="12" fill="#665747">post-and-rail fences</text>

