<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Sumner's relief route to Fair Oaks on May 31, 1862</title>
  <desc id="desc">Schematic operational map showing Richmond, the Chickahominy River, the Grapevine Bridge, Fair Oaks Station, Seven Pines, the Adams House, the main roads, and Sumner's route from the north bank to Couch and Sedgwick at Fair Oaks.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1df"/>
      <stop offset="1" stop-color="#e8dcc0"/>
    </linearGradient>
    <pattern id="marsh" width="26" height="22" patternUnits="userSpaceOnUse">
      <path d="M2 18 C7 12 11 12 16 18 M11 21 C15 15 20 15 24 20" fill="none" stroke="#7d9a75" stroke-width="1.5" opacity=".55"/>
    </pattern>
    <marker id="blueArrow" markerWidth="18" markerHeight="18" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12">
      <path d="M0 0 L12 6 L0 12 Z" fill="#285f91"/>
    </marker>
    <marker id="redArrow" markerWidth="18" markerHeight="18" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12">
      <path d="M0 0 L12 6 L0 12 Z" fill="#963d35"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".25"/>
    </filter>
    <style>
      .road{fill:none;stroke:#8a714d;stroke-width:8;stroke-linecap:round}.rail{fill:none;stroke:#333;stroke-width:5;stroke-dasharray:16 10}.river{fill:none;stroke:#5c93b6;stroke-width:28;stroke-linecap:round}.label{font:600 22px Georgia,serif;fill:#2d2922}.small{font:17px Arial,sans-serif;fill:#38342d}.tiny{font:14px Arial,sans-serif;fill:#4a463f}.blue{fill:#285f91}.red{fill:#963d35}.box{fill:#fffaf0;stroke:#776c5b;stroke-width:2}.unit-blue{fill:#e5eef7;stroke:#285f91;stroke-width:3}.unit-red{fill:#f7e6e2;stroke:#963d35;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#paper)"/>
  <path d="M0 245 C145 210 245 280 390 245 S660 195 790 232 S1015 285 1200 236 L1200 335 C1020 368 920 320 782 290 S520 270 390 310 S130 275 0 310 Z" fill="url(#marsh)" opacity=".8"/>
  <path class="river" d="M-30 275 C115 235 260 310 390 272 S650 222 790 260 S1010 310 1230 260"/>
  <text x="425" y="245" class="label blue">CHICKAHOMINY RIVER</text>
  <text x="26" y="104" class="label">RICHMOND APPROACHES • MAY 31, 1862</text>
  <text x="27" y="133" class="small">Schematic: locations, routes, and distances are approximate</text>

  <path class="road" d="M70 610 C290 575 470 545 662 514 S950 495 1165 470"/>
  <path class="road" d="M102 675 C330 650 540 635 760 615 S1010 590 1185 575"/>
  <path class="rail" d="M155 535 C400 510 660 492 900 470 S1080 450 1200 438"/>
  <path class="road" d="M380 145 C455 225 535 355 650 500"/>
  <text x="900" y="447" class="small" transform="rotate(-5 900 447)">Richmond &amp; York River Railroad</text>
  <text x="805" y="543" class="small" transform="rotate(-7 805 543)">Nine Mile Road</text>
  <text x="830" y="643" class="small" transform="rotate(-5 830 643)">Williamsburg Road</text>

  <line x1="505" y1="263" x2="525" y2="305" stroke="#644f38" stroke-width="12"/>
  <line x1="523" y1="255" x2="542" y2="298" stroke="#d1b179" stroke-width="5"/>
  <text x="465" y="338" class="small">Grapevine Bridge</text>

  <circle cx="378" cy="166" r="8" fill="#332f29"/>
  <text x="392" y="164" class="label">Gaines Mill area</text>
  <text x="392" y="190" class="small">McClellan's headquarters</text>

  <circle cx="646" cy="496" r="9" fill="#332f29"/>
  <text x="535" y="455" class="label">Fair Oaks Station</text>
  <text x="535" y="480" class="small">railroad / Nine Mile Road</text>
  <circle cx="771" cy="609" r="9" fill="#332f29"/>
  <text x="790" y="600" class="label">Seven Pines</text>
  <text x="790" y="625" class="small">crossroads</text>
  <rect x="744" y="419" width="20" height="17" fill="#6f5a3d"/>
  <text x="770" y="412" class="label">Adams House</text>

  <rect x="52" y="145" rx="10" width="270" height="72" class="unit-blue" filter="url(#shadow)"/>
  <text x="68" y="174" class="label blue">SUMNER • II CORPS</text>
  <text x="68" y="200" class="small">Sedgwick and Richardson</text>
  <path d="M278 220 C375 240 430 245 475 278 C518 310 544 350 580 393 C615 432 672 448 735 437" fill="none" stroke="#285f91" stroke-width="13" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <text x="355" y="360" class="small blue" transform="rotate(48 355 360)">crossing after 2:30 p.m.</text>

  <rect x="885" y="340" rx="10" width="280" height="68" class="unit-blue" filter="url(#shadow)"/>
  <text x="901" y="369" class="label blue">COUCH</text>
  <text x="901" y="394" class="small">four regiments + 6 guns</text>
  <line x1="734" y1="440" x2="734" y2="523" stroke="#285f91" stroke-width="10"/>
  <line x1="734" y1="440" x2="875" y2="440" stroke="#285f91" stroke-width="10"/>
  <text x="845" y="492" class="small blue">Sedgwick reinforces</text>
  <text x="845" y="516" class="small blue">shortly after 5 p.m.</text>

  <rect x="370" y="526" rx="10" width="183" height="70" class="unit-red" filter="url(#shadow)"/>
  <text x="386" y="555" class="label red">WHITING</text>
  <text x="386" y="580" class="small">Johnston with division</text>
  <path d="M550 548 C615 530 664 500 709 458" fill="none" stroke="#963d35" stroke-width="12" marker-end="url(#redArrow)"/>

  <rect x="22" y="666" rx="8" width="420" height="68" class="box"/>
  <line x1="40" y1="690" x2="104" y2="690" stroke="#285f91" stroke-width="10" marker-end="url(#blueArrow)"/>
  <text x="120" y="696" class="small">United States relief route</text>
  <line x1="40" y1="716" x2="104" y2="716" stroke="#963d35" stroke-width="10" marker-end="url(#redArrow)"/>
  <text x="120" y="722" class="small">Confederate movement / attack</text>

  <path d="M1120 90 L1120 150" stroke="#2d2922" stroke-width="4"/>
  <path d="M1120 74 L1108 98 L1132 98 Z" fill="#2d2922"/>
  <text x="1112" y="68" class="label">N</text>
</svg>
