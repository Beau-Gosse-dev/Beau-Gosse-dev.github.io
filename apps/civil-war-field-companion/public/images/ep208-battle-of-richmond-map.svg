<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Three stages of the Battle of Richmond, Kentucky</title>
  <desc id="desc">Schematic north-up map showing United States positions south of Richmond, Confederate attacks north along the Old State Road, and Scott's cavalry circling east to block the Lexington road.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f1df"/>
      <stop offset="1" stop-color="#e8dcc1"/>
    </linearGradient>
    <pattern id="fields" width="42" height="42" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 0V42" stroke="#d5c7a9" stroke-width="3" opacity="0.35"/>
    </pattern>
    <marker id="redArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L16 8L0 16Z" fill="#963b31"/>
    </marker>
    <marker id="blueArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L16 8L0 16Z" fill="#315f8c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#493d2b" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#paper)"/>
  <rect width="1200" height="760" fill="url(#fields)"/>

  <text x="60" y="62" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#27241e">Battle of Richmond, Kentucky</text>
  <text x="61" y="94" font-family="Arial, sans-serif" font-size="18" fill="#5e5547">August 30, 1862 · schematic, north up, not to scale</text>

  <g transform="translate(1080 52)">
    <path d="M0 46V0" stroke="#27241e" stroke-width="4" marker-end="url(#blueArrow)"/>
    <text x="-7" y="67" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#27241e">N</text>
  </g>

  <path d="M565 724C548 651 558 592 575 535C592 478 575 421 590 362C607 297 594 235 610 168C616 142 620 122 622 106" fill="none" stroke="#aa946e" stroke-width="30" stroke-linecap="round" opacity="0.55"/>
  <path d="M565 724C548 651 558 592 575 535C592 478 575 421 590 362C607 297 594 235 610 168C616 142 620 122 622 106" fill="none" stroke="#fffaf0" stroke-width="9" stroke-linecap="round"/>
  <path d="M565 724C548 651 558 592 575 535C592 478 575 421 590 362C607 297 594 235 610 168C616 142 620 122 622 106" fill="none" stroke="#564b3a" stroke-width="2" stroke-dasharray="9 8" opacity="0.7"/>
  <text x="638" y="503" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#564b3a">Old State Road</text>

  <path d="M596 357C494 348 399 357 310 384" fill="none" stroke="#8eb0c5" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M596 357C494 348 399 357 310 384" fill="none" stroke="#527f98" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="329" y="343" font-family="Arial, sans-serif" font-size="15" fill="#426b81">Hayes Fork / creek bottom</text>

  <g filter="url(#shadow)">
    <rect x="484" y="117" width="278" height="63" rx="12" fill="#fdf9ee" stroke="#75634b" stroke-width="2"/>
    <text x="510" y="145" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#27241e">RICHMOND</text>
    <text x="510" y="168" font-family="Arial, sans-serif" font-size="15" fill="#5e5547">Lexington road continues north</text>
  </g>
  <circle cx="609" cy="206" r="9" fill="#75634b"/>
  <text x="635" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#453d32">Richmond Cemetery</text>

  <circle cx="586" cy="415" r="8" fill="#75634b"/>
  <text x="315" y="420" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#453d32">Rogersville / former bivouac</text>
  <text x="315" y="442" font-family="Arial, sans-serif" font-size="14" fill="#5e5547">approximate second position</text>

  <circle cx="559" cy="591" r="8" fill="#75634b"/>
  <text x="589" y="579" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#453d32">White’s Farm</text>
  <text x="589" y="602" font-family="Arial, sans-serif" font-size="15" fill="#5e5547">Mount Zion Church nearby</text>

  <circle cx="558" cy="690" r="8" fill="#75634b"/>
  <text x="590" y="696" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#453d32">Kingston and Big Hill to the south</text>

  <g filter="url(#shadow)">
    <rect x="165" y="548" width="307" height="82" rx="12" fill="#eef4f8" stroke="#315f8c" stroke-width="3"/>
    <circle cx="198" cy="573" r="17" fill="#315f8c"/>
    <text x="192" y="580" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="227" y="576" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#244b70">Manson’s first line</text>
    <text x="187" y="605" font-family="Arial, sans-serif" font-size="15" fill="#31495d">Mount Zion · morning flank attacks</text>
  </g>
  <path d="M476 584C510 582 531 582 550 587" fill="none" stroke="#315f8c" stroke-width="4"/>

  <g filter="url(#shadow)">
    <rect x="735" y="378" width="348" height="82" rx="12" fill="#eef4f8" stroke="#315f8c" stroke-width="3"/>
    <circle cx="769" cy="403" r="17" fill="#315f8c"/>
    <text x="763" y="410" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="798" y="406" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#244b70">Second defensive line</text>
    <text x="757" y="435" font-family="Arial, sans-serif" font-size="15" fill="#31495d">Canister, counterattack, then collapse</text>
  </g>
  <path d="M731 420C676 417 632 416 596 416" fill="none" stroke="#315f8c" stroke-width="4"/>

  <g filter="url(#shadow)">
    <rect x="124" y="184" width="349" height="82" rx="12" fill="#eef4f8" stroke="#315f8c" stroke-width="3"/>
    <circle cx="158" cy="209" r="17" fill="#315f8c"/>
    <text x="152" y="216" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="187" y="212" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#244b70">Final line at Richmond</text>
    <text x="146" y="241" font-family="Arial, sans-serif" font-size="15" fill="#31495d">Nelson arrives · line breaks again</text>
  </g>
  <path d="M477 224C527 218 567 212 599 207" fill="none" stroke="#315f8c" stroke-width="4"/>

  <path d="M534 671C508 631 507 611 535 592" fill="none" stroke="#963b31" stroke-width="8" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <path d="M548 543C526 507 537 457 563 430" fill="none" stroke="#963b31" stroke-width="8" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <path d="M568 375C548 324 565 266 596 228" fill="none" stroke="#963b31" stroke-width="8" stroke-linecap="round" marker-end="url(#redArrow)"/>

  <path d="M628 571C697 543 777 522 864 475C960 424 1008 326 952 242C900 165 776 143 700 143" fill="none" stroke="#963b31" stroke-width="6" stroke-dasharray="13 9" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <rect x="850" y="264" width="255" height="68" rx="10" fill="#fff6ed" stroke="#963b31" stroke-width="2"/>
  <text x="873" y="291" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7e3029">Scott’s cavalry</text>
  <text x="873" y="314" font-family="Arial, sans-serif" font-size="14" fill="#6f453e">wide sweep to Lexington road</text>

  <path d="M608 562C616 520 604 472 592 440" fill="none" stroke="#315f8c" stroke-width="5" stroke-dasharray="7 7" marker-end="url(#blueArrow)"/>
  <path d="M603 396C620 347 621 291 614 230" fill="none" stroke="#315f8c" stroke-width="5" stroke-dasharray="7 7" marker-end="url(#blueArrow)"/>

  <g transform="translate(58 679)">
    <rect x="0" y="0" width="440" height="57" rx="9" fill="#fdf9ee" stroke="#b5a586"/>
    <path d="M20 20H74" stroke="#963b31" stroke-width="7" marker-end="url(#redArrow)"/>
    <text x="88" y="25" font-family="Arial, sans-serif" font-size="14" fill="#453d32">Confederate attack</text>
    <path d="M220 20H274" stroke="#315f8c" stroke-width="5" stroke-dasharray="7 7" marker-end="url(#blueArrow)"/>
    <text x="288" y="25" font-family="Arial, sans-serif" font-size="14" fill="#453d32">U.S. retreat</text>
    <text x="20" y="45" font-family="Arial, sans-serif" font-size="12" fill="#6c6255">Positions and movement are diagrammatic.</text>
  </g>
</svg>
