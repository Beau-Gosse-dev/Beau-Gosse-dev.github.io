<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Evening fight around the East Woods on September 16, 1862</title>
  <desc id="desc">Schematic action map with north at top. The Bucktails advance southwest along both sides of Smoketown Road toward Fourth Texas skirmishers at a fence line, Colonel Hugh McNeil is killed while leading the final rush, Seymour's brigade reinforces the Bucktails, Fifth Texas and Eighteenth Georgia counter through the East Woods, and United States artillery enfilades Confederates near the Cornfield.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e3"/>
      <stop offset="1" stop-color="#e7dbc2"/>
    </linearGradient>
    <pattern id="trees" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="17" r="8" fill="#506044" opacity="0.5"/>
      <circle cx="22" cy="10" r="7" fill="#687256" opacity="0.45"/>
      <circle cx="28" cy="25" r="6" fill="#44543f" opacity="0.42"/>
    </pattern>
    <pattern id="furrows" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 8H28M0 21H28" stroke="#9f865f" stroke-width="2" opacity="0.34"/>
    </pattern>
    <pattern id="corn" width="18" height="24" patternUnits="userSpaceOnUse">
      <path d="M9 23V5M9 10L3 6M9 14L15 9" stroke="#9f7f30" stroke-width="2" fill="none" opacity="0.56"/>
    </pattern>
    <marker id="blueArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#97896f" stroke-width="2"/>
  <text x="60" y="77" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2f2b27">THE EVENING FIGHT AT THE EAST WOODS</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#5c5548">The first infantry clash at Antietam, about 6 p.m. until darkness</text>
  <rect x="48" y="128" width="1104" height="613" fill="#e9e6cf"/>

  <path d="M704 128C680 239 688 350 702 456C711 530 702 627 696 741" fill="none" stroke="#ad7e4f" stroke-width="17"/>
  <path d="M704 128C680 239 688 350 702 456C711 530 702 627 696 741" fill="none" stroke="#f1d8a8" stroke-width="6"/>
  <rect x="716" y="169" width="164" height="33" rx="7" fill="#fffaf0" opacity="0.9"/>
  <text x="798" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#6c5133">SMOKETOWN ROAD</text>

  <path d="M583 282C686 245 835 262 921 335L935 615C851 681 680 680 578 618C610 526 616 375 583 282Z" fill="#657256" opacity="0.94"/>
  <path d="M583 282C686 245 835 262 921 335L935 615C851 681 680 680 578 618C610 526 616 375 583 282Z" fill="url(#trees)"/>
  <rect x="746" y="540" width="140" height="38" rx="7" fill="#fffaf0" opacity="0.9"/>
  <text x="816" y="566" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#3f4d39">EAST WOODS</text>

  <path d="M80 356L541 311L574 679L80 695Z" fill="#d6c36f" opacity="0.69" stroke="#a58d3d" stroke-width="2"/>
  <path d="M80 356L541 311L574 679L80 695Z" fill="url(#corn)"/>
  <rect x="151" y="546" width="190" height="39" rx="7" fill="#fffaf0" opacity="0.9"/>
  <text x="246" y="573" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#6a5525">MILLER'S CORNFIELD</text>

  <path d="M763 134L1118 129L1130 700L953 704C926 588 934 444 921 335C879 284 821 257 763 258Z" fill="#d9c6a2" opacity="0.68"/>
  <path d="M763 134L1118 129L1130 700L953 704C926 588 934 444 921 335C879 284 821 257 763 258Z" fill="url(#furrows)"/>
  <path d="M915 331L959 347L942 373L978 392L958 419L991 439L970 466L1002 487L981 515L1010 535L990 564L1020 586" fill="none" stroke="#7b5b3c" stroke-width="7" stroke-linecap="round"/>
  <text x="1017" y="358" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5f482f">skirmish fence</text>
  <text x="1017" y="376" font-family="Arial, sans-serif" font-size="12" fill="#5f482f">location generalized</text>

  <path d="M1100 220C1049 247 1017 283 990 328" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <rect x="875" y="153" width="222" height="58" rx="8" fill="#f8f1df" stroke="#8197ad"/>
  <text x="986" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#244c73">Bucktails skirmishers</text>
  <text x="986" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#244c73">four companies lead</text>

  <path d="M1091 591C1054 555 1025 521 999 486" fill="none" stroke="#315f8c" stroke-width="12" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <rect x="918" y="615" width="209" height="57" rx="8" fill="#f8f1df" stroke="#8197ad"/>
  <text x="1023" y="638" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#244c73">six companies close up</text>
  <text x="1023" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#244c73">then advance by rushes</text>

  <path d="M990 475C956 468 927 454 904 433" fill="none" stroke="#315f8c" stroke-width="13" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <g transform="translate(919 450)" font-family="Arial, sans-serif">
    <circle r="11" fill="#2f2b27" stroke="#fffaf0" stroke-width="3"/>
    <path d="M-7 -7L7 7M7 -7L-7 7" stroke="#fffaf0" stroke-width="3"/>
    <rect x="-249" y="-35" width="220" height="57" rx="8" fill="#fffaf0" stroke="#8d806a" filter="url(#shadow)"/>
    <text x="-139" y="-13" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2b27">Col. Hugh W. McNeil killed</text>
    <text x="-139" y="9" text-anchor="middle" font-size="13" fill="#5c5548">during the rush on the fence</text>
  </g>

  <rect x="784" y="674" width="332" height="43" rx="8" fill="#f8f1df" stroke="#8197ad"/>
  <circle cx="807" cy="695" r="8" fill="#315f8c"/>
  <text x="827" y="701" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#244c73">Seymour's brigade reinforces and holds</text>

  <path d="M522 395C597 370 675 358 756 362C822 365 877 382 929 414" fill="none" stroke="#963b31" stroke-width="11" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <rect x="485" y="344" width="201" height="55" rx="8" fill="#f8f1df" stroke="#b98b84"/>
  <text x="586" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7a3029">about 100 men</text>
  <text x="586" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a3029">from 4th Texas</text>

  <path d="M430 653C509 632 590 608 659 573" fill="none" stroke="#963b31" stroke-width="11" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <rect x="286" y="614" width="195" height="57" rx="8" fill="#f8f1df" stroke="#b98b84"/>
  <text x="384" y="637" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7a3029">5th Texas</text>
  <text x="384" y="659" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a3029">counters through woods</text>

  <path d="M327 479C411 477 490 486 569 510" fill="none" stroke="#963b31" stroke-width="9" stroke-dasharray="14 9" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <rect x="162" y="439" width="191" height="56" rx="8" fill="#f8f1df" stroke="#b98b84"/>
  <text x="258" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7a3029">18th Georgia</text>
  <text x="258" y="483" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a3029">supports the counter</text>

  <g transform="translate(594 688)" font-family="Arial, sans-serif">
    <path d="M0 0L36 -10L39 4L3 14Z" fill="#315f8c" stroke="#1f425f" stroke-width="2"/>
    <circle cx="8" cy="15" r="8" fill="#2f2b27"/>
    <circle cx="33" cy="8" r="8" fill="#2f2b27"/>
    <text x="-14" y="37" text-anchor="end" font-size="15" font-weight="700" fill="#244c73">Ransom's battery at woods' edge</text>
  </g>
  <path d="M619 676C558 625 491 579 421 548" fill="none" stroke="#315f8c" stroke-width="7" stroke-dasharray="11 8" marker-end="url(#blueArrow)"/>
  <text x="459" y="600" transform="rotate(30 459 600)" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#244c73">enfilading fire</text>

  <g transform="translate(70 151)" font-family="Arial, sans-serif">
    <rect width="333" height="134" rx="10" fill="#fffaf0" stroke="#8d806a" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#2f2b27">Sequence</text>
    <circle cx="25" cy="52" r="8" fill="#315f8c"/><text x="45" y="58" font-size="14" fill="#2f2b27">Federal advance and reinforcement</text>
    <circle cx="25" cy="82" r="8" fill="#963b31"/><text x="45" y="88" font-size="14" fill="#2f2b27">Confederate screen and counter</text>
    <text x="20" y="116" font-size="13" fill="#5c5548">Darkness ends the action; picket fire continues.</text>
  </g>

  <g transform="translate(1130 158)" font-family="Arial, sans-serif">
    <path d="M0 60V0" stroke="#2f2b27" stroke-width="4"/>
    <path d="M0 0L-10 20H10Z" fill="#2f2b27"/>
    <text x="0" y="87" text-anchor="middle" font-size="17" font-weight="700" fill="#2f2b27">N</text>
  </g>
  <text x="1128" y="736" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#5c5548">Positions and routes generalized · not to scale</text>
</svg>
