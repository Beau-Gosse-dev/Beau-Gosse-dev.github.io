<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Malvern Hill regional context and withdrawal to Harrison's Landing</title>
  <desc id="desc">Schematic map locating the Richmond and James River area within the eastern United States and showing the Army of the Potomac's movement from Glendale through Malvern Hill to Harrison's Landing.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f0df"/>
      <stop offset="1" stop-color="#e8dcc4"/>
    </linearGradient>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#9a3d32"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#594b3a" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#paper)"/>
  <rect x="28" y="26" width="1144" height="708" rx="18" fill="#fffaf0" stroke="#6d604d" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="78" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2f2a23">Malvern Hill in the Seven Days campaign</text>
  <text x="70" y="110" font-family="Arial, sans-serif" font-size="17" fill="#5e5548">Richmond–James River region, June 30–July 4, 1862</text>

  <g transform="translate(70 150)">
    <rect width="760" height="510" rx="12" fill="#eef0e7" stroke="#857660"/>
    <path d="M-5 423 C125 381 213 440 320 410 S517 355 772 378 L772 520 L-5 520Z" fill="#b9d2d9"/>
    <path d="M-5 423 C125 381 213 440 320 410 S517 355 772 378" fill="none" stroke="#4e8295" stroke-width="9"/>
    <text x="455" y="438" font-family="Georgia, serif" font-size="19" font-style="italic" fill="#315f74">James River</text>

    <path d="M122 80 C190 135 232 183 292 242 C352 300 409 332 485 369" fill="none" stroke="#8c806e" stroke-width="5" stroke-dasharray="9 8"/>
    <text x="42" y="181" font-family="Arial, sans-serif" font-size="14" fill="#5b5042">movement away from the Richmond front</text>
    <path d="M290 241 C354 275 387 303 421 326" fill="none" stroke="#315f8c" stroke-width="7" marker-end="url(#blueArrow)"/>
    <path d="M421 326 C493 350 557 366 641 374" fill="none" stroke="#315f8c" stroke-width="7" marker-end="url(#blueArrow)"/>
    <path d="M235 136 C277 183 323 217 365 256" fill="none" stroke="#9a3d32" stroke-width="6" marker-end="url(#redArrow)"/>

    <g fill="#2f2a23" font-family="Arial, sans-serif">
      <circle cx="100" cy="65" r="7" fill="#28231d"/>
      <text x="114" y="71" font-size="20" font-weight="700">Richmond</text>
      <text x="114" y="94" font-size="14" fill="#655a4a">Confederate capital</text>

      <circle cx="284" cy="238" r="7" fill="#28231d"/>
      <text x="197" y="268" font-size="18" font-weight="700">Glendale</text>
      <text x="197" y="290" font-size="14" fill="#655a4a">June 30</text>

      <circle cx="420" cy="326" r="10" fill="#fff" stroke="#315f8c" stroke-width="5"/>
      <text x="448" y="304" font-size="22" font-weight="700">Malvern Hill</text>
      <text x="448" y="327" font-size="14" fill="#655a4a">Union victory, July 1</text>

      <circle cx="646" cy="375" r="10" fill="#fff" stroke="#315f8c" stroke-width="5"/>
      <text x="548" y="410" font-size="21" font-weight="700">Harrison's Landing</text>
      <text x="548" y="432" font-size="14" fill="#655a4a">fortified James River base</text>

      <text x="296" y="337" font-size="15" fill="#315f8c">Army of the Potomac</text>
      <text x="296" y="357" font-size="14" fill="#315f8c">night withdrawal, July 1–2</text>
      <text x="285" y="89" font-size="15" fill="#9a3d32">Confederate pursuit</text>
      <text x="285" y="108" font-size="14" fill="#9a3d32">halted by weather and the river position</text>
    </g>

    <g transform="translate(24 462)" font-family="Arial, sans-serif" font-size="14">
      <line x1="0" y1="0" x2="46" y2="0" stroke="#315f8c" stroke-width="6" marker-end="url(#blueArrow)"/>
      <text x="58" y="5" fill="#443c31">United States movement</text>
      <line x1="250" y1="0" x2="296" y2="0" stroke="#9a3d32" stroke-width="6" marker-end="url(#redArrow)"/>
      <text x="308" y="5" fill="#443c31">Confederate advance</text>
    </g>
  </g>

  <g transform="translate(865 150)">
    <rect width="260" height="350" rx="12" fill="#e9e4d7" stroke="#857660"/>
    <text x="18" y="31" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#3d352b">Eastern United States</text>
    <path d="M84 50 L130 59 L157 79 L175 107 L172 133 L193 160 L181 194 L196 226 L178 281 L145 320 L128 291 L116 252 L94 222 L79 180 L65 146 L71 111 L58 84Z" fill="#d6ccb7" stroke="#6f634f" stroke-width="2"/>
    <path d="M93 142 L158 135 L178 160 L166 186 L110 190 L80 169Z" fill="#c7b899" stroke="#6f634f"/>
    <circle cx="128" cy="166" r="7" fill="#9a3d32" stroke="#fff" stroke-width="2"/>
    <text x="139" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#40372c">Virginia</text>
    <text x="18" y="319" font-family="Arial, sans-serif" font-size="13" fill="#625747">The battlefield was southeast of Richmond,</text>
    <text x="18" y="337" font-family="Arial, sans-serif" font-size="13" fill="#625747">between the capital and the James River.</text>
  </g>

  <g transform="translate(865 530)" font-family="Arial, sans-serif">
    <rect width="260" height="130" rx="10" fill="#f3ead8" stroke="#9a8768"/>
    <text x="18" y="30" font-size="15" font-weight="700" fill="#473e32">Map note</text>
    <text x="18" y="56" font-size="14" fill="#5d5244">Locations, routes, and distances are</text>
    <text x="18" y="77" font-size="14" fill="#5d5244">generalized for orientation.</text>
    <text x="18" y="105" font-size="15" font-weight="700" fill="#7d372f">SCHEMATIC — NOT TO SCALE</text>
  </g>
</svg>
