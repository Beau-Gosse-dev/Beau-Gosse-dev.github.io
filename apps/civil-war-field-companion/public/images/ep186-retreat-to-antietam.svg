    <g transform="translate(305 415)"><circle r="10" fill="#f4c35a" stroke="#2e2b28" stroke-width="3"/><rect x="-57" y="20" width="114" height="38" rx="7" fill="#fffaf0" stroke="#877b65"/><text x="0" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#2e2b28">Sharpsburg</text></g>
    <g transform="translate(907 455)"><circle r="10" fill="#f4c35a" stroke="#2e2b28" stroke-width="3"/><rect x="-77" y="20" width="154" height="38" rx="7" fill="#fffaf0" stroke="#877b65"/><text x="0" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#2e2b28">Crampton's Gap</text></g>
    <g transform="translate(739 659)"><circle r="10" fill="#f4c35a" stroke="#2e2b28" stroke-width="3"/><rect x="20" y="-56" width="130" height="38" rx="7" fill="#fffaf0" stroke="#877b65"/><text x="85" y="-31" text-anchor="middle" font-size="16" font-weight="700" fill="#2e2b28">Harpers Ferry</text></g>
  </g>

