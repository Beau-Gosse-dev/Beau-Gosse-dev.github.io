  <text x="60" y="76" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2e2b28">FROM SOUTH MOUNTAIN TO ANTIETAM CREEK</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#5d5548">Night of September 14–15 and morning of September 15, 1862</text>

  <rect x="48" y="127" width="1104" height="617" fill="#e6dfb8"/>
  <path d="M889 127C857 201 881 260 850 330C823 389 847 451 819 515C790 579 814 657 776 744H1152V127Z" fill="#718064"/>
