<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">From South Mountain to Antietam Creek, September 14 to 15, 1862</title>
  <desc id="desc">Schematic operational map with north at top. Confederate forces under Hill and Longstreet withdraw west from Turner's and Fox's Gaps through Boonsboro, halt near Keedysville, and form behind Antietam Creek near Sharpsburg. McLaws remains south in Pleasant Valley after the Union seizure of Crampton's Gap. Harpers Ferry surrenders, opening the route for McLaws and Jackson to join Lee.</desc>
