  <path d="M105 686C279 684 401 701 550 711C706 721 864 706 1105 680" fill="none" stroke="#6b9aab" stroke-width="26"/>
  <path d="M105 686C279 684 401 701 550 711C706 721 864 706 1105 680" fill="none" stroke="#bfe1e9" stroke-width="10"/>
  <text x="156" y="669" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#376878">Potomac River</text>

