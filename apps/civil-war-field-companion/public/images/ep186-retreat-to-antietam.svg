  <path d="M304 414C273 502 249 575 239 665" fill="none" stroke="#f6dfa8" stroke-width="5"/>
  <text x="196" y="555" transform="rotate(-76 196 555)" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#60492f">SHEPHERDSTOWN ROAD</text>

