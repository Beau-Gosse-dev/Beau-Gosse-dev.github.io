  <rect x="568" y="180" width="288" height="66" rx="9" fill="#fff4e9" stroke="#963b31" filter="url(#shadow2)"/>
  <text x="712" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#762d28">Hill + Longstreet withdraw</text>
  <text x="712" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#762d28">10 p.m.–4 a.m. through Boonsboro</text>

