    <linearGradient id="paper2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f1df"/>
      <stop offset="1" stop-color="#e8dcc2"/>
    </linearGradient>
    <pattern id="ridge2" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="16" r="7" fill="#3f583f" opacity="0.32"/>
      <circle cx="20" cy="9" r="7" fill="#64765b" opacity="0.35"/>
      <circle cx="29" cy="24" r="6" fill="#354d37" opacity="0.28"/>
    </pattern>
    <marker id="blueArrow2" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow2" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#963b31"/>
    </marker>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#paper2)"/>
