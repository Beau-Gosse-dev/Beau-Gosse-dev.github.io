  <rect x="428" y="461" width="246" height="72" rx="9" fill="#fff4e9" stroke="#963b31" filter="url(#shadow2)"/>
  <text x="551" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#762d28">Lee selects high ground</text>
  <text x="551" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#762d28">west of Antietam Creek</text>

  <path d="M842 500C787 517 738 531 681 541" fill="none" stroke="#963b31" stroke-width="12" stroke-linecap="round"/>
  <rect x="848" y="538" width="276" height="69" rx="9" fill="#fff4e9" stroke="#963b31" filter="url(#shadow2)"/>
  <text x="986" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#762d28">McLaws holds Pleasant Valley</text>
  <text x="986" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#762d28">boxed in until Harpers Ferry falls</text>

  <path d="M806 646C720 612 626 571 523 516" fill="none" stroke="#963b31" stroke-width="9" stroke-dasharray="11 8" marker-end="url(#redArrow2)"/>
  <rect x="407" y="597" width="293" height="70" rx="9" fill="#fff4e9" stroke="#963b31" filter="url(#shadow2)"/>
  <text x="553" y="623" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#762d28">Jackson + McLaws can rejoin Lee</text>
  <text x="553" y="647" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#762d28">after the September 15 surrender</text>

  <path d="M1092 340C1002 353 943 370 890 402" fill="none" stroke="#315f8c" stroke-width="10" marker-end="url(#blueArrow2)"/>
  <text x="1110" y="375" text-anchor="end" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#dceaf2">VI Corps holds gap</text>
  <path d="M1080 168C1010 162 950 163 890 172" fill="none" stroke="#315f8c" stroke-width="10" marker-end="url(#blueArrow2)"/>
  <text x="1079" y="153" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#dceaf2">Federal pursuit</text>

