<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Lew Wallace's march to Shiloh on April 6, 1862</title>
  <desc id="desc">Schematic route map shows Crump's Landing, Stoney Lonesome, the Shunpike toward Sherman's former position, the crossroad used after turning back, the River Road through Snake Creek bottomland, and Pittsburg Landing.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315f8c"/></marker><marker id="wrong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9a3d32"/></marker></defs>
  <rect width="1200" height="820" fill="#f3eedf"/><path d="M1010 0C955 130 1055 260 990 405S1050 675 970 820" fill="none" stroke="#6da3aa" stroke-width="100"/><text x="1080" y="410" fill="#385f64" font-family="Georgia,serif" font-size="26" text-anchor="middle" transform="rotate(88 1080 410)">TENNESSEE RIVER</text>
  <path d="M900 150C780 250 735 400 820 675" fill="none" stroke="#766653" stroke-width="11"/><text x="810" y="400" fill="#514438" font-family="Arial,sans-serif" font-size="18" transform="rotate(70 810 400)">River Road</text>
  <path d="M660 205C620 340 575 480 460 690" fill="none" stroke="#766653" stroke-width="10"/><text x="560" y="470" fill="#514438" font-family="Arial,sans-serif" font-size="18" transform="rotate(-64 560 470)">Shunpike</text>
  <path d="M540 480C650 500 735 530 785 570" fill="none" stroke="#9b8b70" stroke-width="8" stroke-dasharray="12 8"/><text x="680" y="500" text-anchor="middle" fill="#6b5d4b" font-family="Arial,sans-serif" font-size="16">rough crossroad</text>
  <path d="M740 600Q800 555 865 600T980 600" fill="none" stroke="#6e8a64" stroke-width="20"/><text x="845" y="635" text-anchor="middle" fill="#4e684a" font-family="Arial,sans-serif" font-size="16">Snake Creek bottomland</text>
  <circle cx="910" cy="145" r="13" fill="#315f8c"/><text x="875" y="125" text-anchor="end" fill="#234b73" font-family="Arial,sans-serif" font-size="22" font-weight="700">CRUMP'S LANDING</text><text x="875" y="151" text-anchor="end" fill="#234b73" font-family="Arial,sans-serif" font-size="15">Grant and Wallace meet about 8:30 a.m.</text>
  <circle cx="655" cy="205" r="14" fill="#315f8c"/><text x="615" y="185" text-anchor="end" fill="#234b73" font-family="Arial,sans-serif" font-size="22" font-weight="700">STONEY LONESOME</text><text x="615" y="211" text-anchor="end" fill="#234b73" font-family="Arial,sans-serif" font-size="15">3rd Division assembled about 6 a.m.</text>
  <circle cx="965" cy="710" r="14" fill="#315f8c"/><text x="925" y="700" text-anchor="end" fill="#234b73" font-family="Arial,sans-serif" font-size="22" font-weight="700">PITTSBURG LANDING</text><text x="925" y="726" text-anchor="end" fill="#234b73" font-family="Arial,sans-serif" font-size="15">division arrives after dark</text>
  <rect x="320" y="680" width="270" height="70" rx="8" fill="#d8b88a"/><text x="455" y="709" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="20" font-weight="700">SHERMAN'S FORMER RIGHT</text><text x="455" y="735" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="14">position already abandoned</text>
  <path d="M895 160C825 190 750 205 672 205" fill="none" stroke="#315f8c" stroke-width="8" stroke-dasharray="12 8" marker-end="url(#arrow)"/><text x="785" y="185" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="15">Wallace returns to his division</text>
  <path d="M648 225C615 320 575 430 535 505C505 560 475 620 455 676" fill="none" stroke="#9a3d32" stroke-width="13" marker-end="url(#wrong)"/><text x="430" y="440" fill="#7c3029" font-family="Arial,sans-serif" font-size="17" font-weight="700">NOON: MARCH SOUTH ON SHUNPIKE</text>
  <path d="M500 580C545 545 575 525 605 515" fill="none" stroke="#315f8c" stroke-width="9" stroke-dasharray="13 8" marker-end="url(#arrow)"/><text x="380" y="560" fill="#234b73" font-family="Arial,sans-serif" font-size="16">after 2 p.m.: countermarch</text>
  <path d="M605 515C670 525 735 545 790 575" fill="none" stroke="#315f8c" stroke-width="10" marker-end="url(#arrow)"/><path d="M800 585C845 620 900 660 955 700" fill="none" stroke="#315f8c" stroke-width="10" marker-end="url(#arrow)"/><text x="830" y="555" fill="#234b73" font-family="Arial,sans-serif" font-size="16" font-weight="700">cross to River Road, then south</text>
  <text x="40" y="52" fill="#263332" font-family="Georgia,serif" font-size="32" font-weight="700">Lew Wallace's delayed march</text><text x="40" y="88" fill="#4b5856" font-family="Arial,sans-serif" font-size="18">April 6, 1862 · schematic route · at least 16 miles in 7–8 hours · not to scale</text>
  <path d="M1120 75V130" stroke="#263332" stroke-width="5" marker-end="url(#arrow)"/><text x="1120" y="57" text-anchor="middle" fill="#263332" font-family="Arial,sans-serif" font-size="20" font-weight="700">N</text>
</svg>
