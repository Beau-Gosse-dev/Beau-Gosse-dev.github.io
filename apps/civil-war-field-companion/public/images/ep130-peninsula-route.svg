<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Army of the Potomac route to the Virginia Peninsula, March and April 1862</title>
  <desc id="desc">Schematic map showing the water movement from Alexandria through Chesapeake Bay to Fort Monroe, then the planned advance northwest between the James and York Rivers through Yorktown, Williamsburg, and West Point toward Richmond.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1df"/>
      <stop offset="1" stop-color="#e8dcc1"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aac9d3"/>
      <stop offset="1" stop-color="#749eaf"/>
    </linearGradient>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 0L18 9L0 18Z" fill="#315f8c"/>
    </marker>
    <marker id="grayArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 0L18 9L0 18Z" fill="#6c655b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3e392f" flood-opacity=".22"/>
    </filter>
    <style>
      .label{font-family:Georgia,'Times New Roman',serif;fill:#29271f}.small{font:15px system-ui,sans-serif;fill:#4b4942}.town{font:700 18px system-ui,sans-serif;fill:#29271f}.water-label{font:italic 18px Georgia,serif;fill:#2f6175}.note{font:600 16px system-ui,sans-serif;fill:#315f8c}.date{font:14px system-ui,sans-serif;fill:#685f52}.dot{fill:#fff;stroke:#29271f;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#paper)"/>
  <path d="M0 0H1200V760H0Z" fill="none" stroke="#6c655b" stroke-width="12" opacity=".12"/>
  <text x="62" y="65" class="label" font-size="33" font-weight="700">From Alexandria to the Peninsula</text>
  <text x="64" y="94" class="small">Operational schematic · March 17–April 5, 1862 · not to scale</text>

  <!-- Chesapeake and lower Potomac -->
  <path d="M160 112C250 172 307 226 350 299C389 367 425 401 492 445C529 469 575 486 620 509L537 627C444 572 357 527 287 459C218 391 188 295 104 218Z" fill="url(#water)" stroke="#507f90" stroke-width="3"/>
  <path d="M537 627C558 652 574 691 571 742H1138V630C1030 625 930 609 845 578C758 547 688 521 620 509Z" fill="url(#water)" stroke="#507f90" stroke-width="3"/>
  <text x="298" y="395" class="water-label" transform="rotate(46 298 395)">Chesapeake Bay</text>
  <text x="179" y="211" class="water-label" transform="rotate(33 179 211)">Potomac River</text>

  <!-- Virginia Peninsula and rivers -->
  <path d="M547 602C645 520 734 438 835 335C889 280 927 222 970 146L1160 151C1106 235 1059 303 1008 359C911 466 828 548 720 630Z" fill="#d1c59f" stroke="#736a55" stroke-width="3" filter="url(#shadow)"/>
  <path d="M559 623C676 568 768 514 865 426C947 351 1022 257 1089 158" fill="none" stroke="#5d8fa1" stroke-width="22" stroke-linecap="round"/>
  <path d="M611 585C708 512 805 429 891 337C939 286 981 226 1019 155" fill="none" stroke="#9fc1cb" stroke-width="13" stroke-linecap="round"/>
  <text x="854" y="405" class="water-label" transform="rotate(-43 854 405)">York River</text>
  <text x="764" y="586" class="water-label" transform="rotate(-28 764 586)">James River</text>

  <!-- Route -->
  <path d="M149 141C256 220 316 293 353 365C390 438 457 492 548 548" fill="none" stroke="#315f8c" stroke-width="9" stroke-linecap="round" stroke-dasharray="4 17" marker-end="url(#blueArrow)"/>
  <path d="M584 563C663 516 715 477 770 430C816 391 862 340 905 291" fill="none" stroke="#315f8c" stroke-width="9" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M936 263C1000 225 1051 198 1102 180" fill="none" stroke="#315f8c" stroke-width="9" stroke-linecap="round" marker-end="url(#blueArrow)"/>

  <!-- Places -->
  <circle cx="143" cy="135" r="8" class="dot"/><text x="167" y="136" class="town">Alexandria</text><text x="168" y="158" class="date">Embarkation begins March 17</text>
  <circle cx="572" cy="573" r="8" class="dot"/><text x="489" y="702" class="town">Fort Monroe</text><text x="454" y="724" class="date">Army base and landing point</text>
  <circle cx="748" cy="449" r="8" class="dot"/><text x="660" y="431" class="town">Yorktown</text><text x="620" y="454" class="date">Advance halted April 5</text>
  <circle cx="829" cy="370" r="8" class="dot"/><text x="700" y="349" class="town">Williamsburg</text>
  <circle cx="914" cy="283" r="8" class="dot"/><text x="928" y="305" class="town">West Point</text><text x="928" y="328" class="date">Planned supply base</text>
  <circle cx="1111" cy="175" r="8" class="dot"/><text x="1020" y="130" class="town">Richmond</text><text x="994" y="151" class="date">Campaign objective</text>

  <!-- James River restriction -->
  <path d="M629 611L694 570" stroke="#9a3d32" stroke-width="7" stroke-linecap="round"/>
  <path d="M643 568L684 614" stroke="#9a3d32" stroke-width="7" stroke-linecap="round"/>
  <rect x="716" y="629" width="408" height="73" rx="9" fill="#f7f1df" stroke="#9a3d32" stroke-width="2"/>
  <text x="736" y="658" class="small" font-weight="700" fill="#77332d">James River unavailable at the outset</text>
  <text x="736" y="683" class="small">CSS Virginia remained an operational threat in Hampton Roads.</text>

  <!-- key -->
  <rect x="55" y="543" width="310" height="102" rx="10" fill="#fffaf0" stroke="#8e826d"/>
  <path d="M78 574H147" stroke="#315f8c" stroke-width="8" stroke-dasharray="4 13" marker-end="url(#blueArrow)"/>
  <text x="166" y="580" class="small">Water transport</text>
  <path d="M78 614H147" stroke="#315f8c" stroke-width="8" marker-end="url(#blueArrow)"/>
  <text x="166" y="620" class="small">Planned land advance</text>
</svg>
