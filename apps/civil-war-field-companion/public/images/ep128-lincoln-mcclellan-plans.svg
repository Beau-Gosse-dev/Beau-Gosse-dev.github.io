<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Lincoln and McClellan campaign plans, winter 1861–1862</title>
  <desc id="desc">Schematic map comparing Lincoln's proposed overland advance from Washington toward the railroad southwest of Manassas with McClellan's proposed water movement down the Potomac and Chesapeake, up the Rappahannock to Urbanna, and overland toward Richmond.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efd9"/>
      <stop offset="1" stop-color="#e7d6ae"/>
    </linearGradient>
    <marker id="blueArrow" markerWidth="38" markerHeight="38" refX="35" refY="19" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L38,19 L0,38 Z" fill="#235d85"/>
    </marker>
    <marker id="goldArrow" markerWidth="38" markerHeight="38" refX="35" refY="19" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L38,19 L0,38 Z" fill="#a56418"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2d2619" flood-opacity="0.25"/>
    </filter>
    <style>
      .title { font: 700 43px Georgia, serif; fill: #2d2b26; }
      .subtitle { font: 22px Georgia, serif; fill: #514b3f; }
      .place { font: 700 23px Arial, sans-serif; fill: #2d2b26; paint-order: stroke; stroke: #f3e8cb; stroke-width: 6px; stroke-linejoin: round; }
      .small { font: 19px Arial, sans-serif; fill: #4f493d; }
      .water-label { font: italic 22px Georgia, serif; fill: #356f88; letter-spacing: 2px; }
      .legend { font: 700 21px Arial, sans-serif; fill: #2d2b26; }
      .note { font: 18px Arial, sans-serif; fill: #413c33; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#paper)"/>
  <path d="M1030 90 C1120 135 1120 235 1185 286 C1260 345 1245 450 1298 522 C1358 605 1328 738 1390 875 L1600 875 L1600 90 Z" fill="#9dc2cf" opacity="0.92"/>
  <path d="M1022 86 C1116 139 1110 233 1181 291 C1247 345 1235 449 1290 527 C1345 606 1318 742 1382 882" fill="none" stroke="#436e78" stroke-width="4"/>
  <path d="M545 125 C625 190 725 205 813 224 C922 247 1025 230 1105 282" fill="none" stroke="#8ab5c6" stroke-width="50" stroke-linecap="round"/>
  <path d="M545 125 C625 190 725 205 813 224 C922 247 1025 230 1105 282" fill="none" stroke="#436e78" stroke-width="3"/>
  <path d="M1145 410 C1070 425 975 447 900 493 C858 518 831 543 800 572" fill="none" stroke="#8ab5c6" stroke-width="36" stroke-linecap="round"/>
  <path d="M1145 410 C1070 425 975 447 900 493 C858 518 831 543 800 572" fill="none" stroke="#436e78" stroke-width="3"/>
  <path d="M1345 855 C1230 845 1110 824 1015 810" fill="none" stroke="#8ab5c6" stroke-width="44" stroke-linecap="round"/>

  <path d="M274 342 C355 425 423 518 492 614 C527 664 564 727 604 793" fill="none" stroke="#8b4a44" stroke-width="8" stroke-dasharray="17 13" opacity="0.75"/>
  <path d="M245 360 C340 410 420 488 492 614" fill="none" stroke="#574d3d" stroke-width="5" opacity="0.7"/>
  <path d="M492 614 L604 793" fill="none" stroke="#574d3d" stroke-width="5" opacity="0.7"/>
  <path d="M795 587 L604 793" fill="none" stroke="#574d3d" stroke-width="5" opacity="0.7"/>

  <path d="M650 210 C505 250 360 306 245 360 C210 386 189 412 167 443" fill="none" stroke="#a56418" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#goldArrow)" filter="url(#shadow)"/>
  <path d="M650 210 C770 210 870 220 968 244 C1108 276 1183 342 1142 410 C1097 484 924 515 804 570 C730 607 685 680 610 787" fill="none" stroke="#235d85" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)" filter="url(#shadow)"/>

  <g fill="#2d2b26" stroke="#f3e8cb" stroke-width="5" paint-order="stroke">
    <circle cx="650" cy="210" r="12"/>
    <circle cx="274" cy="342" r="10"/>
    <circle cx="245" cy="360" r="12"/>
    <circle cx="167" cy="443" r="12"/>
    <circle cx="800" cy="572" r="12"/>
    <circle cx="690" cy="680" r="10"/>
    <circle cx="604" cy="793" r="12"/>
    <circle cx="1280" cy="815" r="10"/>
  </g>

  <text x="670" y="198" class="place">WASHINGTON</text>
  <text x="288" y="325" class="place">CENTREVILLE</text>
  <text x="110" y="480" class="place">MANASSAS</text>
  <text x="820" y="562" class="place">URBANNA</text>
  <text x="706" y="710" class="place">WEST POINT</text>
  <text x="514" y="832" class="place">RICHMOND</text>
  <text x="1190" y="850" class="place">FORT MONROE</text>

  <text x="725" y="208" class="water-label" transform="rotate(12 725 208)">POTOMAC RIVER</text>
  <text x="1245" y="445" class="water-label" transform="rotate(74 1245 445)">CHESAPEAKE BAY</text>
  <text x="923" y="480" class="water-label" transform="rotate(-18 923 480)">RAPPAHANNOCK</text>

  <rect x="70" y="55" width="980" height="118" rx="14" fill="#f8f1df" stroke="#8e7c5c" stroke-width="2" opacity="0.96"/>
  <text x="102" y="105" class="title">Two plans for the Army of the Potomac</text>
  <text x="103" y="142" class="subtitle">The strategic dispute described in Lincoln's February 3, 1862 letter</text>

  <rect x="1025" y="55" width="510" height="268" rx="16" fill="#f8f1df" stroke="#8e7c5c" stroke-width="2" opacity="0.96"/>
  <line x1="1060" y1="112" x2="1150" y2="112" stroke="#a56418" stroke-width="13" marker-end="url(#goldArrow)"/>
  <text x="1175" y="104" class="legend">Lincoln: overland</text>
  <text x="1175" y="132" class="note">to the railroad southwest of Manassas</text>
  <line x1="1060" y1="188" x2="1150" y2="188" stroke="#235d85" stroke-width="13" marker-end="url(#blueArrow)"/>
  <text x="1175" y="180" class="legend">McClellan: by water</text>
  <text x="1175" y="208" class="note">to Urbanna, then toward Richmond</text>
  <line x1="1060" y1="266" x2="1150" y2="266" stroke="#8b4a44" stroke-width="8" stroke-dasharray="17 13"/>
  <text x="1175" y="258" class="legend">Confederate line</text>
  <text x="1175" y="286" class="note">and withdrawal axis (schematic)</text>

  <text x="1140" y="360" class="small">MARYLAND</text>
  <text x="1070" y="700" class="small">VIRGINIA</text>
  <text x="1070" y="932" class="note">Schematic—not to scale</text>
</svg>
