    <g transform="translate(536 205)">
      <rect x="-80" y="-25" width="160" height="50" rx="9" fill="#315f8c"/>
      <text x="0" y="-2" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1 · DURYEA</text>
      <text x="0" y="17" text-anchor="middle" font-size="12" fill="#e4eef7">about 6 a.m.</text>
    </g>
    <g transform="translate(710 207)">
      <rect x="-75" y="-25" width="150" height="50" rx="9" fill="#315f8c"/>
      <text x="0" y="-2" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2 · COULTER</text>
      <text x="0" y="17" text-anchor="middle" font-size="12" fill="#e4eef7">delayed support</text>
    </g>
    <g transform="translate(873 231)">
      <rect x="-72" y="-25" width="144" height="50" rx="9" fill="#315f8c"/>
      <text x="0" y="-2" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3 · LYLE</text>
      <text x="0" y="17" text-anchor="middle" font-size="12" fill="#e4eef7">about 7 a.m.</text>
    </g>

