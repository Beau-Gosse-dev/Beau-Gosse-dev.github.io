<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Where United States emancipation policy changed, 1861–1862</title>
  <desc id="desc">A schematic map of the eastern United States. It marks Missouri, the loyal slave states, Washington, Fort Monroe, and the Department of the South. Arrows connect Washington to the field orders that Lincoln modified or revoked.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e4"/>
      <stop offset="1" stop-color="#e4d6b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
    <marker id="blueArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14">
      <path d="M0 0L14 7L0 14Z" fill="#315f8c"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#97896f" stroke-width="2"/>
  <text x="60" y="76" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#2f2b27">WHERE FIELD POLICY CHANGED</text>
  <text x="60" y="107" font-family="Arial, sans-serif" font-size="18" fill="#5c5549">May 1861–May 1862 · locations and jurisdictions generalized</text>

  <path d="M160 181L275 157L359 184L439 180L514 222L600 218L654 187L718 204L761 244L817 255L861 298L921 322L972 377L957 425L920 458L886 521L841 552L813 635L754 696L675 696L644 655L615 605L559 573L520 522L463 500L427 453L360 433L305 385L232 355L190 309Z" fill="#e9e4d5" stroke="#817866" stroke-width="3"/>

  <path d="M257 310L337 296L386 326L365 376L295 373L246 346Z" fill="#d6c69c" stroke="#7c6d4d" stroke-width="2"/>
  <text x="318" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#4d4434">MISSOURI</text>
  <text x="318" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4d4434">loyal slave state</text>

  <path d="M391 345L518 347L559 376L534 408L418 404L373 376Z" fill="#d6c69c" stroke="#7c6d4d" stroke-width="2"/>
  <text x="466" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#4d4434">KENTUCKY</text>
  <text x="466" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4d4434">loyal slave state</text>

  <path d="M600 291L703 288L737 314L702 337L606 330L574 309Z" fill="#d6c69c" stroke="#7c6d4d" stroke-width="2"/>
  <text x="654" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4d4434">MARYLAND</text>

  <path d="M713 279L735 269L748 291L735 310L718 300Z" fill="#d6c69c" stroke="#7c6d4d" stroke-width="2"/>
  <line x1="738" y1="277" x2="806" y2="232" stroke="#6d6252" stroke-width="2"/>
  <rect x="766" y="194" width="154" height="40" rx="7" fill="#fffaf0" stroke="#8c806d"/>
  <text x="843" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4d4434">DELAWARE</text>

  <circle cx="690" cy="292" r="11" fill="#315f8c" stroke="#fff" stroke-width="3"/>
  <line x1="684" y1="283" x2="648" y2="229" stroke="#315f8c" stroke-width="3"/>
  <g transform="translate(544 186)" filter="url(#shadow)">
    <rect width="208" height="61" rx="9" fill="#315f8c"/>
    <text x="104" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">WASHINGTON, D.C.</text>
    <text x="104" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#eaf2f8">president · Congress · War Dept.</text>
  </g>

  <circle cx="862" cy="391" r="11" fill="#8b5b25" stroke="#fff" stroke-width="3"/>
  <line x1="851" y1="392" x2="785" y2="397" stroke="#8b5b25" stroke-width="3"/>
  <g transform="translate(561 365)" filter="url(#shadow)">
    <rect width="229" height="78" rx="9" fill="#8b5b25"/>
    <text x="114.5" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">FORT MONROE · VIRGINIA</text>
    <text x="114.5" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff3e1">Butler retains freedom seekers</text>
    <text x="114.5" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff3e1">May 23–30, 1861</text>
  </g>

  <circle cx="319" cy="336" r="11" fill="#963b31" stroke="#fff" stroke-width="3"/>
  <line x1="309" y1="326" x2="270" y2="278" stroke="#963b31" stroke-width="3"/>
  <g transform="translate(75 194)" filter="url(#shadow)">
    <rect width="258" height="86" rx="9" fill="#963b31"/>
    <text x="129" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">DEPARTMENT OF THE WEST</text>
    <text x="129" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fae9e4">Frémont declares emancipation</text>
    <text x="129" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fae9e4">in Missouri · Aug. 30, 1861</text>
  </g>

  <path d="M776 525L834 511L880 543L858 584L810 596L764 569Z" fill="#c7d8c2" stroke="#637861" stroke-width="2"/>
  <text x="824" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#40513f">S.C.</text>
  <path d="M702 540L776 525L802 594L775 653L713 620L680 575Z" fill="#c7d8c2" stroke="#637861" stroke-width="2"/>
  <text x="741" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#40513f">GEORGIA</text>
  <path d="M713 620L775 653L795 713L770 730L735 681Z" fill="#c7d8c2" stroke="#637861" stroke-width="2"/>
  <text x="759" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#40513f">FLA.</text>
  <line x1="816" y1="574" x2="936" y2="590" stroke="#47704f" stroke-width="3"/>
  <g transform="translate(917 542)" filter="url(#shadow)">
    <rect width="220" height="100" rx="9" fill="#47704f"/>
    <text x="110" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">DEPARTMENT OF THE SOUTH</text>
    <text x="110" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#eef7ec">Hunter declares emancipation</text>
    <text x="110" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#eef7ec">May 9, 1862</text>
    <text x="110" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#eef7ec">limited coastal U.S. control</text>
  </g>

  <path d="M671 270C589 214 452 199 329 298" fill="none" stroke="#315f8c" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#blueArrow)"/>
  <rect x="365" y="119" width="322" height="35" rx="7" fill="#fffaf0" stroke="#315f8c"/>
  <text x="526" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#315f8c">Lincoln narrows Frémont’s order · Sept. 11, 1861</text>
  <path d="M708 309C809 351 882 440 813 531" fill="none" stroke="#315f8c" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#blueArrow)"/>
  <rect x="847" y="450" width="275" height="48" rx="7" fill="#fffaf0" stroke="#315f8c"/>
  <text x="984" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#315f8c">Lincoln voids Hunter’s declaration</text>
  <text x="984" y="487" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#315f8c">May 19, 1862</text>

  <g transform="translate(72 493)">
    <rect width="464" height="212" rx="12" fill="#fffaf0" stroke="#93846d" stroke-width="2"/>
    <text x="24" y="32" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#2f2b27">LOYAL SLAVE STATES</text>
    <rect x="24" y="51" width="20" height="20" fill="#d6c69c" stroke="#7c6d4d"/>
    <text x="56" y="66" font-family="Arial, sans-serif" font-size="13" fill="#4f4a43">Delaware · Maryland · Kentucky · Missouri</text>
    <text x="24" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#315f8c">Lincoln’s central political concern</text>
    <text x="24" y="123" font-family="Arial, sans-serif" font-size="12" fill="#4f4a43">He feared unauthorized emancipation orders would</text>
    <text x="24" y="142" font-family="Arial, sans-serif" font-size="12" fill="#4f4a43">weaken Unionism in states that had not seceded.</text>
    <text x="24" y="171" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#8b5b25">Proposed alternative · March–July 1862</text>
    <text x="24" y="193" font-family="Arial, sans-serif" font-size="12" fill="#4f4a43">Voluntary gradual abolition with federal compensation.</text>
  </g>

  <g transform="translate(1087 165)" font-family="Arial, sans-serif" fill="#2f2b27">
    <path d="M0 52V0M0 0L-9 18M0 0L9 18" fill="none" stroke="#2f2b27" stroke-width="3"/>
    <text x="0" y="-10" text-anchor="middle" font-size="18" font-weight="700">N</text>
  </g>
  <text x="1126" y="742" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#5f574d">Schematic · not to scale</text>
</svg>
