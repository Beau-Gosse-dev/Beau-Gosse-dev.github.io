<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">The Twelfth Corps enters the northern Antietam battlefield, about 7:30 a.m.</title>
  <desc id="desc">Schematic map with north at top. Mansfield's Twelfth Corps approaches from the Poffenberger farms. Crawford deploys toward the Hagerstown Turnpike, Gordon advances toward Miller's pasture and Cornfield, and Greene moves through the East Woods. Ripley, Colquitt, and McRae move north from D. H. Hill's Confederate division.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e3"/>
      <stop offset="1" stop-color="#e8dcc3"/>
    </linearGradient>
    <pattern id="trees" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="17" r="8" fill="#43543d" opacity="0.55"/>
      <circle cx="21" cy="9" r="7" fill="#667257" opacity="0.53"/>
      <circle cx="29" cy="25" r="6" fill="#354834" opacity="0.48"/>
    </pattern>
    <pattern id="corn" width="20" height="28" patternUnits="userSpaceOnUse">
      <path d="M10 27V5M10 11L4 7M10 15L16 9M10 20L4 15" fill="none" stroke="#87691f" stroke-width="2" opacity="0.7"/>
    </pattern>
    <pattern id="furrow" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#987c57" stroke-width="3" opacity="0.4"/>
    </pattern>
    <marker id="blueArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16">
      <path d="M0 0L16 8L0 16Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16">
      <path d="M0 0L16 8L0 16Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#97896f" stroke-width="2"/>
  <text x="60" y="77" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2f2b27">XII CORPS ENTERS THE BATTLE</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#5c5549">The northern Antietam battlefield · approximately 7:30 a.m.</text>
  <rect x="48" y="128" width="1104" height="613" fill="#e8e5ce"/>

