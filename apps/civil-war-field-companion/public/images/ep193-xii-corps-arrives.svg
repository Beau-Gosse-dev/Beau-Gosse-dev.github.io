      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">GORDON</text>
    </g>
    <g transform="translate(900 252)">
      <rect x="-63" y="-22" width="126" height="44" rx="8" fill="#315f8c"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">GREENE</text>
