<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Albert Sidney Johnston's final attack at Shiloh on April 6, 1862</title>
  <desc id="desc">Simplified map shows Statham and Bowen attacking north across Bell's cotton field, the United States line withdrawing from the peach orchard, the battery west of the orchard, Johnston's wounding site, and the ravine where he died.</desc>
  <defs><marker id="usa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315f8c"/></marker><marker id="csa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9a3d32"/></marker></defs>
  <rect width="1200" height="820" fill="#f3eedf"/><path d="M880 800L830 80" stroke="#6a5a48" stroke-width="10"/><text x="865" y="380" fill="#514438" font-family="Arial,sans-serif" font-size="18" transform="rotate(-84 865 380)">Hamburg–Savannah Road</text>
  <rect x="380" y="160" width="430" height="150" rx="9" fill="#e6cfa9"/><g fill="#bd6f78"><circle cx="430" cy="205" r="18"/><circle cx="500" cy="230" r="18"/><circle cx="575" cy="198" r="18"/><circle cx="650" cy="232" r="18"/><circle cx="730" cy="200" r="18"/></g><text x="595" y="275" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="24" font-weight="700">PEACH ORCHARD</text>
  <rect x="335" y="355" width="515" height="210" rx="9" fill="#d8b88a"/><text x="595" y="398" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="25" font-weight="700">BELL'S COTTON FIELD</text><text x="595" y="427" text-anchor="middle" fill="#553e28" font-family="Arial,sans-serif" font-size="16">open stubble crossed by the Confederate attack</text>
  <path d="M400 280L760 280" stroke="#315f8c" stroke-width="18"/><text x="580" y="145" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="20" font-weight="700">HURLBUT'S UNITED STATES LINE</text><path d="M520 275C500 230 470 195 440 170" fill="none" stroke="#315f8c" stroke-width="8" stroke-dasharray="13 8" marker-end="url(#usa)"/><text x="330" y="235" fill="#234b73" font-family="Arial,sans-serif" font-size="16">line withdraws</text>
  <g transform="translate(315 260)"><circle cx="0" cy="0" r="16" fill="#315f8c"/><path d="M-25 20H25M-15 20L-30 45M15 20L30 45" stroke="#315f8c" stroke-width="8"/><text x="0" y="78" text-anchor="middle" fill="#234b73" font-family="Arial,sans-serif" font-size="16" font-weight="700">U.S. BATTERY</text></g>
  <path d="M460 700C470 630 485 555 500 475C510 410 525 345 545 295" fill="none" stroke="#9a3d32" stroke-width="14" marker-end="url(#csa)"/><text x="405" y="675" text-anchor="middle" fill="#7c3029" font-family="Arial,sans-serif" font-size="19" font-weight="700">STATHAM</text><path d="M770 710C760 620 750 535 735 460C725 390 710 335 690 295" fill="none" stroke="#9a3d32" stroke-width="14" marker-end="url(#csa)"/><text x="805" y="675" text-anchor="middle" fill="#7c3029" font-family="Arial,sans-serif" font-size="19" font-weight="700">BOWEN</text>
  <path d="M595 680C585 610 580 540 575 470" fill="none" stroke="#9a3d32" stroke-width="9" stroke-dasharray="14 9" marker-end="url(#csa)"/><text x="605" y="617" fill="#7c3029" font-family="Arial,sans-serif" font-size="17" font-weight="700">JOHNSTON LEADS CHARGE</text><circle cx="565" cy="455" r="16" fill="#f3eedf" stroke="#9a3d32" stroke-width="7"/><text x="540" y="500" text-anchor="end" fill="#7c3029" font-family="Arial,sans-serif" font-size="17" font-weight="700">wounded behind right knee</text>
  <path d="M565 475C620 520 675 565 710 620" fill="none" stroke="#9a3d32" stroke-width="7" stroke-dasharray="12 8" marker-end="url(#csa)"/><path d="M650 660Q710 620 775 660T905 660" fill="none" stroke="#6e8a64" stroke-width="18"/><circle cx="750" cy="642" r="18" fill="#f3eedf" stroke="#263332" stroke-width="6"/><text x="775" y="700" fill="#263332" font-family="Arial,sans-serif" font-size="17" font-weight="700">ravine where Johnston died about 2:30 p.m.</text>
  <path d="M565 440C480 385 395 325 330 280" fill="none" stroke="#9a3d32" stroke-width="8" stroke-dasharray="12 8" marker-end="url(#csa)"/><text x="345" y="365" fill="#7c3029" font-family="Arial,sans-serif" font-size="16">Statham ordered against battery</text>
  <text x="40" y="52" fill="#263332" font-family="Georgia,serif" font-size="31" font-weight="700">Albert Sidney Johnston's final attack</text><text x="40" y="86" fill="#4b5856" font-family="Arial,sans-serif" font-size="18">April 6, 1862 · early afternoon · Bell Field · simplified orientation · not to scale</text><rect x="46" y="692" width="20" height="20" fill="#315f8c"/><text x="78" y="709" fill="#263332" font-family="Arial,sans-serif" font-size="16">United States</text><rect x="46" y="726" width="20" height="20" fill="#9a3d32"/><text x="78" y="743" fill="#263332" font-family="Arial,sans-serif" font-size="16">Confederacy</text><path d="M1120 75V130" stroke="#263332" stroke-width="5" marker-end="url(#usa)"/><text x="1120" y="57" text-anchor="middle" fill="#263332" font-family="Arial,sans-serif" font-size="20" font-weight="700">N</text>
</svg>
