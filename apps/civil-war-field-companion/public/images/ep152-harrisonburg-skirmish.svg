<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Schematic map of the June 6, 1862 engagement near Harrisonburg</title>
  <desc id="desc">A phase diagram shows Federal cavalry and Pennsylvania infantry advancing southeast from Harrisonburg toward a Confederate rear guard near Good's Farm and Chestnut Ridge, where Turner Ashby was killed.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efe7d2"/><stop offset="1" stop-color="#d9cfb3"/></linearGradient>
    <pattern id="field" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 28 L28 0" stroke="#c8bc9f" stroke-width="1"/></pattern>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#315f8c"/></marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#9a3d32"/></marker>
  </defs>
  <rect width="1200" height="800" fill="url(#ground)"/>
  <rect y="120" width="1200" height="680" fill="url(#field)" opacity=".52"/>
  <path d="M0 120 H1200" stroke="#6b6253" stroke-width="4"/>
  <path d="M165 130 C265 235 355 315 470 390 C600 470 735 535 875 700" fill="none" stroke="#726757" stroke-width="18"/>
  <path d="M890 700 C980 715 1075 732 1200 744" fill="none" stroke="#726757" stroke-width="15"/>
  <text x="260" y="220" font-family="Arial,sans-serif" font-size="18" fill="#4e463b" transform="rotate(42 260 220)">Port Republic Road</text>
  <g fill="#71805d" opacity=".86">
    <ellipse cx="700" cy="410" rx="210" ry="95"/>
    <ellipse cx="760" cy="535" rx="245" ry="110"/>
    <ellipse cx="600" cy="555" rx="145" ry="88"/>
  </g>
  <text x="715" y="485" font-family="Georgia,serif" font-size="27" fill="#f8f3e6" font-weight="700" text-anchor="middle">CHESTNUT RIDGE</text>
  <g stroke="#8c8272" stroke-width="7" stroke-linecap="round">
    <path d="M600 360 L740 455"/><path d="M625 340 L765 435"/>
  </g>
  <text x="695" y="345" font-family="Arial,sans-serif" font-size="17" fill="#51483d">stone walls / wooded position</text>
  <rect x="85" y="145" width="160" height="70" rx="10" fill="#fffaf0" stroke="#675d4c" stroke-width="2"/>
  <text x="165" y="174" font-family="Georgia,serif" font-size="25" font-weight="700" text-anchor="middle" fill="#2d2923">HARRISONBURG</text>
  <text x="165" y="199" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#5b5246">about 1½ miles northwest</text>
  <rect x="850" y="650" width="185" height="66" rx="10" fill="#fffaf0" stroke="#675d4c" stroke-width="2"/>
  <text x="942" y="679" font-family="Georgia,serif" font-size="23" font-weight="700" text-anchor="middle" fill="#2d2923">GOOD’S FARM</text>
  <text x="942" y="701" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#5b5246">approximate area</text>
  <path d="M215 190 C330 275 435 345 560 405" fill="none" stroke="#315f8c" stroke-width="13" marker-end="url(#blueArrow)"/>
  <path d="M335 260 C455 350 555 435 650 505" fill="none" stroke="#315f8c" stroke-width="10" stroke-dasharray="17 9" marker-end="url(#blueArrow)"/>
  <path d="M820 625 C760 585 715 548 672 515" fill="none" stroke="#9a3d32" stroke-width="11" marker-end="url(#redArrow)"/>
  <path d="M905 630 C835 565 790 500 742 445" fill="none" stroke="#9a3d32" stroke-width="11" marker-end="url(#redArrow)"/>
  <g font-family="Arial,sans-serif" font-weight="700" font-size="18">
    <rect x="250" y="232" width="270" height="57" rx="9" fill="#fff" opacity=".92"/><text x="385" y="255" fill="#315f8c" text-anchor="middle">1st New Jersey Cavalry advances;</text><text x="385" y="277" fill="#315f8c" text-anchor="middle">its commander is captured</text>
    <rect x="300" y="330" width="245" height="56" rx="9" fill="#fff" opacity=".92"/><text x="422" y="353" fill="#315f8c" text-anchor="middle">13th Pennsylvania Reserves</text><text x="422" y="375" fill="#315f8c" text-anchor="middle">enters the fight</text>
    <rect x="800" y="500" width="275" height="56" rx="9" fill="#fff" opacity=".92"/><text x="937" y="523" fill="#9a3d32" text-anchor="middle">58th Virginia and 1st Maryland</text><text x="937" y="545" fill="#9a3d32" text-anchor="middle">counter the Federal advance</text>
  </g>
  <circle cx="720" cy="500" r="19" fill="#fff" stroke="#9a3d32" stroke-width="7"/>
  <path d="M710 490 L730 510 M730 490 L710 510" stroke="#9a3d32" stroke-width="6"/>
  <rect x="520" y="605" width="305" height="58" rx="9" fill="#fffaf0" stroke="#9a3d32" stroke-width="3"/>
  <text x="672" y="629" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#9a3d32">Ashby killed while leading on foot</text>
  <text x="672" y="651" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#4f473d">exact shooter and precise spot are uncertain</text>
  <line x1="690" y1="605" x2="716" y2="523" stroke="#9a3d32" stroke-width="3"/>
  <rect x="0" y="0" width="1200" height="116" fill="#fffaf0" opacity=".96"/>
  <text x="600" y="43" font-family="Georgia,serif" font-size="31" font-weight="700" text-anchor="middle" fill="#2d2923">ENGAGEMENT NEAR HARRISONBURG · JUNE 6, 1862</text>
  <text x="600" y="76" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#5b5246">Confederate rear guard delays Frémont’s pursuit near Good’s Farm and Chestnut Ridge</text>
  <text x="600" y="104" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#6d4a35">SCHEMATIC — phase relationships, roads, terrain, and positions are simplified</text>
  <g transform="translate(70 695)" font-family="Arial,sans-serif" font-size="17">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#315f8c" stroke-width="10"/><text x="75" y="6" fill="#2d2923">United States advance</text>
    <line x1="0" y1="40" x2="60" y2="40" stroke="#9a3d32" stroke-width="10"/><text x="75" y="46" fill="#2d2923">Confederate counterattack</text>
  </g>
</svg>
