<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Kentucky campaign positions and movements, September 20 to October 1, 1862</title>
  <desc id="desc">Schematic north-up map showing Confederate positions at Bardstown, Lexington, Frankfort, and Camp Breckinridge and United States movements from Louisville toward Frankfort and central Kentucky.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f0df"/>
      <stop offset="1" stop-color="#e8dcc1"/>
    </linearGradient>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="0.7" fill="#8b7652" opacity="0.18"/>
      <circle cx="14" cy="11" r="0.5" fill="#8b7652" opacity="0.13"/>
    </pattern>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#513e25" flood-opacity="0.25"/>
    </filter>
    <style>
      .title { font: 700 30px Georgia, serif; fill: #2f2a21; letter-spacing: .4px; }
      .subtitle { font: 16px Georgia, serif; fill: #655947; }
      .river-label { font: italic 15px Georgia, serif; fill: #557891; }
      .town { font: 700 17px Arial, sans-serif; fill: #282820; paint-order: stroke; stroke: #f3ead7; stroke-width: 4px; stroke-linejoin: round; }
      .small { font: 14px Arial, sans-serif; fill: #4b4235; paint-order: stroke; stroke: #f3ead7; stroke-width: 3px; }
      .route-label { font: 700 14px Arial, sans-serif; paint-order: stroke; stroke: #f3ead7; stroke-width: 4px; }
      .legend { font: 15px Arial, sans-serif; fill: #302a21; }
      .border { fill: none; stroke: #736247; stroke-width: 2; stroke-dasharray: 8 5; opacity: .65; }
      .road { fill: none; stroke: #a6987c; stroke-width: 3; stroke-dasharray: 7 7; opacity: .8; }
      .blue { fill: none; stroke: #315f8c; stroke-width: 7; marker-end: url(#blueArrow); }
      .red { fill: none; stroke: #963b31; stroke-width: 7; marker-end: url(#redArrow); }
    </style>
  </defs>

  <rect width="1200" height="760" rx="22" fill="url(#paper)"/>
  <rect width="1200" height="760" rx="22" fill="url(#grain)"/>
  <text x="60" y="55" class="title">The rival armies turn toward central Kentucky</text>
  <text x="61" y="84" class="subtitle">Positions and movements discussed in Episode 211 · September 20–October 1, 1862 · north is up</text>

  <!-- Stylized Kentucky frame and geographic guides -->
  <path d="M66 162 C260 128 431 139 586 121 C750 102 942 130 1133 174" fill="none" stroke="#78a4ba" stroke-width="16" opacity=".7"/>
  <path d="M68 163 C255 129 432 140 586 122 C747 103 944 130 1134 175" fill="none" stroke="#d8edf2" stroke-width="5" opacity=".9"/>
  <text x="86" y="137" class="river-label">Ohio River</text>
  <path d="M50 650 C260 646 451 661 644 646 C830 633 1012 644 1150 635" class="border"/>
  <text x="965" y="676" class="small">Tennessee line</text>

  <!-- Approximate road network -->
  <path d="M132 183 L300 326 L480 410 L653 447 L770 505" class="road"/>
  <path d="M132 183 L520 188 L699 239" class="road"/>
  <path d="M520 188 L480 410 L650 545" class="road"/>
  <path d="M699 239 L650 545 L780 665" class="road"/>
  <path d="M300 326 L194 540" class="road"/>

  <!-- Confederate movements and positions -->
  <path d="M194 540 C214 467 249 393 292 340" class="red"/>
  <text x="87" y="456" class="route-label" fill="#963b31" transform="rotate(-65 87 456)">Bragg from Munfordville</text>
  <path d="M317 313 C420 260 565 251 678 244" class="red" stroke-dasharray="13 9"/>
  <text x="422" y="244" class="route-label" fill="#963b31">Bragg rides to meet Kirby Smith</text>
  <path d="M682 226 C627 193 578 183 541 184" class="red" stroke-dasharray="13 9"/>
  <text x="650" y="151" class="route-label" fill="#963b31">Hawes ceremony planned</text>
  <path d="M682 260 C677 358 665 452 655 529" class="red" stroke-dasharray="13 9"/>
  <text x="715" y="488" class="route-label" fill="#963b31" transform="rotate(-86 715 488)">Wilderness Road supply line</text>

  <!-- United States movements -->
  <path d="M153 182 C250 178 375 182 497 188" class="blue"/>
  <text x="233" y="161" class="route-label" fill="#315f8c">Sill + Dumont feint · about 20,000</text>
  <path d="M142 203 C168 255 215 296 281 321" class="blue"/>
  <path d="M159 212 C214 284 333 353 460 400" class="blue"/>
  <path d="M174 202 C272 279 421 346 626 434" class="blue"/>
  <rect x="65" y="246" width="395" height="57" rx="8" fill="#f5ecd9" stroke="#315f8c" stroke-width="1" opacity=".94"/>
  <text x="82" y="269" class="route-label" fill="#315f8c">Buell’s three main columns · about 55,000</text>
  <text x="82" y="291" class="small">advance October 1 toward Bardstown and central Kentucky</text>

  <!-- Place markers -->
  <g filter="url(#shadow)">
    <circle cx="132" cy="183" r="9" fill="#315f8c" stroke="#f8f1e3" stroke-width="3"/>
    <circle cx="300" cy="326" r="9" fill="#963b31" stroke="#f8f1e3" stroke-width="3"/>
    <circle cx="194" cy="540" r="7" fill="#963b31" stroke="#f8f1e3" stroke-width="3"/>
    <circle cx="520" cy="188" r="8" fill="#963b31" stroke="#f8f1e3" stroke-width="3"/>
    <circle cx="699" cy="239" r="9" fill="#963b31" stroke="#f8f1e3" stroke-width="3"/>
    <circle cx="480" cy="410" r="7" fill="#6f6049" stroke="#f8f1e3" stroke-width="3"/>
    <circle cx="650" cy="545" r="7" fill="#963b31" stroke="#f8f1e3" stroke-width="3"/>
    <circle cx="770" cy="505" r="7" fill="#6f6049" stroke="#f8f1e3" stroke-width="3"/>
  </g>
  <text x="86" y="216" class="town">Louisville</text>
  <text x="249" y="361" class="town">Bardstown</text>
  <text x="126" y="573" class="town">Munfordville</text>
  <text x="476" y="219" class="town">Frankfort</text>
  <text x="715" y="242" class="town">Lexington</text>
  <text x="402" y="441" class="town">Perryville</text>
  <text x="563" y="578" class="town">Camp Breckinridge</text>
  <text x="748" y="543" class="town">Danville</text>

  <!-- Position callouts -->
  <g transform="translate(842 126)">
    <rect width="300" height="174" rx="14" fill="#fffaf0" stroke="#98866a" stroke-width="1.5" opacity=".97"/>
    <text x="20" y="30" class="legend" font-weight="700">Late-September situation</text>
    <line x1="22" y1="58" x2="67" y2="58" stroke="#315f8c" stroke-width="6"/>
    <path d="M67 49 L84 58 L67 67 Z" fill="#315f8c"/>
    <text x="99" y="63" class="legend">United States advance</text>
    <line x1="22" y1="92" x2="67" y2="92" stroke="#963b31" stroke-width="6"/>
    <path d="M67 83 L84 92 L67 101 Z" fill="#963b31"/>
    <text x="99" y="97" class="legend">Confederate movement</text>
    <line x1="22" y1="127" x2="84" y2="127" stroke="#963b31" stroke-width="5" stroke-dasharray="9 6"/>
    <text x="99" y="132" class="legend">Command / supply link</text>
    <text x="20" y="158" class="small">Town positions and route traces are approximate.</text>
  </g>

  <g transform="translate(842 330)">
    <rect width="300" height="178" rx="14" fill="#fffaf0" stroke="#98866a" stroke-width="1.5" opacity=".97"/>
    <text x="20" y="31" class="legend" font-weight="700">Why the initiative shifted</text>
    <text x="20" y="61" class="legend">• Bragg paused at Bardstown.</text>
    <text x="20" y="89" class="legend">• Kirby Smith remained near Lexington.</text>
    <text x="20" y="117" class="legend">• Buell rebuilt his army in under a week.</text>
    <text x="20" y="145" class="legend">• The October 1 advance threatened the</text>
    <text x="37" y="167" class="legend">Confederate road back to Tennessee.</text>
  </g>

  <text x="60" y="719" class="small">Custom schematic based on the Official Records and U.S. National Park Service campaign summary.</text>
</svg>
