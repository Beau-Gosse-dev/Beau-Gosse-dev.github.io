  <text x="128" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#685442">HAUSER RIDGE</text>

  <g transform="translate(788 584)" filter="url(#shadow)">
    <rect x="-15" y="-13" width="30" height="28" fill="#f7f1df" stroke="#4b4540" stroke-width="2"/>
    <path d="M-19-13L0-28L19-13Z" fill="#60564c"/>
    <rect x="-5" y="2" width="10" height="13" fill="#776b5c"/>
