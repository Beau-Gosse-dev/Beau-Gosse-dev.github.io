<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Sedgwick's division enveloped in the West Woods</title>
  <desc id="desc">Schematic tactical map with north at top. Gorman, Dana, and Howard advance west in three brigade lines only tens of yards apart. Confederate infantry attacks the exposed Federal left and rear from the south while artillery on Hauser Ridge fires from the west. Kershaw attacks the 125th Pennsylvania near the Dunker Church, and Federal units retreat north.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e3"/>
      <stop offset="1" stop-color="#e7dbc2"/>
    </linearGradient>
    <pattern id="trees" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="17" r="8" fill="#43543d" opacity="0.56"/>
      <circle cx="21" cy="9" r="7" fill="#667257" opacity="0.54"/>
      <circle cx="29" cy="25" r="6" fill="#354834" opacity="0.49"/>
    </pattern>
    <marker id="blueArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16">
      <path d="M0 0L16 8L0 16Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16">
      <path d="M0 0L16 8L0 16Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#97896f" stroke-width="2"/>
  <text x="60" y="77" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2f2b27">THE WEST WOODS ENVELOPMENT</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#5c5549">Three compressed Federal lines are struck from the south and west · about 9:30 a.m.</text>
  <rect x="48" y="128" width="1104" height="613" fill="#e8e5ce"/>

  <g transform="translate(1092 163)" font-family="Arial, sans-serif" fill="#2f2b27">
    <path d="M0 48V0M0 0L-9 18M0 0L9 18" fill="none" stroke="#2f2b27" stroke-width="3"/>
    <text x="0" y="-9" text-anchor="middle" font-size="18" font-weight="700">N</text>
  </g>

  <path d="M785 128C792 230 796 330 800 435C804 540 807 640 812 741" fill="none" stroke="#a97849" stroke-width="17"/>
  <path d="M785 128C792 230 796 330 800 435C804 540 807 640 812 741" fill="none" stroke="#f1d7a6" stroke-width="6"/>
  <g transform="translate(829 432) rotate(-88)">
    <rect x="-91" y="-14" width="182" height="28" rx="6" fill="#fffaf0" opacity="0.94"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#6b4d31">HAGERSTOWN TURNPIKE</text>
  </g>

  <path d="M207 128Q374 142 719 167L758 660Q520 727 214 694Q148 609 168 500Q190 391 151 287Q142 196 207 128Z" fill="#59674d"/>
  <path d="M207 128Q374 142 719 167L758 660Q520 727 214 694Q148 609 168 500Q190 391 151 287Q142 196 207 128Z" fill="url(#trees)"/>
  <rect x="348" y="162" width="151" height="35" rx="7" fill="#fffaf0" opacity="0.9"/>
  <text x="423" y="186" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#384535">WEST WOODS</text>

  <path d="M91 128Q129 248 107 352Q88 453 121 555Q139 632 101 741" fill="none" stroke="#9d835f" stroke-width="8" stroke-dasharray="14 8"/>
