    <g transform="translate(352 691)">
      <rect x="-72" y="-22" width="144" height="44" rx="8" fill="#963b31"/>
      <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">BARKSDALE</text>
    </g>
    <g transform="translate(499 701)">
      <rect x="-62" y="-22" width="124" height="44" rx="8" fill="#963b31"/>
      <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">SEMMES</text>
    </g>
    <g transform="translate(226 619)">
      <rect x="-58" y="-22" width="116" height="44" rx="8" fill="#963b31"/>
      <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">EARLY</text>
    </g>
  </g>

  <path d="M150 340C261 350 362 365 486 391" fill="none" stroke="#963b31" stroke-width="10" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <g transform="translate(190 309)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="-82" y="-23" width="164" height="46" rx="8" fill="#f6ead7" stroke="#963b31" stroke-width="2"/>
    <text x="0" y="-1" text-anchor="middle" font-size="14" font-weight="700" fill="#7c342d">STUART’S GUNS</text>
    <text x="0" y="16" text-anchor="middle" font-size="11" fill="#7c342d">shot and shell from west</text>
  </g>

  <path d="M705 650C752 622 786 603 823 579" fill="none" stroke="#963b31" stroke-width="10" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <g transform="translate(686 680)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="-68" y="-22" width="136" height="44" rx="8" fill="#963b31"/>
    <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">KERSHAW</text>
  </g>
  <g transform="translate(922 632)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="-94" y="-23" width="188" height="46" rx="8" fill="#e5edf5" stroke="#315f8c" stroke-width="2"/>
    <text x="0" y="-1" text-anchor="middle" font-size="13" font-weight="700" fill="#244d76">125th PENNSYLVANIA</text>
    <text x="0" y="16" text-anchor="middle" font-size="11" fill="#244d76">falls back east</text>
  </g>

  <path d="M493 386C430 322 383 276 343 216" fill="none" stroke="#315f8c" stroke-width="9" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#blueArrow)"/>
  <path d="M605 389C560 322 530 266 507 211" fill="none" stroke="#315f8c" stroke-width="9" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#blueArrow)"/>
  <rect x="225" y="201" width="222" height="31" rx="7" fill="#fffaf0" opacity="0.94"/>
  <text x="336" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#244d76">FEDERAL RETREAT NORTH</text>

  <g transform="translate(1090 276)" font-family="Arial, sans-serif">
    <rect x="-167" y="-54" width="174" height="99" rx="10" fill="#fffaf0" stroke="#93846d" stroke-width="2" opacity="0.97"/>
    <line x1="-147" y1="-28" x2="-112" y2="-28" stroke="#315f8c" stroke-width="8" marker-end="url(#blueArrow)"/>
    <text x="-95" y="-23" font-size="14" fill="#2f2b27">Federal move</text>
    <line x1="-147" y1="12" x2="-112" y2="12" stroke="#963b31" stroke-width="8" marker-end="url(#redArrow)"/>
    <text x="-95" y="17" font-size="14" fill="#2f2b27">Confederate attack</text>
  </g>
</svg>
