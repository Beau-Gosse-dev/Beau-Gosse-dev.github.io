      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">GORMAN · 1</text>
    </g>
    <g transform="translate(613 599)">
      <rect x="-60" y="-20" width="120" height="40" rx="8" fill="#315f8c"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">DANA · 2</text>
    </g>
    <g transform="translate(701 235)">
      <rect x="-69" y="-20" width="138" height="40" rx="8" fill="#315f8c"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">HOWARD · 3</text>
    </g>
  </g>
  <path d="M960 382C878 381 799 386 713 404" fill="none" stroke="#315f8c" stroke-width="12" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <rect x="892" y="334" width="184" height="44" rx="8" fill="#e5edf5" stroke="#315f8c" stroke-width="2" filter="url(#shadow)"/>
  <text x="984" y="361" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#244d76">ADVANCE FACES WEST</text>

  <path d="M371 700C400 641 437 583 500 526" fill="none" stroke="#963b31" stroke-width="12" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <path d="M500 714C516 647 537 586 575 532" fill="none" stroke="#963b31" stroke-width="12" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <path d="M250 657C306 598 365 552 445 520" fill="none" stroke="#963b31" stroke-width="11" stroke-linecap="round" marker-end="url(#redArrow)"/>
