<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">McClellan's defensive response around Washington on September 2, 1862</title>
  <desc id="desc">Schematic map of Washington, Alexandria, Chain Bridge, Fairfax Court House, the Potomac River, and the main western approaches, showing guards, food, cavalry, train clearance, and Abercrombie's brigade in McClellan's first defensive arrangements.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f1df"/><stop offset="1" stop-color="#dcd0b0"/></linearGradient>
    <marker id="blueArrow" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto"><path d="M0 0 18 7 0 14Z" fill="#315f8c"/></marker>
  </defs>
  <rect width="1200" height="800" fill="url(#paper)"/>
  <text x="52" y="58" font-family="Georgia,serif" font-size="32" fill="#2f2a22">Washington’s defensive response</text>
  <text x="54" y="89" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.4" fill="#7b302a">SEPTEMBER 2, 1862 · SCHEMATIC · NOT TO SCALE</text>

  <path d="M760 90 C724 151 729 215 774 271 C822 331 832 392 801 451 C772 506 773 564 814 718" fill="none" stroke="#6d93a7" stroke-width="44"/>
  <path d="M760 90 C724 151 729 215 774 271 C822 331 832 392 801 451 C772 506 773 564 814 718" fill="none" stroke="#d8eef1" stroke-width="6"/>
  <text x="818" y="440" transform="rotate(83 818 440)" font-family="Georgia,serif" font-size="21" fill="#315e72">Potomac River</text>
  <path d="M814 281 C940 302 1045 343 1160 437" fill="none" stroke="#6d93a7" stroke-width="18"/>

  <ellipse cx="911" cy="328" rx="176" ry="150" fill="#cbd8bd" opacity=".55" stroke="#596c4c" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="913" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#44583d">WASHINGTON FORTIFICATION RING</text>
  <g fill="#596c4c">
    <rect x="747" y="250" width="16" height="16"/><rect x="787" y="204" width="16" height="16"/><rect x="861" y="180" width="16" height="16"/><rect x="949" y="191" width="16" height="16"/><rect x="1020" y="230" width="16" height="16"/><rect x="1061" y="305" width="16" height="16"/><rect x="1035" y="394" width="16" height="16"/><rect x="964" y="454" width="16" height="16"/><rect x="870" y="471" width="16" height="16"/>
  </g>

  <g fill="none" stroke="#806c4f" stroke-linecap="round">
    <path d="M95 534 C229 516 341 492 457 458 C564 427 664 388 775 337" stroke-width="11"/>
    <path d="M155 656 C294 611 426 563 538 509 C650 455 727 438 795 446" stroke-width="8"/>
    <path d="M463 458 C543 383 637 315 746 268" stroke-width="7"/>
  </g>
  <text x="178" y="468" font-family="Arial,sans-serif" font-size="16" fill="#654f37">western roads into the capital</text>

  <path d="M116 532 C261 514 366 487 462 456 C583 417 683 379 771 339" fill="none" stroke="#315f8c" stroke-width="8" marker-end="url(#blueArrow)"/>
  <path d="M176 653 C318 607 444 559 543 511 C652 458 730 441 793 447" fill="none" stroke="#315f8c" stroke-width="6" marker-end="url(#blueArrow)"/>
  <g font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315f8c">
    <text x="520" y="680">Pope’s troops and trains</text>
    <text x="520" y="704">re-enter the defenses</text>
  </g>

  <g font-family="Arial,sans-serif">
    <circle cx="115" cy="533" r="9" fill="#111"/><text x="66" y="514" font-size="20" font-weight="700" fill="#262626">Fairfax C.H.</text>
    <circle cx="803" cy="332" r="10" fill="#111"/><text x="838" y="330" font-size="24" font-weight="700" fill="#262626">Washington</text>
    <circle cx="800" cy="628" r="10" fill="#111"/><text x="831" y="634" font-size="22" font-weight="700" fill="#262626">Alexandria</text>
    <rect x="721" y="213" width="58" height="9" fill="#6c4f37"/><text x="530" y="164" font-size="19" font-weight="700" fill="#262626">Chain Bridge</text><path d="M665 168 L724 209" fill="none" stroke="#6c4f37" stroke-width="3"/>
  </g>

  <g font-family="Arial,sans-serif">
    <rect x="236" y="344" width="280" height="78" rx="10" fill="#fbf8ee" stroke="#776c5a" stroke-width="2"/>
    <text x="255" y="371" font-size="17" font-weight="700" fill="#315f8c">Road guards and food</text>
    <text x="255" y="396" font-size="15" fill="#35312b">Collect and feed stragglers on the approaches</text>
    <path d="M480 421 L500 446" fill="none" stroke="#315f8c" stroke-width="4"/>

    <rect x="168" y="596" width="330" height="80" rx="10" fill="#fbf8ee" stroke="#776c5a" stroke-width="2"/>
    <text x="187" y="623" font-size="17" font-weight="700" fill="#315f8c">Cavalry and wagon control</text>
    <text x="187" y="648" font-size="15" fill="#35312b">Hasten trains; secure wagons off troop routes</text>

    <path d="M917 293 C855 259 806 235 766 218" fill="none" stroke="#315f8c" stroke-width="6" marker-end="url(#blueArrow)"/>
    <rect x="914" y="237" width="238" height="74" rx="10" fill="#fbf8ee" stroke="#776c5a" stroke-width="2"/>
    <text x="933" y="264" font-size="17" font-weight="700" fill="#315f8c">Abercrombie’s brigade</text>
    <text x="933" y="289" font-size="15" fill="#35312b">Ordered to Chain Bridge</text>

    <rect x="868" y="514" width="275" height="78" rx="10" fill="#fbf8ee" stroke="#776c5a" stroke-width="2"/>
    <text x="887" y="541" font-size="17" font-weight="700" fill="#315f8c">Garrisons alerted</text>
    <text x="887" y="566" font-size="15" fill="#35312b">Ready to cover the army’s return</text>
  </g>

  <g transform="translate(65 730)" font-family="Arial,sans-serif" font-size="15" fill="#403b34">
    <text x="0" y="0">Actions shown are drawn from McClellan’s 12:50 p.m. report to Lincoln; positions and routes are generalized.</text>
  </g>
</svg>
