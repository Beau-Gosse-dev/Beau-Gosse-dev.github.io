<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Hooker's First Corps crosses Antietam Creek on September 16, 1862</title>
  <desc id="desc">Schematic map with north at top. Meade and Ricketts cross the Upper Bridge, Doubleday crosses at Pry Ford, and Hooker's First Corps turns south toward the Confederate left. Stuart's sentries report the movement, and Hood's division moves north from the Dunker Church area toward the Cornfield and East Woods.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e3"/>
      <stop offset="1" stop-color="#e7dbc2"/>
    </linearGradient>
    <pattern id="trees" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="17" r="8" fill="#506044" opacity="0.46"/>
      <circle cx="22" cy="10" r="7" fill="#687256" opacity="0.42"/>
      <circle cx="28" cy="25" r="6" fill="#44543f" opacity="0.38"/>
    </pattern>
    <pattern id="corn" width="18" height="24" patternUnits="userSpaceOnUse">
      <path d="M9 23V5M9 10L3 6M9 14L15 9" stroke="#9f7f30" stroke-width="2" fill="none" opacity="0.56"/>
    </pattern>
    <marker id="blueArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#97896f" stroke-width="2"/>
  <text x="60" y="77" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2f2b27">HOOKER CROSSES AND TURNS SOUTH</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#5c5548">First Corps approaches Lee's left during the afternoon of September 16</text>
  <rect x="48" y="128" width="1104" height="613" fill="#e9e6cf"/>

  <path d="M1005 128C974 193 1017 249 982 317C954 371 995 428 963 490C934 548 971 614 942 678C931 702 930 722 936 741" fill="none" stroke="#5d899e" stroke-width="34"/>
  <path d="M1005 128C974 193 1017 249 982 317C954 371 995 428 963 490C934 548 971 614 942 678C931 702 930 722 936 741" fill="none" stroke="#b9d5dd" stroke-width="11"/>
  <text x="1070" y="492" transform="rotate(-84 1070 492)" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#365c70">Antietam Creek</text>

  <path d="M410 128C409 267 417 404 423 741" fill="none" stroke="#ad7e4f" stroke-width="17"/>
  <path d="M410 128C409 267 417 404 423 741" fill="none" stroke="#f1d8a8" stroke-width="6"/>
  <rect x="240" y="505" width="174" height="34" rx="7" fill="#fffaf0" opacity="0.9"/>
  <text x="327" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#6c5133">HAGERSTOWN PIKE</text>

  <path d="M1016 171C886 218 774 292 692 384C604 483 518 568 429 635" fill="none" stroke="#ad7e4f" stroke-width="14"/>
  <path d="M1016 171C886 218 774 292 692 384C604 483 518 568 429 635" fill="none" stroke="#f1d8a8" stroke-width="5"/>
  <rect x="724" y="272" width="172" height="33" rx="7" fill="#fffaf0" opacity="0.94"/>
  <text x="810" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#6c5133">SMOKETOWN ROAD</text>

  <path d="M221 334C282 310 343 330 380 382L379 665C329 692 262 672 222 625Z" fill="#657256" opacity="0.92"/>
  <path d="M221 334C282 310 343 330 380 382L379 665C329 692 262 672 222 625Z" fill="url(#trees)"/>
  <rect x="244" y="564" width="124" height="34" rx="7" fill="#fffaf0" opacity="0.88"/>
  <text x="306" y="587" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#3f4d39">WEST WOODS</text>

  <path d="M694 302C759 279 830 302 866 361L867 601C821 629 746 626 694 590C716 516 716 410 694 302Z" fill="#657256" opacity="0.92"/>
  <path d="M694 302C759 279 830 302 866 361L867 601C821 629 746 626 694 590C716 516 716 410 694 302Z" fill="url(#trees)"/>
  <rect x="733" y="502" width="116" height="34" rx="7" fill="#fffaf0" opacity="0.88"/>
  <text x="791" y="525" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#3f4d39">EAST WOODS</text>

  <path d="M438 360L679 329L694 588L440 600Z" fill="#d6c36f" opacity="0.7" stroke="#a58d3d" stroke-width="2"/>
  <path d="M438 360L679 329L694 588L440 600Z" fill="url(#corn)"/>
  <text x="568" y="455" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#6a5525">MILLER'S CORNFIELD</text>
  <text x="568" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6a5525">about 30 acres in the episode</text>

  <g transform="translate(422 646)" filter="url(#shadow)">
    <rect x="-14" y="-12" width="28" height="27" fill="#f6f1df" stroke="#4b4540" stroke-width="2"/>
    <path d="M-18 -12L0 -26L18 -12Z" fill="#584f47"/>
    <path d="M8 -26V-39H13V-22" fill="#584f47"/>
    <text x="27" y="2" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2f2b27">Dunker Church</text>
  </g>

  <g stroke="#8a6847" stroke-width="8">
    <path d="M968 198H1017"/>
    <path d="M955 302H1002" stroke-dasharray="8 6"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#5f482f">
    <text x="885" y="185">Upper Bridge</text>
    <text x="879" y="331">Pry Ford</text>
  </g>

  <path d="M1114 188C1044 189 975 191 910 203C808 222 722 255 649 314" fill="none" stroke="#315f8c" stroke-width="12" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <rect x="733" y="206" width="228" height="57" rx="8" fill="#f8f1df" stroke="#8197ad"/>
  <text x="847" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#244c73">Meade · Ricketts</text>
  <text x="847" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#244c73">cross at the Upper Bridge</text>

  <path d="M1114 315C1040 310 980 314 914 334C800 367 687 395 590 420" fill="none" stroke="#315f8c" stroke-width="10" stroke-dasharray="15 9" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <rect x="868" y="358" width="212" height="54" rx="8" fill="#f8f1df" stroke="#8197ad"/>
  <text x="974" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#244c73">Doubleday</text>
  <text x="974" y="401" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#244c73">crosses at Pry Ford</text>

  <path d="M650 284C672 340 685 394 687 449" fill="none" stroke="#315f8c" stroke-width="12" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <rect x="486" y="255" width="177" height="54" rx="8" fill="#f8f1df" stroke="#8197ad"/>
  <text x="574" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#244c73">Meade leads</text>
  <text x="574" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#244c73">turn south</text>

  <path d="M455 676C515 643 579 612 648 588" fill="none" stroke="#963b31" stroke-width="13" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <rect x="493" y="647" width="213" height="56" rx="8" fill="#f8f1df" stroke="#b98b84"/>
  <text x="599" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7a3029">Hood's division</text>
  <text x="599" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7a3029">moves north to meet threat</text>

  <g transform="translate(919 160)" font-family="Arial, sans-serif">
    <circle r="9" fill="#963b31" stroke="#fffaf0" stroke-width="3"/>
    <text x="-17" y="-17" text-anchor="end" font-size="14" font-weight="700" fill="#7a3029">Stuart's vedettes spot movement</text>
  </g>

  <g transform="translate(64 625)" font-family="Arial, sans-serif">
    <rect width="285" height="96" rx="10" fill="#fffaf0" stroke="#8d806a" filter="url(#shadow)"/>
    <path d="M20 27H77" stroke="#315f8c" stroke-width="9" marker-end="url(#blueArrow)"/>
    <text x="94" y="33" font-size="15" fill="#2f2b27">United States movement</text>
    <path d="M20 68H77" stroke="#963b31" stroke-width="9" marker-end="url(#redArrow)"/>
    <text x="94" y="74" font-size="15" fill="#2f2b27">Confederate movement</text>
  </g>

  <g transform="translate(1100 158)" font-family="Arial, sans-serif">
    <path d="M0 60V0" stroke="#2f2b27" stroke-width="4"/>
    <path d="M0 0L-10 20H10Z" fill="#2f2b27"/>
    <text x="0" y="87" text-anchor="middle" font-size="17" font-weight="700" fill="#2f2b27">N</text>
  </g>
  <text x="1128" y="720" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#5c5548">Routes generalized · not to scale</text>
</svg>
