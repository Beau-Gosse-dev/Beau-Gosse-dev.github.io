<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Richmond strategic situation in June 1862</title>
  <desc id="desc">Schematic map showing Richmond, the Chickahominy and James Rivers, McClellan's divided army, White House Landing, and Jackson's approach from the northwest.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#315f8c"/></marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#9a3d32"/></marker>
    <pattern id="earth" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#9a3d32" stroke-width="2" opacity=".42"/></pattern>
    <style>
      .label{font:600 20px Georgia,serif;fill:#182022}.small{font:16px Arial,sans-serif;fill:#253034}.tiny{font:14px Arial,sans-serif;fill:#374246}.river{fill:none;stroke:#5e99bd;stroke-width:18;stroke-linecap:round;opacity:.82}.road{fill:none;stroke:#aa9d82;stroke-width:5;stroke-dasharray:10 8}.blue{fill:#315f8c}.red{fill:#9a3d32}.box{fill:#fffdf7;stroke:#857d69;stroke-width:2}.town{fill:#272b2c}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f2eddc"/>
  <path d="M-20 183 C170 165 245 215 405 201 S680 142 830 194 S1040 251 1220 215" class="river"/>
  <path d="M455 705 C525 620 615 617 702 647 S930 696 1220 626" class="river"/>
  <text x="760" y="165" class="label" fill="#396e91">Chickahominy River</text>
  <text x="845" y="675" class="label" fill="#396e91">James River</text>
  <path d="M198 84 L362 152 L525 258 L591 463" class="road"/>
  <path d="M591 463 L777 333 L1045 290" class="road"/>
  <path d="M591 463 L855 520 L1050 585" class="road"/>
  <text x="878" y="303" class="small">Richmond &amp; York River Railroad</text>
  <circle cx="591" cy="463" r="12" class="town"/><text x="610" y="470" class="label">Richmond</text>
  <circle cx="198" cy="84" r="8" class="town"/><text x="218" y="91" class="small">Ashland</text>
  <circle cx="403" cy="204" r="8" class="town"/><text x="419" y="234" class="small">Mechanicsville</text>
  <circle cx="535" cy="300" r="7" class="town"/><text x="553" y="307" class="small">Dabbs House</text>
  <circle cx="1045" cy="290" r="9" class="town"/><text x="923" y="276" class="small">White House Landing</text>
  <rect x="496" y="377" width="205" height="172" rx="20" fill="url(#earth)" stroke="#9a3d32" stroke-width="3"/>
  <text x="516" y="405" class="small" fill="#7c2e28">Richmond defenses</text>
  <text x="516" y="430" class="tiny">strengthened in June</text>
  <ellipse cx="745" cy="320" rx="165" ry="65" fill="#315f8c" opacity=".15" stroke="#315f8c" stroke-width="3"/>
  <text x="638" y="309" class="label" fill="#315f8c">Porter's V Corps</text>
  <text x="650" y="337" class="small">north of the river</text>
  <ellipse cx="777" cy="474" rx="190" ry="82" fill="#315f8c" opacity=".15" stroke="#315f8c" stroke-width="3"/>
  <text x="670" y="465" class="label" fill="#315f8c">Federal majority</text>
  <text x="650" y="493" class="small">south of the river by late June</text>
  <path d="M96 64 C167 117 205 135 314 164" fill="none" stroke="#9a3d32" stroke-width="9" marker-end="url(#arrowRed)"/>
  <text x="38" y="37" class="label" fill="#9a3d32">Jackson approaches</text>
  <text x="38" y="58" class="tiny">rail and road from the Valley</text>
  <path d="M880 359 C948 342 987 329 1019 307" fill="none" stroke="#315f8c" stroke-width="6" marker-end="url(#arrowBlue)"/>
  <text x="880" y="385" class="small" fill="#315f8c">Federal supply line</text>
  <g transform="translate(34 565)">
    <rect width="465" height="118" rx="12" class="box"/>
    <text x="18" y="30" class="label">Lee's operational problem</text>
    <text x="18" y="57" class="small">A direct assault on the prepared Federal line was costly.</text>
    <text x="18" y="81" class="small">Fortifications could free troops to move north, threaten</text>
    <text x="18" y="104" class="small">the railroad, and force McClellan to move.</text>
  </g>
  <text x="875" y="704" class="tiny">Schematic; not to scale. Positions and routes are generalized.</text>
</svg>
