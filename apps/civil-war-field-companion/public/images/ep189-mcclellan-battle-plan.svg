  <text x="807" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#244c73">3 · CONDITIONAL</text>
  <text x="807" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#244c73">strike the center</text>

  <path d="M1117 608C1064 606 1011 599 958 585" fill="none" stroke="#315f8c" stroke-width="8" stroke-dasharray="12 9" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <g font-family="Arial, sans-serif">
    <rect x="724" y="525" width="172" height="52" rx="8" fill="#fffaf0" opacity="0.94"/>
    <text x="810" y="547" text-anchor="middle" font-size="14" font-weight="700" fill="#244c73">VI Corps · Franklin</text>
    <text x="810" y="567" text-anchor="middle" font-size="13" fill="#244c73">approaching the reserve</text>
  </g>

  <g transform="translate(70 598)" font-family="Arial, sans-serif">
