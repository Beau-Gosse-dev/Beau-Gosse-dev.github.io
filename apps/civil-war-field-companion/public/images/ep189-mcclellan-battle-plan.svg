    <text x="607" y="475" font-size="17">Longstreet</text>
    <text x="299" y="581" font-size="16">Confederate right</text>
  </g>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(900 186)">
      <rect width="216" height="58" rx="10" fill="#e8f0f7" stroke="#315f8c" stroke-width="2"/>
      <text x="16" y="25" font-size="17" font-weight="700" fill="#244c73">I Corps · Hooker</text>
      <text x="16" y="47" font-size="14" fill="#244c73">about 14,000 in 3 divisions</text>
    </g>
    <g transform="translate(892 266)">
      <rect width="224" height="58" rx="10" fill="#e8f0f7" stroke="#315f8c" stroke-width="2"/>
      <text x="16" y="25" font-size="17" font-weight="700" fill="#244c73">XII Corps · Mansfield</text>
      <text x="16" y="47" font-size="14" fill="#244c73">supporting Hooker's attack</text>
    </g>
    <g transform="translate(870 367)">
      <rect width="246" height="58" rx="10" fill="#e8f0f7" stroke="#315f8c" stroke-width="2"/>
      <text x="16" y="25" font-size="17" font-weight="700" fill="#244c73">II Corps · Sumner</text>
      <text x="16" y="47" font-size="14" fill="#244c73">about 18,000 · army center</text>
    </g>
    <g transform="translate(878 445)">
      <rect width="238" height="58" rx="10" fill="#e8f0f7" stroke="#315f8c" stroke-width="2"/>
      <text x="16" y="25" font-size="17" font-weight="700" fill="#244c73">V Corps · Porter</text>
      <text x="16" y="47" font-size="14" fill="#244c73">two divisions in reserve</text>
    </g>
    <g transform="translate(908 523)">
      <rect width="208" height="58" rx="10" fill="#e8f0f7" stroke="#315f8c" stroke-width="2"/>
      <text x="16" y="25" font-size="16" font-weight="700" fill="#244c73">Cavalry · Pleasonton</text>
      <text x="16" y="47" font-size="14" fill="#244c73">about 4,300 in center</text>
    </g>
    <g transform="translate(882 632)">
      <rect width="234" height="58" rx="10" fill="#e8f0f7" stroke="#315f8c" stroke-width="2"/>
      <text x="16" y="25" font-size="17" font-weight="700" fill="#244c73">IX Corps · Burnside</text>
      <text x="16" y="47" font-size="14" fill="#244c73">about 13,000 on the left</text>
    </g>
  </g>

  <path d="M893 216C818 209 755 207 685 221C621 234 558 249 488 255" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <rect x="735" y="149" width="147" height="44" rx="8" fill="#fffaf0" opacity="0.94"/>
  <text x="808" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#244c73">1 · MAIN ATTACK</text>
  <text x="808" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#244c73">turn Lee's left</text>

  <path d="M880 660C812 650 763 638 718 618C675 599 631 587 582 573" fill="none" stroke="#315f8c" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>
