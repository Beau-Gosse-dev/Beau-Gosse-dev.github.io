<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">McClellan's intended sequence and initial Union deployment at Antietam</title>
  <desc id="desc">Schematic map with north at top. Hooker's First Corps and Mansfield's Twelfth Corps are north of the Union center and positioned to attack Lee's left. Burnside's Ninth Corps faces the lower bridge and Lee's right. Sumner's Second Corps, Porter's Fifth Corps, Pleasonton's cavalry, and arriving elements of Franklin's Sixth Corps are massed near the middle bridge as McClellan's center and reserve. Solid arrows show the flank attacks described in McClellan's reports; a dashed arrow marks a conditional attack on Lee's center.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e3"/>
      <stop offset="1" stop-color="#e8dcc3"/>
    </linearGradient>
    <pattern id="trees" width="32" height="28" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="17" r="7" fill="#4f6046" opacity="0.43"/>
      <circle cx="21" cy="10" r="6" fill="#6a7658" opacity="0.42"/>
      <circle cx="27" cy="23" r="5" fill="#40513d" opacity="0.38"/>
    </pattern>
    <marker id="blueArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0 0L18 9L0 18Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

