  <text x="365" y="369" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#f5ecd7">WEST WOODS</text>
  <path d="M514 167C583 153 642 174 656 226C665 261 651 302 625 329L525 316C544 275 539 230 505 202Z" fill="#667458"/>
  <path d="M514 167C583 153 642 174 656 226C665 261 651 302 625 329L525 316C544 275 539 230 505 202Z" fill="url(#trees)"/>
