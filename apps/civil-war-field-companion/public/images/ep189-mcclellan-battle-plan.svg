    <path d="M19 63H75" stroke="#315f8c" stroke-width="8" stroke-dasharray="12 8" marker-end="url(#blueArrow)"/>
    <text x="91" y="69" font-size="14" fill="#2f2b27">conditional center attack</text>
    <path d="M19 98H75" stroke="#963b31" stroke-width="11" stroke-linecap="round"/>
    <text x="91" y="104" font-size="14" fill="#2f2b27">Confederate defensive line</text>
  </g>

  <g transform="translate(1138 158)" font-family="Arial, sans-serif">
    <path d="M0 60V0" stroke="#2f2b27" stroke-width="4"/>
    <path d="M0 0L-10 20H10Z" fill="#2f2b27"/>
    <text x="0" y="87" text-anchor="middle" font-size="17" font-weight="700" fill="#2f2b27">N</text>
  </g>
  <text x="1128" y="720" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#5c5548">Schematic · not to scale</text>
</svg>
