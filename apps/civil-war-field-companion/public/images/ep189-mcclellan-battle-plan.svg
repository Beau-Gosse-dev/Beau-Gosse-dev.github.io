  <text x="813" y="704" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#244c73">2 · ATTACK / DIVERSION</text>
  <text x="813" y="721" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#244c73">against Lee's right</text>

  <path d="M867 397C806 400 759 408 721 424C671 444 627 461 573 474" fill="none" stroke="#315f8c" stroke-width="9" stroke-dasharray="15 10" stroke-linecap="round" marker-end="url(#blueArrow)"/>
