  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#97896f" stroke-width="2"/>
  <text x="60" y="77" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2f2b27">McCLELLAN'S BATTLE PLAN</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#5c5548">Intended sequence and initial deployment for September 17, 1862</text>

  <rect x="48" y="128" width="1104" height="613" fill="#e9e6cf"/>

