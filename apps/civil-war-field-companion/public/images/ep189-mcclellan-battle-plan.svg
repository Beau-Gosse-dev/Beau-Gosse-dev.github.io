  <rect x="262" y="436" width="186" height="34" rx="7" fill="#fffaf0" opacity="0.9"/>
  <text x="355" y="459" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#6c5133">HAGERSTOWN TURNPIKE</text>

  <path d="M463 282C560 266 632 257 711 253" fill="none" stroke="#ad7e4f" stroke-width="12"/>
  <path d="M463 282C560 266 632 257 711 253" fill="none" stroke="#f1d8a8" stroke-width="4"/>
