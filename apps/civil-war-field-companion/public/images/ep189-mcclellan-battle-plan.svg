  </g>

  <path d="M275 227C329 244 376 268 419 302M420 302C456 319 486 342 510 367M513 371C550 397 579 421 596 448M595 450C570 490 555 527 558 565M558 566C591 590 621 615 645 650" fill="none" stroke="#963b31" stroke-width="14" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" font-weight="700" fill="#7a3029">
    <text x="195" y="214" font-size="17">Jackson</text>
    <text x="302" y="290" font-size="16">Hood</text>
