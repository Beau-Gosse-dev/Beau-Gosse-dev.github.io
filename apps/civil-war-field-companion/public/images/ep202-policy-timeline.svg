<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">From refuge to federal policy, May 1861–July 1862</title>
  <desc id="desc">A three-lane chronological diagram. The first lane traces self-emancipation and military decisions, the second congressional legislation, and the third presidential decisions. All events move from May 1861 on the left to July 1862 on the right.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e4"/>
      <stop offset="1" stop-color="#e4d6b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.17"/>
    </filter>
    <marker id="grayArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14">
      <path d="M0 0L14 7L0 14Z" fill="#756d61"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="844" rx="18" fill="none" stroke="#97896f" stroke-width="2"/>
  <text x="60" y="76" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#2f2b27">FROM REFUGE TO FEDERAL POLICY</text>
  <text x="60" y="107" font-family="Arial, sans-serif" font-size="18" fill="#5c5549">May 1861–July 1862 · related developments on three distinct tracks</text>

  <line x1="271" y1="151" x2="1112" y2="151" stroke="#756d61" stroke-width="4" marker-end="url(#grayArrow)"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#4f4a43">
    <text x="296" y="137" text-anchor="middle">MAY 1861</text>
    <text x="462" y="137" text-anchor="middle">AUG.–SEPT. 1861</text>
    <text x="628" y="137" text-anchor="middle">MAR.–APR. 1862</text>
    <text x="794" y="137" text-anchor="middle">MAY 1862</text>
    <text x="960" y="137" text-anchor="middle">JULY 1862</text>
  </g>

  <rect x="58" y="178" width="1084" height="206" rx="14" fill="#e8edf2" stroke="#a2abb2"/>
  <rect x="58" y="402" width="1084" height="190" rx="14" fill="#eee6d5" stroke="#b6a78e"/>
  <rect x="58" y="610" width="1084" height="214" rx="14" fill="#e9e6ee" stroke="#aaa0b2"/>

  <g font-family="Georgia, serif" font-size="15" font-weight="700">
    <rect x="76" y="197" width="126" height="70" rx="8" fill="#315f8c"/>
    <text x="139" y="216" text-anchor="middle" font-size="11" fill="#fff">SELF-</text>
    <text x="139" y="233" text-anchor="middle" font-size="11" fill="#fff">EMANCIPATION</text>
    <text x="139" y="253" text-anchor="middle" font-size="11" fill="#fff">AND THE ARMY</text>
    <rect x="76" y="421" width="174" height="44" rx="8" fill="#8b5b25"/>
    <text x="163" y="449" text-anchor="middle" fill="#fff">CONGRESS</text>
    <rect x="76" y="629" width="174" height="44" rx="8" fill="#67547d"/>
    <text x="163" y="657" text-anchor="middle" fill="#fff">PRESIDENT</text>
  </g>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(296 281)">
      <rect x="-83" y="-78" width="166" height="156" rx="10" fill="#fff" stroke="#315f8c" stroke-width="3"/>
      <text x="0" y="-51" text-anchor="middle" font-size="13" font-weight="700" fill="#315f8c">MAY 23–30, 1861</text>
      <text x="0" y="-26" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2b27">Fort Monroe</text>
      <text x="0" y="-2" text-anchor="middle" font-size="12" fill="#4f4a43">Three men arrive;</text>
      <text x="0" y="17" text-anchor="middle" font-size="12" fill="#4f4a43">Butler refuses return.</text>
      <text x="0" y="39" text-anchor="middle" font-size="12" fill="#4f4a43">Cameron approves</text>
      <text x="0" y="58" text-anchor="middle" font-size="12" fill="#4f4a43">retention and labor.</text>
    </g>
    <g transform="translate(462 281)">
      <rect x="-72" y="-78" width="144" height="156" rx="10" fill="#fff" stroke="#963b31" stroke-width="3"/>
      <text x="0" y="-51" text-anchor="middle" font-size="13" font-weight="700" fill="#963b31">AUG. 30, 1861</text>
      <text x="0" y="-26" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2b27">Frémont</text>
      <text x="0" y="-2" text-anchor="middle" font-size="12" fill="#4f4a43">declares freedom</text>
      <text x="0" y="17" text-anchor="middle" font-size="12" fill="#4f4a43">for enslaved people</text>
      <text x="0" y="36" text-anchor="middle" font-size="12" fill="#4f4a43">held by Confederate</text>
      <text x="0" y="55" text-anchor="middle" font-size="12" fill="#4f4a43">supporters in Missouri.</text>
    </g>
    <g transform="translate(628 281)">
      <rect x="-72" y="-78" width="144" height="156" rx="10" fill="#fff" stroke="#315f8c" stroke-width="3"/>
      <text x="0" y="-51" text-anchor="middle" font-size="13" font-weight="700" fill="#315f8c">1861–EARLY 1862</text>
      <text x="0" y="-26" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2b27">Uneven practice</text>
      <text x="0" y="-2" text-anchor="middle" font-size="12" fill="#4f4a43">Some commands</text>
      <text x="0" y="17" text-anchor="middle" font-size="12" fill="#4f4a43">give refuge;</text>
      <text x="0" y="36" text-anchor="middle" font-size="12" fill="#4f4a43">others exclude or</text>
      <text x="0" y="55" text-anchor="middle" font-size="12" fill="#4f4a43">return fugitives.</text>
    </g>
    <g transform="translate(794 281)">
      <rect x="-72" y="-78" width="144" height="156" rx="10" fill="#fff" stroke="#47704f" stroke-width="3"/>
      <text x="0" y="-51" text-anchor="middle" font-size="13" font-weight="700" fill="#47704f">MAY 9, 1862</text>
      <text x="0" y="-26" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2b27">Hunter</text>
      <text x="0" y="-2" text-anchor="middle" font-size="12" fill="#4f4a43">declares freedom</text>
      <text x="0" y="17" text-anchor="middle" font-size="12" fill="#4f4a43">throughout S.C.,</text>
      <text x="0" y="36" text-anchor="middle" font-size="12" fill="#4f4a43">Georgia, and</text>
      <text x="0" y="55" text-anchor="middle" font-size="12" fill="#4f4a43">Florida.</text>
    </g>
    <g transform="translate(960 281)">
      <rect x="-72" y="-78" width="144" height="156" rx="10" fill="#fff" stroke="#315f8c" stroke-width="3"/>
      <text x="0" y="-51" text-anchor="middle" font-size="13" font-weight="700" fill="#315f8c">BY JULY 1862</text>
      <text x="0" y="-26" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2b27">Mass refuge</text>
      <text x="0" y="-2" text-anchor="middle" font-size="12" fill="#4f4a43">Freedom seekers</text>
      <text x="0" y="17" text-anchor="middle" font-size="12" fill="#4f4a43">make slavery an</text>
      <text x="0" y="36" text-anchor="middle" font-size="12" fill="#4f4a43">immediate military</text>
      <text x="0" y="55" text-anchor="middle" font-size="12" fill="#4f4a43">and human question.</text>
    </g>

    <g transform="translate(379 497)">
      <rect x="-111" y="-69" width="222" height="138" rx="10" fill="#fff" stroke="#8b5b25" stroke-width="3"/>
      <text x="0" y="-42" text-anchor="middle" font-size="13" font-weight="700" fill="#8b5b25">JULY 9–AUG. 6, 1861</text>
      <text x="0" y="-17" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2b27">House resolution</text>
      <text x="0" y="4" text-anchor="middle" font-size="12" fill="#4f4a43">opposes military returns.</text>
      <text x="0" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2b27">First Confiscation Act</text>
      <text x="0" y="48" text-anchor="middle" font-size="12" fill="#4f4a43">forfeits claims to labor</text>
      <text x="0" y="64" text-anchor="middle" font-size="12" fill="#4f4a43">used to aid rebellion.</text>
    </g>
    <g transform="translate(662 497)">
      <rect x="-111" y="-69" width="222" height="138" rx="10" fill="#fff" stroke="#8b5b25" stroke-width="3"/>
      <text x="0" y="-42" text-anchor="middle" font-size="13" font-weight="700" fill="#8b5b25">MARCH 13, 1862</text>
      <text x="0" y="-17" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2b27">Additional Article of War</text>
      <text x="0" y="8" text-anchor="middle" font-size="12" fill="#4f4a43">Military and naval personnel</text>
      <text x="0" y="27" text-anchor="middle" font-size="12" fill="#4f4a43">may not use forces to return</text>
      <text x="0" y="46" text-anchor="middle" font-size="12" fill="#4f4a43">people escaping claimed</text>
      <text x="0" y="65" text-anchor="middle" font-size="12" fill="#4f4a43">service or labor.</text>
    </g>
    <g transform="translate(960 497)">
      <rect x="-111" y="-69" width="222" height="138" rx="10" fill="#fff" stroke="#8b5b25" stroke-width="3"/>
      <text x="0" y="-42" text-anchor="middle" font-size="13" font-weight="700" fill="#8b5b25">JULY 17, 1862</text>
      <text x="0" y="-17" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2b27">Second Confiscation Act</text>
      <text x="0" y="8" text-anchor="middle" font-size="12" fill="#4f4a43">Broadens emancipation</text>
      <text x="0" y="27" text-anchor="middle" font-size="12" fill="#4f4a43">provisions and authorizes</text>
      <text x="0" y="46" text-anchor="middle" font-size="12" fill="#4f4a43">employment of people of</text>
      <text x="0" y="65" text-anchor="middle" font-size="12" fill="#4f4a43">African descent.</text>
    </g>

    <g transform="translate(379 717)">
      <rect x="-111" y="-79" width="222" height="158" rx="10" fill="#fff" stroke="#67547d" stroke-width="3"/>
      <text x="0" y="-52" text-anchor="middle" font-size="13" font-weight="700" fill="#67547d">SEPTEMBER 2–11, 1861</text>
      <text x="0" y="-27" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2b27">Frémont order narrowed</text>
      <text x="0" y="-2" text-anchor="middle" font-size="12" fill="#4f4a43">Lincoln requires conformity</text>
      <text x="0" y="17" text-anchor="middle" font-size="12" fill="#4f4a43">with the First Confiscation Act</text>
      <text x="0" y="39" text-anchor="middle" font-size="12" fill="#4f4a43">and reserves national policy</text>
      <text x="0" y="58" text-anchor="middle" font-size="12" fill="#4f4a43">to civilian authority.</text>
    </g>
    <g transform="translate(662 717)">
      <rect x="-111" y="-79" width="222" height="158" rx="10" fill="#fff" stroke="#67547d" stroke-width="3"/>
      <text x="0" y="-52" text-anchor="middle" font-size="13" font-weight="700" fill="#67547d">MARCH 6–MAY 19, 1862</text>
      <text x="0" y="-27" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2b27">Two presidential tracks</text>
      <text x="0" y="-2" text-anchor="middle" font-size="12" fill="#4f4a43">Lincoln proposes compensated</text>
      <text x="0" y="17" text-anchor="middle" font-size="12" fill="#4f4a43">state emancipation, then voids</text>
      <text x="0" y="39" text-anchor="middle" font-size="12" fill="#4f4a43">Hunter’s order while reserving</text>
      <text x="0" y="58" text-anchor="middle" font-size="12" fill="#4f4a43">the military-necessity decision.</text>
    </g>
    <g transform="translate(960 717)">
      <rect x="-111" y="-79" width="222" height="158" rx="10" fill="#fff" stroke="#67547d" stroke-width="3"/>
      <text x="0" y="-52" text-anchor="middle" font-size="13" font-weight="700" fill="#67547d">JULY 12–22, 1862</text>
      <text x="0" y="-27" text-anchor="middle" font-size="15" font-weight="700" fill="#2f2b27">Policy break</text>
      <text x="0" y="-2" text-anchor="middle" font-size="12" fill="#4f4a43">Border-state majority declines.</text>
      <text x="0" y="18" text-anchor="middle" font-size="12" fill="#4f4a43">After Congress acts, Lincoln</text>
      <text x="0" y="39" text-anchor="middle" font-size="12" fill="#4f4a43">drafts commander-in-chief</text>
      <text x="0" y="58" text-anchor="middle" font-size="12" fill="#4f4a43">emancipation.</text>
    </g>
  </g>

  <path d="M296 361V410" fill="none" stroke="#756d61" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#grayArrow)"/>
  <path d="M462 361C462 393 421 397 406 422" fill="none" stroke="#756d61" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#grayArrow)"/>
  <path d="M662 567V621" fill="none" stroke="#756d61" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#grayArrow)"/>
  <path d="M794 361C794 517 721 570 686 621" fill="none" stroke="#756d61" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#grayArrow)"/>
  <path d="M960 567V621" fill="none" stroke="#756d61" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#grayArrow)"/>

  <text x="600" y="855" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f574d">Arrows show chronological and institutional links; no single event alone produced the next.</text>
</svg>
