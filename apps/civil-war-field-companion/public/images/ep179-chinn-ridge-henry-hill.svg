<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Chinn Ridge and Henry Hill, August 30, 1862</title>
  <desc id="desc">Schematic map showing Longstreet's Confederate attack from the west, successive United States defenses on Chinn Ridge and Henry Hill, and the retreat toward Bull Run.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eddb"/>
      <stop offset="1" stop-color="#e6dbc0"/>
    </linearGradient>
    <pattern id="field" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 0V28" stroke="#8b9b64" stroke-width="6" opacity=".14"/>
    </pattern>
    <marker id="redArrow" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="20" refY="11" orient="auto">
      <path d="M0 0L22 11L0 22Z" fill="#913c35"/>
    </marker>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="20" refY="11" orient="auto">
      <path d="M0 0L22 11L0 22Z" fill="#315f8c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3f392f" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#paper)"/>
  <rect x="26" y="26" width="1148" height="708" rx="22" fill="url(#field)" stroke="#5f594d" stroke-width="2"/>

  <path d="M50 310C250 286 444 278 610 292S930 326 1148 304" fill="none" stroke="#b49868" stroke-width="30" opacity=".6"/>
  <path d="M50 310C250 286 444 278 610 292S930 326 1148 304" fill="none" stroke="#5c5141" stroke-width="3" stroke-dasharray="18 9"/>
  <text x="540" y="268" font-family="Georgia,serif" font-size="25" fill="#3f392f" text-anchor="middle">Warrenton Turnpike</text>

  <path d="M860 48C846 154 854 224 880 304S882 484 856 716" fill="none" stroke="#9c8663" stroke-width="24" opacity=".65"/>
  <path d="M860 48C846 154 854 224 880 304S882 484 856 716" fill="none" stroke="#50483b" stroke-width="3"/>
  <text x="896" y="585" font-family="Georgia,serif" font-size="22" fill="#3f392f" transform="rotate(83 896 585)">Sudley Road</text>

  <path d="M1090 55C1056 178 1080 278 1108 394S1090 596 1142 724" fill="none" stroke="#6f9eb1" stroke-width="24" opacity=".82"/>
  <path d="M1090 55C1056 178 1080 278 1108 394S1090 596 1142 724" fill="none" stroke="#355e70" stroke-width="2"/>
  <text x="1130" y="196" font-family="Georgia,serif" font-size="24" fill="#23495b" transform="rotate(77 1130 196)">Bull Run</text>

  <path d="M308 468C365 418 448 395 540 412S668 482 718 528" fill="none" stroke="#77724c" stroke-width="11" opacity=".45"/>
  <path d="M677 576C750 522 806 510 900 526S1022 592 1082 614" fill="none" stroke="#77724c" stroke-width="11" opacity=".45"/>
  <text x="160" y="362" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#4e4a33">CHINN RIDGE</text>
  <text x="780" y="494" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#4e4a33">HENRY HILL</text>

  <g filter="url(#shadow)">
    <rect x="345" y="386" width="238" height="45" rx="9" fill="#e8eff6" stroke="#315f8c" stroke-width="3"/>
    <text x="464" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#244b70">McLean • 1,200 Ohioans</text>
    <rect x="486" y="446" width="245" height="44" rx="9" fill="#e8eff6" stroke="#315f8c" stroke-width="3"/>
    <text x="608" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#244b70">Tower • Stiles</text>
    <rect x="548" y="505" width="255" height="44" rx="9" fill="#e8eff6" stroke="#315f8c" stroke-width="3"/>
    <text x="676" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#244b70">Koltes • Krzyzanowski</text>
    <rect x="750" y="566" width="285" height="46" rx="9" fill="#e8eff6" stroke="#315f8c" stroke-width="3"/>
    <text x="892" y="596" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#244b70">Reynolds • Sykes • Milroy</text>
  </g>

  <path d="M135 566C220 540 288 485 370 434" fill="none" stroke="#913c35" stroke-width="14" marker-end="url(#redArrow)"/>
  <path d="M170 638C305 635 410 570 510 491" fill="none" stroke="#913c35" stroke-width="14" marker-end="url(#redArrow)"/>
  <path d="M350 688C480 668 610 616 739 575" fill="none" stroke="#913c35" stroke-width="14" marker-end="url(#redArrow)"/>
  <text x="104" y="530" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#7b2e29">Hood and Evans</text>
  <text x="118" y="675" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#7b2e29">Kemper</text>
  <text x="555" y="684" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#7b2e29">D. R. Jones and R. H. Anderson</text>

  <path d="M1040 346C1086 374 1090 420 1096 468" fill="none" stroke="#315f8c" stroke-width="11" stroke-dasharray="17 10" marker-end="url(#blueArrow)"/>
  <text x="790" y="364" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#244b70">Withdrawal toward Bull Run</text>
  <circle cx="1098" cy="474" r="10" fill="#f4eddb" stroke="#315f8c" stroke-width="4"/>
  <text x="1020" y="510" font-family="Georgia,serif" font-size="21" fill="#244b70">Stone Bridge</text>

  <g fill="#4a4337" stroke="#f4eddb" stroke-width="2">
    <rect x="446" y="355" width="20" height="18"/>
    <path d="M442 355L456 342L470 355Z"/>
    <rect x="827" y="535" width="20" height="18"/>
    <path d="M823 535L837 522L851 535Z"/>
  </g>
  <text x="477" y="358" font-family="Arial,sans-serif" font-size="19" fill="#3f392f">Chinn house</text>
  <text x="856" y="548" font-family="Arial,sans-serif" font-size="19" fill="#3f392f">Henry house</text>

  <g transform="translate(62 72)">
    <rect width="485" height="154" rx="14" fill="#fffaf0" stroke="#706858" stroke-width="2" opacity=".96"/>
    <text x="24" y="34" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#332f28">August 30: delaying a breakthrough</text>
    <line x1="24" y1="58" x2="94" y2="58" stroke="#913c35" stroke-width="10" marker-end="url(#redArrow)"/>
    <text x="113" y="65" font-family="Arial,sans-serif" font-size="19" fill="#332f28">Confederate attack</text>
    <rect x="24" y="81" width="70" height="24" rx="5" fill="#e8eff6" stroke="#315f8c" stroke-width="3"/>
    <text x="113" y="101" font-family="Arial,sans-serif" font-size="19" fill="#332f28">United States defensive line</text>
    <path d="M24 127H94" stroke="#315f8c" stroke-width="7" stroke-dasharray="12 7"/>
    <text x="113" y="134" font-family="Arial,sans-serif" font-size="19" fill="#332f28">Withdrawal route</text>
  </g>
  <g transform="translate(1052 72)">
    <path d="M28 50V0" stroke="#332f28" stroke-width="4"/>
    <path d="M28 0L16 22H40Z" fill="#332f28"/>
    <text x="28" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#332f28">N</text>
  </g>
  <text x="600" y="716" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#5e574b">Schematic — positions, routes, frontages, and distances are generalized; not to scale</text>
</svg>
