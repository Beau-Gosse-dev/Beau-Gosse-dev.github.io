<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Battle of New Bern troop positions and attacks, March 14, 1862</title>
  <desc id="desc">Simplified map showing the Confederate line between the Neuse River and Bryce Creek, the railroad gap at the brickyard, and the Union brigades of Foster, Reno, and Parke attacking north toward New Bern.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#315f8c"/></marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6f4937"/></marker>
    <pattern id="swamp" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M2 20C6 12 12 12 18 3" fill="none" stroke="#91a48d" stroke-width="2" opacity=".55"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="#f3eedf"/>
  <path d="M930 0C870 130 910 250 865 380S900 620 835 760H1200V0Z" fill="#b6cfcd"/>
  <text x="1035" y="365" fill="#385f64" font-family="Georgia,serif" font-size="30" text-anchor="middle" transform="rotate(86 1035 365)">Neuse River</text>
  <path d="M115 0C145 110 110 235 175 355S180 630 220 760H0V0Z" fill="url(#swamp)"/>
  <text x="80" y="390" fill="#5b7057" font-family="Georgia,serif" font-size="25" text-anchor="middle" transform="rotate(-82 80 390)">Bryce Creek and swamp</text>
  <path d="M530 760L570 0" stroke="#343b3d" stroke-width="9"/>
  <path d="M546 760L586 0" stroke="#343b3d" stroke-width="3" stroke-dasharray="16 12"/>
  <text x="612" y="180" fill="#343b3d" font-family="Arial,sans-serif" font-size="22" transform="rotate(-86 612 180)">Atlantic &amp; North Carolina Railroad</text>
  <path d="M210 270L470 300M655 300L905 245" stroke="#9a3d32" stroke-width="18" stroke-linecap="round"/>
  <path d="M470 300L525 305M600 305L655 300" stroke="#9a3d32" stroke-width="6" stroke-dasharray="12 10"/>
  <rect x="506" y="265" width="112" height="78" rx="5" fill="#b26e4c" opacity=".82"/>
  <text x="562" y="292" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="18">BRICKYARD</text>
  <text x="562" y="326" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="18">GAP</text>
  <path d="M888 245L930 195L965 244L925 285Z" fill="#9a3d32"/>
  <text x="966" y="190" fill="#7c3029" font-family="Arial,sans-serif" font-weight="700" font-size="20">Fort Thompson</text>
  <text x="780" y="225" fill="#7c3029" font-family="Arial,sans-serif" font-weight="700" font-size="20">37th NC</text>
  <text x="678" y="278" fill="#7c3029" font-family="Arial,sans-serif" font-weight="700" font-size="20">7th NC</text>
  <text x="385" y="276" fill="#7c3029" font-family="Arial,sans-serif" font-weight="700" font-size="20">35th NC</text>
  <text x="215" y="246" fill="#7c3029" font-family="Arial,sans-serif" font-weight="700" font-size="20">24th/26th NC sector</text>
  <text x="548" y="375" text-anchor="middle" fill="#7c3029" font-family="Arial,sans-serif" font-size="18">militia at the weak point</text>
  <path d="M765 655C770 560 780 465 790 345" fill="none" stroke="#315f8c" stroke-width="14" marker-end="url(#blueArrow)"/>
  <text x="800" y="610" fill="#234b73" font-family="Arial,sans-serif" font-weight="700" font-size="24">Foster</text>
  <text x="800" y="638" fill="#234b73" font-family="Arial,sans-serif" font-size="18">attack stalled under heavy fire</text>
  <path d="M355 665C375 545 430 430 520 345" fill="none" stroke="#315f8c" stroke-width="14" marker-end="url(#blueArrow)"/>
  <text x="280" y="620" fill="#234b73" font-family="Arial,sans-serif" font-weight="700" font-size="24">Reno</text>
  <text x="280" y="648" fill="#234b73" font-family="Arial,sans-serif" font-size="18">21st Massachusetts through gap</text>
  <path d="M565 685C565 575 560 470 560 348" fill="none" stroke="#315f8c" stroke-width="14" marker-end="url(#blueArrow)"/>
  <text x="590" y="610" fill="#234b73" font-family="Arial,sans-serif" font-weight="700" font-size="24">Parke</text>
  <text x="590" y="638" fill="#234b73" font-family="Arial,sans-serif" font-size="18">reserve followed through gap</text>
  <path d="M690 290C730 185 775 120 835 68" fill="none" stroke="#6f4937" stroke-width="8" stroke-dasharray="15 10" marker-end="url(#grayArrow)"/>
  <text x="650" y="115" fill="#5f3f33" font-family="Arial,sans-serif" font-weight="700" font-size="20">Confederate retreat</text>
  <text x="650" y="140" fill="#5f3f33" font-family="Arial,sans-serif" font-size="18">to Trent River bridge and New Bern</text>
  <text x="36" y="48" fill="#263332" font-family="Georgia,serif" font-size="30" font-weight="700">Battle of New Bern · March 14, 1862</text>
  <text x="36" y="82" fill="#4b5856" font-family="Arial,sans-serif" font-size="18">Simplified orientation map; not to scale</text>
  <path d="M1100 70V125" stroke="#263332" stroke-width="5" marker-end="url(#grayArrow)"/>
  <text x="1100" y="54" text-anchor="middle" fill="#263332" font-family="Arial,sans-serif" font-weight="700" font-size="20">N</text>
</svg>
