<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Sumner's approach to the West Woods after 9 a.m.</title>
  <desc id="desc">Schematic map with north at top. Sedgwick's division moves west from the East Woods, crosses the Cornfield and Hagerstown Turnpike, and enters the West Woods in three close brigade lines. Confederate reinforcements move north toward Jackson while French trails Sedgwick and turns south. Hooker is wounded near the front, and Greene holds near the Dunker Church.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3e3"/>
      <stop offset="1" stop-color="#e7dbc2"/>
    </linearGradient>
    <pattern id="trees" width="34" height="30" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="17" r="8" fill="#43543d" opacity="0.56"/>
      <circle cx="21" cy="9" r="7" fill="#667257" opacity="0.54"/>
      <circle cx="29" cy="25" r="6" fill="#354834" opacity="0.49"/>
    </pattern>
    <pattern id="corn" width="20" height="28" patternUnits="userSpaceOnUse">
      <path d="M10 27V5M10 11L4 7M10 15L16 9M10 20L4 15" fill="none" stroke="#87691f" stroke-width="2" opacity="0.68"/>
    </pattern>
    <marker id="blueArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16">
      <path d="M0 0L16 8L0 16Z" fill="#315f8c"/>
    </marker>
    <marker id="redArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16">
      <path d="M0 0L16 8L0 16Z" fill="#963b31"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="744" rx="18" fill="none" stroke="#97896f" stroke-width="2"/>
  <text x="60" y="77" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2f2b27">SUMNER REACHES THE NORTHERN FIELD</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#5c5549">Sedgwick advances alone toward the West Woods · shortly after 9 a.m.</text>
  <rect x="48" y="128" width="1104" height="613" fill="#e8e5ce"/>

  <g transform="translate(1090 165)" font-family="Arial, sans-serif" fill="#2f2b27">
    <path d="M0 48V0M0 0L-9 18M0 0L9 18" fill="none" stroke="#2f2b27" stroke-width="3"/>
    <text x="0" y="-9" text-anchor="middle" font-size="18" font-weight="700">N</text>
  </g>

  <path d="M1005 128C979 205 1034 271 999 349C968 417 1026 477 987 546C957 600 1009 671 977 741" fill="none" stroke="#668ba5" stroke-width="34" opacity="0.83"/>
