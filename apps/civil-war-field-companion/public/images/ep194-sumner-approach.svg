  <path d="M291 719C310 666 328 620 351 577" fill="none" stroke="#963b31" stroke-width="11" stroke-linecap="round" marker-end="url(#redArrow)"/>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(883 326)">
      <rect x="-91" y="-27" width="182" height="54" rx="9" fill="#315f8c"/>
      <text x="0" y="-3" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">SEDGWICK</text>
      <text x="0" y="17" text-anchor="middle" font-size="12" fill="#e4eef7">about 5,400 men</text>
    </g>
    <g transform="translate(883 493)">
      <rect x="-82" y="-24" width="164" height="48" rx="9" fill="#315f8c"/>
      <text x="0" y="4" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">FRENCH · 20 MIN LATE</text>
    </g>
    <g transform="translate(846 680)">
      <rect x="-73" y="-22" width="146" height="44" rx="8" fill="#e5edf5" stroke="#315f8c" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#244d76">TURNS SOUTH</text>
    </g>
    <g transform="translate(411 700)">
      <rect x="-82" y="-22" width="164" height="44" rx="8" fill="#963b31"/>
      <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">McLAWS · 3 BRIGADES</text>
    </g>
    <g transform="translate(235 682)">
      <rect x="-74" y="-22" width="148" height="44" rx="8" fill="#963b31"/>
      <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">G. T. ANDERSON</text>
    </g>
  </g>

  <g transform="translate(618 523)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="-81" y="-23" width="162" height="46" rx="8" fill="#e5edf5" stroke="#315f8c" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#244d76">GREENE · XII CORPS</text>
  </g>
  <g transform="translate(685 220)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="-69" y="-22" width="138" height="44" rx="8" fill="#fffaf0" stroke="#796c5a" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#453d34">HOOKER WOUNDED</text>
  </g>

  <g transform="translate(1091 683)" font-family="Arial, sans-serif">
    <rect x="-168" y="-52" width="175" height="95" rx="10" fill="#fffaf0" stroke="#93846d" stroke-width="2" opacity="0.97"/>
    <line x1="-148" y1="-26" x2="-113" y2="-26" stroke="#315f8c" stroke-width="8" marker-end="url(#blueArrow)"/>
    <text x="-96" y="-21" font-size="14" fill="#2f2b27">Federal move</text>
    <line x1="-148" y1="12" x2="-113" y2="12" stroke="#963b31" stroke-width="8" marker-end="url(#redArrow)"/>
    <text x="-96" y="17" font-size="14" fill="#2f2b27">Confederate move</text>
  </g>
</svg>
