  <rect x="919" y="561" width="128" height="28" rx="6" fill="#fffaf0" opacity="0.93"/>
  <text x="983" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#3f6074">ANTIETAM CREEK</text>

  <path d="M554 128C559 240 560 342 568 447C574 550 572 647 578 741" fill="none" stroke="#a97849" stroke-width="17"/>
  <path d="M554 128C559 240 560 342 568 447C574 550 572 647 578 741" fill="none" stroke="#f1d7a6" stroke-width="6"/>
  <g transform="translate(592 442) rotate(-86)">
    <rect x="-92" y="-14" width="184" height="28" rx="6" fill="#fffaf0" opacity="0.94"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#6b4d31">HAGERSTOWN TURNPIKE</text>
  </g>

  <path d="M690 128Q791 153 824 228Q851 291 821 367Q797 426 822 488Q850 558 819 622Q797 676 728 741L616 741Q642 658 627 586Q613 512 639 442Q664 376 629 303Q602 242 630 183Z" fill="#647158"/>
