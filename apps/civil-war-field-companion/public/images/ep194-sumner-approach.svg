  <rect x="676" y="279" width="139" height="34" rx="7" fill="#fffaf0" opacity="0.9"/>
  <text x="745" y="303" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#384535">EAST WOODS</text>

  <path d="M214 128Q349 142 490 174L517 683Q356 726 178 689Q141 588 158 470Q176 359 142 266Q143 182 214 128Z" fill="#58664d"/>
  <path d="M214 128Q349 142 490 174L517 683Q356 726 178 689Q141 588 158 470Q176 359 142 266Q143 182 214 128Z" fill="url(#trees)"/>
  <rect x="258" y="421" width="151" height="35" rx="7" fill="#fffaf0" opacity="0.9"/>
  <text x="333" y="445" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#384535">WEST WOODS</text>

  <path d="M502 185Q571 171 633 198L638 401Q576 422 508 402Z" fill="#d3bf63" stroke="#a58b36" stroke-width="3"/>
  <path d="M502 185Q571 171 633 198L638 401Q576 422 508 402Z" fill="url(#corn)"/>
  <rect x="514" y="276" width="112" height="51" rx="8" fill="#fff8df" opacity="0.91"/>
  <text x="570" y="297" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#66501f">MILLER’S</text>
  <text x="570" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#66501f">CORNFIELD</text>

  <g transform="translate(549 585)" filter="url(#shadow)">
    <rect x="-15" y="-13" width="30" height="28" fill="#f7f1df" stroke="#4b4540" stroke-width="2"/>
    <path d="M-19-13L0-28L19-13Z" fill="#60564c"/>
    <rect x="-5" y="2" width="10" height="13" fill="#776b5c"/>
  </g>
  <rect x="468" y="614" width="162" height="29" rx="6" fill="#fffaf0" opacity="0.94"/>
  <text x="549" y="635" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#342f2b">DUNKER CHURCH</text>

  <path d="M918 366C824 353 747 355 673 370C604 385 533 402 452 410" fill="none" stroke="#315f8c" stroke-width="14" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M889 458C826 454 772 460 713 476" fill="none" stroke="#315f8c" stroke-width="10" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M707 523C751 553 789 590 808 640" fill="none" stroke="#315f8c" stroke-width="9" stroke-linecap="round" stroke-dasharray="15 11" marker-end="url(#blueArrow)"/>
