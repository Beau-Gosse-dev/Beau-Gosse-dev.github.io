<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Washington and Peninsula Campaign operational context, March and April 1862</title>
  <desc id="desc">Schematic map showing Washington, the Shenandoah Valley, Manassas, Warrenton, Alexandria, Fort Monroe, Yorktown, and Richmond. A blue sea route carries the Army of the Potomac from Alexandria to Fort Monroe and a red arrow shows Joseph Johnston moving from northern Virginia toward Yorktown and Richmond.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8f1df"/><stop offset="1" stop-color="#e7d6b4"/></linearGradient>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315f8c"/></marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#9a3d32"/></marker>
    <style>
      .title{font:700 42px Georgia,serif;fill:#29271f}.subtitle{font:21px system-ui,sans-serif;fill:#514b40}.place{font:700 21px system-ui,sans-serif;fill:#29271f;paint-order:stroke;stroke:#f5ecd8;stroke-width:6px;stroke-linejoin:round}.small{font:17px system-ui,sans-serif;fill:#4c473d}.route{font:700 18px system-ui,sans-serif;paint-order:stroke;stroke:#f5ecd8;stroke-width:5px}.water{font:italic 21px Georgia,serif;fill:#356e82}.legend{font:18px system-ui,sans-serif;fill:#37342e}.date{font:700 16px system-ui,sans-serif;fill:#37342e}
    </style>
  </defs>
