  <text x="895" y="700" class="place">FORT MONROE</text>
  <text x="295" y="385" class="place">YORKTOWN</text><text x="292" y="410" class="small">Warwick River line</text>
  <text x="492" y="260" class="place">WILLIAMSBURG</text>
  <text x="518" y="550" class="place">NEWPORT NEWS</text>
  <text x="760" y="140" class="place">WHITE HOUSE</text><text x="762" y="162" class="small">supply landing</text>
  <text x="1028" y="525" class="place">RICHMOND</text>
  <text x="940" y="453" class="place">FAIR OAKS /</text><text x="952" y="478" class="place">SEVEN PINES</text>
  <g transform="translate(36 26)"><rect width="840" height="92" rx="12" fill="#fff9ec" opacity=".97" stroke="#89795c"/><text x="24" y="39" class="title">From Fort Monroe to Richmond's outskirts</text><text x="24" y="69" class="label" fill="#5b4b35">March 17–June 1, 1862 · operational diagram · schematic and not to scale</text></g>
  <g transform="translate(42 565)"><rect width="470" height="157" rx="12" fill="#fff9ec" opacity=".97" stroke="#89795c"/><text x="18" y="29" class="label">CAMPAIGN SEQUENCE</text><text x="18" y="56" class="small">1 · Federal army lands at Fort Monroe.</text><text x="18" y="80" class="small">2 · Magruder delays it at the Warwick line.</text><text x="18" y="104" class="small">3 · Johnston retreats through Williamsburg.</text><text x="18" y="128" class="small">4 · Both armies concentrate near Richmond and the Chickahominy.</text></g>
  <g transform="translate(700 570)"><rect width="455" height="151" rx="12" fill="#fff9ec" opacity=".97" stroke="#89795c"/><text x="18" y="29" class="label">LIMITS</text><text x="18" y="55" class="small">Coastlines, rivers, roads, routes, and positions are simplified.</text><text x="18" y="79" class="small">Arrows show broad movement, not daily marches or exact frontages.</text><text x="18" y="105" class="small">Blue: United States movement</text><text x="235" y="105" class="small">Red: Confederate movement</text><circle cx="28" cy="126" r="8" fill="#315f8c"/><circle cx="244" cy="126" r="8" fill="#9a3d32"/></g>
</svg>
