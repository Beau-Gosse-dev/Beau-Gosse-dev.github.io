  <text x="760" y="650" class="label" fill="#315d72" transform="rotate(31 760 650)">JAMES RIVER</text>
  <text x="690" y="332" class="label" fill="#315d72" transform="rotate(-34 690 332)">YORK RIVER</text>
  <path d="M445 118 C545 155 650 200 770 264 C885 325 952 380 1015 420" fill="none" stroke="#8ab9c8" stroke-width="26" stroke-linecap="round"/>
  <text x="632" y="204" class="small" fill="#315d72" transform="rotate(27 632 204)">Pamunkey River</text>
