  <path d="M585 278 C626 327 678 370 748 407 C806 438 860 453 917 465" fill="none" stroke="#9a3d32" stroke-width="15" stroke-dasharray="18 12" marker-end="url(#red)"/>
  <g fill="#27231e">
    <circle cx="873" cy="664" r="8"/><circle cx="425" cy="392" r="8"/><circle cx="586" cy="278" r="8"/><circle cx="649" cy="508" r="8"/><circle cx="850" cy="149" r="8"/><circle cx="1015" cy="521" r="8"/><circle cx="934" cy="468" r="8"/>
