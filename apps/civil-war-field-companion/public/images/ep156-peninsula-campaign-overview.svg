<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Peninsula Campaign operational overview through June 1, 1862</title>
  <desc id="desc">Schematic map showing the Army of the Potomac moving by water from Alexandria to Fort Monroe and then northwest through Yorktown and Williamsburg toward Richmond while Joseph Johnston's Confederate army retreats from the Yorktown line toward the Chickahominy.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efe5ca"/><stop offset="1" stop-color="#d6c294"/></linearGradient>
    <marker id="blue" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0 0L20 10L0 20Z" fill="#315f8c"/></marker>
    <marker id="red" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0 0L20 10L0 20Z" fill="#9a3d32"/></marker>
    <style>.title{font:700 29px Georgia,serif;fill:#27231e}.place{font:700 19px Georgia,serif;fill:#27231e}.label{font:700 16px Arial,sans-serif}.small{font:14px Arial,sans-serif;fill:#38332c}.tiny{font:12px Arial,sans-serif;fill:#38332c}.water{fill:#8ab9c8;stroke:#557f8f;stroke-width:3}.road{fill:none;stroke:#766247;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1200" height="760" fill="url(#ground)"/>
