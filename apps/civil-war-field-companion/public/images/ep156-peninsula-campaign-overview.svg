  <path d="M420 390 C475 330 540 285 605 250 C690 204 770 177 850 148" class="road"/>
  <path d="M647 510 C760 500 882 499 1014 521" class="road" stroke-dasharray="18 10"/>
  <text x="765" y="540" class="tiny">Richmond &amp; York River Railroad</text>
  <path d="M120 92 C255 152 420 245 825 660" fill="none" stroke="#315f8c" stroke-width="10" stroke-dasharray="17 12" marker-end="url(#blue)"/>
  <text x="145" y="125" class="small" fill="#244c72">Army transported from Alexandria</text>
  <path d="M882 660 C813 605 745 553 653 506 C565 459 494 426 432 396" fill="none" stroke="#315f8c" stroke-width="17" marker-end="url(#blue)"/>
  <path d="M432 395 C477 350 528 310 586 279" fill="none" stroke="#315f8c" stroke-width="17" marker-end="url(#blue)"/>
  <path d="M586 278 C676 237 763 211 842 176" fill="none" stroke="#315f8c" stroke-width="17" marker-end="url(#blue)"/>
  <path d="M472 110 C557 164 607 229 615 294 C623 346 600 396 570 433" fill="none" stroke="#9a3d32" stroke-width="11" stroke-dasharray="17 12" marker-end="url(#red)"/>
